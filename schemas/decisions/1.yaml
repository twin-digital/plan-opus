$schema: https://json-schema.org/draft/2020-12/schema
$id: decisions@1
title: decisions
description: a per-increment decisions source
type: object
additionalProperties: false
required: [version]
anyOf:
  - required: [decisions]
  - required: [retires]
properties:
  version:
    type: integer
    minimum: 1
  decisions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, statement, status, pinned]
      properties:
        id:
          type: string
          pattern: "^d-[0-9a-z]{8}$"
        title:
          type: string
        statement:
          type: string
        status:
          enum: [proposed, accepted, tolerated, delegated, rejected]
        rejection_reason:
          type: string
          description: the owner's reason, required when status is rejected
        pinned:
          oneOf:
            - const: false
            - type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  enum: [data-format, public-api, other]
                notes:
                  type: string
              if:
                properties:
                  reason:
                    const: other
              then:
                required: [notes]
        because:
          type: array
          minItems: 1
          items:
            type: string
        falsifiers:
          type: array
          minItems: 1
          items:
            type: string
        supersedes:
          type: string
          pattern: "^d-[0-9a-z]{8}$"
        facets:
          $ref: "#/$defs/facets"
      if:
        properties:
          status:
            const: rejected
        required: [status]
      then:
        required: [rejection_reason]
  retires:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, reason]
      properties:
        id:
          type: string
          pattern: "^d-[0-9a-z]{8}$"
        reason:
          type: string
$defs:
  facets:
    oneOf:
      - type: string
      - type: array
        minItems: 1
        items:
          type: string
