$schema: https://json-schema.org/draft/2020-12/schema
$id: /design-process/questions@1
title: questions
description: a draft increment's open questions; never present on a published increment
type: object
additionalProperties: false
required: [version]
properties:
  version:
    const: "1"
  questions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, question, answer]
      properties:
        id:
          type: string
          pattern: "^q-[0-9a-z]{8}$"
        question:
          type: string
        answer:
          enum: [fact, requirement, decision]
          description: the kind of foundation that would answer the question
        facets:
          $ref: "/design-process/common@1#/$defs/facets"
