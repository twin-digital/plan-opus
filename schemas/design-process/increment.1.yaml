$schema: https://json-schema.org/draft/2020-12/schema
$id: /design-process/increment@1
title: increment
description: an increment's adoption declarations; the file exists only when at least one is made
type: object
additionalProperties: false
required: [version]
anyOf:
  - required: [adopts]
  - required: [drops]
properties:
  version:
    type: integer
    minimum: 1
  adopts:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*@[0-9]+$"
  drops:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*$"
