$schema: https://json-schema.org/draft/2020-12/schema
$id: /design-process/model@1
title: model
description: a per-increment model source, binding entity names to pool schemas
type: object
additionalProperties: false
required: [version]
anyOf:
  - required: [model]
  - required: [retires]
properties:
  version:
    type: integer
    minimum: 1
  model:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name]
      oneOf:
        - required: [schema]
        - required: [api]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*$"
        schema:
          type: string
          pattern: "^/[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)+@[0-9]+$"
          description: a schema-pool reference by identity, /<namespace>/<entity>@<version>
        api:
          type: string
          pattern: "^/[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)+@[0-9]+$"
          description: an api-pool reference by identity, /<namespace>/<name>@<version>
        description:
          type: string
  retires:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, reason]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*$"
        reason:
          type: string
