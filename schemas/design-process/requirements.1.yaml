$schema: https://json-schema.org/draft/2020-12/schema
$id: /design-process/requirements@1
title: requirements
description: a per-increment requirements source
type: object
additionalProperties: false
required: [version]
anyOf:
  - required: [requirements]
  - required: [presets]
  - required: [retires]
properties:
  version:
    type: integer
    minimum: 1
  requirements:
    type: array
    minItems: 1
    items:
      $ref: "/design-process/requirement@1"
  presets:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*$"
        version:
          type: integer
          minimum: 1
        status:
          enum: [adopted, dropped]
          description: adopted when absent
      if:
        properties:
          status:
            const: dropped
        required: [status]
      then:
        not:
          required: [version]
      else:
        required: [version]
  retires:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, reason]
      properties:
        id:
          type: string
          pattern: "^r-[0-9a-z]{8}$"
        reason:
          type: string
