$schema: https://json-schema.org/draft/2020-12/schema
$id: design-process/requirements@1
title: requirements
description: a per-increment requirements source
type: object
additionalProperties: false
required: [version]
anyOf:
  - required: [requirements]
  - required: [retires]
properties:
  version:
    type: integer
    minimum: 1
  requirements:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, statement, satisfied_when]
      properties:
        id:
          type: string
          pattern: "^r-[0-9a-z]{8}$"
        title:
          type: string
        statement:
          type: string
        satisfied_when:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              description: conditions combined with logical AND — all must be met
              items:
                type: string
        facets:
          $ref: "#/$defs/facets"
        informed_by:
          type: array
          minItems: 1
          items:
            type: string
        amends:
          type: string
          pattern: "^r-[0-9a-z]{8}$"
  retires:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, reason]
      properties:
        id:
          type: string
          pattern: "^r-[0-9a-z]{8}$"
        reason:
          type: string
$defs:
  facets:
    oneOf:
      - type: string
      - type: array
        minItems: 1
        items:
          type: string
