$schema: https://json-schema.org/draft/2020-12/schema
$id: /design-process/backlog-item@1
title: backlog item
description: one item held for a future increment — the foundation kind it will become, a title, and a statement sketch
type: object
additionalProperties: false
required: [id, kind, title, statement]
properties:
  id:
    type: string
    pattern: "^b-[0-9a-z]{8}$"
  kind:
    enum: [requirement, decision]
    description: the kind of foundation the item becomes when an increment adopts it
  title:
    type: string
  statement:
    type: string
    description: a sketch of the foundation's statement, refined by the adopting increment
  notes:
    type: string
