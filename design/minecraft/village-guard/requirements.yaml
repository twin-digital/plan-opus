# Requirements scoped to the minecraft/village-guard design. Every entry here was drafted at
# capture from the owner's answers and awaits ratification.
#
# rationale is omitted unless the statement's intent is genuinely non-obvious.

- id: the-whole-village-is-protected
  statement: |
    every villager, wandering trader, and iron golem in the world is protected — in every
    dimension, those present when the pack starts and those that arrive afterwards alike — with no
    opt-in, no exclusion, and no in-game configuration.

- id: protection-survives-ordinary-play
  statement: |
    a protected mob does not die from anything ordinary gameplay produces: mobs, players, fire,
    falling, drowning, suffocation, and explosions among them. Operator action and the void are
    outside what the pack must prevent.

- id: protected-villagers-are-not-converted
  statement: |
    a zombie never converts a protected villager — losing one to conversion counts as losing it.

- id: the-pack-changes-nothing-else
  statement: |
    apart from not dying and not being converted, a protected mob behaves exactly as it does in
    vanilla: trading, restocking, breeding, gossip, panic, and golem spawning are unchanged. The
    protection carries no visible tell — no effect particles, no name tag, no chat output.

- id: installable-on-any-vanilla-world
  statement: |
    the pack is distributed as a release anyone can install into their own Bedrock world, and
    assumes nothing about that world beyond a vanilla server — no companion pack, and no world
    state prepared in advance.

- id: pack-uses-the-shared-build-tooling
  statement: |
    the pack is built and released by the workspace's shared pack tooling — the same build
    configuration and release path every other pack there uses — and carries none of its own.
