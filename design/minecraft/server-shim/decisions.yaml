# Decisions for @twin-digital/minecraft-server-shim.
# The accepted entries are the owner's ruling at the defaults gate; the proposed ones are the spec
# author's, still open.

- id: generated-values-cover-declared-constants
  statement: |
    the shim exports the declarations' 64 enums as frozen objects and their five module-level
    numeric constants, generated together from the same pass
  status: accepted
  falsifiers:
    - a pack imports a module-level value the declarations carry that is neither an enum nor one of
      the five constants, so the generated surface is short of what a value import needs

- id: every-declared-class-is-exported
  statement: |
    every class the pinned declarations export is exported by the shim, whether or not any fake is
    ever branded as it
  status: accepted
  falsifiers:
    - the generated class surface costs enough at import time to show up in a consumer's suite
      startup against a curated list of the classes packs actually import

- id: declared-error-classes-are-real-classes
  statement: |
    a declared class whose ancestry reaches Error is emitted as a real Error subclass setting its
    own name, with its declared readonly members left to whoever throws it
  status: accepted
  falsifiers:
    - code under test reads a declared member off a caught shim error and gets undefined often
      enough that the shim populating it would have been the cheaper answer

- id: unset-singletons-throw
  statement: |
    reading world or system before a server is installed throws ShimNotInstalledError rather than
    reading undefined
  status: accepted
  falsifiers:
    - a pack reads the singletons at module scope during import, so the throw fires before any test
      could have installed a server and the shim becomes unusable for that pack

- id: install-call-is-the-reset
  statement: |
    __useServer replaces both bindings wholesale and __useServer() with no argument returns them to
    the unset state; there is no separate reset entry point
  status: accepted
  falsifiers:
    - a consumer needs to replace one binding without disturbing the other, so the wholesale
      replacement forces them to reconstruct state they wanted kept

- id: version-statement-is-inert
  statement: |
    the derived @minecraft/server version is stated as an exported string and in the README, and the
    shim performs no runtime comparison and emits no warning
  status: accepted
  falsifiers:
    - consumers on a mismatched server version report failures whose cause is stale enum values,
      diagnosed only after the fact, often enough that a runtime check would have caught them first

- id: package-identity-and-runtime-target
  statement: |
    the shim publishes as @twin-digital/minecraft-server-shim, written in TypeScript, shipping its
    own declarations, with engines.node >=22
  status: accepted
  falsifiers:
    - a consumer the shim is meant to serve runs a Node version below the active LTS floor

- id: undeclared-exports-stay-absent
  statement: |
    a name the pinned declarations do not declare is not exported — no Proxy, no auto-vivified stub,
    no fallback value
  status: accepted
  falsifiers:
    - a pack imports a value the declarations do not carry — an undeclared or newer name — and the
      resulting resolution failure is routine enough that a permissive fallback would be cheaper

- id: one-package-one-aliasable-module
  statement: |
    the shim ships as its own package, separate from any fake library, with four entry points — the
    aliasable module, ./control, ./vite and ./vitest — and a runner integration is a subpath of it
    rather than a package of its own
  status: proposed
  falsifiers:
    - a consumer wants the enum values in production pack code, where taking the brand table and the
      mutable singleton bindings along is not acceptable
    - a second @minecraft/* module's shim needs a build or peer range this package cannot carry
      alongside the first
    - a runner integration needs a release cadence or a dependency range the shim package cannot
      carry, so the subpath has to become a package after all

- id: install-is-a-documented-snippet
  statement: |
    installing the shim is documented snippets the consumer copies — the two runner-config entries
    and the setup file — not a helper the package exports that returns runner config or registers
    itself
  status: rejected

- id: values-are-generated-and-committed
  statement: |
    the generated value and class modules are produced at author time from the pinned declarations
    and committed, with a regenerate-and-diff step in CI, rather than generated in a consumer's
    postinstall
  status: proposed
  falsifiers:
    - consumers routinely need values for a server version other than the pinned one, so generating
      against the consumer's own installed declarations is what they actually need
    - the generated files are large enough to make review of an unrelated change in the package
      impractical

- id: pinned-version-is-declared-as-a-peer-range
  statement: |
    @minecraft/server is declared as a plain peer dependency at ^2.8.0, with no
    peerDependenciesMeta.optional entry
  status: proposed
  falsifiers:
    - a 2.x release within the range changes an enum member's value, so the range admits a consumer
      the generated values are wrong for
    - consumers pinned to a 1.x range are common enough that npm's hard install failure walls them
      out of testing entirely, where declaring no peer at all would have let them in with values
      they could at least see were stale

- id: shim-cooperates-through-a-registered-brand-symbol
  statement: |
    the shim reads a brand to answer instanceof and does not define the protocol — the fake library
    owns the symbol and value shape, and the shim conforms to whatever it settles
  status: rejected

- id: instanceof-answers-only-to-the-brand
  statement: |
    instanceof answers true only for a value branded with the class or with a declared descendant of
    it, and false for everything else, a real engine object included
  status: rejected

- id: control-surface-is-a-real-subpath
  statement: |
    the control surface ships on the package's own ./control subpath rather than as extra exports of
    the aliased @minecraft/server specifier
  status: proposed
  falsifiers:
    - a runner resolves the alias and the control subpath to two module instances, so a test's
      __useServer writes bindings the pack under test never reads

- id: esm-only-single-format
  statement: |
    the shim publishes ESM only; no CJS build is produced
  status: proposed
  falsifiers:
    - the share of consumers reachable only as CJS measures large enough to outweigh the
      split-instance hazard a dual build carries, so the reach a second format buys is worth its
      risk after all

- id: vitest-is-the-covered-runner
  statement: |
    vitest is the runner the shim's own suite covers; bun and jest-in-ESM-mode recipes ship in the
    README marked untested and are not in the test matrix
  status: proposed
  falsifiers:
    - a documented but untested recipe turns out not to work, so the README shipped an install path
      that never functioned
    - enough consumers arrive on one of the untested runners that its breakage is reported before
      vitest's

- id: both-entries-re-export-one-internal-module
  statement: |
    the root entry and ./control each re-export from one internal module holding the mutable state
    and the shim's error classes; neither entry re-exports from the other
  status: proposed
  falsifiers:
    - a bundler or runner splits the internal module across the two entry points into two instances,
      so the shared state the re-export was chosen to guarantee is not shared

- id: constant-statics-are-emitted-onto-the-classes
  statement: |
    the generator emits each declared class's constant static members — the 86 componentId strings
    and the four other literal statics — as static members of the emitted class
  status: proposed
  falsifiers:
    - a declared constant static's value cannot be read out of index.d.ts as a literal, so the
      generator would have to hand-author or omit it

- id: behavioural-statics-throw-unsupported
  statement: |
    the declared static methods that perform a lookup — the registry get/getAll pairs, the five on
    Potions, and BlockPermutation.resolve — are emitted as functions throwing ShimUnsupportedError
  status: proposed
  falsifiers:
    - packs call one of these statics often enough that the throw is the routine outcome of a test
      run, so routing the call to the installed server would have been the cheaper answer

- id: class-table-is-a-self-inclusive-ancestry-record
  statement: |
    src/generated/classes.ts exports one record mapping each declared class name to its self-inclusive
    ancestor list, and one record mapping each class name to its constant statics
  status: rejected

- id: unset-bindings-hold-a-throwing-proxy
  statement: |
    while no server is installed, world and system hold a Proxy over a function target whose every
    trap throws ShimNotInstalledError, rather than undefined or an accessor export
  status: proposed
  falsifiers:
    - a pack passes world or system somewhere that inspects it without touching a property — a
      truthiness guard, a null check, an equality test — and takes the wrong branch silently

- id: pack-module-loads-after-install
  statement: |
    the pack module under test is reached by a dynamic import the test performs after __useServer,
    not by a static import at the top of the test file
  status: rejected

- id: brandas-unions-and-rejects-unknown-classes
  statement: |
    a second brandAs call unions its class names with the brand already on the value, and a class
    name the generated table does not declare throws
  status: rejected

- id: install-documentation-lives-with-the-shim
  statement: |
    the shim's own README is the sole normative install document — alias entry, load-order contract,
    version statement and runner recipes — and the shim asks nothing of any fake library's
    documentation
  status: proposed
  falsifiers:
    - consumers routinely arrive through the test library, hit the unresolved-import failure, and
      report it against the library, so the shim's README is documentation nobody reaches until
      after the failure they needed it to prevent
    - a fake library documents an install recipe for the shim of its own and the two drift, so a
      consumer copies an entry wrong for the version they have

- id: class-exports-are-generated-lines-over-a-hand-written-factory
  statement: |
    the generator emits src/generated/class-exports.ts, one literal export line per declared class
    calling a makeClass factory the hand-written brands module supplies, rather than the export list
    being hand-maintained
  status: rejected

- id: constructible-classes-throw-unsupported
  statement: |
    the 14 declared classes the declarations leave constructible are emitted as callables throwing
    ShimUnsupportedError named for the class, while the 425 declaring a private constructor stay
    non-callable
  status: proposed
  falsifiers:
    - packs construct one of the 14 — ItemStack most likely — often enough that the throw is the
      routine outcome of a test run, so a constructor producing a branded plain value would have
      been the cheaper answer
    - a test needs to distinguish an unconstructible class from a constructible one by the failure
      it raises, and the two failure shapes are now indistinguishable

- id: the-setup-file-is-the-install-shape
  statement: |
    a setup file registered with the runner installs one server per test file at module scope, and
    it is the only install shape the shim documents — no dynamic-import recipe and no per-test
    install hook
  status: rejected

- id: per-test-isolation-waits-on-a-library-reset
  statement: |
    per-test isolation is out of this cycle and the shim adds no mechanism for it; the route is a
    reset the fake library exposes, which it does not today, and the shape gated on that reset is a
    self-registering /vitest setup subpath taking the library as an optional peer
  status: proposed
  falsifiers:
    - the leakage a file-scoped server carries changes a consumer's assertion rather than merely
      accumulating, often enough that suites are unwritable without a reset
    - a per-test mechanism turns out to be available from the shim's side alone, without the library
      clearing a server in place
    - a self-registering subpath cannot keep its library import off the core — a runner or bundler
      that loads every published entry point, or an optional peer a manager installs regardless — so
      the shape costs the library independence the core is built on

- id: the-plugin-is-the-install-shape
  statement: |
    a vite plugin the consumer lists in plugins is the documented install — its config hook
    contributes the resolve.alias entry and the test.setupFiles entry naming the package's ./vitest
    subpath — with that subpath also exported for a consumer who wants no plugin
  status: proposed
  falsifiers:
    - vitest or vite stops honouring a plugin-contributed test.setupFiles entry, so the plugin can
      contribute the alias but not the install
    - consumers routinely need the alias without the setup file, or the reverse, so the single
      plugin entry is the wrong granularity and they configure around it

- id: plugin-options-travel-in-test-env
  statement: |
    the plugin passes its options to the setup module as JSON on test.env, read off process.env,
    rather than through vite's define
  status: proposed
  falsifiers:
    - an option value cannot survive a JSON round trip through the environment — a function, a
      module instance — so the channel cannot carry what the plugin needs to pass
    - a runner the shim documents provides no equivalent of test.env, so the channel does not
      generalise past vitest

- id: the-alias-is-the-substitution-mechanism
  statement: |
    the shim substitutes @minecraft/server by a resolver alias, not by vi.mock, even though vi.mock
    alone is sufficient to make the specifier importable
  status: proposed
  falsifiers:
    - a runner the shim documents offers a mock hook but no resolver alias, so the alias cannot be
      the mechanism there
    - an object-literal vi.mock factory turns out to keep the shim's live bindings live and removes
      a config entry the alias needs, so the alias buys nothing

- id: the-library-is-an-optional-peer-of-the-setup-subpath-alone
  statement: |
    the fake library is an optional peer dependency imported only by the ./vitest setup module,
    which the serverModule option can point elsewhere; the core entries import no library
  status: proposed
  falsifiers:
    - a bundler or runner loads every published entry point of the package, so the setup module's
      import reaches a consumer who never asked for the library
    - the setup module cannot select a factory by module specifier under a runner the shim
      documents, so the default becomes a hard dependency

- id: the-default-world-is-what-the-factory-builds
  statement: |
    the setup module installs what the server factory returns, adding nothing; a populated starting
    world is the plugin's world option, not the default
  status: proposed
  falsifiers:
    - the great majority of packs fail on their first world read against a bare server, so the
      empty default is a step every consumer takes and the option is a default in the wrong place

- id: fakes-are-instances-of-the-shims-classes
  statement: |
    the shim's exported classes are real class declarations with the declared extends, and instanceof
    is answered by the prototype chain — the fake library depends on this package and constructs its
    fakes from these prototypes; there is no brand, no protocol and no hasInstance implementation
  status: proposed
  falsifiers:
    - the shim resolves to two instances in one run — installed at two node_modules depths — so a
      fake built from one answers false against the other, with no diagnostic
    - a third party wants to fake the engine without depending on this package, which the prototype
      answer gives them no way to do

- id: class-exports-are-generated-class-declarations
  statement: |
    src/generated/class-exports.ts holds one real class declaration per declared class, with its
    declared extends, statics and constructor written out by the generator rather than built by a
    factory at run time
  status: proposed
  falsifiers:
    - a declared class needs a shape the generator cannot write out from index.d.ts alone, so the
      uniform emission cannot cover the surface
    - the emitted file is large enough that a consumer's bundler or type checker pays a measurable
      cost for classes their pack never imports
