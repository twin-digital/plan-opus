# Requirements scoped to the minecraft/server-shim design. Every entry here was DRAFTED by an
# agent from the validation prototype and awaits the owner's ratification.
#
# rationale is omitted unless the statement's intent is genuinely non-obvious.

- id: unmodified-pack-code-loads-under-test
  statement: |
    a test process configured with the shim loads a pack's engine-facing module unmodified — its
    value imports from `@minecraft/server`, enum members and classes alike, resolve — with no edit
    to the pack and no hand-written stub from the pack's author.

- id: enum-values-come-from-the-pinned-declarations
  statement: |
    every enum value the shim supplies is derived from a pinned `@minecraft/server` version's
    declarations rather than hand-authored, and the shim states which version it was derived from.

- id: instanceof-answers-for-a-fake
  statement: |
    `instanceof` against a class the shim exports answers true for the corresponding fake and
    false for a value that is not one, without the consumer naming a member or other
    implementation detail of the fakes.
  rationale: |
    A silently false `instanceof` leaves a handler returning early and its test passing while
    exercising nothing.

- id: module-singletons-are-test-controlled
  statement: |
    a test can point the module-scope `world` and `system` at fakes it created, code that reaches
    the engine through the module import sees them, and a test starts from what it installed with
    nothing carried over from a previous test.

- id: shim-supplies-values-not-behaviour
  statement: |
    the shim supplies only what a module import must carry — values, classes, and the singleton
    bindings — and models no engine behaviour of its own; every behaviour a test observes comes
    from `@twin-digital/minecraft-test-lib`.

- id: a-consumer-suite-still-typechecks
  statement: |
    a TypeScript pack's test suite typechecks with the shim installed, without a cast or an `any`
    at the seam between the shim and the pack's `@minecraft/server` types.
