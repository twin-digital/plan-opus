- id: dev-kit-reports-each-pack-build-output-location
  claim: |
    minecraft/dev-kit reports a build output location for every pack it discovers, including packs
    that have not been built. The build writes where the kit says a pack's output is, and resolves
    no output location itself.
  backing: documented
  sources:
    - url: design/minecraft/dev-kit/requirements.yaml
      where: pack-record-details — the details provided for every discovered pack
      quote: |
        for every pack discovered, the kit provides the following details:

          - its owning package
          - its kind (behavior pack or resource pack)
          - its source location
          - it's build output location (even if that location is not present because the pack is unbuilt),
          - the full content of its manifest in object form (including content auto-populated as
            described by `r:kit-completes-partial-source-manifests`)

- id: dev-kit-fixes-the-built-output-tree-shape
  claim: |
    minecraft/dev-kit requires a package's output root to hold one kind-named subdirectory per
    pack — `behavior_pack`, `resource_pack` — mirroring the source layout, and to do so always: a
    single-pack package still nests. The build has no flat single-pack shape to emit.
  backing: documented
  sources:
    - url: design/minecraft/dev-kit/requirements.yaml
      where: built-output-mirrors-the-source-layout
      quote: |
        a package's output root always holds one kind-named subdirectory per pack — `behavior_pack`,
        `resource_pack` — mirroring the source layout. A single-pack package still nests.
