# Requirements scoped to the minecraft/pack-build design. Every entry is DRAFTED from a design
# conversation for the owner to accept, amend, or reject — none has been ratified.
#
# rationale is omitted unless the statement's intent is genuinely non-obvious.

# Where the build lives, and what it is

- id: build-ships-in-the-kit-package
  statement: |
    the build capability ships in the same distributable as minecraft/dev-kit — one package, two
    designs. Nothing here is published, versioned, or installed separately from the kit.

- id: build-is-an-exported-bundler-config
  statement: |
    the build half of this design is exported for a consuming package's bundler configuration to
    use — not a command the package runs. It embeds no bundler and ships no command line of its
    own. The archive half is not bound by this: it may ship a command line.

- id: a-released-pack-is-an-archive-of-its-output-tree
  statement: |
    an npm package is an addon pack: it releases as a single archive, cut from its built output tree
    and from nothing else — no separate staging source, and no pack inside it released on its own.
    This design produces that archive, and the package's release hook is what reaches it.

- id: the-exported-config-is-documented
  statement: |
    what this design exports carries documentation of how a consuming package uses it and what
    using it produces.

# What a build produces

- id: script-module-is-bundled-with-game-modules-external
  statement: |
    a pack's script module is bundled to the location the pack's output tree expects, with the
    modules the game provides at runtime left external.

- id: every-pack-file-reaches-the-output-tree
  statement: |
    every file a pack is made of, and not only what the bundler emits — functions, entity and item
    definitions, textures, `.lang` files, and the rest — is placed into the output tree, so a
    finished build is loadable with no further processing by anything downstream.

- id: built-manifests-are-the-completed-ones
  statement: |
    the manifest in a pack's output tree is the completed manifest, not the partial source
    manifest — a build never copies a source `manifest.json` through unchanged.
  rationale: |
    A source manifest is required to omit `header.name` and `header.version`, so a pack whose built
    manifest is the source one does not load.

- id: assembly-is-authoritative-over-the-output-tree
  statement: |
    the output tree holds what the current source declares and nothing else: a file deleted or
    renamed in source is gone from the output after the next build, with no clean step first.
  rationale: |
    Otherwise a deleted file survives in the output and ships in whatever is cut from that tree.

- id: rebuild-triggers-are-declared-not-inferred
  statement: |
    a rebuild is triggered by a change to any input a build reads, the pack files and
    `package.json` included — nothing imports those, so a module graph cannot find them. What a
    rebuild must bring up to date is the output; whether it gets there by skipping work it does not
    need is the design's to choose.

- id: the-package-version-is-the-pack-version
  statement: |
    a pack's version comes from its `package.json` and nowhere else — raising that version and
    building is what produces a new version of the pack. No separate release manifest is
    maintained.
