# Requirements scoped to the minecraft/build-kit design. Every entry is DRAFTED from a design
# conversation for the owner to accept, amend, or reject — none has been ratified.
#
# rationale is omitted unless the statement's intent is genuinely non-obvious.

# Product and boundary

- id: build-tool-is-separate-from-the-kit
  statement: |
    the build tool ships as its own package layered on minecraft/dev-kit. A consumer that only
    needs to know which packs a workspace holds imports the kit and takes on none of the build
    toolchain.

- id: build-runs-per-package
  statement: |
    a build is invoked from a package's own scripts and builds that one package. Ordering builds
    across packages and caching their results belong to the workspace task runner, and the build
    tool supplies neither.

- id: build-exposes-a-command-and-a-call
  statement: |
    the same build is reachable two ways over one implementation: a command a package's `build`
    script runs, and a programmatic call a long-running process makes per changed package without
    starting a process each time.

# What a build produces

- id: build-produces-loadable-output-in-one-step
  statement: |
    one invocation takes a package from source to output a server or a client can load with no
    further processing: its script module bundled, its pack source in place under the output root,
    and the completed manifests written there.

- id: built-packs-come-only-from-the-build-tool
  statement: |
    every route to a built pack — a package's `build` script, a rebuild triggered by a watcher, and
    a continuous-integration run — goes through this build. No built output is produced any other
    way.
  rationale: |
    Manifest completion can then never be skipped, since there is no second path around it.

- id: release-is-a-version-bump-and-a-build
  statement: |
    releasing a package is raising its `package.json` version, building, and archiving the built
    output. No version is recorded anywhere else and no separate release manifest is maintained.

# Configuration

- id: build-needs-no-configuration
  statement: |
    a package with the conventional source and output layout builds with nothing declared. What a
    package does need to state is stated under the existing `minecraft` key of its `package.json`,
    and the build tool introduces no configuration file of its own.
