# Facts scoped to the minecraft/dev-kit design. All are PROPOSED by an agent and await owner
# review. The first-party quotes were captured through a fetch tool and are worth a spot-check
# against the live page; the in-repo quotes point at evidence already committed under
# design/minecraft/dev-workflow/artifacts/.
#
# Two facts this design leans on live in design/minecraft/dev-workflow/ and are not copied here —
# bedrock-manifest-declares-pack-identity-and-kind and content-independent-pack-heuristics-misfire.
# Both bind this design as much as that one and belong at design/minecraft/ area scope.

- id: pack-is-a-directory-with-a-manifest-at-its-root
  claim: |
    A Bedrock pack is a directory whose only required file is `manifest.json`, sitting at that
    directory's root; everything else is optional content in format-named subfolders. A directory
    holding a `manifest.json` at its root is therefore the format's own definition of a pack, with
    nothing outside the directory needed to recognise it.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/comprehensivepackcontents
      where: intro, before "Comprehensive Behavior Pack"
      quote: |
        The only required file in either type of pack is manifest.json.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/behaviorpackfromscratch
      where: opening paragraph
      quote: |
        A behavior pack is a folder structure that contains files that drive entity behaviors,
        loot drops, spawn rules, items, recipes, and trade tables.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/behaviorpackfromscratch
      where: '"Create the manifest file", step 1 — where the manifest goes'
      quote: |
        Create a new document in your My_BEHAVIOR_Pack folder and name it manifest.json.

- id: pack-kind-mismatch-fails-silently-at-the-server
  claim: |
    A pack deployed into the pool for the other kind does not load, in either direction, and the
    server reports nothing about it — a behavior pack in the resource pool leaves the world with
    "Pack Stack - None", and a resource pack in the behavior pool is simply absent from the stack.
    A pack's kind must therefore be right before anything is copied, and a wrong kind is not
    observable from the server's output.
  backing: documented
  sources:
    - url: design/minecraft/dev-workflow/artifacts/pack-layout/probe/OUTPUT.txt
      where: case 4 — the behavior pack placed in the resource pool and listed as a resource pack
      quote: |
        === case 4: the behavior pack placed in the resource pool and listed as a resource pack
        (does the pool decide a pack's kind, or does its manifest?)
          world_behavior_packs.json = []
          world_resource_packs.json = [{"pack_id":"f5ebc4c3-7d8a-4e9f-0a1b-2c3d4e5f6a7b","version":[1,0,0]},{"pack_id":"d3c9f2a1-5b6e-4c7d-8e9f-0a1b2c3d4e5f","version":[1,0,0]}]
        [2026-07-24 23:49:15:522 INFO] Pack Stack - None
    - url: design/minecraft/dev-workflow/artifacts/pack-layout/probe/NOTES.md
      where: What this establishes — the pool is authoritative for kind
      quote: |
        - **The pool is authoritative for kind, and it is a deploy target.** A pack loads only from the
          pool matching its kind (cases 2 and 4, in both directions). Misfiling fails in silence.

- id: pack-directory-name-carries-no-meaning
  claim: |
    Nothing reads a pack's directory name. The name is free by the format, and a behavior pack
    deployed into a directory named `resource_pack_totally` loads normally, the server printing
    that name back untroubled. Where a pack's sources and built output sit, and what those
    directories are called, is therefore free to choose without affecting whether the pack loads —
    and a directory name can never be relied on as a statement of what a pack is.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/behaviorpackfromscratch
      where: '"Create a folder" — naming the pack folder'
      quote: |
        In this section, you will create a folder called My_BEHAVIOR_Pack. Well, actually you
        don't have to call it that. In fact, you can name this folder anything you want, but the
        other folders have to be named exactly like this tutorial says so that Minecraft knows
        where to look.
    - url: design/minecraft/dev-workflow/artifacts/pack-layout/probe/OUTPUT.txt
      where: case 5 — pack directories renamed to names that contradict their manifests
      quote: |
        === case 5: pack directories renamed to names that contradict their manifests
        (is a source or pool directory name ever read as a declaration of kind?)
          world_behavior_packs.json = [{"pack_id":"d3c9f2a1-5b6e-4c7d-8e9f-0a1b2c3d4e5f","version":[1,0,0]}]
          world_resource_packs.json = [{"pack_id":"f5ebc4c3-7d8a-4e9f-0a1b-2c3d4e5f6a7b","version":[1,0,0]}]
        [2026-07-24 23:49:22:860 INFO] Pack Stack - [00] layout probe behavior pack (id: d3c9f2a1-5b6e-4c7d-8e9f-0a1b2c3d4e5f, version: 1.0.0) @ development_behavior_packs/resource_pack_totally
    - url: design/minecraft/dev-workflow/artifacts/pack-layout/probe/NOTES.md
      where: What this establishes — a pack's own directory name means nothing
      quote: |
        - **A pack's own directory name means nothing.** A behavior pack in a directory called
          `resource_pack_totally` loads, and the server prints that name back without complaint (case 5).
          Nothing reads it; the manifest is the only declaration of what a pack is.

- id: pack-dependencies-name-an-exact-uuid-and-version
  claim: |
    A pack declares its dependencies on other packs in its manifest's `dependencies` array, each
    entry naming the other pack's exact header uuid and an exact version. An entry may instead name
    a built-in scripting module by `module_name`, so not every dependency entry resolves to a pack
    in the workspace and validation cannot assume the set is closed.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: Properties table — dependencies row
      quote: |
        Section containing definitions for any other packs that are required in order for this
        manifest.json file to work.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: dependencies table — uuid row
      quote: |
        This is the unique identifier of the pack that this pack depends on. It needs to be the
        exact same UUID that the pack has defined in the header section of its manifest file.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: dependencies table — version row
      quote: |
        This is the specific version of the pack that your pack depends on. Should match the
        version the other pack has in its manifest file.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: dependencies table — module_name row
      quote: |
        For dependencies on built-in scripting modules, contains the name of the module. (for
        example, @minecraft/server)

- id: ecosystem-models-one-pack-per-kind-per-project
  claim: |
    Every pack config and build tool surveyed models a project as at most one pack of each kind.
    The Bedrock-OSS project config standard — shared by Regolith and bridge. — keys its `packs` map
    by pack type with one path each, both tools let a pack's path move while the pack-type keys
    stay fixed, and Microsoft's `@minecraft/core-build-tasks` merges every listed source folder
    into one `development_behavior_packs/<PROJECT_NAME>` directory. What no surveyed tool can
    express is two packs of the *same* kind in one project.
  backing: documented
  sources:
    - url: design/minecraft/dev-workflow/artifacts/pack-layout/TOOLING-EVIDENCE.md
      where: The community standard makes multi-pack projects structurally impossible — the Bedrock-OSS `packs` field
      quote: |
        `packs` is keyed by pack *type*, one path per type: a second behavior pack has nowhere to go.
    - url: design/minecraft/dev-workflow/artifacts/pack-layout/TOOLING-EVIDENCE.md
      where: The community standard makes multi-pack projects structurally impossible — closing note on Regolith and bridge.
      quote: |
        Regolith and bridge. both default to `BP/` and `RP/` (Regolith under `packs/`), and both let the
        *paths* move while the pack-type keys stay fixed.
    - url: design/minecraft/dev-workflow/artifacts/pack-layout/TOOLING-EVIDENCE.md
      where: "`@minecraft/core-build-tasks` hard-codes one deployed pack per project"
      quote: |
        Several source folders may be listed, but they are all copied into the *same*
        `development_behavior_packs/<PROJECT_NAME>` directory — they merge into one pack. Producing two
        packs needs two `PROJECT_NAME` values and two task chains.

- id: release-archives-follow-pack-content
  claim: |
    The format's distribution archives follow what a project contains: an `.mcpack` is one zipped
    resource or behavior pack, and an `.mcaddon` is a zip holding `.mcpack` or `.mcworld` files.
    Microsoft's build tasks emit exactly that — `packBP` and `packRP` each produce an `.mcpack`,
    and `packMcaddon` bundles the two. Nothing in the definition requires an `.mcaddon` to hold
    more than one pack.
  backing: documented
  caveat: |
    That a client imports a single-pack `.mcaddon` happily is not stated by any first-party source
    found. It is structurally legal by the definition quoted here, and untested.
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/minecraftfileextensions
      where: .mcaddon
      quote: |
        A zip file that contains .mcpack or .mcworld files to modify Minecraft (Bedrock Edition);
        generally used to distribute Add-Ons to other users.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/minecraftfileextensions
      where: .mcpack
      quote: |
        A zipped resource or behavior pack that modifies Minecraft: Bedrock Edition, typically used
        to transfer resources between users.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/scripting/libraries
      where: Core build tasks — Available tasks — packBP, packRP, packMcaddon
      quote: |
        **packBP**: creates an **.mcpack** file with your behavior packs. (Requires the `build` task to have been run first.)
        **packRP**: creates an **.mcpack** file with your resource packs. (Requires the `build` task to have been run first.)
        **packMcaddon**: creates an **.mcaddon** file with the packs previously created in `packBP` and `packRP`.
