- id: ecosystem-models-one-pack-per-kind-per-project
  status: retired
  reason: stale
  claim: |
    Every pack config and build tool surveyed models a project as at most one pack of each kind.
    The Bedrock-OSS project config standard — shared by Regolith and bridge. — keys its `packs` map
    by pack type with one path each, both tools let a pack's path move while the pack-type keys
    stay fixed, and Microsoft's `@minecraft/core-build-tasks` merges every listed source folder
    into one `development_behavior_packs/<PROJECT_NAME>` directory. What no surveyed tool can
    express is two packs of the *same* kind in one project.
  backing: documented
  caveat: |
    The operative half of the claim — at most one pack of a *given* kind — is carried by the
    project-config-standard `packs` map and Regolith's `Packs` struct, each holding one path per
    pack type. The other two legs are weaker than they look: the bridge. quote counts pack *types*
    ("up to four different pack types"), not packs per type, and no quote here states that bridge.
    shares the Bedrock-OSS standard; the `core-build-tasks` merge argument needs
    `copyToBehaviorPacks` to be a list of folders, which the quoted call site does not show.
  sources:
    - url: https://github.com/Bedrock-OSS/project-config-standard
      where: README — the `packs` field of the config interface
      quote: |
        	/**
        	 * Maps the id of packs this project contains to a path relative to the config.json
        	 *
        	 * @example { "behaviorPack": "./BP", "resourcePack": "./RP" }
        	 */
        	packs: {
        		[
        			packId:
        				| 'behaviorPack'
        				| 'resourcePack'
        				| 'skinPack'
        				| 'worldTemplate'
        				| 'dataPack'
        		]: string
        	}
    - url: https://github.com/Bedrock-OSS/regolith/blob/main/regolith/config.go
      where: the `Packs` struct
      quote: |
        type Packs struct {
        	BehaviorFolder string `json:"behaviorPack,omitempty"`
        	ResourceFolder string `json:"resourcePack,omitempty"`
        }
    - url: https://bridge-core.app/extensions/misc/pack-types.html
      where: Pack Types — Basics
      quote: |
        Each bridge. project can contain up to four different pack types.
    - url: https://github.com/Mojang/minecraft-scripting-libraries/blob/main/tools/core-build-tasks/src/tasks/copy.ts
      where: the deploy pool path constants
      quote: |
        const BehaviorPacksPath = 'development_behavior_packs';
        const ResourcePacksPath = 'development_resource_packs';
    - url: https://github.com/Mojang/minecraft-scripting-libraries/blob/main/tools/core-build-tasks/src/tasks/copy.ts
      where: copyTask — every listed source folder copied into one per-project directory
      quote: |2
                copyFiles(params.copyToBehaviorPacks, path.join(deploymentPath, BehaviorPacksPath, projectName));
                copyFiles(params.copyToScripts, path.join(deploymentPath, BehaviorPacksPath, projectName, 'scripts'));

- id: pnpm-workspace-packages-is-an-include-exclude-glob-list
  claim: |
    A `pnpm-workspace.yaml` defines the root of a workspace, and its `packages` field is the list of
    directory patterns the workspace includes or excludes: a direct subdirectory path, a `*` or `**`
    glob, or a pattern prefixed with `!` excluding the directories it matches. Omitting the field
    leaves only the root package, and the root package is a member whatever the patterns say.
  backing: documented
  caveat: |
    The documentation states only that the field includes or excludes directories; it says nothing
    about the patterns being evaluated in order, so whether a `!` pattern can be undone by a later
    include is outside what this evidence covers.
  sources:
    - url: https://pnpm.io/pnpm-workspace_yaml
      where: pnpm-workspace.yaml — opening paragraph, before the example
      quote: |
        pnpm-workspace.yaml defines the root of the workspace and enables you to include / exclude
        directories from the workspace. If the packages field is omitted, only the root package is
        included in the workspace.
    - url: https://pnpm.io/pnpm-workspace_yaml
      where: pnpm-workspace.yaml — the packages example
      quote: |
        packages:
          # specify a package in a direct subdir of the root
          - 'my-app'
          # all packages in direct subdirs of packages/
          - 'packages/*'
          # all packages in subdirs of components/
          - 'components/**'
          # exclude packages that are inside test directories
          - '!**/test/**'
    - url: https://pnpm.io/pnpm-workspace_yaml
      where: pnpm-workspace.yaml — the note following the packages example
      quote: |
        The root package is always included, even when custom location wildcards are used.

- id: npm-workspaces-is-an-array-of-paths-or-globs
  claim: |
    A root `package.json`'s `workspaces` field is an array of file patterns naming the folders that
    are the workspace's members; each entry is either a direct path to a folder or a glob that
    resolves to such folders. A folder a pattern matches is treated as a workspace only where it
    holds a valid `package.json`, so matching a pattern is not by itself membership.
  backing: documented
  sources:
    - url: https://docs.npmjs.com/cli/v10/configuring-npm/package-json
      where: workspaces — the field's definition
      quote: |
        The optional workspaces field is an array of file patterns that describes locations within
        the local file system that the install client should look up to find each workspace that
        needs to be symlinked to the top level node_modules folder.
    - url: https://docs.npmjs.com/cli/v10/configuring-npm/package-json
      where: workspaces — the sentence following the definition
      quote: |
        It can describe either the direct paths of the folders to be used as workspaces or it can
        define globs that will resolve to these same folders.
    - url: https://docs.npmjs.com/cli/v10/configuring-npm/package-json
      where: workspaces — the sentence introducing the glob example
      quote: |
        In the following example, all folders located inside the folder ./packages will be treated
        as workspaces as long as they have valid package.json files inside them:

- id: manager-enumeration-libraries-need-no-install
  claim: |
    npm and pnpm each publish their own workspace-enumeration implementation to the public npm
    registry — `@npmcli/map-workspaces`, from github.com/npm/map-workspaces, and
    `@pnpm/workspace.find-packages`, from github.com/pnpm/pnpm.
    Each enumerates a workspace in-process from its checked-out definition alone: with no
    `node_modules`, no lockfile, and without invoking the manager's own binary, both return the
    workspace's member packages and the directory of each. pnpm's finder takes the `packages`
    patterns its caller reads from `pnpm-workspace.yaml`, honours a `!` exclusion among them, and
    returns the workspace root package alongside the members; npm's returns the members only.
  backing: tested
  caveat: |
    Both `npm` and `pnpm` were on PATH when the probe ran, so the capture shows the libraries not
    being handed the binary rather than the libraries working while it is absent — non-invocation is
    read off the committed probe script, not observed against a machine without the manager. The
    enumeration results and the uninstalled fixture state are directly observed. And what the
    registry entries carry is that each package is published from the manager's own repository, not
    that either manager's CLI consumes the published package.
  sources:
    - description: |
        Two probes under design/minecraft/dev-kit/artifacts/, both written and run by this fact's
        author on 2026-07-26. registry-probe/probe.mjs queries the public registry for each
        package and prints its identifying metadata. workspace-enumeration-probe/probe.mjs
        enumerates the two committed fixture workspaces beside it — neither ever installed, as the
        probe checks and prints — using the libraries, and reports whether each manager's CLI is on
        PATH. Captured stdout is OUTPUT.txt beside each script.
    - url: design/minecraft/dev-kit/artifacts/registry-probe/OUTPUT.txt
      where: both entries — registry status, latest version, and repository of each package
      quote: |
        === @npmcli/map-workspaces
        GET https://registry.npmjs.org/@npmcli%2Fmap-workspaces -> 200
        name: @npmcli/map-workspaces
        latest: 6.0.0
        description: Retrieves a name:pathname Map for a given workspaces config
        repository: {"url":"git+https://github.com/npm/map-workspaces.git","type":"git"}
        homepage: https://github.com/npm/map-workspaces#readme
        dist.tarball: https://registry.npmjs.org/@npmcli/map-workspaces/-/map-workspaces-6.0.0.tgz

        === @pnpm/workspace.find-packages
        GET https://registry.npmjs.org/@pnpm%2Fworkspace.find-packages -> 200
        name: @pnpm/workspace.find-packages
        latest: 1000.0.65
        description: Finds packages inside a workspace
        repository: {"url":"git+https://github.com/pnpm/pnpm.git#main","type":"git"}
        homepage: https://github.com/pnpm/pnpm/tree/main/workspace/find-packages#readme
        dist.tarball: https://registry.npmjs.org/@pnpm/workspace.find-packages/-/workspace.find-packages-1000.0.65.tgz
    - url: design/minecraft/dev-kit/artifacts/workspace-enumeration-probe/OUTPUT.txt
      where: '"fixture state" — neither fixture workspace has been installed'
      quote: |
        === fixture state (no install has run in either)
        npm-ws node_modules present: false
        npm-ws package-lock.json present: false
        npm-ws pnpm-lock.yaml present: false
        pnpm-ws node_modules present: false
        pnpm-ws package-lock.json present: false
        pnpm-ws pnpm-lock.yaml present: false
    - url: design/minecraft/dev-kit/artifacts/workspace-enumeration-probe/OUTPUT.txt
      where: the two enumeration sections — what each library returned for its fixture
      quote: |
        === npm workspace via @npmcli/map-workspaces
          @fixture/delta -> packages/delta
          @fixture/gamma -> packages/gamma

        === pnpm workspace via @pnpm/workspace.find-packages
          patterns read from pnpm-workspace.yaml: ["packages/*","!packages/ignored"]
          pnpm-ws-root@0.0.0 -> .
          @fixture/alpha@1.2.3 -> packages/alpha
          @fixture/beta@0.1.0 -> packages/beta

- id: module-type-enumerations-disagree
  claim: |
    The set of module `type` values a manifest may declare is not enumerable from the format's own
    documentation. Microsoft's add-on manifest reference lists four — `resources`, `data`,
    `world_template`, `script`. Its Creator Tools manifest validator raises an error on an
    unrecognised type but names six, and says its list "include"s them rather than that they are the
    set. And the reference page's own example behavior-pack manifest declares a `client_data` module
    that appears in neither list. A kit validating a module type against any published enumeration
    would report a problem against Microsoft's own reference pack.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: modules — type
      quote: |
        This is the type of the module. Can be any of the following: `resources`, `data`,
        `world_template` or `script`.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/mctoolsvalreference/chkmanif
      where: CHKMANIF109 — Invalid Module, severity Error
      quote: |
        A module has an unrecognized type. Valid module types include: persona\_piece,
        world\_template, skin\_pack, data, script, and resources.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: Examples — Behavior Pack, the second entry of its modules array
      quote: |
        {
                    "description": "Example client scripts module",
                    "type": "client_data",
                    "uuid": "c05a992e-482a-455f-898c-58bbb4975e47",
                    "version": [1, 0, 0]
                }

- id: manifest-declares-pack-identity-version-and-module-kinds
  claim: |
    A Bedrock add-on pack is defined by its own `manifest.json`: the header's `uuid` uniquely
    identifies the pack and the header's `version` is the pack version, while the `modules`
    array's `type` states what kind of pack it is — `data` for behavior content, `script` for
    scripting code, which is embedded within behavior packs, and `resources` for a resource
    pack. A pack's own content therefore carries what kind of content it holds, without reference
    to how it is stored or built.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/manifestreference/packmanifestdocument
      where: opening paragraph — the root structure of a manifest.json
      quote: |
        The root structure of a manifest.json file that defines an add-on pack. Every behavior
        pack and resource pack requires a manifest with a unique UUID, version info, and module
        declarations. This is the entry point Minecraft uses to identify and load your content.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/manifestreference/packmanifestdocument
      where: 3.0.0.Module — what a module declares
      quote: |
        Declares a module within the pack. Modules define what the pack contains: 'data' for
        behavior packs, 'resources' for resource packs, or 'script' for packs with
        JavaScript/TypeScript code. Script modules require an entry point file path.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: Properties — header — uuid
      quote: |
        This is a special type of identifier that uniquely identifies this pack from any other
        pack. UUIDs are written in the format xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx where each x
        is a hexadecimal value (0-9 or a-f).
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: Properties — header — version, the full row including its Type column
      quote: |
        version | Vector [a, b, c] or SemVer String | This is the version of your pack in the
        format [majorVersion, minorVersion, revision]. The version number is used when importing
        a pack that has been imported before. The new pack will replace the old one if the
        version is higher, and ignored if it's the same or lower. In version 3, currently in
        preview, you must use a string for version.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: modules — type
      quote: |
        This is the type of the module. Can be any of the following: `resources`, `data`,
        `world_template` or `script`.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/bedrockserver/scripting
      where: '"Enable differentiated module permissions" — opening sentence'
      quote: |
        You can set different permissions for different references to scripts that are embedded
        as modules within behavior packs.

