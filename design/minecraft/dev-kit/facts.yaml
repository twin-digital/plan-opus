# Facts scoped to the minecraft/dev-kit design. All are PROPOSED by an agent and await owner
# review. Every outside quote was fetched from its primary source and checked byte-for-byte
# against it.
#
# The two tested facts rest on probes committed with the design. The detection probe is this
# design's own, under design/minecraft/dev-kit/artifacts/. The pool-layout probe sits at area
# scope, under design/minecraft/artifacts/, because minecraft/dev-server has a fact resting on
# the same probe. Both were run by the author of the design formerly named
# minecraft/dev-workflow, not by this file's author, and say so per r:tested-facts-name-whose-test.

- id: bedrock-manifest-declares-pack-identity-and-kind
  claim: |
    A Bedrock add-on pack is defined by its own `manifest.json`: the header's `uuid` uniquely
    identifies the pack and the header's `version` is the pack version, while the `modules`
    array's `type` states what kind of pack it is — `data` for behavior content, `script` for
    scripting, `resources` for a resource pack. A pack's own content therefore states both that
    it is a pack and which kind, with no reference to how it is stored or built.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/manifestreference/packmanifestdocument
      where: opening paragraph — the root structure of a manifest.json
      quote: |
        The root structure of a manifest.json file that defines an add-on pack. Every behavior
        pack and resource pack requires a manifest with a unique UUID, version info, and module
        declarations. This is the entry point Minecraft uses to identify and load your content.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/manifestreference/packmanifestdocument
      where: 3.0.0.Module — what a module declares
      quote: |
        Declares a module within the pack. Modules define what the pack contains: 'data' for
        behavior packs, 'resources' for resource packs, or 'script' for packs with
        JavaScript/TypeScript code. Script modules require an entry point file path.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: Properties — header — uuid
      quote: |
        This is a special type of identifier that uniquely identifies this pack from any other
        pack. UUIDs are written in the format xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx where each x
        is a hexadecimal value (0-9 or a-f).
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: Properties — header — version
      quote: |
        This is the version of your pack in the format [majorVersion, minorVersion, revision].
        The version number is used when importing a pack that has been imported before. The new
        pack will replace the old one if the version is higher, and ignored if it's the same or
        lower.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: modules — type
      quote: |
        This is the type of the module. Can be any of the following: `resources`, `data`,
        `world_template` or `script`.

- id: content-independent-pack-heuristics-misfire
  claim: |
    Detection rules that do not read a pack's manifest misclassify real workspaces. Scored
    against a 41-package monorepo holding two behavior packs, a dependency on the Minecraft
    scripting API also selects a shared library that scripts against that API without being a
    pack; the presence of build and watch scripts selects three unrelated packages; and living
    under a `minecraft/` directory also selects a build config and the dev harness itself. A
    package.json marker field or pack keyword selects nothing, because no package carries one
    until every pack is edited to add it.
  backing: tested
  sources:
    - description: |
        design/minecraft/dev-kit/artifacts/pack-detection/detect-probe.mjs was run against a 41-package
        pnpm workspace (twin-digital/opus at archive/minecraft-prototype, 4e731f5b) by the author
        of the design formerly named minecraft/dev-workflow, not by this fact's author; captured
        stdout is OUTPUT.txt beside the script. Ground truth is derived from pack content under
        the add-on format — a committed manifest.json with a header uuid and a data or script
        module — and yielded two packs.
    - url: design/minecraft/dev-kit/artifacts/pack-detection/OUTPUT.txt
      where: "\"rules that diverge from the format's own answer\" — the summary of each heuristic's error counts"
      quote: |2
          [heuristic] any dependency on @minecraft/server: missed=0 falsePositives=1
          [heuristic] has both build and watch scripts: missed=0 falsePositives=3
          [heuristic] package.json keywords contain a pack keyword: missed=2 falsePositives=0
          [heuristic] explicit package.json marker field (minecraft/mcpack/bedrock key): missed=2 falsePositives=0
          [heuristic] package name matches /pack/: missed=2 falsePositives=1
          [external] directory location under a minecraft/ folder: missed=0 falsePositives=3

- id: pack-is-a-directory-with-a-manifest-at-its-root
  claim: |
    A Bedrock pack is a directory whose only required file is `manifest.json`, sitting at that
    directory's root; everything else is optional content in format-named subfolders. A directory
    holding a `manifest.json` at its root is therefore the format's own definition of a pack, with
    nothing outside the directory needed to recognise it.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/comprehensivepackcontents
      where: intro, before "Comprehensive Behavior Pack"
      quote: |
        The only required file in either type of pack is manifest.json.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/behaviorpackfromscratch
      where: opening paragraph
      quote: |
        A behavior pack is a folder structure that contains files that drive entity behaviors,
        loot drops, spawn rules, items, recipes, and trade tables.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/behaviorpackfromscratch
      where: '"Create the manifest file", step 1 — where the manifest goes'
      quote: |
        Create a new document in your My_BEHAVIOR_Pack folder and name it manifest.json.

- id: pack-directory-name-carries-no-meaning
  claim: |
    Nothing reads a pack's directory name. The name is free by the format, and a behavior pack
    deployed into a directory named `resource_pack_totally` loads normally, the server printing
    that name back untroubled. Where a pack's sources and built output sit, and what those
    directories are called, is therefore free to choose without affecting whether the pack loads —
    and a directory name can never be relied on as a statement of what a pack is.
  backing: tested
  sources:
    - description: |
        The pool-layout probe at design/minecraft/artifacts/pack-layout/probe/, case 5: run.mjs
        redeploys the probe packs into pool directories named to contradict their manifests and
        reloads the world, capturing the server's Pack Stack line in OUTPUT.txt beside it. Run by
        the author of the design formerly named minecraft/dev-workflow, not by this fact's author.
        The Learn quote below is the source-side half — that a pack's own folder may be named
        anything — and is independent of the probe.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/behaviorpackfromscratch
      where: '"Create a folder" — naming the pack folder'
      quote: |
        In this section, you will create a folder called My_BEHAVIOR_Pack. Well, actually you
        don't have to call it that. In fact, you can name this folder anything you want, but the
        other folders have to be named exactly like this tutorial says so that Minecraft knows
        where to look.
    - url: design/minecraft/artifacts/pack-layout/probe/OUTPUT.txt
      where: case 5 — pack directories renamed to names that contradict their manifests
      quote: |
        === case 5: pack directories renamed to names that contradict their manifests
        (is a source or pool directory name ever read as a declaration of kind?)
          world_behavior_packs.json = [{"pack_id":"d3c9f2a1-5b6e-4c7d-8e9f-0a1b2c3d4e5f","version":[1,0,0]}]
          world_resource_packs.json = [{"pack_id":"f5ebc4c3-7d8a-4e9f-0a1b-2c3d4e5f6a7b","version":[1,0,0]}]
        [2026-07-24 23:49:22:860 INFO] Pack Stack - [00] layout probe behavior pack (id: d3c9f2a1-5b6e-4c7d-8e9f-0a1b2c3d4e5f, version: 1.0.0) @ development_behavior_packs/resource_pack_totally

- id: pack-dependencies-name-an-exact-uuid-and-version
  claim: |
    A pack declares its dependencies on other packs in its manifest's `dependencies` array, each
    entry naming the other pack's exact header uuid and an exact version. An entry may instead name
    a built-in scripting module by `module_name`, so not every dependency entry resolves to a pack
    in the workspace and validation cannot assume the set is closed.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: Properties table — dependencies row
      quote: |
        Section containing definitions for any other packs that are required in order for this
        manifest.json file to work.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: dependencies table — uuid row
      quote: |
        This is the unique identifier of the pack that this pack depends on. It needs to be the
        exact same UUID that the pack has defined in the header section of its manifest file.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: dependencies table — version row
      quote: |
        This is the specific version of the pack that your pack depends on. Should match the
        version the other pack has in its manifest file.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
      where: dependencies table — module_name row
      quote: |
        For dependencies on built-in scripting modules, contains the name of the module. (for
        example, @minecraft/server)

- id: ecosystem-models-one-pack-per-kind-per-project
  claim: |
    Every pack config and build tool surveyed models a project as at most one pack of each kind.
    The Bedrock-OSS project config standard — shared by Regolith and bridge. — keys its `packs` map
    by pack type with one path each, both tools let a pack's path move while the pack-type keys
    stay fixed, and Microsoft's `@minecraft/core-build-tasks` merges every listed source folder
    into one `development_behavior_packs/<PROJECT_NAME>` directory. What no surveyed tool can
    express is two packs of the *same* kind in one project.
  backing: documented
  sources:
    - url: https://github.com/Bedrock-OSS/project-config-standard
      where: README — the `packs` field of the config interface
      quote: |
        	/**
        	 * Maps the id of packs this project contains to a path relative to the config.json
        	 *
        	 * @example { "behaviorPack": "./BP", "resourcePack": "./RP" }
        	 */
        	packs: {
        		[
        			packId:
        				| 'behaviorPack'
        				| 'resourcePack'
        				| 'skinPack'
        				| 'worldTemplate'
        				| 'dataPack'
        		]: string
        	}
    - url: https://github.com/Bedrock-OSS/regolith/blob/main/regolith/config.go
      where: the `Packs` struct
      quote: |
        type Packs struct {
        	BehaviorFolder string `json:"behaviorPack,omitempty"`
        	ResourceFolder string `json:"resourcePack,omitempty"`
        }
    - url: https://bridge-core.app/extensions/misc/pack-types.html
      where: Pack Types — Basics
      quote: |
        Each bridge. project can contain up to four different pack types.
    - url: https://github.com/Mojang/minecraft-scripting-libraries/blob/main/tools/core-build-tasks/src/tasks/copy.ts
      where: the deploy pool path constants
      quote: |
        const BehaviorPacksPath = 'development_behavior_packs';
        const ResourcePacksPath = 'development_resource_packs';
    - url: https://github.com/Mojang/minecraft-scripting-libraries/blob/main/tools/core-build-tasks/src/tasks/copy.ts
      where: copyTask — every listed source folder copied into one per-project directory
      quote: |2
                copyFiles(params.copyToBehaviorPacks, path.join(deploymentPath, BehaviorPacksPath, projectName));
                copyFiles(params.copyToScripts, path.join(deploymentPath, BehaviorPacksPath, projectName, 'scripts'));

- id: release-archives-follow-pack-content
  claim: |
    The format's distribution archives follow what a project contains: an `.mcpack` is one zipped
    resource or behavior pack, and an `.mcaddon` is a zip holding `.mcpack` or `.mcworld` files.
    Microsoft's build tasks emit exactly that — `packBP` and `packRP` each produce an `.mcpack`,
    and `packMcaddon` bundles the two. Nothing in the definition requires an `.mcaddon` to hold
    more than one pack.
  backing: documented
  caveat: |
    That a client imports a single-pack `.mcaddon` happily is not stated by any first-party source
    found. It is structurally legal by the definition quoted here, and untested.
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/minecraftfileextensions
      where: .mcaddon
      quote: |
        A zip file that contains .mcpack or .mcworld files to modify Minecraft (Bedrock Edition);
        generally used to distribute Add-Ons to other users.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/minecraftfileextensions
      where: .mcpack
      quote: |
        A zipped resource or behavior pack that modifies Minecraft: Bedrock Edition, typically used
        to transfer resources between users.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/scripting/libraries
      where: Core build tasks — Available tasks — packBP, packRP, packMcaddon
      quote: |
        **packBP**: creates an **.mcpack** file with your behavior packs. (Requires the `build` task to have been run first.)
        **packRP**: creates an **.mcpack** file with your resource packs. (Requires the `build` task to have been run first.)
        **packMcaddon**: creates an **.mcaddon** file with the packs previously created in `packBP` and `packRP`.
