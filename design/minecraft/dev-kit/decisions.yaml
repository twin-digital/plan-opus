# Decisions scoped to the minecraft/dev-kit design.
# Schema: id, statement, status (proposed|accepted|tolerated|rejected), falsifiers.

- id: workspace-enumeration-uses-the-managers-own-libraries
  statement: |
    workspace packages are enumerated in-process by each package manager's own published
    enumeration library, not by shelling out to the manager
  status: accepted
  falsifiers:
    - a manager's enumeration library turns out to need a completed install, a lockfile, or a network fetch before it will list a clean checkout
    - a workspace form the kit must support is reachable only through the manager's CLI, not through the definition file its library reads
    - a library's published API churns faster than the kit can absorb, so tracking it costs more than reading the definition files against their documented formats

- id: workspace-definition-file-selects-the-manager
  statement: |
    a root `pnpm-workspace.yaml` selects pnpm enumeration, and otherwise a root `package.json`
    `workspaces` field selects npm
  status: accepted
  falsifiers:
    - a real workspace carries both definition files with different member sets, so the precedence silently drops packages a developer expects to see
    - a third manager comes into scope whose workspace definition neither file distinguishes

- id: workspace-root-package-is-a-candidate
  statement: |
    the workspace root package is a discovery candidate, added explicitly where the manager's
    library omits it
  status: accepted
  falsifiers:
    - a root package routinely holds a `behavior_pack/` or `resource_pack/` directory that is fixture or template content rather than a shipped pack

- id: workspace-failures-throw-and-pack-failures-are-records
  statement: |
    trouble with the workspace itself — no definition found, an unreadable root, a member
    `package.json` that will not parse — throws, while trouble with an individual pack becomes a
    problem record on its entry
  status: tolerated
  falsifiers:
    - a consumer needs the packs it can resolve from a workspace whose definition is unreadable, rather than nothing at all
    - a consumer ends up wrapping every call to render workspace trouble alongside pack problems, so the two channels are one channel in practice
    - a monorepo routinely holds a member whose `package.json` is mid-edit or generated broken, so packs with no relation to it become undiscoverable and a dev server stops for a fault in another team's package
    - an entry point turns up that matches workspace directories without reading their manifests, so the kit could keep a member fault per-pack without reproducing either manager's glob semantics

- id: problems-carry-a-closed-set-of-codes
  statement: |
    a problem is a union discriminated by a code from a closed set, each code typing the referent
    it needs, plus a human-readable message; the entry it rides on names the pack it is about
  status: tolerated
  falsifiers:
    - a consumer branches on message text because the codes are too coarse to act on
    - no consumer reads the code, every one of them treating a problem as an opaque message
    - consumers routinely widen the union back to one shape to render or store a list, so typing the referent per code costs more than it gives
    - consumers routinely flatten problems across entries and have to re-attach the pack by hand, so a problem should carry it after all

- id: completion-version-form-follows-format-version
  statement: |
    a manifest's `format_version` fixes its version form everywhere the kit reads or writes one —
    a SemVer string at 3 or higher, a `[major, minor, revision]` array otherwise, including when
    the format version is absent or unrecognised
  status: rejected

- id: built-output-location-is-computed-not-probed
  statement: |
    a pack's built output location is computed from its package and kind and reported without
    touching the filesystem
  status: tolerated
  falsifiers:
    - the output root becomes configurable per package, so the location can no longer be computed from the package directory and kind alone
    - every consumer independently stats the reported location, showing the kit should carry that answer

- id: manifest-is-reported-as-an-open-typed-document
  statement: |
    the reported manifest is typed as an open document, with `format_version`, `header`, `modules`,
    and `dependencies` the known subset and every other field carried untyped
  status: tolerated
  falsifiers:
    - the kit comes to read or write a field outside the known subset, so the typed subset no longer states what the kit acts on
    - a check keys on a field whose shape varies by format version, so the known subset has to be typed per format version rather than once

- id: workspace-dependency-resolution-matches-member-names
  statement: |
    a prod dependency resolves to a workspace package when its name equals an enumerated member's
    `name`, whatever specifier it carries, and the declared range is not checked against that
    member's version
  status: rejected

- id: workspace-uuid-entry-may-not-carry-a-version
  statement: |
    a dependency entry whose uuid names a pack in the workspace is a problem when it specifies a
    version, rather than being read as an entry the kit leaves alone
  status: accepted
  falsifiers:
    - a pack legitimately needs to pin a sibling at a version other than the one the workspace holds — a published release of a pack that also lives here — so the error blocks a real dependency
    - a workspace pack shares its uuid with an outside pack a manifest genuinely depends on, so the entry can never carry the version an external dependency requires

- id: every-observed-problem-is-reported
  statement: |
    a candidate that trips several codes yields one problem record per code, with no precedence
    among them and no primary code elected
  status: tolerated
  falsifiers:
    - one malformed manifest routinely emits a burst a CLI cannot present without picking a lead code, so consumers re-derive a precedence the kit refused to give
    - two codes prove to be one condition seen twice, so a consumer counting problems overstates what is wrong

- id: pack-set-closure-demotes-to-a-fixed-point
  statement: |
    a single closing pass decides which entries are valid, marking every candidate carrying a
    problem invalid and re-walking dependency edges until a pass marks nothing
  status: rejected

- id: invalidation-propagates-along-dependency-edges
  statement: |
    a candidate carrying a problem is invalid, and so is every candidate that reaches one along its
    dependency edges — one walk backwards from the candidates that failed on their own
  status: accepted
  falsifiers:
    - a rule arrives that can restore a candidate as well as invalidate one, so a single backward walk from the initial failures no longer settles the set
    - a consumer needs to deploy the packs that are individually sound even where a transitive dependency failed, so invalidating them at all blocks a run the developer wanted

- id: pack-record-paths-are-workspace-relative-directories
  statement: |
    every path a pack record carries — its owning package's directory, its source location, its
    built-output location — is a POSIX path relative to the workspace root, naming a directory
    rather than a file within it
  status: accepted
  falsifiers:
    - a consumer outside the workspace process needs an absolute path and cannot recover the workspace root the paths are relative to
    - a workspace member resolves outside the workspace root, so no relative path names it

- id: pack-record-version-is-the-packages-own-string
  statement: |
    a pack record's `version` is the owning package's `version` string exactly as `package.json`
    holds it, read independently of the manifest and of what its format version can express
  status: accepted
  falsifiers:
    - a consumer compares record versions against manifest versions field-for-field and has to re-parse the string back into the array form
    - the record version and the completed manifest version diverge often enough that consumers cannot tell which one a server will honour
    - consumers parse the field as SemVer without checking and break on the entries where the package's string is not one

- id: pack-kind-is-spelled-behavior-or-resource
  statement: |
    a pack's kind is the enum `behavior` | `resource` on the record and on every problem record,
    distinct from the `behavior_pack` / `resource_pack` directory names it is read from
  status: accepted
  falsifiers:
    - consumers routinely map the enum back to the directory name to build a path, so carrying the directory spelling would serve them better
    - a third pack kind arrives whose directory name and enum value cannot be derived from one another

- id: unidentified-candidates-make-outside-ness-indeterminate
  statement: |
    while any candidate has yielded no identity, a dependency uuid no candidate claims is
    indeterminate rather than external: an entry carrying a version passes through and one carrying
    none is reported as an unresolved target
  status: rejected

- id: a-placeholder-version-is-no-version-everywhere
  statement: |
    a placeholder version is read as no version wherever the kit reads one, so it leaves an inside
    dependency entry unspecified and leaves an external entry missing the version it must carry
  status: rejected
  falsifiers:
    - a pack legitimately depends on version `[0, 0, 0]` of an outside pack, so the placeholder reading rejects a real dependency
    - a placeholder version on an external entry turns out to be how an author says "any version" and the server accepts it

- id: uuids-are-compared-and-reported-lowercased
  statement: |
    the kit lowercases every uuid it reads before matching one against another, and a pack record
    carries the lowercased form
  status: tolerated
  falsifiers:
    - a consumer queries with a uuid taken from a manifest rather than from a record, and the case mismatch reads as "no such pack" instead of an error
    - a uuid's case turns out to be significant somewhere the kit's output is consumed, so canonicalising changes which pack loads

- id: the-pack-set-is-the-single-returned-value
  statement: |
    one asynchronous entry point returns a pack set holding the one list of entries and the queries
    over it
  status: accepted
  falsifiers:
    - a workspace grows large enough that a consumer needs packs streamed or discovered incrementally rather than as one settled value
    - a consumer needs the queries over a set it assembled itself, so they have to be free functions

- id: an-invalid-entry-keeps-every-detail-its-sources-hold
  statement: |
    an invalid entry carries every field the kit managed to read, two of them optional on that arm
    alone: `uuid` and `manifest`, present where the manifest parsed and declared a header uuid
  status: accepted
  falsifiers:
    - a consumer sorts or renders entries by version and has to invent a placeholder for the ones without, so the field should always be present in some form
    - consumers read the optional fields without checking and crash on the arm that lacks them, so a status naming "found but unidentified" would carry the distinction better than optionality does

- id: an-uncompletable-field-keeps-what-the-source-wrote
  statement: |
    a field completion cannot fill is left exactly as the source manifest wrote it — the placeholder,
    or the omission — and never carries a value the kit invented or a form the manifest cannot express
  status: tolerated
  falsifiers:
    - a consumer needs to tell "the kit could not fill this" from "the author wrote this placeholder", which the document alone does not say
    - a server rejects a manifest carrying a placeholder where it would have accepted the field omitted, so leaving the source spelling is worse than dropping the field

- id: a-uuid-is-the-documented-hex-form
  statement: |
    the kit accepts as a uuid only the documented `xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx` hexadecimal
    form, in either case, and reports an absent one and a malformed one under the one code
  status: tolerated
  falsifiers:
    - packs in the wild carry a uuid the engine loads in another spelling — braces, or no hyphens — so rejecting it blocks a working pack
    - a consumer needs to tell an absent uuid from a malformed one to give the right repair advice, and the carried value is not enough

- id: entries-come-back-in-a-stable-order
  statement: |
    the entry list is ordered by owning package name and then by kind, the same order on every run
    and under either package manager
  status: accepted
  falsifiers:
    - a consumer needs the workspace definition's own order, or discovery order, and cannot recover it from a sorted list
    - every consumer re-sorts the list for its own display, so the kit's order is never the one used
