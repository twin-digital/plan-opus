# Decisions for the minecraft/dev-kit design.
# Schema: id, statement, status (proposed|accepted|tolerated|rejected), falsifiers.
# status is required and always written. At least one falsifier per live decision.
#
# Three decisions the owner accepted on review are gone from this file: they are now requirements
# under the same ids (pack-set-is-a-flat-record-list, packages-come-from-the-workspace-definition,
# kind-derived-from-module-types), and their citations moved to [[r:...]]. A fourth,
# membership-probed-at-fixed-package-root-paths, is gone because the requirements settle it —
# see the requirements it cited in "Finding packs".
#
# Two more are gone with the arrival of minecraft/build-kit, which owns when a build runs and where
# its output lands: this design no longer chooses how a build is invoked or when completion runs
# relative to one. The guarantee that completion never edits a source manifest moved into
# r:kit-completes-partial-source-manifests.

- id: problems-returned-beside-the-pack-set
  statement: |
    every capability returns the normalised pack set together with a list of coded problem records
    naming the owning package, the path examined, and a message
  status: tolerated
  falsifiers:
    - both consumers wrap every call in the same throw-on-any-problem shim, so pairing the return
      only relocates the check it was meant to force
    - problems arise that belong to the workspace rather than to any one package and path, so a
      per-location record cannot express them
    - consumers key on a problem's message text rather than its code, so the code carries no weight

- id: built-output-checks-are-opt-in
  statement: |
    source-level validation always runs; the check that a pack's expected built output exists runs
    only when the caller asks for it
  status: proposed
  falsifiers:
    - every caller passes the same value on every invocation, so the option never varies and the
      split earns nothing
    - a source-level check turns out to need the built output to reach its answer, so the two tiers
      cannot be separated

- id: output-root-overridden-in-package-json
  statement: |
    a package overrides the default output root with a `minecraft.outDir` key in its own
    `package.json`
  status: tolerated
  falsifiers:
    - a package's build emits its two packs somewhere other than under one root, so no single
      override can locate both
    - the output root must vary per invocation, by build target or configuration, so a single
      static value in `package.json` cannot express it

- id: explicit-version-marks-a-dependency-external
  statement: |
    a dependency entry with no version must resolve by uuid to a discovered pack, and one carrying
    an explicit version is treated as external and never resolved against the workspace
  status: proposed
  falsifiers:
    - manifests in a real workspace carry explicit versions on entries that do name in-workspace
      packs, so an explicit version cannot mark a dependency external
    - a pack must depend on an in-workspace pack at a version other than the one the workspace
      currently holds, which an absent version cannot express

