# Decisions scoped to the minecraft/dev-kit design.
# Every status here is the owner's ruling: `accepted` is endorsed, `tolerated` is cleared to
# proceed and free for a later author to rework, and `rejected` is a record of a choice turned
# down — kept, uncitable, and never the behaviour the spec describes.

- id: the-kit-resolves-the-workspace-definition-itself
  statement: |
    the kit reads the workspace definition and expands its patterns itself, rather than delegating
    enumeration to `@npmcli/map-workspaces` or `@pnpm/workspace.find-packages`
  status: rejected
  falsifiers:
    - a real workspace holds a directory with its own `package.json`, not the root, that `npm query .workspace` or `pnpm list -r` counts a member and the kit does not, or the reverse — divergence outside the two the design chooses
    - either manager changes its workspace config format such that the kit's pattern handling has to track a moving target
    - the kit's own enumeration path grows past the size of the config-format and glob semantics it replaces

- id: a-package-fault-invalidates-only-its-own-packs
  statement: |
    a candidate package whose `package.json` cannot be read or parsed invalidates the packs in that
    package and no others; the rest of the workspace enumerates normally
  status: rejected
  falsifiers:
    - consumers report that a package fault silently hides a workspace-wide breakage they needed to see immediately
    - packs whose completion data comes from a faulted package are found to be usable in practice, making the invalid marking wrong

- id: a-pack-outside-any-workspace-package-is-reported-invalid
  statement: |
    a directory the workspace patterns match that holds a source pack but no `package.json` is
    reported as an invalid entry rather than skipped
  status: rejected
  falsifiers:
    - real workspaces routinely carry pack-shaped directories outside any package that consumers must not be told about
    - the entries produced this way are unusable enough that every consumer filters them out at the first call

- id: pack-locations-are-workspace-relative
  statement: a pack's source and build-output locations are reported as workspace-relative paths
  status: accepted
  falsifiers:
    - a consumer is found holding a pack entry without the workspace root it came from, so the paths cannot be rejoined

- id: entries-ordered-by-package-path
  statement: |
    entries are ordered by candidate-package path, behavior pack before resource pack within a
    package
  status: tolerated
  falsifiers:
    - a consumer needs a different stable order often enough that it re-sorts on every call

- id: only-a-missing-workspace-definition-throws
  statement: |
    `discoverPacks` throws only when the workspace root holds neither a readable
    `pnpm-workspace.yaml` nor a readable `package.json`; every other fault is a reported problem
  status: rejected
  falsifiers:
    - a fault class arises that no entry can carry, because it belongs to no pack

- id: pnpm-marker-wins-npm-is-the-fallback
  statement: |
    a root `pnpm-workspace.yaml` selects pnpm; otherwise the root is an npm workspace
  status: accepted
  falsifiers:
    - a third manager's workspace layout has to be supported and its marker file collides with this order
    - a root holding a `pnpm-workspace.yaml` is found that must be read as an npm workspace

- id: node-modules-directories-are-never-candidates
  statement: a matched directory anywhere under a `node_modules` path is never a candidate package
  status: rejected
  falsifiers:
    - a workspace legitimately holds a source pack under a `node_modules` path

- id: a-package-with-no-source-manifest-yields-no-entry
  statement: |
    a candidate package holding neither source pack directory produces no entry at all, not an
    empty or invalid one
  status: accepted
  falsifiers:
    - a consumer needs to distinguish a package that was examined from one that was never a candidate

- id: unreadable-and-unparseable-manifests-are-one-problem
  statement: |
    any failure to read or to parse a source `manifest.json` is reported as the single
    `manifest-unreadable` problem carrying the underlying message
  status: accepted
  falsifiers:
    - a consumer has to branch on whether the file was absent, unreadable, or malformed

- id: empty-header-name-reads-as-unspecified
  statement: |
    a `header.name` of `""` in a source manifest is treated as unspecified and completed; any other
    present value is the specified-field error
  status: accepted
  falsifiers:
    - a pack legitimately ships an empty header name that must survive to the server

- id: only-format-version-3-restricts-version-form
  statement: |
    only a `format_version` of 3 restricts a source version to string form; a missing or
    unrecognised `format_version` imposes no restriction
  status: tolerated
  falsifiers:
    - a later manifest format version restricts version form and the kit reports its packs as unrestricted

- id: product-name-must-be-a-non-empty-string
  statement: |
    completion reads `productName` when it is a non-empty string and falls back to the
    scope-stripped package name otherwise; a `productName` that is absent or unusable raises no
    problem
  status: accepted
  falsifiers:
    - a package is found whose non-string `productName` carries the name a consumer expects to see

- id: an-unconstrained-search-returns-every-valid-entry
  statement: a search constraining nothing returns every valid entry in the set
  status: rejected
  falsifiers:
    - the empty-criteria call is found to be a common typo whose result reads as a filtered set

- id: filtering-is-a-parameter-of-the-discovery-call
  statement: |
    pack criteria are the `filter` field of `DiscoverOptions`, and `discoverPacks` returns the
    matching entries directly rather than a pack-set object carrying a `search` method
  status: accepted
  falsifiers:
    - a consumer filters one workspace more than once per read, so the repeated whole-workspace reads dominate its cost
    - a consumer needs the whole set alongside a filtered subset of it and has to call twice to get both
    - the pack set grows behaviour past the entry list — a uuid index, a lazily read detail — that has nowhere to live once the call returns a bare array

- id: the-pack-set-is-read-once-per-call
  statement: |
    each `discoverPacks` call reads the filesystem once and searches run over that in-memory set,
    with no caching or watching between calls
  status: accepted
  falsifiers:
    - a consumer's watch loop calls `discoverPacks` often enough that repeated whole-workspace reads dominate its cost

- id: the-workspace-option-is-required
  statement: |
    `DiscoverOptions.workspace` is required and has no default, so a consumer wanting the current
    directory passes it explicitly
  status: rejected
  falsifiers:
    - nearly every call site is found passing `process.cwd()`, making the required argument ceremony

- id: enumeration-failure-rejects-the-call
  statement: |
    a failure to enumerate the workspace — a missing or unparseable workspace definition, or an
    enumeration library throwing on a member `package.json` — rejects `discoverPacks` with the
    underlying error unwrapped, rather than being reported as an entry or a set-level problem
  status: accepted
  falsifiers:
    - a consumer needs the packs from the members that did enumerate more than it needs the failure, so a workspace with one broken `package.json` must still return a set
    - the library errors prove unstable enough across versions that consumers branch on their shape

- id: output-locations-are-computed-not-probed
  statement: |
    `outputDir` is reported whether or not it exists, and the kit never reads the output tree
  status: tolerated
  falsifiers:
    - a consumer has to stat every reported `outputDir` before using it, making the unprobed path useless

- id: the-problem-code-set-is-closed
  statement: |
    the `Problem` union is closed: every fault the kit reports carries one of the listed codes, and a
    new fault class means a new code in a new version rather than a free-form problem
  status: accepted
  falsifiers:
    - a fault arises that no listed code fits and that has to be reported before a release can add one
    - codes are added often enough that consumers' exhaustive switches break on ordinary upgrades

- id: invalid-entries-omit-only-manifest-derived-details
  statement: |
    on an invalid entry only `uuid`, `version`, and `manifest` may be absent; `kind`, `packageName`,
    `packageDir`, `sourceDir`, and `outputDir` are present on every entry
  status: accepted
  falsifiers:
    - a fault class arises that leaves a pack's kind or one of its locations unknown while still producing an entry

- id: the-completed-manifest-is-reported-as-a-plain-object
  statement: |
    `manifest` is the parsed and completed JSON reported as an untyped `object`, not a typed model of
    the manifest format
  status: rejected
  falsifiers:
    - every consumer hand-writes the same manifest types over the kit's `object`, so the types belong in the kit
    - a consumer mutates the reported object and corrupts a later reader, showing the untyped pass-through is too loose

- id: entry-version-is-the-completed-package-version
  statement: |
    an entry's `version` field carries the completed `header.version`, rather than a version of its
    own
  status: tolerated
  falsifiers:
    - a consumer needs the version the source manifest declared and can no longer reach it

- id: relative-paths-are-posix-with-the-root-as-a-dot
  statement: |
    reported paths are normalised POSIX relative paths with no `./` prefix and no trailing slash, and
    the root package's `packageDir` is the single dot `.`
  status: accepted
  falsifiers:
    - a consumer joining these paths on Windows is broken by the POSIX spelling
    - the `.` root spelling is found to concatenate or sort wrongly often enough in consumers to be a trap

- id: a-nameless-package-is-named-by-its-directory
  statement: |
    a package whose `package.json` declares no string `name` is reported under its directory's
    basename, and its packs are invalid with `package-name-missing`
  status: tolerated
  falsifiers:
    - a workspace whose root package legitimately declares no name, whose packs consumers must receive as valid
    - two nameless packages whose directory basenames collide, making the reported name ambiguous

- id: manifest-shape-faults-are-one-problem
  statement: |
    a manifest that parses as JSON but whose root, `header`, `modules`, or `dependencies` is not the
    container shape the format documents is the single `manifest-shape-invalid` problem naming the
    offending field, and the checks that read that part are skipped
  status: tolerated
  falsifiers:
    - a consumer has to branch on which part of the manifest was misshapen
    - a manifest the server loads happily is rejected by the shape check

- id: modules-uuid-and-version-are-unmodelled
  statement: |
    `ManifestModule` declares only `type`; a module's `uuid` and `version` reach the consumer
    through the index signature as `unknown`
  status: rejected

- id: field-type-faults-reuse-the-shape-code
  statement: |
    a source value whose type contradicts what `PackManifest` declares is reported as
    `manifest-shape-invalid`, the code a misshapen container raises, rather than as a new code
  status: tolerated
  falsifiers:
    - a consumer has to branch on whether a container or a scalar was misshapen, so the single code forces it to parse `field`
    - a form fault arises at a position the dotted `field` path cannot name

- id: a-form-fault-suppresses-the-checks-that-read-it
  statement: |
    a field whose form is faulted reports that fault alone: every check and completion reading that
    field is skipped, as with a misshapen container
  status: tolerated
  falsifiers:
    - a real manifest is found where the suppressed check named the fault a user had to see and the form fault did not
    - the suppression table grows past what a builder holds while implementing one check

- id: an-ambiguous-dependency-entry-is-a-problem
  statement: |
    a `dependencies` entry carrying both `uuid` and `module_name`, or neither, is
    `dependency-entry-malformed` rather than resolved by preferring one field
  status: tolerated
  falsifiers:
    - the format is found to give an entry carrying both a defined meaning
    - real manifests carry such entries often enough that consumers cannot use the kit until it picks a field

- id: an-unsatisfied-dependency-names-both-readings
  statement: |
    a `dependencies` entry whose `uuid` matches no pack and which carries no version is the single
    `dependency-unsatisfied` problem, whose message names both readings, rather than two codes a
    consumer picks between
  status: tolerated
  falsifiers:
    - a consumer has to branch on which of the two readings holds
    - evidence appears that lets the kit tell a wrong uuid from a versionless external dependency

- id: invalidity-propagates-to-a-fixpoint
  statement: |
    the set-wide pass repeats until no entry changes status, so `dependency-invalid` is transitive; a
    dependency cycle among otherwise sound packs stays valid
  status: tolerated
  falsifiers:
    - a transitively invalidated pack is usable in practice, so consumers ignore the propagated status
    - a cycle among packs is found that must be reported as a problem in its own right

- id: an-absent-script-location-is-null-not-a-missing-field
  statement: |
    `scriptOutput` is present on every entry and carries `null` where a pack has no script location,
    rather than being an optional field a resource pack's entry omits
  status: proposed
  falsifiers:
    - consumers routinely forget the null branch, so an optional field TypeScript forces them to narrow would catch more
    - a further location arises that a valid entry can genuinely lack, so absence needs a representation anyway
