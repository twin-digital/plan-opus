# Requirements scoped to the minecraft/dev-kit design. Every entry is DRAFTED for the owner to
# accept, amend, or reject — none has been ratified. The first three record decisions the owner
# stated directly on the shape walkthrough; the rest are outcomes distilled from it.
#
# rationale is omitted unless the statement's intent is genuinely non-obvious.
#
# Everything from "Manifest completion" down, and the retirement of
# r:kit-stops-at-a-validated-pack-set, is the owner's own, stated on review of the draft spec.

# Product and consumers

- id: kit-is-consumed-as-a-library
  statement: |
    the kit's product is a typed library: a consumer imports it and receives the pack set as data,
    not as text it must parse. A command-line interface over the same capabilities is intended and
    is not specified here.

- id: consumers-are-the-dev-server-and-ci
  statement: |
    the dev server and a continuous-integration check are both intended consumers. Validation
    therefore reports a structured result naming every problem it found, consumable without a
    human reading it.

# Scope and membership

- id: membership-from-source-manifest-presence
  statement: |
    a workspace package is a pack-bearing package when its source holds `behavior_pack/manifest.json`
    or `resource_pack/manifest.json`; presence of those source manifests is the whole membership
    test. Both kinds are discovered. No marker field, keyword, or central list is required, and
    adding, removing, or renaming a pack needs no edit anywhere but the package itself.

# What the kit reports

- id: packs-enumerable-without-a-build
  statement: |
    the kit reports every pack in a workspace — its owning package, its kind, its source location,
    and the identity its source manifest declares — from a clean checkout, with no build having run
    and no server running. What only a built pack settles, the version present in a server pool, is
    not claimed before a build.

- id: pack-identity-and-kind-declared-only-by-the-manifest
  statement: |
    a pack's identity, version, and kind come from its own `manifest.json`. Where a convention
    encodes kind — the `behavior_pack/` and `resource_pack/` directories membership is read from —
    the manifest stays authoritative and a disagreement between the two is a reported error, never
    a silent preference for one side.

- id: selection-filters-the-discovered-set
  statement: |
    which packs a consumer operates on is expressed as a filter over the discovered set, applied
    per invocation; narrowing a selection never changes what the workspace contains, and the kit's
    report of what exists is unaffected by it.

- id: unresolvable-packs-fail-loudly
  statement: |
    a pack the kit cannot resolve — a manifest that cannot be parsed, a missing or duplicated
    identity, a manifest dependency on another pack that the set does not satisfy, or no built
    output where the pack's output was expected — is reported as a named error identifying the
    package and the path examined, not omitted from a silently smaller result and not deferred to
    the server. A dependency naming a built-in scripting module is not a missing pack.

- id: kit-stops-at-a-validated-pack-set
  status: retired
  statement: |
    the kit's product is a validated, normalised pack set. It may invoke or configure a package's
    build, but it defines no build semantics, performs no deployment, and builds no release
    archive.

# Manifest completion

- id: kit-completes-partial-source-manifests
  statement: |
    a source `manifest.json` is partial by design: it carries no `header.name` and no
    `header.version`, and a `dependencies` entry on a pack in this workspace carries no version
    either — no `version` key, or an empty array. Absence is what marks a dependency in-workspace:
    its version is resolved from the pack it names and stamped into the entry on the way to build
    output, while an entry carrying an explicit version denotes a pack outside the workspace and
    passes through untouched. The injected `header.name` is the owning package's `package.json`
    `productName` when present, and otherwise the package name with its npm scope stripped —
    `@scope/mc-pack-1` becomes `mc-pack-1`. Completing all of this is the kit's job, not a
    consumer's or a package build's, and no absence it fills in is ever reported as a problem.
    Completion writes only into built output and never edits a source manifest, so source stays
    partial. The kit's product is therefore a validated, normalised pack set and, for each pack,
    its completed manifest; it still performs no deployment and builds no release archive.
  rationale: |
    Validation hinges on a manifest that is deliberately incomplete, so someone must populate it,
    and leaving that outside the kit would leak these rules into every consumer that wants a
    loadable pack. Absence is the resolution signal because a `workspace:*`-style placeholder token
    would be ill-typed against a field the format admits only as an array or a SemVer string.

    The injected name is not the scoped package name: `@` and `/` are undocumented in a field the
    game renders in its pack-selection UI, and no first-party pack uses them. Nor a dotted form,
    which is indistinguishable from an unresolved `pack.name` localization key, whose documented
    failure mode is rendering the raw string in that same UI.

# Workspace scope

- id: workspace-definitions-are-npm-and-pnpm
  statement: |
    the workspace definitions the kit enumerates packages from are npm's and pnpm's.

# Elevated from this design's decisions on owner review. Ids are carried over from the decision
# they replace, since the content is unchanged and only its authority moved.

- id: pack-set-is-a-flat-record-list
  statement: |
    the kit's product is one flat list of pack records, each carrying owning package, kind,
    identity, version, source directory, and expected output directory.

- id: packages-come-from-the-workspace-definition
  statement: |
    candidate packages are enumerated from the workspace's package-manager workspace definition,
    not from walking the directory tree.

- id: kind-derived-from-module-types
  statement: |
    a pack's kind is derived from the `type` values across its manifest's modules — `data` or
    `script` to behavior, `resources` to resource — and any other or mixed reading is a problem.
