# Product kind

- id: dev-kit-provides-a-library
  statement: |
    the kit provides a typed library: a consumer imports it and receives the pack set as data,
    not as text it must parse. 

- id: dev-kit-library-name
  statement: |
    the name of the npm package containing the dev-kit library is `@twin-digital/mc-dev-kit`

# Pack Discovery

- id: pack-discovery
  statement: |
    the kit provides a way to discover Minecraft behavior packs and resource packs in a workspace.
    Details for valid, discovered packs are returned as a flat list of pack records. A separate list
    is provided containing structured errors for packs that were discovered, but whose content was
    invalid. The error list is only included if it is not empty.
    
- id: packs-enumerable-without-a-build
  statement: |
    the kit must be able to discover workspace packs from a clean checkout, with no build having run 
    and no server running.

- id: membership-from-source-manifest-presence
  statement: |
    a workspace package is a pack-bearing package when its source holds `behavior_pack/manifest.json`
    or `resource_pack/manifest.json`; presence of those source manifests is the whole membership
    test. Both kinds are discovered. No marker field, keyword, or central list is required, and
    adding, removing, or renaming a pack needs no edit anywhere but the package itself. Note that 
    this makes it structurally impossible for a workspace package to hold more than one behavior pack
    or more than one resource pack. A package holding two packs of the same kind is out of scope.

- id: packages-come-from-the-workspace-definition
  statement: |
    candidate packages are enumerated from the workspace's package-manager workspace definition,
    not from walking the directory tree. Both `npm` and `pnpm` workspaces must be supported.

- id: do-not-reinvent-package-manager-features
  statement: |
    candidate packages are enumerated using functionality implemented directly by the package
    manager itself. This means the kit must use a package manager-provided library, or shell out to
    the package manager itself (rather than interpreting and re-implementing configuration, glob
    behavior, etc.) APIs that are not officially supported are tolerated provided they are published
    to the public package registry. Spec authors are expected to weigh advantages and disadvantages
    of the decision they make on how to implement workspace discovery.

# Pack Query

- id: pack-search
  statement: |
    the kit allows users to search for packs using the following criteria:

      - npm package name
      - pack name

    Search results are provided as an array of pack records. If no results are found, an empty
    array is returned.

# Pack Details

- id: pack-record-details
  statement: |
    for every pack discovered, the kit provides the following details:
    
      - its owning package
      - its kind (behavior pack or resource pack)
      - its source location
      - its build output location (even if that location is not present because the pack is unbuilt),
      - the full content of its manifest in object form (including content auto-populated as
        described by `r:kit-completes-partial-source-manifests`)
    
- id: pack-identity-and-kind-declared-only-by-the-manifest
  statement: |
    a pack's identity — its uuid, name, and version — comes from its own `manifest.json`. Its kind
    comes from the directory membership is read from, `behavior_pack/` or `resource_pack/`, and the
    manifest must corroborate it. A disagreement between the two is a reported error, never a silent
    preference for one side, so a pack carries one kind and no consumer reconciles two.

- id: built-output-defaults-to-dist
  statement: |
    a pack's built output is found at `dist/` within its package.

- id: built-output-mirrors-the-source-layout
  statement: |
    a package's output root always holds one kind-named subdirectory per pack — `behavior_pack`,
    `resource_pack` — mirroring the source layout. A single-pack package still nests.

- id: manifest-format-version-passes-through
  statement: |
    a source `manifest.json` is accepted whatever manifest format version it declares, and the
    completed manifest the kit reports stays in that version. The kit does not normalise between
    versions, and what completion writes matches the form the source already uses.

- id: kit-completes-partial-source-manifests
  statement: |
    a pack's source `manifest.json` is partial by design:
    
      - it MUST NOT have a `header.name` field, the kit MUST flag this as an error
      - it MUST NOT have a `header.version` field, the kit MUST flag this as an error
      - it MAY omit the version for workspace-local `dependencies` entries

    In both cases, a 'version' field is left unspecified either by omitting it, or supplying
    an empty array.

    Whenever this component provides manifest details for a pack, it populates missing fields
    as follows:

      - `header.name` is set to the owning package's `package.json` `productName` when present,
        and otherwise set to the package name with its npm scope strpped (`@scope/mc-pack-1` 
        becomes `mc-pack-1`)
      - `header.version` is set to the owning package's `package.json` version field, written in the
        form the source manifest's format version uses — the `[major, minor, revision]` array where
        the source carries arrays, the SemVer string where it carries strings. A version the source's
        form cannot express, such as a pre-release where that form is the array, is a problem
      - any dependency with a missing `version` is assumed to reference a pack within the same
        workspace. The `version` field of that package's package.json will be used as the dependency
        version, using the same parsing and error reporting rules described for `header.version`. If
        a dependency entry specifies a version, it is assumed to be an external dependency and is
        handled normally.

# Validation

- id: kind-derived-from-module-types
  statement: |
    a pack's manifest must carry a module corroborating the kind its directory declares — `data` or
    `script` for a behavior pack, `resources` for a resource pack — and must carry no module of the
    other kind. A manifest carrying no corroborating module, or carrying modules of both kinds, is a
    problem. Any further module type is ignored: the kit validates no enumeration of module types and
    treats an unrecognised one as neither corroborating nor a problem.
  rationale: |
    The set of module types is not knowable. Microsoft's manifest reference lists four, its Creator
    Tools validator lists six and says "include" rather than "are", and the reference's own
    behavior-pack example declares a seventh the other two omit. Corroboration therefore tests only
    the types that carry the kind: `resources`, and the `data` and `script` that both sit in a
    behavior pack. Everything else is either a companion module riding inside a pack, or a different
    artifact the fixed-path membership test never reaches.

- id: structured-validation
  statement: |
    Validation reports a structured result naming every problem it found, consumable without a
    human reading it.
    
- id: unresolvable-packs-fail-loudly
  statement: |
    a pack the kit cannot resolve — a manifest that cannot be parsed, a missing or duplicated
    identity, a manifest dependency on another pack that the set does not satisfy, invalid or
    missing manifest completion data — is reported as a named error identifying the package and 
    the path examined. A dependency naming a built-in scripting module is not a missing pack.
    Such invalid packs are never omitted silently: all discovered packs must be returned as fully
    resolved pack data, or as a structured error.

