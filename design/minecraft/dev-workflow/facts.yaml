- id: compose-watch-actions-and-versions
  claim: |
    Docker Compose's `develop.watch` offers the actions a live deploy needs, but the two most
    useful gate on recent Compose versions: `sync` copies changed files into the running
    container; `sync+exec` copies then runs a command inside the container (e.g. a reload) and
    needs Compose 2.32.0+; `restart` and `sync+restart` (copy then restart the container) need
    2.32.0 and 2.23.0 respectively. `develop` itself is 2.22.0+.
  backing: documented
  sources:
    - url: https://docs.docker.com/reference/compose-file/develop/
      where: opening note on the develop section
      quote: |
        Develop is an optional part of the Compose Specification. It is available with Docker
        Compose version 2.22.0 and later.
    - url: https://docs.docker.com/reference/compose-file/develop/
      where: watch — action — sync and sync+exec
      quote: |
        `sync`: Compose keeps the existing service container(s) running, but synchronizes source
        files with container content according to the `target` attribute.
        `sync+exec`: Compose synchronizes source files with container content according to the
        `target` attribute, and then executes a command inside the container. Available with
        Docker Compose version 2.32.0 and later.
    - url: https://docs.docker.com/reference/compose-file/develop/
      where: watch — action — restart and sync+restart
      quote: |
        `restart`: Compose restarts the service container. Available with Docker Compose version
        2.32.0 and later.
        `sync+restart`: Compose synchronizes source files with container content according to the
        `target` attribute, and then restarts the container. Available with Docker Compose version
        2.23.0 and later.

- id: compose-watch-path-constraints
  claim: |
    A `develop.watch` rule's `path` must name a directory that exists when the watcher starts.
    A glob path and a symlinked directory are both accepted at parse time but never sync and emit
    no error; a single-file path never fires. Compose therefore cannot discover packs on its own —
    each pack needs a literal directory rule enumerated ahead of time.
  backing: tested
  sources:
    - description: |
        Ran the three compose probes in
        design/minecraft/dev-workflow/artifacts/compose-watch-probes/ under Compose v5.2.0
        (see NOTES.md there for full commands and outputs). A directory path with sync+exec
        synced files and ran its exec ("Syncing service ... after 2 changes"); a glob path
        (./packs-real/*/dist) and a symlinked directory (./links) both produced no sync and no
        error, their targets never created; a single-file path (./gen.json) never fired across
        repeated edits.

- id: compose-cp-copies-without-bind-mounts
  claim: |
    `docker compose cp` transfers files between host and container over the Docker API, so it
    works against a remote daemon with no bind mount. This makes a direct push (cp the built
    pack into the container, then issue a reload) a viable deploy transport independent of
    `develop.watch`.
  backing: tested
  sources:
    - description: |
        In the prototype, built pack directories were copied into a running Bedrock container
        with `docker compose cp <dist>/. bedrock:<pool>/<pack>` against a daemon on another host
        (socket, no bind mount); the server subsequently reported the pack in its Pack Stack and
        `/reload` picked up script changes. Copy succeeded with no volume or mount configured.

- id: compose-env-file-not-loaded-from-cwd
  claim: |
    When compose is invoked with `-f <path>`, its default `.env` is resolved from the compose
    file's directory, not the current working directory. A repo-root `.env` is therefore ignored
    unless passed explicitly: `--project-directory .` loads it but also rebases relative
    `develop.watch` paths, while `--env-file .env` loads it without that side effect.
  backing: tested
  sources:
    - description: |
        Ran the probe in design/minecraft/dev-workflow/artifacts/env-file-resolution/ under
        Compose v5.2.0 (see NOTES.md). With a cwd `.env` setting MINECRAFT_SERVER_NAME and the
        compose file elsewhere, `compose config` showed the default value under `-f` alone,
        and the .env value under both `--project-directory .` and `--env-file .env`.

- id: bedrock-activation-list-read-only-at-world-load
  claim: |
    A behavior pack copied into a Bedrock server's `development_behavior_packs` pool is not
    applied until it is listed in the world's `world_behavior_packs.json`, and that list is read
    only when the world loads. Changing the activation list therefore requires a server restart to
    take effect; the list must be installed into the specific world directory
    (`/data/worlds/<level-name>`).
  backing: tested
  sources:
    - description: |
        In the prototype, packs synced into the pool but absent from the world list logged
        "Pack Stack - None" at load; after writing world_behavior_packs.json into the world
        directory and restarting the container, the same packs appeared as
        "Pack Stack - [00] <pack> ...". Editing the list without a restart had no effect in-game.

- id: bedrock-reload-updates-scripts-not-pool-or-manifest
  claim: |
    The in-game `/reload` command reloads script, function, and loot changes live, but does not
    pick up a newly added pack, a manifest change, a renamed pack folder, or new
    entity/item/block definitions — those require a server restart. This split is why a source
    edit can deploy in ~1s while identity or activation changes cost a restart.
  backing: tested
  sources:
    - description: |
        Observed across many prototype iterations: after `docker compose cp` of a rebuilt
        script bundle, `send-command reload` produced "Function and script files have been
        reloaded" and the new behavior was live within ~1s without disconnecting a connected
        client; whereas adding a pack or changing the activation list only took effect after a
        container restart. Consistent with the community-documented scope of /reload.

- id: bedrock-image-exposes-a-noninteractive-console-helper
  claim: |
    The Bedrock server image used by the prototype (itzg/minecraft-bedrock-server) ships a
    `send-command` helper that writes a command to the running server's console. It is driven
    non-interactively from `docker compose exec` — no attached TTY, no in-game client — and so
    works against a remote daemon, since exec travels over the Docker API like any other call.
  backing: tested
  sources:
    - description: |
        Observed in the same prototype run recorded by
        bedrock-reload-updates-scripts-not-pool-or-manifest and
        compose-cp-copies-without-bind-mounts, whose daemon ran on another host: `send-command
        reload`, executed inside the running container with no interactive session attached,
        produced "Function and script files have been reloaded" on the server console.

- id: bedrock-server-hosts-one-world
  claim: |
    A Bedrock dedicated server hosts a single active world per instance, selected by the
    `level-name` server property; running multiple worlds means running multiple server
    instances. The deploy target for activation is therefore one unambiguous world directory.
  backing: tested
  sources:
    - description: |
        The prototype's itzg/minecraft-bedrock-server container logged a single active world at
        boot — "[INFO] Level Name: dev" and "Opening level 'worlds/dev/db'" — and the world files
        (including world_behavior_packs.json) lived under /data/worlds/<level-name>. One instance
        served one world; no configuration produced two active worlds in one container.

- id: bedrock-activation-entry-is-header-uuid-and-version
  claim: |
    A world's activation list, `<world>/world_behavior_packs.json`, is a JSON array of entries
    with exactly two fields: `pack_id`, the uuid from the pack manifest's *header* — a module
    uuid does not work — and `version`, the header's three-number version array, which must
    match the pack in the pool. A wrong uuid or a mismatched version loads nothing and reports
    no error beyond "Pack Stack - None". The server does not create the file for a new world and
    does not rewrite one it is given.
  backing: tested
  sources:
    - description: |
        Ran design/minecraft/dev-workflow/artifacts/activation-list-probe/run.mjs against a
        remote daemon (DOCKER_HOST=ssh://…, no bind mount) under Compose v5.2.0; captured stdout
        is OUTPUT.txt there and the probe pack is pack/manifest.json. With the pack in the pool
        and no list, the world load logged "Pack Stack - None"; with
        [{"pack_id": "<header uuid>", "version": [1,0,0]}] it logged "Pack Stack - [00]
        activation probe pack (id: b1a7d0c2-3f4e-4a5b-8c9d-0e1f2a3b4c5d, version: 1.0.0) @
        development_behavior_packs/probe-pack"; substituting the data module's uuid, and then a
        version of [9,9,9], each returned "Pack Stack - None". A fresh world directory contained
        only db, level.dat, level.dat_old and levelname.txt, and the installed file read back
        byte-for-byte as written.

- id: monorepo-defines-a-pack-by-a-committed-manifest
  claim: |
    The monorepo already has a convention for what makes a package a Bedrock behavior pack: a
    committed `pack/manifest.json`. repo-kit's `bedrock-pack` feature fires on exactly that
    condition and then writes the rest of a pack's shape — the shared tsdown fragment, the
    `mc-pack-config` devDependency, the `release-assets` script — so those are derived from the
    manifest rather than independent evidence of a pack.
  backing: documented
  sources:
    - url: https://github.com/twin-digital/opus/blob/archive/minecraft-prototype/nodejs/minecraft/README.md
      where: closing paragraph of the overview
      quote: |
        A pack is any package with a committed `pack/manifest.json`; repo-kit's `bedrock-pack`
        feature wires up its build config and keeps the manifest identity in sync with
        `package.json`. Releases attach an installable `.mcpack` to the pack's GitHub release.
    - url: https://github.com/twin-digital/opus/blob/archive/minecraft-prototype/.repo-kit.yml
      where: features — the bedrock-pack feature's conditions
      quote: |
        - name: bedrock-pack
          # A Bedrock behavior pack (any package with a pack/manifest.json) keeps its
          # manifest identity in sync with package.json — the single source of truth.
          conditions:
            - exists: pack/manifest.json

- id: pack-detection-rules-scored-against-the-monorepo
  claim: |
    Scored against the monorepo's 41 workspace packages, a committed `pack/manifest.json`
    selects exactly the two behavior packs, as do the rules derived from it (the
    `mc-pack-config` devDependency, the repo-kit tsdown fragment, the `release-assets` script).
    Heuristics that are not derived from it are wrong: a dependency on `@minecraft/server` also
    selects the shared library, and the `nodejs/minecraft/*` directory also selects the library,
    the build config, and the harness. No package carries an explicit pack marker field or a
    pack keyword today, so both of those rules select nothing.
  backing: tested
  sources:
    - description: |
        Ran design/minecraft/dev-workflow/artifacts/pack-detection/detect-probe.mjs against
        twin-digital/opus at archive/minecraft-prototype (4e731f5b); captured stdout is
        OUTPUT.txt beside it and the scoring is summarised in ADDENDUM.md. Ground truth is the
        two packs the repo's README names. Exact matches: committed pack/manifest.json, the same
        plus header.uuid, the same plus a script-or-data module, any manifest.json in the
        package, the mc-pack-config devDependency, tsdown.config.d/bedrock-pack.ts, and the
        mcpack-assets release-assets script. False positives: @minecraft/server dependency
        (mc-scripting-core); nodejs/minecraft/* (dev-bedrock-server, mc-pack-config,
        mc-scripting-core); build+watch scripts (three bookify packages). Selecting nothing:
        marker field, pack keyword.

- id: pack-version-comes-from-the-built-manifest
  claim: |
    A pack's committed source manifest carries no `header.version` — the version is injected at
    build time from the package's `package.json` version, so only the built `dist/manifest.json`
    carries the version the activation list has to name. The built manifest is also the only
    manifest present when `dist/` is the deploy source, since `dist/` is gitignored.
  backing: tested
  sources:
    - description: |
        Observed by design/minecraft/dev-workflow/artifacts/pack-detection/detect-probe.mjs
        against twin-digital/opus at archive/minecraft-prototype (4e731f5b); see OUTPUT.txt
        beside it. Both packs' committed pack/manifest.json reported "header.version: null",
        while their built dist/manifest.json on disk reported header.version=[0,1,0], matching
        each package's package.json version of 0.1.0.
