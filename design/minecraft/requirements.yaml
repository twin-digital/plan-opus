# Requirements scoped to the minecraft area — those more than one design in the area depends on.
# Every entry is DRAFTED for the owner to accept, amend, or reject.
#
# These three were design-scoped to minecraft/dev-kit until minecraft/build-kit came to share them:
# build-kit produces the output layout, and dev-kit predicts it in every pack record's outputDir.
# Ids are unchanged by the move, so citations resolve as before.
#
# rationale is omitted unless the statement's intent is genuinely non-obvious.

- id: one-pack-of-each-kind-per-package
  statement: |
    a workspace package holds at most one behavior pack and at most one resource pack. A package
    holding two packs of the same kind is out of scope.

- id: built-output-defaults-to-dist
  statement: |
    a pack's built output is found at `dist/` within its package unless the package specifies an
    alternate location.

- id: built-output-mirrors-the-source-layout
  statement: |
    a package's output root always holds one kind-named subdirectory per pack — `behavior_pack`,
    `resource_pack` — mirroring the source layout, however many packs the package has; a
    single-pack package still nests. Packaging is a zip of that tree with no restructuring, so a
    one-pack product ships a one-pack `.mcaddon`.
