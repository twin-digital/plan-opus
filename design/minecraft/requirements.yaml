# Requirements at minecraft area scope. All retired: each bound only the pack set whose one
# member, village-guard, converted to products/village-guard, and the merged `minecraft-addon`
# preset carries their statements now.
#
# rationale is omitted unless the statement's intent is genuinely non-obvious.

- id: pack-uses-the-shared-build-tooling
  statement: |
    a pack's bundle is built by the workspace's shared pack-build toolchain: its build
    configuration merges the fragment that toolchain exports, and it implements no build logic of
    its own. Every route to a built pack — a build script, a watch rebuild, a
    continuous-integration run — goes through it.
  status: retired
  rationale: |
    A second path to a built pack is a path around manifest completion.

- id: a-pack-does-not-deliver-itself
  statement: |
    a pack implements no delivery of its own: whatever release or deploy hook the monorepo's
    conventions require of it delegates to shared tooling, and the pack itself publishes and deploys
    nothing.
  status: retired

- id: packs-unit-test-with-the-shared-test-lib
  statement: |
    a pack's unit tests stand up `@minecraft/server` with `@twin-digital/minecraft-test-lib`
    rather than a hand-rolled double or a module mock.
  status: retired
