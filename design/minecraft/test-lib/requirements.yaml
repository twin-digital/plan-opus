# Fidelity and behaviour

- id: modelled-behaviour-is-the-engines
  statement: |
    where the library models a behaviour, it models the engine's, quirks included, not a
    convenient approximation. Which behaviours are modelled is a scope decision the spec makes.

- id: engine-claims-are-sourced
  statement: |
    a behaviour the library presents as the engine's rests on a source: the pinned version's
    declarations and the official API reference, or a recorded observation where those are
    silent. A simplification is never presented as the engine's behaviour; the spec marks it as
    the library's own.
  rationale: |
    Requiring a recorded observation for every behaviour puts the library's cost under the
    engine's quirkiness rather than under what the library is for.

- id: synchronous-event-delivery
  statement: |
    the fake dispatches a behaving method's after-events synchronously, within the causing
    call, rather than same-tick-deferred as the engine does.
  rationale: |
    The engine defers within the same tick [[f:after-events-deferred]]
    [[f:after-event-deferral-subtick]]; a tickless fake has none to defer within. The cost is
    that code after the mutating call runs after the handlers, not before.

- id: before-events-can-cancel
  statement: |
    the fake dispatches before-events synchronously ahead of the action they gate, and an event
    a handler cancels does not take effect.

- id: scheduling-is-test-advanced
  statement: |
    the fake records `system` scheduling and runs a callback only when the test advances it; the
    library starts no timer and awaits nothing.
  rationale: |
    84% of surveyed public packs reach `system` [[f:public-packs-reach-past-the-v1-surface]] —
    more than reach items or blocks.

- id: fakes-behave-not-record
  statement: |
    the doubles hold real state and mutate it as their methods are called; a test asserts on
    the resulting state (an entity's current health, the effect it now carries) rather than on
    which methods were invoked with which arguments.

- id: fakes-never-fabricate
  statement: |
    a fake never fabricates: a read of a value the test did not supply and the engine could not
    lack fails loudly with a distinctive error, and an unimplemented member throws distinctly.
    Absence the engine can exhibit is not fabrication, and reads back as the engine reports it.

- id: invalidation-is-modeled
  statement: |
    a fake can be put into the unloaded/invalid state in which the real API leaves a stale
    reference — member access throws, per the engine's actual (non-uniform) behaviour — and
    the transition can happen mid-test on a reference a test already holds.
  rationale: |
    The hit that fires an event is routinely the hit that unloaded the entity, so the try/catch
    guarding every handler is untestable without this.

# Substitution, typing, and surface

- id: object-substitution-not-module-mocking
  statement: |
    the library substitutes fake objects passed into code under test; it does not replace or
    intercept the `@minecraft/server` module import. Code that can only reach the engine
    through a direct module import is outside its reach.
  rationale: |
    A later module-shim story would invalidate whole suites written against object
    substitution, so this is fiat, not open to reargument.

- id: fakes-are-structurally-assignable
  statement: |
    a fake is assignable where the real declared type is expected, and declares only the members
    it implements; each of those either behaves or throws, so an unfaked access never reads
    `undefined`.

- id: only-real-members-free-functions
  statement: |
    a fake exposes no member that duplicates or shadows a real one; everything the real API
    cannot express — constructing worlds and entities, invalidation, event emission, and any
    read the real surface has no member for — is an exported free function over the fakes, not
    a fake-only member.

- id: no-test-framework-dependency
  statement: |
    the library depends on no test framework at runtime; the fakes are plain objects a caller
    can wrap with their own spy library if they must, and they behave identically under any
    runner.

- id: target-server-version
  statement: |
    the library targets the stable `@minecraft/server` 2.x line, pinned at 2.8.0 and declared
    as the peer range a consumer must satisfy; every derivation, guard list, and behaviour
    reading is taken from the pinned version's declarations.

# Construction, ids, and the control plane

- id: instance-scoped-world
  statement: |
    all fake state belongs to a world instance a test creates; the library holds no
    module-level mutable state.

- id: no-implicit-defaults
  statement: |
    constructing a fake populates nothing the caller did not ask for: every collection starts
    empty and every value unset, whatever the engine would have populated there.
  rationale: |
    Keeping construction empty puts fidelity in presets, which can grow without reopening this rule.

- id: presets-are-opt-in
  statement: |
    a populated starting point ships as a named preset the caller invokes explicitly, never as
    constructor behaviour, and presets compose. A preset supplies only values a source pins; one
    needing per-type vanilla data belongs to a package built on this one.
  rationale: |
    The source-pinned bar is what stops a preset from reintroducing invented values by the back
    door: the three vanilla dimensions, their height ranges and localization keys are recorded
    facts; a sheep's 14 components are not.

- id: ids-auto-assigned-typeid-required
  statement: |
    spawnFake requires a typeId and assigns each entity a unique opaque id, which the caller may
    override at spawn — in the engine, too, the spawner never chooses the id.

- id: control-plane-component-mutation
  statement: |
    the control plane includes component add and remove over a live entity, since the real API
    reshapes an entity's components only through data-driven paths the fakes do not model.

- id: canonical-prefixed-storage
  statement: |
    an id-taking input accepts bare or prefixed ids wherever the engine accepts both, normalizes
    on entry, and stores and reports the canonical `minecraft:`-prefixed form.
  rationale: |
    The engine reports the prefixed form, so reads compare equal against the
    `@minecraft/vanilla-data` constants a test typically holds — but its tolerance of bare ids
    is surface-dependent, not universal (namespace-prefix-is-optional).

- id: persisted-state-is-modeled
  statement: |
    dynamic properties and scoreboard state are real state the fakes hold — readable and writable
    on the world and on entities — and a test reads back what the code under test wrote. Neither
    is a stub.
  rationale: |
    Measured, not assumed: dynamic properties are the largest single blocker across the three
    packs probed in artifacts/testability-probe, stopping 17 of 30 candidate test units, and all
    three keep their persisted state there. A string-keyed map needs no world geometry, no
    per-type vanilla data, and no class this package does not ship, so none of the reasons the
    other absences rest on apply to it.

- id: output-is-capturable
  statement: |
    what a fake would send to a player or to the world — messages, titles, action bars — is
    recorded and readable through the control plane rather than discarded.
  rationale: |
    A pack's output is what its tests assert on: SafeGuard alone has 145 sendMessage call sites
    and, for most of its decisions, no other observable result
    (artifacts/testability-probe/safeguard.md).
