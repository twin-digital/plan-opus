# Decisions proposed for the minecraft/test-lib design.
# Schema: id, statement, status (proposed|accepted|tolerated|rejected), falsifiers.
# status is required and always written. At least one falsifier per live decision.

- id: implements-enforces-the-declared-shape
  statement: |
    fake classes declare `implements` against the pinned declarations and a compile-only
    conformance suite holds them there; no source is generated from the `.d.ts`
  status: proposed
  falsifiers:
    - a class the library must fake carries a member a hand-written class cannot satisfy — an
      index signature, an overload set, or a non-public brand — so `implements` cannot be
      declared without a cast
    - a pinned-version bump churns enough stub members that hand-maintaining the shape costs
      more per release than a generator would

- id: fact-backed-surface-with-not-implemented-stubs
  statement: |
    a member behaves only where an active fact pins its behaviour or where the member is plain
    storage the test supplied; every other declared member is a stub that throws a
    not-implemented error naming it
  status: proposed
  falsifiers:
    - a consumer suite cannot be written without a member no fact pins, so the bar blocks the
      library's purpose more often than it catches a fabricated behaviour
    - the code under test catches broadly around a member the fake stubs, so the stub's throw
      is swallowed as an ordinary engine failure and the suite passes on a path the library
      never faked — the throw stops being the loud failure it was chosen to be

- id: id-unions-derived-from-declarations
  statement: |
    the library's accepted id types are derived from `@minecraft/server`'s own type map and
    enums rather than transcribed into a list the library maintains
  status: proposed
  falsifiers:
    - a derived union produces a compile error too opaque for a test author to act on, so a
      transcribed list with a readable name would serve better
    - a version bump changes the type map's shape and the conditional derivations stop
      compiling, making the derivation more brittle than a transcription

- id: engine-shaped-auto-ids
  statement: |
    an auto-assigned entity id is a sequential negative integer rendered as a string, never
    reissued for the life of the world instance that issued it
  status: proposed
  falsifiers:
    - the engine is observed to issue ids in another shape, so code that parses or pattern-matches
      an id passes against the fake and fails in production
    - a consumer needs ids stable across two independently constructed worlds and the
      per-world counter cannot give them

- id: vanilla-dimensions-on-every-world
  statement: |
    every fake world exposes the three vanilla dimensions and no others, with no opt-in
  status: proposed
  falsifiers:
    - a test needs a world carrying a custom or absent dimension to exercise its code
    - the engine is observed to resolve dimension ids the fixed trio does not carry — an
      alternate spelling, or a dimension another pack registered — so a three-entry table
      rejects ids the engine answers

- id: opt-in-presets-compose
  statement: |
    a reusable starting point ships as a named preset function applied at construction and
    composed in order, not as a constructor option object or a fake subclass
  status: proposed
  falsifiers:
    - two presets must write the same state and last-applied-wins confuses authors more than
      composition helps them
    - nearly every construction in a consumer suite needs the same preset, so the explicit call
      is noise rather than a choice

- id: reimplemented-engine-errors
  statement: |
    the library ships its own runtime error classes and message strings mirroring the observed
    engine throws, and throws a bare `Error` wherever the engine throws one
  status: proposed
  falsifiers:
    - a test asserts on error state the declarations do not expose, so a reimplementation cannot
      be made indistinguishable from the engine's
    - the real error classes become importable at runtime, so two same-named classes are worse
      than one shared import

- id: observed-guard-table-not-annotations
  statement: |
    the invalidation guard table is transcribed from the observed member enumeration, and any
    member outside that enumeration throws when its owner is invalid
  status: proposed
  falsifiers:
    - a member outside the enumeration is observed to stay readable on an invalid owner, so
      default-throw makes the fake stricter than the engine
    - the guard turns out to depend on how the reference went invalid — a removed entity and an
      unloaded one answering different members — so one transcribed table cannot represent both
      states

- id: invalidation-only-through-the-control-plane
  statement: |
    no fake operation invalidates a reference on its own — kill and remove leave it valid — and
    only the control plane's invalidation call makes the transition
  status: proposed
  falsifiers:
    - suites routinely invalidate immediately after removing an entity, so the explicit call is
      ceremony rather than a choice
    - the code under test is itself a teardown or cleanup helper whose contract is that a
      reference reads invalid after `remove()`; with removal leaving it valid the helper cannot
      be exercised at all

- id: synchronous-dispatch-in-subscription-order
  statement: |
    a behaving method delivers its after-events inline before it returns, each signal calling its
    subscribers once apiece in subscription order
  status: proposed
  falsifiers:
    - a later engine run shows dispatch is not once-apiece in subscription order — a closure
      subscribed twice receiving two deliveries, or subscribers called in another order — so the
      single-run reading the fake transcribes is wrong
    - a cascade's own handler mutates the same entity and inline delivery re-enters the mutation
      in a way the engine's deferral cannot produce

- id: handler-exceptions-propagate
  statement: |
    an exception thrown by a subscribed handler propagates out of the call that dispatched the
    event; the fake neither swallows it nor isolates the remaining subscribers
  status: proposed
  falsifiers:
    - the engine is observed to isolate a throwing handler, so a suite green against the fake
      breaks in production
    - a test cannot exercise a cascade's later events at all once an earlier handler throws, and
      that combination is the normal case rather than the exception

- id: applydamage-mirrors-observed-cascade
  statement: |
    applyDamage fires the observed hurt, health-changed, and death sequence carrying the
    requested damage amount and the observed default cause, and never clamps at the minimum
  status: proposed
  falsifiers:
    - a later engine run shows the sequence or the payload differs by damage cause or by entity
      type, so one transcribed cascade cannot cover them

- id: peer-range-admits-2x-minors
  statement: |
    the package declares `@minecraft/server` as a peer of `^2.8.0` and develops against exactly
    2.8.0
  status: proposed
  falsifiers:
    - a 2.x minor changes a behaviour the fakes reproduce, so the range admits a version the
      library is wrong for
    - a 2.x minor changes a declaration such that the fake classes no longer compile against it
