    `InvalidEntityError` — but not uniformly. `id`, `typeId`, `isValid`, and `nameTag` stay
    readable; `isValid` never throws, as it is the safe validity probe. A component follows its
    owner: `Component.isValid` and `typeId` stay readable while `EntityComponent.entity` throws.
  backing: documented
  sources:
    - description: |
        @minecraft/server 2.8.0 index.d.ts: nearly every Entity member carries an
        `@throws … InvalidEntityError` TSDoc annotation, while id, typeId, isValid, and nameTag
        carry none. The Component / EntityComponent declarations show the same split — isValid
        and typeId unannotated, entity annotated `@throws InvalidEntityError`.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
      where: Properties — id, typeId, isValid
      quote: |
        This property is accessible even if @minecraft/server.Entity.isValid is false.

- id: invalidation-throws-are-mechanically-derivable
  status: retired
  reason: superseded
  superseded_by: invalidation-guard-list-complete
  caveat: |
    The derivation claim is disproven by the engine run: `nameTag` and `isSneaking` throw
    despite carrying no `@throws`, so the annotations under-report the guard list.
  claim: |
    In `@minecraft/server` 2.8.0 the invalidation guard list is mechanically derivable from
    the declarations: every Entity member carrying `@throws` names InvalidEntityError in its
    TSDoc (56 members), and the six without — `id`, `isSneaking`, `isValid`, `nameTag`,
    `scoreboardIdentity`, `typeId` — carry no `@throws` at all, so no Entity member is
    ambiguous. The attribute component classes are coarser: `setCurrentValue` names
    InvalidEntityError while the value getters and reset methods carry only a generic
    `@throws` naming no error.
  backing: tested
  sources:
    - description: |
        design/minecraft/test-lib/artifacts/type-probes/throws-annotation-probe.mjs pairs each declared
        member of Entity, Component, EntityComponent, EntityAttributeComponent, and
        EntityHealthComponent with its TSDoc block and splits members by whether the block
        names InvalidEntityError; committed output in
        design/minecraft/test-lib/artifacts/type-probes/throws-annotation-probe.out.txt.

- id: public-packs-reach-past-entities-and-events
  claim: |
    Across 103 public GitHub behavior-pack repositories (368,385 non-blank source lines,
    classified against the `@minecraft/server` 2.8.0 declarations), every part of the API outside
    entity state, effects and after-event subscriptions is reached by a large share of packs.
    `system` scheduling is reached by 84%,
    `beforeEvents` subscriptions by 76%, items and containers by 62%, blocks by 55%, the player
    client surface by 44%, the static type registries by 41%, and the startup and custom-command
    registries by 40%. Exactly one repository of the 103 reaches for none of them.

    On items and blocks specifically, 69% of repositories reference `ItemStack`, `Block`,
    `Container`, or an item or block component id unambiguously, and 88% either do so or
    subscribe to an event whose payload exposes one of those classes. The two halves are demanded
    almost equally — items 79%, blocks 78% — and 68% reference both, so a surface covering only
    one of the two leaves at most 22% of repositories referencing nothing beyond it. The 12
    repositories that reference none are
    small utility packs: median 394 source lines and largest 1,563, against a median of 1,466 for
    the rest.

    By contrast, entity components are referenced by 73% of repositories and effects by 13%.
  backing: tested
  caveat: |
    Presence is not weight: one `itemStack.typeId` read counts the same as an inventory system,
    so these shares rank what packs touch and do not establish how much of a pack could still be
    usefully tested against a fake lacking it. "Fully covered" is a claim about references, not
    about testability. The sample is what GitHub repository search returns for one fixed query
    list — packs shipped as `.mcaddon`, on marketplaces, or in private repositories are absent,
    and the unit is a repository rather than a shipped pack. Helper modules that manipulate API
    objects without naming `@minecraft/server` are not analysed at all, which undercounts.
  sources:
    - description: |
        design/minecraft/test-lib/artifacts/pack-api-survey, five Node scripts run in order with
        output captured in 1-discover.out.txt, 2-api-index.out.txt, 3-fetch.out.txt,
        4-analyze.out.txt and 5-report.out.txt. 3-fetch.mjs cloned 850 candidate repositories and
        accepted 103 on their contents, pinning each commit SHA in packs.json; 4-analyze.mjs
        classified every import, component id, event subscription and single-area method call
        against the 2.8.0 declarations parsed by 2-api-index.mjs. The shares above are the
        "Surface absent from v1" table (System scheduling 87/103, beforeEvents 78, items 64,
        blocks 57, player client 45, registries 42, startup 41; one repository touching none),
        the "Headline" table (71 unambiguous, 91 including event payloads, 12 untouched; median
        394 vs 1466 source lines), the "Which half of the gap" table (items 81, blocks 80, both
        70, neither 12) and the "API area" table (entity components 75, effects 13).

- id: engine-surface-outside-instances
  claim: |
    `@minecraft/server` 2.8.0 exposes a surface that is not reached through any instance, in two
    kinds.

    **Module-level exported constants: 7.** Two are singleton instances — `system: System` and
    `world: World` — and five are numeric literals: `HudElementsCount` 13, `HudVisibilityCount` 2,
    `MoonPhaseCount` 8, `TicksPerDay` 24000, `TicksPerSecond` 20.

    **Static members on exported classes: 112**, across 439 exported classes. They divide as:

    - 86 are `static readonly componentId`, one on each component class, carrying that
      component's id string.
    - 16 are `get`/`getAll` lookup pairs on 8 registry classes: `BiomeTypes`, `BlockStates`,
      `BlockTypes`, `DimensionTypes`, `EffectTypes`, `EnchantmentTypes`, `EntityTypes`,
      `ItemTypes`.
    - 5 are on `Potions`: `resolve`, `getDeliveryType`, `getEffectType`, `getAllDeliveryTypes`,
      `getAllEffectTypes`.
    - 1 is `BlockPermutation.resolve`, the only way to obtain a `BlockPermutation`, whose
      constructor is private.
    - 4 are constant values: `AimAssistRegistry.DefaultCategoryId` and `.DefaultPresetId`,
      `FluidContainer.maxFillLevel` 6 and `.minFillLevel` 0.
  backing: tested
  sources:
    - description: |
        design/minecraft/test-lib/artifacts/type-probes/module-surface-probe.mjs, output in
        module-surface-probe.out.txt, parsing @minecraft/server 2.8.0's index.d.ts: it collects
        every `export const` with its declared type, and every 4-space-indented `static` member
        with the `export class` it falls under. Output records total=7 module constants with
        singleton-instances=2 and numeric-constants=5, and total=112 statics split
        componentId=86 and everything-else=26, with the 26 listed per class and the 8 registry
        classes named.
