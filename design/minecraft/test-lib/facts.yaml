        `kill-no-health-invalidation-timing` lines: before-kill isValid=true
        healthComponent=undefined; kill ok true with synchronous-isValid=false on the same
        line; isValid read false again at tick+1 through tick+5.

- id: after-event-deferral-subtick
  claim: |
    An after-event is deferred past the mutating call's return but delivered within the same
    game tick: applyDamage was called, returned, and its entityHurt handler ran all at
    `system.currentTick` 72309 (delay 0 ticks), while no event had been delivered before
    applyDamage returned. Delivery is same-tick-deferred, neither synchronous within the call
    nor postponed to a later tick.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, Deep run, `after-event-tick-delay` line
        (called-at=72309 returned-at=72309 delivered-at=72309 delay-ticks=0), read with the
        first run's after-events-deferred (events-delivered-before-applyDamage-returned=0).

# Facts from the resting-state run (Bedrock 1.26.31.1, @minecraft/server 2.8.0, single run of
# artifacts/resting-state-probe-pack), raw log and provenance in
# artifacts/mctest-resting-state-probe-results.md. These record what a freshly created engine
# object already holds before any test writes to it.

- id: fresh-entity-is-never-component-empty
  claim: |
    A freshly spawned entity always arrives carrying components — every type tried reported
    `zeroComponents=false`, with a floor of one: sheep 14, armor_stand 5, arrow 1
    (`minecraft:projectile`), xp_orb 1 (`minecraft:type_family`). The set is type-dependent
    rather than a shared baseline plus extras: a connected player carries 16 components, seven
    of which no sheep has, while the sheep carries five the player lacks. There is no empty or
    common starting set an engine entity rests at.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `resting-entity-fields`
        (componentCount=14 for minecraft:sheep) and `component-poor-entities` lines
        (minecraft:arrow count=1 components=[minecraft:projectile]; minecraft:armor_stand
        count=5; minecraft:xp_orb count=1 components=[minecraft:type_family]; all
        zeroComponents=false), with `resting-player-fields` rerun as a player
        (componentCount=16, player-only=[equippable, ender_inventory, cursor_inventory,
        inventory, player.exhaustion, player.hunger, player.saturation],
        sheep-only=[movement.basic, navigation.walk, leashable, color, is_dyeable]).
        `minecraft:item` is not spawnable via spawnEntity (threw InvalidArgumentError), so its
        component count is unanswered.

- id: fresh-entity-spawn-frame-field-values
  claim: |
    A freshly spawned entity's own fields are populated before any test writes to it, and the
    values are not all empty: on a never-written sheep `nameTag` is the empty string (length 0),
    `localizationKey` is populated (`entity.sheep.name`), `location` and `dimension.id` are
    real, `getTags()` is empty, `isValid` is true, and `getRotation()` and `getVelocity()` read
    all-zero vectors. The zeroed rotation and velocity are a spawn-frame reading and hold for
    most but not all entity types — `minecraft:xp_orb` spawns with neither
    [[f:spawn-frame-kinematics-zero-except-xp-orb]] — and they are not a resting value either,
    since an AI-driven mob may be moving a few ticks later
    [[f:post-spawn-mob-motion-is-per-run-not-per-type]].
  backing: tested
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `resting-entity-fields` lines on a
        never-written minecraft:sheep: nameTag string length=0; localizationKey
        "entity.sheep.name"; location {x:38.17…, y:62.67…, z:22.78…}; dimension.id
        "minecraft:overworld"; getRotation() {x:0,y:0}; getVelocity() {x:0,y:0,z:0};
        getTags() []; isValid true; typeId "minecraft:sheep".
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `resting-kinematics-isolated`
        spawn-frame lines, four runs: minecraft:sheep reads getRotation() {x:0,y:0} and
        getVelocity() {x:0,y:0,z:0} in 4/4, so the sheep reading above reproduces; the same
        section's minecraft:xp_orb lines are what bound its generality.

# Facts from the `resting-kinematics-isolated` runs (pack 0.3.0, Bedrock 1.26.31.1,
# @minecraft/server 2.8.0), each type spawned alone 4 blocks clear of the source and disposed
# before the next, sampled on the spawn frame and again at 2 and 22 ticks; four consecutive runs
# from a fixed source at (38.5, 81, 22.5). Raw logs and per-run tables in
# artifacts/mctest-resting-state-probe-results.md. The contended `resting-kinematics` runs that
# preceded them spawned all eight types at one point; that file retracts two of their readings
# (an arrow that self-invalidated and a +0.455 upward velocity on sheep and cow), both artifacts
# of overlap resolution, and neither is recorded here.

- id: spawn-frame-kinematics-zero-except-xp-orb
  claim: |
    On its own spawn frame an entity reads `getRotation() = {x:0, y:0}` and
    `getVelocity() = {x:0, y:0, z:0}` for seven of the eight types sampled — `sheep`, `cow`,
    `chicken`, `zombie`, `armor_stand`, `arrow`, `boat` — bit-identical in 4/4 runs.
    `minecraft:xp_orb` is the exception: it spawns with a randomized y-rotation and a nonzero
    randomized velocity, drawn afresh per spawn (four runs, four distinct values, no repeats),
    then decays to near-rest by 22 ticks. Zero rotation and velocity at spawn are therefore an
    engine constant a fake may assume for most types, but not a universal one.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `resting-kinematics-isolated`
        [spawn-frame] lines across runs 1–4 (n=4): every one of sheep, cow, chicken, zombie,
        armor_stand, arrow and boat reads getRotation() {"y":0,"x":0} and getVelocity()
        {"z":0,"y":0,"x":0} in all four runs, as the file's "Deterministic — bit-identical in
        4/4 runs" section records. minecraft:xp_orb reads rotation.y 325.0025939941406 /
        37.7103385925293 / 191.06085205078125 / 61.451141357421875 in runs 1–4 with velocities
        {x:0.0673, y:0.0970, z:-0.1841} / {x:-0.1899, y:0.1864, z:0.0300} /
        {x:-0.0842, y:0.2846, z:-0.1761} / {x:-0.1481, y:0.0508, z:0.0354}; its y-rotation
        spans the circle; x and z each take both signs, while y is positive in all four draws
        (and in the two contended runs below, 0.2263 and 0.1287), so an upward component is
        the one part of the draw not observed to vary in sign. Its 22-tick velocity
        falls to ~7e-6 (run 1) and ~5e-7 (run 4) after travelling ~0.5–2.4 blocks.
    - description: |
        artifacts/mctest-resting-state-probe-results.md, the two earlier contended
        `resting-kinematics` runs, whose spawn-frame half is unaffected by the contention
        (each entity is read before the next exists): the same seven types read zero rotation
        and zero velocity, and xp_orb read rotation.y 69.07179260253906 and
        288.386962890625 with nonzero velocities — two further distinct draws.

- id: fresh-entity-nametag-is-empty-string
  claim: |
    `nameTag` on a freshly spawned entity is the empty string, not `undefined` and not a
    type-derived name: it read `""` (`length=0`) for all eight types sampled — `sheep`, `cow`,
    `chicken`, `zombie`, `armor_stand`, `xp_orb`, `arrow`, `boat` — in every run. The empty
    string is the engine's representation of an unnamed entity, so a fake may treat it as a
    universal starting value rather than a per-type one.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `resting-kinematics-isolated` nameTag
        lines, one per type per run across runs 1–4 (n=4): every one reads
        `nameTag ok value=string: length=0`. The earlier contended `resting-kinematics` runs
        report the same as a summary line, `nameTag uniform=true distinctValues=1 values=[""]`,
        in both runs, and `resting-entity-fields` reads `nameTag ok value=string: (empty-string
        check: length=0)` on a sheep.

- id: post-spawn-mob-motion-is-per-run-not-per-type
  claim: |
    Whether an AI-driven mob has begun moving by 22 ticks after spawn is drawn per run, not
    fixed per type. Across four runs of the same probe: `zombie` moved in 2/4, `sheep` in 1/4,
    `cow` in 1/4, `chicken` in 0/4, and run 3 inverted run 1 (sheep moved while cow and zombie
    stayed put). No AI-driven type is reliably still at 22 ticks and none reliably moves, so a
    single run cannot tell the two apart and a fake cannot hardcode either. The non-AI types
    are the contrast: `armor_stand`, `boat` and `arrow` read zero velocity and zero positional
    delta at both the 2- and 22-tick samples in 4/4.
  backing: tested
  caveat: |
    `chicken` at 0/4 is consistent with the same mechanism firing at a lower rate, not with a
    stationary type; four runs cannot distinguish those. Only the presence of drift by 22 ticks
    is reproducible — its direction, magnitude and timing are not.
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `resting-kinematics-isolated`
        [after-22-ticks] lines across runs 1–4 (n=4), tabulated in the file's "Whether a mob has
        started moving by 22 ticks is per-run, not per-type" section: zombie moved in runs 1 and
        2 (rotation.y -45.01167297363281 / -90.01869201660156), cow in run 1
        (rotation.y -135.13467407226562, velocity ~0.060, delta ~0.41 on x and z), sheep in
        run 3 (rotation.y 45.00886535644531, velocity ~0.0298, delta ~0.089), chicken in none;
        in run 3 both cow and zombie read rotation {y:0,x:0}, velocity {0,0,0} and delta
        {0,0,0}. armor_stand, boat and arrow read zero velocity and zero delta at both samples
        in all four runs. The file states the first sentence of the caveat above in nearly the
        same words ("the same mechanism at a lower rate"); the caveat's second sentence, on
        what about the drift is reproducible, is this entry's reading rather than the file's.

- id: resting-arrow-turns-once-and-stays-valid
  claim: |
    A spawned `minecraft:arrow` left alone reads `getRotation() = {x:0, y:0}` on its spawn frame
    and `{x:-72, y:0}` two ticks later, holding that value at 22 ticks — deterministic in 4/4
    runs — while its velocity never leaves zero and it never moves from the spawn point. It also
    stays valid: `isValid=true` at 2 and 22 ticks in 4/4. It is the one type sampled whose
    rotation is not stable across the spawn frame, so a fake reading rotation back must decide
    whether to model the settle.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `resting-kinematics-isolated`
        minecraft:arrow lines across runs 1–4 (n=4): [spawn-frame] getRotation()
        {"y":0,"x":0}; [after-2-ticks] and [after-22-ticks] getRotation() {"y":0,"x":-72}, both
        with getVelocity() {"z":0,"y":0,"x":0}, location unchanged at
        {x:38.5, y:81, z:26.5} and delta {"x":0,"y":0,"z":0}, isValid=true throughout. The
        file's "Deterministic — bit-identical in 4/4 runs" section records both the rotation and
