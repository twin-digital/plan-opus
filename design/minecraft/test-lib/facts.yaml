- id: server-package-ships-types-only
  claim: |
    `@minecraft/server` ships type declarations with no runtime JavaScript — its published
    package is `index.d.ts`, `package.json`, and a README. The engine supplies the
    implementation at runtime, so in a test process there is nothing importable to construct or
    module-mock, and enum members such as `EntityComponentTypes.Health` have a type but no
    usable value.
  backing: tested
  sources:
    - description: |
        design/minecraft/test-lib/artifacts/type-probes/package-contents-probe.mjs, output in
        package-contents-probe.out.txt: the installed 2.8.0 package ships exactly three files —
        index.d.ts (751641 bytes), package.json (384 bytes), README.md (278 bytes) — and zero
        .js/.cjs/.mjs files. Its package.json declares no `main`, `module`, `types`, `typings`,
        `exports`, or `files`; the only fields of interest are peerDependencies on
        @minecraft/common and @minecraft/vanilla-data. `await import('@minecraft/server')` from a
        plain node process threw Error code=ERR_MODULE_NOT_FOUND, resolving to a nonexistent
        index.js.

- id: invalid-entity-error-shape
  claim: |
    `@minecraft/server` 2.8.0 declares `InvalidEntityError` as an exported class extending
    Error, carrying `readonly id: string` and `readonly type: string` — the id and type of the
    entity that became invalid. Like every class in the package the declaration is types-only,
    so a test process cannot import the real class; only its declared shape is available.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/invalidentityerror
      where: Extends, and Properties — id and type
      quote: |
        ## Extends

        - *Error*

        The error called when an entity is invalid. This can occur when accessing components on
        a removed entity.

        ### **id**

        `read-only id: string;`

        The id of the entity that is now invalid.

        ### **type**

        `read-only type: string;`

        The type of the entity that is now invalid.
    - description: |
        Runtime absence follows from [[f:server-package-ships-types-only]]: the class is declared
        in @minecraft/server 2.8.0's index.d.ts, which the package ships with no importable
        runtime, so a test process has the declared shape and not the class.

- id: namespace-prefix-is-optional
  claim: |
    Whether the `minecraft:` prefix may be omitted is per-surface, not a uniform rule. Bare and
    prefixed ids are both accepted by `addEffect`, `getEffect`, `spawnEntity`, and
    `getComponent`; `Entity.triggerEvent` rejects the bare form and requires the prefix. The
    canonical (engine-reported) form is the prefixed one on every surface that reports one —
    `triggerEvent` returns `undefined` and reports no id at all.

    The API reference states the opposite for `triggerEvent` — "If a namespace is not specified,
    minecraft: is assumed" — and the observation overrides it. The probe ran matched pairs on one
    sheep: the bare id threw while its `minecraft:`-prefixed twin fired the same event
    successfully, and the error echoed the bare string back rather than a prefixed one, so the
    engine looked up the literal argument without assuming a namespace. The reference carries
    that sentence for `getComponent` as well, where it does hold.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `namespace-prefix-other-surfaces`
        lines: addEffect("speed"/"minecraft:speed"), getEffect("speed"/"minecraft:speed"),
        spawnEntity("sheep"/"minecraft:sheep"), and getComponent("health"/"minecraft:health")
        all ok, each reporting the prefixed typeId; triggerEvent("entity_born") and
        triggerEvent("ageable_grow_up") threw name=InvalidArgumentError ("The event
        <name> does not exist on minecraft:sheep") while the `minecraft:`-prefixed forms of
        both returned ok.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
      where: Methods — getComponent, componentId parameter
      quote: |
        If no namespace prefix is specified, 'minecraft:' is assumed.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
      where: Methods — triggerEvent, eventName parameter — contradicted by the observation above
      quote: |
        Name of the entity type event to trigger. If a namespace is not specified, minecraft: is assumed.
    - description: |
        EntityComponentTypeMap in index.d.ts 2.8.0 carries every component id in both bare and
        prefixed form (136 keys = 68 components x 2). Prefixed is canonical: the
        @minecraft/vanilla-data constants report the prefixed form — see
        [[f:vanilla-data-provides-prefixed-id-constants]].

- id: component-ids-are-derivable-from-types
  claim: |
    The finite id sets are computable from `@minecraft/server`'s own types rather than
    transcribed: `keyof EntityComponentTypeMap` yields every component id, `` `${EntityComponentTypes}` ``
    the canonical prefixed ids, and a conditional mapping over the type map the attribute-shaped
    subset. On 2.8.0 that is 68 component classes, each id in a bare and a prefixed form, of
    which 7 are attribute-shaped. The derivation tracks version bumps for free.
  backing: tested
  sources:
    - description: |
        design/minecraft/test-lib/artifacts/type-probes/component-ids-probe.ts compiles clean
        (tsc --noEmit, strict; `npm run check` in that folder) against @minecraft/server 2.8.0,
        deriving ComponentId, CanonicalComponentId, and AttributeComponentId from
        EntityComponentTypeMap and EntityComponentTypes, with three `@ts-expect-error` negative
        probes — a non-attribute id and a typo rejected by the derived unions, and a bare id
        rejected in canonical position. An unused expect-error directive fails the build, so all
        three probes genuinely error. Output in component-ids-probe.tsc.out.txt: exit 0 with no
        diagnostics, both for the file alone and for the whole-project run.
    - description: |
        design/minecraft/test-lib/artifacts/type-probes/component-ids-probe.mjs, output in
        component-ids-probe.out.txt, prints the same sets from the declarations: 136
        EntityComponentTypeMap keys (68 bare, 68 `minecraft:`-prefixed, every bare key having a
        prefixed twin), 68 EntityComponentTypes enum values, all prefixed and all of them type-map
        keys, and 14 attribute-shaped ids (7 components x 2 forms) whose classes extend
        EntityAttributeComponent.

- id: server-classes-are-structurally-assignable
  claim: |
    The classes `@minecraft/server` 2.8.0 declares carry no private instance members and no brand
    fields: a value exposing only a class's public shape is assignable to the class type. Nearly
    every class declares a `private constructor()`, which blocks construction and subclassing but
    adds no instance member, so it does not brand the instance type. A library class can therefore
    satisfy Entity, Player, EntityComponent, EntityHealthComponent, World, Dimension, Effect,
    EffectType, and the event signal classes structurally, and its instances pass where the real
    type is expected without casts.
  backing: tested
  sources:
    - description: |
        design/minecraft/test-lib/artifacts/type-probes/assignability-probe.mjs, output in
        assignability-probe.out.txt: index.d.ts declares 439 exported classes and 425 `private`
        declarations, all 425 of them `private constructor()` — zero private declarations that are
        not constructors.
    - description: |
        design/minecraft/test-lib/artifacts/type-probes/assignability-probe.ts compiles clean (tsc
        --noEmit, strict; `npm run check` in that folder, and re-run by assignability-probe.mjs
        which reports exit 0 with no diagnostics) against @minecraft/server 2.8.0: a mapped
        public-shape value is accepted for all nine classes, and a hand-written class with no
        `extends` — never reaching the private constructor — is accepted as an EntityComponent.
        Two @ts-expect-error negative controls, one mapped shape and one hand-written class each
        missing a member, genuinely error, so a clean compile is a real positive.

- id: vanilla-data-provides-prefixed-id-constants
  claim: |
    `@minecraft/vanilla-data`, unlike `@minecraft/server`, ships runtime JavaScript: named
    constants whose values are the canonical prefixed id strings. Every id namespace it exports
    is fully prefixed — the one exception is `MinecraftPotionDeliveryTypes`, whose values are
    unprefixed PascalCase names rather than ids. Code or tests referencing the id constants deal
    in prefixed ids.
  backing: tested
  sources:
    - description: |
        design/minecraft/test-lib/artifacts/type-probes/vanilla-data-probe.mjs, output in
        vanilla-data-probe.out.txt, against @minecraft/vanilla-data 1.26.33 installed as a
        devDependency of that probe project: the package ships lib/index.js (217395 bytes) plus
        .d.ts files, and its package.json `exports` is "./lib/index.js", so `await
        import('@minecraft/vanilla-data')` resolves at runtime and yields 12 exported objects.
        Eleven are entirely `minecraft:`-prefixed string constants — MinecraftBlockTypes 1342/1342,
        MinecraftItemTypes 1518/1518, MinecraftEntityTypes 128/128, MinecraftEffectTypes 37/37,
        MinecraftPotionEffectTypes 47/47, MinecraftEnchantmentTypes 42/42, MinecraftBiomeTypes
        88/88, MinecraftFeatureTypes 17/17, MinecraftCameraPresetsTypes 7/7,
        MinecraftCooldownCategoryTypes 6/6, MinecraftDimensionTypes 3/3. MinecraftPotionDeliveryTypes
        is 0/3 prefixed (Consume, ThrownLingering, ThrownSplash). Spot checks:
        MinecraftEffectTypes.Resistance === 'minecraft:resistance', MinecraftEntityTypes.Villager
        === 'minecraft:villager', MinecraftEntityTypes.Sheep === 'minecraft:sheep',
        MinecraftBlockTypes.Stone === 'minecraft:stone', MinecraftItemTypes.Apple ===
        'minecraft:apple'.

# Facts transcribed from the committed engine-probe run: Bedrock dedicated 1.26.31.1,
# @minecraft/server 2.8.0, single run (n=1) of artifacts/engine-probe-pack, raw log and run
# provenance in artifacts/mctest-engine-probe-results.md. Each source names the [mctest]
# lines it rests on.

- id: addeffect-returns-the-effect
  claim: |
    `Entity.addEffect` returns the `Effect` object on success — both when adding a new effect
    and when updating one already present — resolving the pinned TSDoc's self-contradiction
    ("Returns nothing if the effect was added or updated successfully" vs the declared
    `Effect | undefined`) in favour of the signature.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `addeffect-success-return` lines: add and
        update both report `ok value=object(Effect)`; the returned object reads
        typeId=minecraft:speed duration=200 amplifier=1.
    - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
      where: Methods — addEffect, signature and Returns
      quote: |
        `addEffect(effectType: EffectType | string, duration: number, options?: EntityEffectOptions): Effect | undefined`

        **Returns**[*Effect*](effect) | *undefined* - Returns nothing if the effect was added or updated successfully. This can throw an error if the duration or amplifier are outside of the valid ranges, or if the effect does not exist.

- id: effect-members-throw-plain-error
  claim: |
    On a removed effect, and equally on an effect whose owner entity has been removed, the
    `Effect` value members `amplifier`, `duration`, `typeId`, and `displayName` throw a plain
    `Error` (name and constructor `Error`, message `Failed to get property '<member>'.`) — not
    `InvalidEntityError` — while `isValid` stays readable and answers false. Only `remove()`
    invalidation was exercised; chunk unloading is untested.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `effect-member-guard-derivation` lines:
        all four members threw name=Error ctor=Error instanceofInvalidEntityError=false in
        both the removed-effect and invalid-owner variants; isValid read `false` in both. The
        probe produced the invalid owner by calling `orphan.remove()`
        (artifacts/engine-probe-pack/scripts/main.js, `effect-member-guard-derivation`), so
        the observation covers removal, not unloading.

- id: damage-cascade-order-and-payload
  claim: |
    `applyDamage` fires `entityHurt`, then `entityHealthChanged`, then — on a killing hit —
    `entityDie`, and `entityHurt.damage` carries the requested amount even when it exceeds
    remaining health (damage=100 against 8 health).
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `damage-event-order-in-engine` and
        `clamped-hit-damage-payload` lines: nonlethal sequence
        [hurt(damage=2), health(8->6)]; lethal sequences
        [hurt(damage=98), health(6->-92), die] and [hurt(damage=100), health(8->-92), die].

- id: health-not-clamped-at-minimum
  claim: |
    A killing `applyDamage` drives `currentValue` below `effectiveMin` — the engine does not
    clamp: 100 damage against 8/[0,8] health leaves −92, and `entityHealthChanged` reports
    the negative value. By contrast `kill()` and `resetToMinValue` land exactly at the
    minimum (8->0).
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md: `health(6->-92)` and `health(8->-92)` from
        lethal applyDamage; `health(8->0)` from kill-cascade and from resetToMinValue in
        component-health-writes-fire-events.

- id: applydamage-cause-defaults
  claim: |
    `applyDamage` with no options fires `damageSource.cause` `none`. With the projectile
    options form (which has no cause field) the engine derives cause `projectile` itself,
    and adjusts the damage: a requested 1 arrived as 1.045823097229004 from a real arrow, so
    the projectile-path damage is velocity-dependent, not the requested constant.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `damage-default-cause` lines: no-options
        sequence [hurt(damage=1,cause=none), health(8->7)]; projectile-options sequence
        [hurt(damage=1.045823097229004,cause=projectile), health(7->5.954176902770996)].
        Single run — the adjusted damage value itself is nondeterministic.

- id: entity-remove-after-event-shape
  claim: |
    `EntityRemoveAfterEvent` — the payload `world.afterEvents.entityRemove` hands a subscriber —
    carries exactly two readonly string properties, named `removedEntityId` and `typeId`. It
    carries no entity reference, which is what makes the payload readable after the entity it
    describes is gone. The engine raises the event for unloading as well as for scripted removal.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entityremoveafterevent
      where: Class summary, and Properties — removedEntityId and typeId
      quote: |
        Data for an event that happens when an entity is removed from the world (for example, the entity is unloaded because it is not close to players.)

        ### **removedEntityId**

        `read-only removedEntityId: string;`

        Id of the entity that was removed.

        ### **typeId**

        `read-only typeId: string;`

        Identifier of the type of the entity removed - for example, 'minecraft:skeleton'.

- id: kill-and-remove-cascades
  claim: |
    `kill()` fires the full damage cascade — `entityHurt` with damage equal to current
    health and cause `selfDestruct`, then `entityHealthChanged` to exactly the minimum, then
    `entityDie` with cause `selfDestruct` — and returns true; on the still-valid corpse a
    second `kill()` returns true and fires nothing. `remove()` fires no *death* event, but it
    is not event-free: with all 55 `world.afterEvents` signals subscribed, `remove()` was
    followed by five delivered events — one `entitySpawn`, three `dataDrivenEntityTrigger`,
    and one `entityRemove`.
  backing: tested
  caveat: |
    "Followed by" is what the run establishes; that `remove()` *caused* all five is inference.
    The probe's payload matching failed on every one — it reads an id that is unreadable after
    removal — so attribution to the probe's own entity rests on the world holding nothing but
    stationary armor stands besides it. One of the five is an `entitySpawn`, which no removal
    plausibly causes, so at least that attribution is likely wrong. Read the five as events
    observed in the window, not as a cascade to reproduce.
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `kill-cascade` lines: first kill returned
        true with sequence [hurt(damage=8,cause=selfDestruct), health(8->0),
        die(cause=selfDestruct)]; second kill returned true with sequence []; and
        `remove-fires-no-death-event` reported sequence [] over the death-event subset it
        subscribed.
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `remove-event-sweep` lines:
        subscribed=55 skipped=0, then after remove() fired=[entitySpawn, dataDrivenEntityTrigger
        x3, entityRemove] count=5. The `(other)` tag on each line is a probe artefact (the
        payload-matching helper reads an id that is unreadable post-remove) and is not evidence
        of foreign provenance; attribution to the probe's own entity rests on the run holding
        only stationary armor stands besides it, per the file's "Reading the log" section.
        Single run.

- id: death-invalidation-window
  claim: |
    Inside an `entityDie` handler the dead entity's reference is still valid — `isValid`
    reads true and guarded members answer — and it stays valid for at least ~7 ticks after
    `kill()`, turning invalid by ~27 ticks when the corpse despawns. The exact boundary is
    unmeasured.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `death-invalidation-timing` lines:
        inside-die-handler isValid true and hasTag answering, then four after-wait samples
        reading true/true/false/false. The tick offsets come from the probe itself —
        artifacts/engine-probe-pack/scripts/main.js waits 2 ticks after `kill()` and then loops
        delays [0, 5, 20, 40], so the four samples sit at 2, 7, 27 and 67 ticks.

- id: component-health-writes-cascade
  claim: |
    Health writes through the component fire `entityHealthChanged` — `setCurrentValue` and
    the resets alike, with no `entityHurt` — and a write that reaches the effective minimum
    fires `entityDie` with cause `override`.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `component-health-writes-fire-events`
        lines: setCurrentValue(3) → [health(8->3)]; resetToMaxValue → [health(3->8)];
        resetToMinValue → [health(8->0), die(cause=override)].

- id: effect-amplifier-defaults-to-zero
  claim: |
    An effect added with no amplifier option carries amplifier 0.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `effect-amplifier-default` line
        `amplifier=0`.

- id: attribute-guard-classes-observed
  claim: |
    On an invalid owner, the attribute members whose `@throws` names no error — the four value
    getters and all three resets (`resetToDefaultValue`, `resetToMaxValue`, `resetToMinValue`) —
    do throw, but a plain `Error` (`Failed to get property '<internal name>'.` / `Failed to
    call function '<name>'.`), while the members whose `@throws` names `InvalidEntityError` —
    `setCurrentValue` and `entity` — throw `InvalidEntityError`. `isValid` (false) and `typeId`
    stay readable. Across the attribute members observed, the error class matches the
    annotation, including where the annotation names none.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `attribute-generic-throws-on-invalid-owner`
        lines: currentValue/defaultValue/effectiveMax/effectiveMin/resetToDefaultValue threw
        name=Error; setCurrentValue(1) and entity threw InvalidEntityError with
        instanceofInvalidEntityError=true; isValid read false and typeId read
        minecraft:health.
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `attribute-reset-guards` lines: all
        three resets threw name=Error ctor=Error instanceofInvalidEntityError=false, message
        "Failed to call function '<name>'." — extending the single reset of the earlier run to
        the whole reset trio.

- id: set-current-value-bounds-observed
  claim: |
    `setCurrentValue` accepts values exactly at `effectiveMin` and `effectiveMax` and throws
    `ArgumentOutOfBoundsError` (that name and constructor) outside them, its message naming
    the value and the bounds: "Unsupported or out of bounds value passed to function
    argument [0]: value, Value: 1008, Argument bounds: [0, 8]".
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `set-current-value-bounds` lines: at-max
        and at-min returned true; above-max and below-min threw
        name=ArgumentOutOfBoundsError with the quoted message shape.

- id: get-dimension-unknown-id-error
  claim: |
    `world.getDimension` with an id that names no dimension throws a plain `Error` with
    message "Dimension '<id>' is invalid.".
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `get-dimension-invalid-id-error` line:
        threw name=Error ctor=Error message="Dimension 'mctest:nope' is invalid.".
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `vanilla-dimensions` unknown-id line
        reproduces it on a second run: threw name=Error ctor=Error
        instanceofInvalidEntityError=false message="Dimension 'mctest2:nope' is invalid.".

- id: after-events-deferred
  claim: |
    After-events are not delivered synchronously inside the causing call: zero events had
    been delivered when `applyDamage` returned, and both events of the hit arrived within
    the following 4 ticks. Handlers observe post-write state — an
    `entityHealthChanged(8->6)` handler read `currentValue` 6 at delivery.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `after-event-delivery-timing` lines:
        events-delivered-before-applyDamage-returned=0, total-after-4-ticks=2,
        handler-observed event(8->6) componentReadsNow=6.

- id: subscription-semantics-observed
  claim: |
    Subscribing the same closure twice delivers an event once — registration is
    set-shaped — and distinct subscribers are called in subscription order.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `duplicate-subscription-delivery` lines:
        same-closure-subscribed-twice deliveries=1; subscription-order=[first, second].

- id: entity-ids-not-reused
  claim: |
    Entity ids are monotonically sequential opaque negative integers and are not reissued
    after removal: three spawned-then-removed sheep took -47244640214..-47244640212 and the
    next three spawns continued at -47244640211..-47244640209 with no overlap (single run,
    six ids).
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, `entity-id-reuse` line with both id lists
        and reused=[].

- id: entity-id-is-documented-opaque
  claim: |
    `Entity.id` is documented as an opaque identifier: consistent across loads of a world
    instance, with no meaning to be inferred from its value or structure and no parsing or
    interpretation intended. The declaration types it as a bare `string` and states no format,
    so the negative-integer form the engine was observed to issue is an unpromised
    implementation detail rather than part of the API's contract.
  backing: documented
  sources:
    - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
      where: Properties — id, declaration line and description
      quote: |
        `read-only id: string;`

        Unique identifier of the entity. This identifier is intended to be consistent across
        loads of a world instance. No meaning should be inferred from the value and structure
        of this unique identifier - do not parse or interpret it. This property is accessible
        even if @minecraft/server.Entity.isValid is false.

# Facts from the mctest:deep follow-up run (same server session family: Bedrock 1.26.31.1,
# @minecraft/server 2.8.0), recorded in the "Deep run" section of
# artifacts/mctest-engine-probe-results.md. These close the factual half of the four
# decision-gating questions; whether the fake should match the engine is the residual decision.

- id: effect-replacement-rule-observed
  claim: |
    addEffect on an already-present effect replaces it iff the re-add has a higher amplifier,
    or the same amplifier and a longer duration; a lower amplifier never replaces regardless of
    duration, and the same amplifier with a shorter duration does not replace. The rule is
    amplifier-first with a duration tiebreak — not unconditional. At equal duration
    specifically, replacement takes at a higher or equal amplifier and not at a lower one.

    An effect's duration decays with the tick while it is applied: a base applied at 300 read
    back 290 once ticks had passed, which is how the probe told a surviving base from a fresh
    replacement. Whether the duration comparison is against the duration originally applied or
    the duration remaining is not discriminated by these runs — the one same-amplifier sample
    re-applied 300 over a base that had decayed to 290, which satisfies both readings, and no
    sample lies between.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `effect-equal-duration-replacement`
        lines, which discriminate by decay (readback duration 300 = fresh application, 290 =
        the decayed base survived) over a base of amp1/dur300 decayed to dur290: re-add
        amp2/dur300 read back amp2/dur300 replaced=true; re-add amp1/dur300 read back
        amp1/dur300 replaced=true; re-add amp0/dur300 read back amp1/dur290 replaced=false.
        Single run, and the decayed durations are nondeterministic.
    - description: |
        artifacts/mctest-engine-probe-results.md, Deep run, `effect-replacement-matrix` lines
        over a base of amplifier 1 / duration 300: higher-amp (shorter or longer) replaced;
        same-amp/longer replaced; same-amp/shorter, lower-amp/shorter, and lower-amp/longer
        did not (read back the base amp1 dur300). Read synchronously, so a non-replacement
        reads the untouched base and a replacement reads the new values exactly.

- id: invalidation-guard-list-complete
  claim: |
    A reflective sweep of the `Entity` prototype after `remove()` enumerated 62 members — 16
    properties and 46 methods invoked with no arguments — and found exactly four properties
    still readable: `id`, `isValid`, `typeId`, and `scoreboardIdentity` (which reads
    `undefined`). Every other property throws `InvalidEntityError`, including `nameTag` and
    `isSneaking`, which carry no `@throws` annotation. The engine guard list is therefore not
    derivable from the `.d.ts` `@throws` annotations, which under-report it. The methods split:
    the 19 that a no-argument call reached threw `InvalidEntityError`, while 27 threw a
    `TypeError` on arity before the validity guard ran — for those, the guard is unobserved
    rather than shown absent [[f:arity-checked-before-validity-guard]].
  backing: tested
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `invalidation-guard-reflected` lines:
        enumerated=62 properties=16 zeroArgMethods=46 argMethods=0, then
        readable-properties-after-remove=4 (id="-68719476721", isValid=false,
        scoreboardIdentity=undefined, typeId="minecraft:sheep"); the other 12 properties
        threw name=InvalidEntityError instanceofInvalidEntityError=true (the sweep reads each
        property — `attempt(() => sheep[name])` — and `nameTag` is reported as
        `Failed to set property 'nameTag'`, which is the engine's wording on a read of that
        member rather than evidence of a write; the engine-probe sweep, also a read, reports it
        identically). Of the 46 methods,
        those reaching the guard (clearDynamicProperties, clearVelocity, extinguishFire,
        getAABB, getAllBlocksStandingOn, getBlockFromViewDirection, getBlockStandingOn,
        getComponents, getDynamicPropertyIds, getDynamicPropertyTotalByteCount, getEffects,
        getEntitiesFromViewDirection, getHeadLocation, getRotation, getTags, getVelocity,
        getViewDirection, kill, remove) threw InvalidEntityError; the rest threw
        name=TypeError "Incorrect number of arguments to function." Per the file's "Reading
        the log" section, argMethods=0 means the probe's partition failed to identify
        argument-taking methods, so those never reached the guard. Single run; the entity id
        is nondeterministic.
    - description: |
        artifacts/mctest-engine-probe-results.md, Deep run, `invalidation-guard-enumeration`
        lines: id/isValid/typeId read ok and scoreboardIdentity read undefined; dimension,
        isClimbing, isFalling, isInWater, isOnGround, isSleeping, isSneaking, isSprinting,
        isSwimming, localizationKey, location, nameTag, and the zero-arg getters it enumerated
        (getAABB, getComponents, getEffects, getHeadLocation, getRotation, getTags,
        getVelocity, getViewDirection, getDynamicPropertyIds, getDynamicPropertyTotalByteCount)
        threw InvalidEntityError with instanceofInvalidEntityError=true.

- id: kill-no-health-behaviour
  claim: |
    `kill()` on an entity that has no health component (an arrow) returns true and fires only
    `entityDie` with cause `selfDestruct` — no `entityHurt`, no `entityHealthChanged` — and the
    entity reads invalid synchronously, in the same statement sequence as the `kill()` call and
    before the next tick, staying invalid through at least tick+5. A killed mob's corpse by
    contrast stays valid for several ticks: post-death validity is not a uniform grace period;
    despawn timing varies by entity.
  backing: tested
  sources:
    - description: |
        artifacts/mctest-engine-probe-results.md, Deep run, `kill-no-health-and-repeat` line:
        arrow healthComponent=undefined, kill returned true, sequence=[die(cause=selfDestruct)],
