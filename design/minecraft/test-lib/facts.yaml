- id: boat-spawn-offset-magnitude-constant
  claim: |
    `spawnEntity` does not always place an entity on the requested point: `minecraft:boat`
    lands `0.2` off it on x and z and exactly on it in y. From a fixed base the offset is
    reproducible to the last digit — `delta={x:0.20000076293945312, y:0,
    z:0.20000076293945312}` in 4/4 runs — so the adjustment is deterministic rather than a
    per-spawn random draw. The magnitude is constant across every base sampled; the sign is
    not, and the rule governing it is not established: at base (24.5, 57, 24.5) the same
    coordinate value yields +0.2 on x and −0.2 on z, so the sign is not a function of the
    requested coordinate alone. Every other type sampled lands exactly,
    `delta={x:0, y:0, z:0}`, and the boat's offset is already present on its spawn frame.
  backing: tested
  caveat: |
    Three bases were sampled, all with x greater than z on two of them; x read +0.2 in all
    three. That is too few to tell a constant +0.2 on x from a sign rule that happened to
    agree, and no base was sampled with a negative coordinate.
  sources:
    - description: |
        artifacts/mctest-resting-state-probe-results.md, `resting-kinematics-isolated`
        minecraft:boat lines across runs 1–4 (n=4): requested-location {x:38.5, y:81, z:18.5},
        location {"z":18.700000762939453,"y":81,"x":38.70000076293945},
        delta={"x":0.20000076293945312,"y":0,"z":0.20000076293945312} at spawn frame, 2 ticks
        and 22 ticks in every run; the seven other types read delta {"x":0,"y":0,"z":0}. The two
        earlier contended `resting-kinematics` runs, from different bases, produced the same
        magnitude with different signs — delta {x:+0.20000076293945312, z:-0.20000076293945312}
        at requested-location (24.5, 57, 24.5), and delta {x:+0.20000076293945312,
        z:+0.20000076293945312} at (42.5, 81, 22.5).

