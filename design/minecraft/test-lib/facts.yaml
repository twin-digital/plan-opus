- id: arity-checked-before-validity-guard
  claim: |
    The engine checks a method's argument count before its validity guard: called with no
    arguments on a removed entity, 27 of `Entity`'s 46 methods threw a `TypeError`
    ("Incorrect number of arguments to function. Expected <n>, received 0") rather than the
    `InvalidEntityError` the same call raises when the arity is right. Argument validation
    therefore precedes the invalidation check.
