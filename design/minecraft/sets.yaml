# Sets of this area's designs. A set here holds only minecraft designs; one whose members span
# areas is declared in design/sets.yaml instead, and only an area-tier requirement may bind
# through a set declared here.
#
# Every member must resolve to a design that exists: a set is written after the designs it groups,
# because a typo and a plan read the same on the page.

# The designs that ship a Bedrock addon pack — what a player installs into a world, as opposed to
# the tooling that finds, builds, serves, or tests one.
minecraft-addon-packs:
  - minecraft/village-guard
