- id: library-is-the-one-implementation-of-the-format
  statement: |
    every program that reads a planning artifact reads it through this library; no tool carries a
    second implementation of the format

- id: library-covers-every-planning-artifact
  statement: |
    the library types, loads, and resolves every artifact this system produces — designs and their
    entries, the fact pool and its evidence, citations and scopes, the product manifest, and the
    published bundle — including resolving a design scope to its bundle name and a cited fact
    source to an upstream edge

- id: library-validates-not-just-parses
  statement: |
    the library enforces the format's invariants, so a consumer that loads an artifact through it
    never has to decide for itself whether the artifact is well-formed

- id: library-derives-no-bundle
  statement: |
    the library stops short of producing a bundle: deriving one, computing its version, and packing
    it belong to the tool that does that

- id: library-is-a-published-package-from-the-opus-monorepo
  statement: |
    the library ships as a TypeScript package built in the opus monorepo and published in its own
    right, installable by any tool that reads planning artifacts

- id: checker-results-do-not-change
  statement: |
    this repository's checker, once it reads the format through the library, reports exactly what
    it reports today for every design in the tree
  rationale: |
    Anything it stops reporting is an invariant silently dropped in the move.
