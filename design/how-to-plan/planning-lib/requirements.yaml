- id: library-covers-every-planning-artifact
  statement: |
    the library types and loads every artifact this system produces, whatever is added later

- id: library-validates-not-just-parses
  statement: |
    the library enforces the format's invariants, so a consumer that loads an artifact through it
    never has to decide for itself whether the artifact is well-formed

- id: library-reports-whether-a-design-is-settled
  statement: |
    the library reports whether a design is settled, computed from its content by the format's own
    rule, so no consumer re-derives that judgement

- id: library-resolves-a-design-to-its-bundle-name
  statement: |
    the library resolves a design scope to the bundle name the product manifest gives it, and
    reports when the manifest names none

- id: library-reports-a-designs-commitment-set
  statement: |
    the library reports a design's commitment set — the requirements binding it and the decisions
    it holds that a bundle carries — as entries with their ids and statements

- id: library-resolves-upstream-edges-from-cited-fact-sources
  statement: |
    the library resolves a design's cited fact sources to the upstream designs it depends on,
    applying the format's rules for which sources count

- id: library-strips-citation-tokens-from-spec-prose
  statement: |
    the library produces a spec's prose with its citation tokens removed, as a builder reads it

- id: library-is-a-published-package-from-the-opus-monorepo
  statement: |
    the library is built in the opus monorepo and published in its own right, installable by any
    tool that reads planning artifacts
