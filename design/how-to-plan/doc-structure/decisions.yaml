# Decisions proposed for the doc-structure design.
# Schema: id, statement, status (proposed|accepted|tolerated|rejected), falsifiers.
# status is required and always written. At least one falsifier per live decision.

- id: block-and-file-encoding
  statement: |
    in-document components and open questions live in `yaml`-fenced blocks each under a
    single kind-naming key; the standalone foundation files are bare top-level sequences
  status: tolerated
  falsifiers:
    - a foundation file grows a need for file-level metadata beside its entries, so a bare
      sequence can no longer hold everything the file must carry
    - the renderer or parser the format targets stops round-tripping the `yaml` info string or
      the in-document block, so a block can no longer be both shown to a person and read by a
      machine from one source

- id: examples-fenced-as-non-yaml
  statement: |
    an on-disk shape shown only for illustration in a spec is written in a fenced block whose
    info string is not `yaml`
  status: rejected
  falsifiers:
    - a spec must display a live, machine-read block and an illustrative example of the same
      kind such that no info-string convention can tell them apart
    - readers or tooling come to depend on `yaml` highlighting for illustrative snippets, so
      withholding the info string from examples costs more than the disambiguation is worth

- id: fixed-section-headings
  statement: |
    a spec.md's three fixed sections are the H2 headings `## Summary`, `## Open questions`, and
    `## Components`, with Open questions right after Summary and Components last
  status: tolerated
  falsifiers:
    - a design needs its open questions or components somewhere other than these fixed slots for
      the document to read well, so the fixed placement fights legibility
    - tooling comes to key on heading text that differs from these exact strings, forcing a
      rename across every spec

- id: live-blocks-identified-by-section
  statement: |
    a spec.md's live component and open-question blocks are the `yaml` blocks under the fixed
    `## Components` and `## Open questions` H2s; a `yaml` block anywhere else is illustrative
  status: accepted
  falsifiers:
    - a design needs a live component or question block outside the two fixed sections for the
      document to read well, so section placement cannot mark what is live
    - authors routinely need an illustrative block that must itself sit under a fixed section,
      so section is not enough to separate an example from a live entry

- id: omitted-binding-means-the-whole-tier
  statement: |
    a wider-scope requirement with no `applies_to` binds every design in its tier
  status: accepted
  falsifiers:
    - authors write `applies_to` on nearly every shared requirement, so the default never
      describes what anyone means and only hides which designs are bound
    - a requirement is found binding designs its author never intended, because the default
      fired where nobody looked

- id: set-membership-is-declared-by-the-set
  statement: |
    a set lists its member designs in design/sets.yaml; a design does not declare the sets it
    belongs to
  status: tolerated
  falsifiers:
    - adding one design routinely means editing several set entries, so membership churns in
      more places than the design itself
    - two sets are maintained by different people and the single file becomes the thing they
      contend over

- id: settle-bar-stays-design-scoped
  statement: |
    a design settles on citing its own live requirements and its kept decisions; a requirement
    bound to it from a wider scope carries no citation obligation
  status: rejected
  falsifiers:
    - a design ships having silently ignored a requirement bound to it, and a citation at settle
      would have caught it

- id: dangling-members-are-reported-not-rejected
  statement: |
    a set member, or an `applies_to` entry, naming a design that does not exist is reported as a
    notice rather than failing the check
  status: rejected
  falsifiers:
    - dangling names accumulate because nothing forces one to resolve, so the notice stops being
      read and a typo survives as long as a real forward reference
    - a set is found binding nobody for a whole cycle because its only members were misspelled

- id: binding-coverage-is-reported-not-enforced
  statement: |
    the harness resolves which requirements bind a design and shows them; whether the design
    honours each is a reviewer's finding
  status: rejected
  falsifiers:
    - a bound requirement's breach turns out to be mechanically detectable often enough that
      reporting alone wastes the signal

- id: fact-index-is-generated-on-demand
  statement: |
    the repository-wide view of facts is generated from the foundation files when asked for, and
    no copy of it is committed to the tree
  status: accepted
  falsifiers:
    - generating the view is slow enough, or awkward enough to invoke, that authors skip it and
      write duplicates anyway
    - a reader outside the working copy — a pull-request reviewer, a rendered docs site — needs
      the index and cannot run the generator

- id: facts-carry-topic-tags
  statement: |
    every fact carries a `topics` list drawn from a declared vocabulary, and finding a fact means
    filtering the tree by topic
  status: rejected

- id: fact-filing-is-advisory-not-enforced
  statement: |
    the harness checks that a fact sits somewhere under facts/ and is well-formed and resolvable,
    never that it sits in the right file for its subject; a misfiled fact is a reviewer's finding
  status: tolerated
  falsifiers:
    - facts pile into one catch-all file because nothing pushes back, to the point that no file
      name describes what it holds
