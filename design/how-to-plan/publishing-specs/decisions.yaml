- id: bundle-identity-is-product-and-feature
  statement: a bundle is named by a product and, where the product subdivides, a feature within it — never by the planning repository or a design's area
  status: accepted
  falsifiers:
    - a design's identity needs a level the product and feature pair cannot carry

- id: bundle-name-is-a-scoped-package
  statement: a bundle publishes as `@td-spec/<product>`, or as `@td-spec/<product>.<feature>` where the product subdivides
  status: accepted
  falsifiers:
    - a registry the bundles must reach rejects a package name carrying a dot
    - a product needs subdivision more than one level deep, which a single dot cannot express

- id: product-map-declares-bundle-identity
  statement: a `products.yaml` at the repository root maps each product either to one design scope or to a mapping of feature names to design scopes
  status: proposed
  falsifiers:
    - a product has to both publish a bundle of its own and hold features
    - the map drifts from the design tree often enough that specs publish under stale names

- id: undeclared-identity-publishes-nothing
  statement: a design absent from `products.yaml` publishes no bundle, and the checker warns rather than failing its settle gate
  status: proposed
  falsifiers:
    - a settled spec goes unpublished unnoticed and a builder is blocked waiting for it

- id: npm-registry-is-the-publication-target
  statement: bundles are published as packages on the public npm registry at registry.npmjs.org
  status: proposed
  falsifiers:
    - a consumer needs a bundle without an npm client available

- id: bundle-is-three-files-plus-incorporated-content
  statement: a bundle is a directory holding spec.md, commitments.md, and package.json, plus the content the spec incorporates by reference
  status: proposed
  falsifiers:
    - a builder routinely needs a file the bundle does not carry
    - the two markdown files are always read together, so the split buys nothing

- id: commitments-are-rendered-markdown
  statement: the requirement and decision extraction is rendered markdown, with no machine-readable copy beside it
  status: proposed
  falsifiers:
    - a builder's tooling needs to enumerate a bundle's commitments programmatically

- id: dependencies-are-derived-from-cited-fact-sources
  statement: a bundle depends on the bundles of the designs whose requirements.yaml or spec.md its spec's cited facts source, each at a caret range on that bundle's latest version
  status: proposed
  falsifiers:
    - a spec leans on another design without citing a fact sourced to that design's requirements
    - a caret range admits an upstream bundle a downstream builder cannot build against

- id: bump-is-computed-from-the-commitment-diff
  statement: the bump is computed from the commitment diff against the previous version — removed or altered is major, added is minor, otherwise patch — and the settling author may raise it, never lower it
  status: proposed
  falsifiers:
    - authors override the computed bump on most publishes
    - a change the rule scores as patch breaks a builder consuming the bundle

- id: latest-never-moves-backward
  statement: latest always names the highest version published for a bundle, and a superseded or withdrawn spec is deprecated rather than having latest moved
  status: proposed
  falsifiers:
    - a consumer builds from a superseded bundle because the deprecation message never reached them

- id: settled-specs-are-backfilled-on-the-first-run
  statement: every spec already settled on main is published by the first publishing run rather than waiting for its next settle
  status: proposed
  falsifiers:
    - a spec already settled on main is found stale enough that publishing it at 1.0.0 would send a builder off the current design

- id: first-version-is-one-zero-zero
  statement: a bundle's first published version is 1.0.0, backfilled bundles included
  status: accepted
  falsifiers:
    - a bundle needs to signal instability through its version line before its first consumer arrives

- id: extraction-carries-live-commitments-only
  statement: commitments.md carries the active requirements binding the design and its accepted and tolerated decisions, and nothing else
  status: accepted
  falsifiers:
    - a builder needs a rejected decision or a retired requirement to understand what the spec rules out

- id: identical-bundle-skips-publish
  statement: a derived bundle byte-identical to the current latest is not published and burns no version
  status: accepted
  falsifiers:
    - a consumer needs a version bump to record that a spec was re-settled without content change

- id: leaving-settled-publishes-nothing
  statement: a spec that stops being settled publishes nothing further, and its existing versions stay fetchable
  status: accepted
  falsifiers:
    - a consumer builds from a bundle whose spec has been reopened and needed to know it

- id: incorporated-content-is-vendored-by-relative-path
  statement: files the spec links inside its own design directory are copied into the bundle at the same relative path, and links outside it are left as written
  status: accepted
  falsifiers:
    - a spec routinely incorporates content from outside its own directory, so the bundle arrives with dead links

- id: bundles-publish-publicly
  statement: bundles are published with public access
  status: accepted
  falsifiers:
    - a design has to be published that the repository does not already expose

- id: bundle-manifest-is-minimal
  statement: package.json carries name, version, description, files, repository, and dependencies, and nothing else
  status: accepted
  falsifiers:
    - a registry or a consumer's tooling rejects or misreads a manifest missing a field the bundle does not carry

- id: token-strip-repairs-the-line
  statement: stripping a citation token collapses the doubled spacing it leaves to one space, and drops the space before a token that ended a line
  status: proposed
  falsifiers:
    - a stripped spec.md renders differently from its source anywhere but where a token stood

- id: every-bundle-is-derived-each-run
  statement: a publishing run derives every bundle in products.yaml and lets the unchanged ones fall out at the identical-bundle gate, rather than selecting bundles from what a merge touched
  status: proposed
  falsifiers:
    - deriving the whole set takes long enough that a merge waits on bundles nothing in it touched
