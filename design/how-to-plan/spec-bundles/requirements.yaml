- id: derived-implementer-view
  statement: |
    the artifact a spec's implementers build from is derived from the spec, not authored
    separately: the spec.md itself with its inline citation tokens stripped, augmented by a
    streamlined extraction of the decisions and requirements the spec is bound by. The spec's
    prose is the primary source — it tells the builder what to build and how; the extraction is
    a crib for the key commitments, and the facts and citation tokens are left out

- id: bundle-is-fetched-by-name-and-version
  statement: |
    a builder outside this repository obtains a spec's bundle from the spec's name and a version,
    or from the name alone to get the latest, without cloning this repository or knowing its
    layout

- id: published-bundle-versions-are-immutable
  statement: |
    a published bundle version's content never changes; a correction of any size is published as
    a new version
  rationale: |
    Reversing this changes the build input under every consumer that pinned a version, without
    their pin moving.

- id: product-manifest-declares-bundle-identity
  statement: |
    a design's bundle name comes from the product manifest, the file `products.yaml` at the
    repository root, which maps each product to one design scope or to a mapping of feature names
    to design scopes; a design the manifest does not name has no bundle name
  rationale: |
    The mapping is not derivable from the design tree, and a second design now resolves names
    through it, so where identity is declared is fixed rather than left to this design.

- id: bundle-name-is-the-td-spec-scope
  statement: |
    a bundle publishes as `@td-spec/<product>`, or as `@td-spec/<product>.<feature>` where the
    product subdivides
  rationale: |
    A second design now emits this name, so the scope and the separator are fixed rather than left
    to this design to rework.

- id: commitments-are-a-flat-id-and-statement-list
  statement: |
    a bundle's commitments are one flat sequence whose entries carry exactly two fields: an `id`
    prefixed with its kind letter, `r:` or `d:`, and a `statement`. Nothing marks which entries are
    the owner's fiat and which the spec's own
  rationale: |
    A second design now reads this file, so the field set and the prefix are fixed rather than left
    to this design to rework.

- id: bundle-dependencies-come-from-cited-fact-sources
  statement: |
    a bundle depends on the bundles of the designs whose `requirements.yaml` or `spec.md` its
    spec's cited facts source, and on nothing else

- id: token-strip-leaves-the-line-as-written
  statement: |
    a spec's prose with its citation tokens stripped differs from the source nowhere but where a
    token stood: the spacing a removal doubles collapses to one, and a token that ended a line
    takes the space before it

- id: a-bundle-is-self-contained
  statement: |
    a bundle carries its own design in full — the spec, and any other content it incorporates by
    reference. What the spec depends on from another design need not be vendored inside the
    bundle, and may be fetched separately
  force: soft
