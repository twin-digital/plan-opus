- id: node-for-tooling
  statement: permanent scripts and tooling are written in Node.js unless the task requires otherwise
  force: soft
  rationale: |
    A standing personal convention applied across all projects. Bash only where no Node
    runtime is available or the task strongly favours it; another language only when Node
    genuinely cannot do the job. Applies to permanent tooling — one-off agent scripting is
    unconstrained.

- id: in-repo-source-urls-resolve
  statement: |
    a fact source whose url is an in-repo path — one carrying no external scheme — must point
    at a file that exists in the repository; the checker rejects a source url that resolves to
    no file
  rationale: |
    An in-repo source is only evidence if the file is actually there. Unlike an external link,
    an in-repo path can be resolved for free at check time, so a dead one is a hard error rather
    than a silently weaker fact.

- id: in-repo-quotes-match-their-source
  statement: |
    where an in-repo fact source carries a quote, that quote must be found in the referenced
    file, matching the file's text up to whitespace and line breaks; the checker rejects a quote
    its source does not contain
  rationale: |
    This is what keeps a cross-design dependency expressed as a quote-fact from drifting: when an
    upstream spec's wording changes, the stale quote fails the check in the same change that broke
    it, rather than lingering as a confident but false claim. It is the extra strength an in-repo
    source has over an external one that cannot be fetched at check time — the quote is verified,
    not trusted. Matching is up to whitespace and line breaks because a block scalar and a
    line-wrapped source hold the same text differently; how tolerant to be is this design's to
    settle.

- id: wip-uncited-content-metrics
  statement: |
    When reviewing a spec, contributors have access to automated metrics that can be used to
    assess the amount of uncited material it contains. Exact metrics are not prescribed but
    might include measurements of amount of text between citations, % of cited/uncited sentences
    or paragraphs, etc.
  rationale: |
    The semantic rule that "all foundational claims" are cited cannot be mechanically enforced.
    Nor does it make sense to add hard gates on citations. But as an input for reviewers to
    consider it makes sense. And the automation opens the gate to building baselines to compare
    against.

- id: check-validates-declared-sets
  statement: |
    the checker reads every `sets.yaml` and rejects a set with no members, a name declared
    twice, a set holding another set, a member naming no design that exists, and — in an area's
    file — a member from another area
  rationale: |
    A set nothing validates fails silently in the direction that looks fine: a misspelt member
    binds nobody, and the requirement pointing at the set still passes.

- id: check-validates-applies-to
  statement: |
    the checker rejects an `applies_to` on a design-scoped requirement, one that is not a
    non-empty list, any item naming no existing design or undeclared set, and any item outside
    the requirement's own tier
  rationale: |
    The tier bound is what makes the foundations view's three-directory read the whole answer;
    unenforced, the view and the settle gate disagree exactly where an author cannot see it.

- id: check-resolves-binding-for-the-settle-gate
  statement: |
    the checker computes which requirements bind a design — from `applies_to`, the sets it
    names, and the tier default when it names none — and fails a design otherwise ready to
    settle for each bound requirement no claim cites
  rationale: |
    The gate is the only thing standing between a bound requirement and a design that never
    read it, since nothing downstream notices an obligation that was simply missed.

- id: bound-requirements-are-rendered-for-an-author
  statement: |
    the foundations view renders a design exactly the requirements that bind it, with the sets
    resolved, so an author never walks the tree to find one
  rationale: |
    An obligation an author has to go looking for is one they will meet at the settle gate
    instead, after the spec is written.

- id: binding-is-resolved-in-one-place
  statement: |
    the settle gate and the foundations view answer "which requirements bind this design" from
    the same resolution, never from two implementations of the rule
  rationale: |
    Two resolvers drift toward the worst pairing — a view that omits what the gate demands —
    and the author sees the disagreement only as a failure they cannot reproduce.

- id: check-verifies-a-run-source
  statement: |
    the checker rejects a run source that resolves to no run or to a retired one, a run whose
    output file is absent, a run source on a fact not backed `tested`, and a quote absent from
    the output the run names
  rationale: |
    An unverified evidence link is indistinguishable from a correct one right up to the point
    someone needs to re-run it.

- id: check-counts-tested-facts-without-a-run
  statement: |
    the checker reports how many tested facts rest on evidence no run names
  rationale: |
    That evidence is the kind the checker cannot verify, and nothing else says how much of it
    there is.

- id: check-identifies-blocks-by-section
  statement: |
    the checker identifies a spec.md's live component and open-question blocks by their
    containing fixed section (`## Components`, `## Open questions`); a yaml block outside those
    sections is not a live entry, so an illustrative example placed elsewhere is ignored rather
    than parsed
  rationale: |
    Lets a spec show copyable on-disk examples of its own block kinds without the checker
    mistaking them for real entries, and gives the fixed section headings a mechanical job
    instead of leaving them cosmetic.
