# Requirements at global scope. One with no `applies_to` binds every design in the repository, so
# narrow it to the designs it was written for unless it really binds them all.

- id: node-libraries-are-esm-typescript
  statement: |
    a Node.js library this repository designs ships as ESM only, written in TypeScript and
    shipping its own type declarations, targeting active Node LTS
  applies_to: [set:nodejs:libraries]

- id: package-config-is-repo-kit-managed
  statement: |
    a package's shared configuration — its bundler, TypeScript, lint, and package-script setup — is
    generated by the monorepo's config manager from that monorepo's declarative configuration. It is
    neither written nor edited in the package, and an exception for one package is declared where
    that configuration lives.
  applies_to: [set:minecraft-addon-packs]
