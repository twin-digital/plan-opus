# Requirements at global scope: those binding designs in more than one area. Each names the designs
# it binds, since nothing here binds every design in the repository.
#
# rationale is omitted unless the statement's intent is genuinely non-obvious.

- id: package-config-is-repo-kit-managed
  statement: |
    a package's shared configuration — its bundler, TypeScript, lint, and package-script setup — is
    generated by the monorepo's config manager from that monorepo's declarative configuration. It is
    neither written nor edited in the package, and an exception for one package is declared where
    that configuration lives.
  applies_to: [set:minecraft-addon-packs]
