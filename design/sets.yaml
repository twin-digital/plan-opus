# Sets declared at global scope: those whose members are meant to span areas. A grouping of one
# area's designs is declared in that area's design/<area>/sets.yaml instead, and only a
# requirement at the matching tier may bind through it.
#
# A set maps a name — unique across the repository — to design scopes (`<area>/<design>`). Sets do
# not nest, and a design may belong to any number of them. A requirement names one as `set:<name>`
# in its `applies_to`.
#
# Every member must resolve to a design that exists: a set is written after the designs it groups,
# because a typo and a plan read the same on the page.

# Designs that ship a Node.js library, wherever they sit — the technology binds them, not the area.
nodejs:libraries:
  - how-to-plan/planning-lib
