version: "1"
requirements:
  - id: r-82ck2fax
    title: package config is repo-kit managed
    statement: |
      a package's shared configuration — its bundler, TypeScript, lint, and package-script
      setup — is generated by the monorepo's config manager from that monorepo's declarative
      configuration. it is neither written nor edited in the package, and an exception for one
      package is declared where that configuration lives.
    verification:
      - do: regenerate the package's shared configuration from the monorepo's declarative configuration
      - verify: the tree is clean, and the package holds no hand-written bundler, TypeScript, lint, or package-script configuration
      - do: look where the shared configuration lives
      - verify: any exception for this package is declared there
