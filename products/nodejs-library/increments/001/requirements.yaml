version: "1"
requirements:
  - id: r-ds3q3en9
    title: node libraries are ESM TypeScript
    statement: |
      a Node.js library ships as ESM only, written in TypeScript and shipping its own type
      declarations, targeting active Node LTS.
    verification:
      - do: pack the package with npm pack --dry-run
      - verify: .d.ts declarations are in the file list
      - do: open the packed package.json
      - verify: '"type" is "module", and no exports path resolves to a CommonJS file'
      - do: require() the package from a CommonJS context
      - verify: it fails — no CJS entry exists
      - do: open the build target configuration
      - verify: the target is within active Node LTS
