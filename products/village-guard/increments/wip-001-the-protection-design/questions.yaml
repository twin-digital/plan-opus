questions:
  - id: q-12hs93gc
    question: |
      does cancelling a player's hit also spare the player the villager's negative gossip? villager
      reputation is not on the script API's surface at all — no `gossip` or `reputation` identifier
      anywhere in the module — so the pack can neither read a villager's standing nor undo it, and a
      cancelled hit spares it only if the engine hangs the gossip off the damage rather than off the
      swing. `r-ef113dxi` wants an accidental swing to cost the player nothing, and this is what
      decides whether cancelling delivers that or whether the requirement needs a mechanism the pack
      does not yet have. observable at a client: trade with a villager, strike it repeatedly, trade
      again, and read the prices.
    answer: fact
    facets: pack-runtime

