questions:
  - id: q-fc5bw0k0
    question: |
      does a hit whose damage is written down still flinch, still sound, and still panic? the
      knockback half is measured and settled — `f:a-clamped-hit-knocks-back-and-a-cancelled-one-does-not`
      puts a clamped hit's peak speed on top of a vanilla hit's and a cancelled hit's at nothing.
      the rest is not: flinch and the hurt sound are rendered on the client and reach no server log,
      and total displacement cannot separate panic-from-being-hit from a villager's ordinary flight
      from a zombie. `evidence/minecraft/script-api/protection-probe/CLIENT.md` stages the
      comparison — three penned villagers, vanilla against clamped against cancelled — and needs a
      person at a client to make it.
    answer: fact
    facets: pack-runtime
