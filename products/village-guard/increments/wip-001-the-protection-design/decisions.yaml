version: "1"

decisions:
  # what ships
  - id: d-issr5yjc
    title: village-guard ships as one behavior pack
    statement: |
      village-guard's consumer-visible package set is a single behavior-pack package,
      `@twin-digital/village-guard`, in the opus monorepo at `nodejs/minecraft/village-guard`. it
      exposes no library surface, and its release artifact is the installable pack itself.
    status: proposed
    pinned:
      reason: public-api
    because:
      - r-cizmztsh
      - r-cyd08e6q
      - r-w2vh7olv
    facets: packaging

  # how protection works
  - id: d-jp67dexu
    title: a mob's hit is clamped, a player's is cancelled
    statement: |
      the pack subscribes `world.beforeEvents.entityHurt` and splits on the hit's
      `damageSource.damagingEntity`, because no damage cause distinguishes a player's swing from a
      mob's.

      a hit from anything other than a player has its `damage` written down to an amount that cannot
      reach the mob's `effectiveMin` health, and the health lost is restored in the same tick. the
      restore is not an ergonomic detail: a clamp alone lets the losses accumulate until the mob
      dies anyway.

      a hit a player dealt, whether in melee or by a projectile they loosed, is cancelled outright,
      so nothing lands and the mob does not react.

      the pack never makes a mob invulnerable and adds no effect to a mob.
    status: proposed
    pinned:
      reason: other
      notes: >-
        fixes what a player observes when they strike a protected mob, and what they observe when a
        zombie does — two behaviours a consumer would notice changing.
    because:
      - r-pe87rfqq
      - r-ef113dxi
      - f:entity-hurt-before-event-sees-engine-dealt-damage
      - f:no-damage-cause-names-the-attacker-and-none-names-reputation
      - f:a-damage-clamp-without-a-restore-still-kills
      - f:a-clamped-hit-knocks-back-and-a-cancelled-one-does-not
      - f:a-clamped-hit-is-indistinguishable-from-a-vanilla-one-at-a-client
      - f:before-event-field-writes-take-effect
      - f:reaching-effective-minimum-is-fatal
      - f:health-not-clamped-at-minimum
      - f:cancelled-call-return-values-observed
      - f:after-event-deferral-subtick
    facets: pack-runtime

  - id: d-8b5m52it
    title: the event subscription is the enrolment
    statement: |
      a mob is protected because the pack's `entityHurt` subscription sees its hit, and by nothing
      else. the pack keeps no registry of protected mobs, scans no dimension, and runs no periodic
      sweep.
    status: proposed
    pinned: false
    because:
      - r-1nxm8bg4
      - d-jp67dexu
    facets: pack-runtime

  - id: d-6lbml4g9
    title: the protected set is three vanilla type ids
    statement: |
      the pack protects `minecraft:villager_v2`, `minecraft:wandering_trader` and
      `minecraft:iron_golem`, and no other entity type. the set is fixed in the pack and is not
      configurable.
    status: proposed
    pinned:
      reason: other
      notes: >-
        an installer reads the set as what the pack does to their world; adding or dropping a type
        changes which mobs survive a siege.
    because:
      - r-1nxm8bg4
      - r-9gw909jf
      - f:preventing-a-villagers-death-prevents-its-conversion
      - f:subscribe-filter-entity-types-requires-the-prefix
    facets: pack-runtime
