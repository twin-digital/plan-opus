version: "1"

questions:
  - id: q-on6z5pic
    question: |
      does a hit written down to zero still flash the mob and play the hurt sound at a client?
      r-ef113dxi requires a struck mob to visibly take the hit — flinch, knockback, sound and panic
      as vanilla would. knockback is measured and unchanged by a zero write
      (f:a-hit-written-down-to-zero-still-knocks-back), but flinch and sound render on the client and
      reach no server log. what covers them today is
      f:a-clamped-hit-is-indistinguishable-from-a-vanilla-one-at-a-client, which the owner observed
      at a client against a hit written down to 0.5 — not to zero, and the engine may well tie the
      hurt animation to damage actually taken. answering it needs a client session like the one that
      recorded that fact.
    answer: fact
    facets: pack-runtime
