version: "1"

# One open question the vendoring build raised, answered by the client session
# increment 003's name-display probe already needs.
questions:
  - id: q-zwn1at3x
    answer: fact
    question: |
      does a client that declines the resource-pack download prompt render an adventure's actors?
      d-x60dka1o rests on a behavior manifest naming its own resource half in `dependencies`, and
      the world half of that is settled: such a dependency pulls the resource pack into the client
      pack stack against an empty resource activation list, and the server offers it to the client,
      which prompts to download before joining. What is not established is what a decline leaves —
      whether the join is refused, or proceeds with the actors unrendered, and whether
      `TEXTUREPACK_REQUIRED` changes it. Nothing server-side can detect the outcome, so it is read
      at a client. `artifacts/resource-pack-decline/` carries the steps; they reuse increment 003's
      name-display probe packs and are run in the same client session, that probe being queued for
      the same reason.
