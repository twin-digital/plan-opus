version: "1"
questions:
  - id: q-r7db9r31
    answer: fact
    question: |
      does a localization entry the pack carries give a player a name they actually read above an
      actor, and can a name a player reads be translated at all?

      b-ejavoqeh proposes moving a preset's default name out of the library (d-bfdql5tx) and into
      the vendored pack as an `entity.<id>.name` entry, which the kit now admits and rewrites to
      follow the composed identifier. both reasons d-bfdql5tx gave for keeping the name in the
      library have expired: d-ny9lcyjg is superseded by d-nyh4i1x1, and the kit composes a `.lang`
      file two packs both contribute to rather than letting one win.

      what is missing is a measurement. today the library applies the default name to the actor as
      it is created, which puts a name plate above it. a `.lang` entry names the *type*, and it is
      not established that it produces anything a player sees above an unnamed entity — nor that a
      name plate can carry a translated string at all. if it cannot, moving the name into the pack
      trades a name every player reads for one most players never see.

      so d-bfdql5tx and d-kklnm4j4 stand unchanged in this increment, with their stated reason
      expired and their conclusion unmeasured.

      the probe is prepared at `artifacts/name-display-probe/`: five entities differing only in
      whether the pack carries a localization entry and what the script writes to `nameTag`, with
      an english and a german lang file. it cannot be run headless —
      f:a-resource-pack-cannot-carry-anything-a-script-can-reach establishes that a resource pack
      reaches nothing a script can observe, and a name plate is drawn by the client — so a person
      reads the plates in a client and reads them again in german.

      the readings pick between three designs, which is why this is a question rather than an
      assumption. if the pack's entry shows above an actor, the name moves there and becomes
      localisable and adventure-overridable. if it shows nothing and a plate is literal text, moving
      the name would trade a name every player reads for one most never see. if a plate resolves a
      translation key, the pack carries the text and the library writes the key — visible and
      translated, which nobody would guess. the README carries what each outcome changes.
