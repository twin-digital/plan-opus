version: "3"
requirements:
  - id: r-wwha7y68
    title: an adventure's author writes no actor content
    statement: |
      an adventure built on this product spawns and uses an actor without its author writing an
      entity definition, a model, a texture, an animation, or a default name for it. what an
      author writes is their own story, their triggers, and their logic, and one dependency.
    scope: actors
    supersedes: r-e8p2oto6
    commentary: |
      r-e8p2oto6 said an adventure carries none of that content. under vendoring the adventure's
      build emits all of it into the adventure's own packs, so the requirement holds of what an
      author writes and not of what ships.

      this is the reading the product already applied to code, which the build inlines into an
      adventure's script without anyone counting it against the requirement. what the requirement
      protects is unchanged: an author never authors a character.
components:
  - id: actors
    description: what an adventure depends on — the presets, the spawn call, and the actor content an adventure's build merges into its own packs
  - id: library
    status: retired
    superseded_by: actors
    reason: the code and the actor content are one package, and neither part is a component of its own (d-zohkvwu1)
    description: what an adventure imports — the actor presets, the spawn call, and the handle it returns
  - id: assets-pack
    status: retired
    superseded_by: actors
    reason: the code and the actor content are one package, and neither part is a component of its own (d-zohkvwu1)
    description: what an adventure depends on — the actor entity definitions and the models, textures, and animations they render from
  - id: example
    description: the adventure built on the actors package, which spawns every actor and carries the product's run-time evidence
terms:
  - id: adventure
    definition: |
      a pack built on this product carrying one experience — its story, its triggers, and its logic — whose author writes no actor definition, model, texture, animation, or name.
  - id: namespace
    definition: |
      the token an adventure's packs are built under, which every identifier in them carries. the adventure chooses it; this product declares none.
  - id: prefix
    definition: |
      the token an adventure's build spells this product's vendored content under, sitting between the adventure's namespace and a preset's own name.
