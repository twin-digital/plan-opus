version: "3"
decisions:
  - id: d-6jlj0rl2
    title: a library package and an assets-pack package, neither holding the other's content
    statement: >
      the product ships two packages. one is a Node library holding no pack, and is what an
      adventure

      imports for code. the other holds a behavior pack and a resource pack, declares no script

      module, and is what an adventure depends on for the actor entity definitions and their assets.

      neither package holds any of the other's content.
    status: proposed
    pinned:
      reason: public-api
      notes: which package an adventure imports and which it declares a manifest dependency on, and that
        the split exists at all
    scope:
      - library
      - assets-pack
    because:
      - r-e8p2oto6
      - r-cyd08e6q
      - f:an-entity-type-resolves-for-a-script-in-any-other-loaded-pack
  - id: d-knzip5zc
    title: code travels as an npm dependency, assets as a manifest uuid dependency
    statement: >
      an adventure takes the library as an ordinary development dependency of its package, bundled

      into the adventure's own script at build time. it takes the assets pack as an entry in its

      behavior pack manifest's `dependencies`, naming that pack's header uuid and version. there is

      exactly one route for each: the library ships no pack to depend on, and the assets pack ships
      no

      script to import.
    status: proposed
    pinned:
      reason: public-api
      notes: what an adventure's package manifest and pack manifest must each declare to use the product
    scope:
      - library
      - assets-pack
    because:
      - r-e8p2oto6
      - d-6jlj0rl2
      - f:pack-dependency-entries-name-a-uuid-or-a-module-name-plus-a-version
      - f:a-script-module-does-not-resolve-across-packs
      - f:a-declared-pack-dependency-activates-the-depended-on-pack
  - id: d-gzoqebyy
    title: an actor is a custom entity, never the game's NPC entity
    statement: >
      no actor is the game's `minecraft:npc` entity, and the product delivers nothing through the
      NPC

      dialogue system. an actor is an entity this product defines.
    status: proposed
    pinned:
      reason: other
      notes: what a click on an actor does, and which game modes a world running an adventure may be in,
        both change if this is reversed
    scope: assets-pack
    because:
      - r-wqwub3zz
      - f:npc-dialogue-needs-survival-or-adventure-mode
      - f:an-npc-is-edited-and-despawned-by-ordinary-clicks
      - f:the-npc-scripting-component-is-pre-release
  - id: d-ipgh0g2d
    title: one entity identifier per preset, over one shared set of components
    statement: |
      every actor carries the same behavior-pack components, and each preset has its own entity
      identifier and its own client entity definition. the identifiers the library names and the
      entity definitions the assets pack holds are produced from one preset registry, so the two
      cannot come to disagree.
    status: proposed
    pinned:
      reason: public-api
      notes: an actor's identifier is visible in a world — in a target selector, and in what the server
        logs about the entity
    scope:
      - library
      - assets-pack
    because:
      - r-lna5xlfe
      - d-6jlj0rl2
      - f:a-client-entity-definition-is-keyed-by-the-entity-identifier
  - id: d-w0smdozf
    title: what the shared actor components establish
    statement: |
      an actor refuses damage from every cause rather than from a filtered set of them; it is
      summonable by identifier and has no spawn egg, so it never appears in the creative menu; it
      looks at a nearby player continuously rather than at the occasional-glance probability the
      look-at behaviour defaults to; and it carries no navigation and no behaviour goal other than
      looking. which components express these, and with what values, is the implementer's.
    status: proposed
    pinned:
      reason: other
      notes: what a player sees an actor do, and whether an actor can be placed from the creative menu at
        all
    scope: assets-pack
    because:
      - r-wqwub3zz
      - r-apu8m7vz
      - r-8ih6ab2r
      - f:damage-sensor-can-stop-received-damage-being-applied
      - f:behavior-look-at-player-rotates-the-head-toward-a-nearby-player
  - id: d-lyvjq8l1
    title: assets are vendored from a pinned revision and re-identified before they are committed
    statement: >
      every model, texture, animation, and animation controller an actor renders from is committed
      in

      the assets pack under this product's own identifiers and paths. what is taken from the game's

      own packs is taken from one pinned revision of `Mojang/bedrock-samples`, re-identified out of

      the vanilla identifier namespaces before it is committed, and refreshed only by a deliberate

      change to that pin. no vanilla identifier or path appears in a shipped client entity
      definition,

      render controller, or animation controller.
    status: proposed
    pinned:
      reason: other
      notes: an actor's appearance is what a player sees, and the re-identification is what stops it
        moving under a game update
    scope: assets-pack
    because:
      - r-pngblab3
      - f:mojang-publishes-the-vanilla-packs-with-all-rights-reserved-under-the-eula
      - f:a-resource-packs-internal-asset-names-are-global-to-the-pack-stack
  - id: d-3ggbl0kl
    title: the wizard preset is vendored from the evoker, without its material
    statement: |
      the wizard preset's appearance is vendored from the game's evoker — its geometry, its texture,
      and its animations — re-identified into this product's namespace. the evoker's material is the
      one thing not vendored: the preset names a stock entity material instead.
    status: proposed
    pinned:
      reason: other
      notes: the wizard's face, which a player meets directly and would notice changing
    scope: assets-pack
    because:
      - r-rpcudvbl
      - d-lyvjq8l1
      - f:the-evoker-client-entity-names-its-geometry-texture-material-and-animations
  - id: d-5lutr7ok
    title: the spawn call takes a preset name and returns a handle
    statement: |
      the library's spawn call takes the name of a preset, the place to put the actor, and options
      that may override the actor's default name; it returns a handle to the actor it created. the
      call's exact signature is not fixed here.
    status: proposed
    pinned:
      reason: public-api
      notes: the one call every adventure makes
    scope: library
    because:
      - r-lna5xlfe
      - d-knzip5zc
      - d-ipgh0g2d
  - id: d-xobjyw2e
    title: every entry point checks its actor's entity type is registered, and throws naming the pack
    statement: >
      every library entry point that acts on an actor checks first that the entity type its preset

      names is registered in the world, by looking the identifier up rather than by attempting the

      action and interpreting what comes back. where it is not registered the call throws an error

      this product defines, naming the preset, the identifier, and the pack that supplies it. the
      check

      is per call rather than once at startup, since a pack's presence is a property of the world
      the

      call is running against.
    status: proposed
    pinned:
      reason: public-api
      notes: the error an adventure's author meets, and the guarantee that no call half-succeeds
    scope: library
    because:
      - r-9owgd93o
      - d-ipgh0g2d
      - f:an-entity-type-can-be-looked-up-by-identifier-without-spawning
      - f:an-unsatisfiable-pack-dependency-is-not-enforced-at-load
      - f:an-entity-type-resolves-for-a-script-in-any-other-loaded-pack
  - id: d-bcybwddk
    title: the check covers the definitions only, and the library asserts nothing about appearance
    statement: >
      the check the library runs before acting has one rung: the entity type the preset names is

      registered in the world, or it is not, and where it is not the call throws naming the preset,
      the

      identifier, and the pack that supplies it.


      the library performs no runtime check of the resource pack and reports nothing about it. no

      counting of the world's pack stack, no inference from what an entity's dimensions read, and no

      error or success path that states or implies an actor will render. a call that succeeds means
      the

      actor exists and behaves; whether a player sees it is outside what the library observes or
      claims.
    status: proposed
    pinned:
      reason: public-api
      notes: what a successful call is evidence of, which is narrower than it looks and is what an
        adventure's author will otherwise assume
    scope: library
    because:
      - r-9owgd93o
      - d-xobjyw2e
      - f:the-active-client-pack-stack-is-countable-from-a-script
      - f:an-entitys-server-side-size-does-not-reflect-its-resource-pack
      - f:a-resource-pack-cannot-carry-anything-a-script-can-reach
  - id: d-hybkhum6
    title: an adventure's release archive bundles the assets pack, so an install is one file
    statement: >
      an adventure's release archive contains this product's packs alongside its own, so installing
      an

      adventure is installing one archive and nothing else. no separate installation of the assets
      pack is

      required, and several adventures installed together each carrying a copy is the expected state
      rather

      than a fault.
    status: proposed
    pinned:
      reason: other
      notes: what an operator installs, and how many pieces they must keep in step
    scope:
      - library
      - assets-pack
    because:
      - r-e8p2oto6
      - d-knzip5zc
      - f:duplicate-pack-copies-are-deduplicated-and-the-activation-pin-selects
      - f:release-archives-follow-pack-content
  - id: d-i8pjw2on
    title: every name the assets pack declares is namespaced by its major version
    statement: >
      the assets pack's uuid and every name it declares carry its major version: the actor entity

      identifiers, and each internal asset name too — geometry, texture paths, materials, render

      controllers, animations, and animation controllers. the library, bundled into an adventure,
      resolves

      its own calls through the same namespace.


      so two adventures built against the same major carry an identical pack, which a server
      deduplicates

      to one with no effect on either, and two adventures built against different majors carry packs
      that

      share no uuid and no name and coexist without contending. a world may hold one pack per major
      in use

      and no more.


      the namespace is exhaustive over name kinds rather than confined to the entity identifier,
      because a

      resource pack's internal names are resolved across the whole pack stack and not within their
      own

      pack. a partial namespace would let one adventure's actor render with another's geometry.
    status: proposed
    pinned:
      reason: public-api
      notes: every identifier an adventure names, and the property that two majors coexist — reversing it
        reintroduces version contention between adventures
    scope:
      - library
      - assets-pack
    because:
      - r-pop72yk6
      - r-6q7adtpo
      - d-hybkhum6
      - d-ipgh0g2d
      - f:duplicate-pack-copies-are-deduplicated-and-the-activation-pin-selects
      - f:a-client-entity-definition-is-keyed-by-the-entity-identifier
      - f:a-resource-packs-internal-asset-names-are-global-to-the-pack-stack
  - id: d-5f011w0o
    title: within a major the assets pack only adds, and the build refuses a release that removes
    statement: >
      within one major version the assets pack never withdraws or repurposes a name an adventure can

      reference: an actor entity identifier present in a release is present in every later release
      of that

      major, naming the same character. appearance may change freely — a texture, a model, a
      re-vendored

      animation — since none of that is a name an adventure holds.


      the build enforces it rather than the discipline: a release compares the set of actor
      identifiers it

      exposes against the previous release of the same major, and fails where any has disappeared or
      been

      renamed. a withdrawal is how a new major begins.
    status: proposed
    pinned:
      reason: other
      notes: it is what makes two adventures on one major safe to share a pack, so relaxing it silently
        reintroduces the failure the namespace was chosen to avoid
    scope: assets-pack
    because:
      - r-6q7adtpo
      - d-i8pjw2on
      - d-xobjyw2e
      - f:duplicate-pack-copies-are-deduplicated-and-the-activation-pin-selects
  - id: d-ny9lcyjg
    title: the assets pack declares only content whose names can be namespaced
    statement: >
      the assets pack confines itself to content kinds that name what they declare, so the
      major-version

      namespace can reach all of it: entity definitions, geometry, textures, materials, render
      controllers,

      animations, animation controllers, particles, fogs, and attachables.


      it declares nothing in the kinds a resource pack supplies as a whole file rather than as named
      entries —

      `blocks.json`, `sounds.json`, `biomes_client.json`, the `texts` translation files, and the
      `ui` tree. those

      hold no name to qualify, so two majors supplying one of them contend over the file itself and
      the namespace

      cannot separate them. an actor needs none of them.


      a preset that comes to need one of the excluded kinds is a change to this decision, not a
      detail of the

      preset.
    status: proposed
    pinned:
      reason: other
      notes: it bounds what the product can ever offer a preset, and relaxing it quietly reintroduces
        contention between majors that d-i8pjw2on cannot reach
    scope: assets-pack
    because:
      - r-pop72yk6
      - d-i8pjw2on
      - f:a-resource-packs-internal-asset-names-are-global-to-the-pack-stack
    commentary: >
      the exclusion is precautionary. that the named kinds collide by name is measured; that the

      whole-file kinds resolve by override or merge instead is read off how a resource pack supplies
      them and is

      not measured here. excluding them costs the product nothing it needs, so the cheaper posture
      is to stay out

      rather than to establish the behaviour first.
  - id: d-ro5pj8er
    title: pack pairing is enforced at build time, which is the only place identity is checkable
    statement: >
      the pairing of this product's two packs is established where identity can be checked at all:
      the

      release archive is verified to hold both of them at agreeing versions, and a build producing
      one

      without the other fails. this is the whole of the guarantee that an actor's appearance ships
      with

      its definitions — nothing at run time contributes to it, because nothing at run time can tell
      this

      product's resource pack from any other's.
    status: proposed
    pinned:
      reason: other
      notes: an actor whose appearance definition never arrives is invisible and cannot be found by
        pointing at it, so this build check is the only thing between an adventure and a character
        no player can perceive
    scope:
      - library
      - assets-pack
    because:
      - r-9owgd93o
      - d-bcybwddk
      - f:the-active-client-pack-stack-is-countable-from-a-script
      - f:what-a-client-renders-for-a-broken-appearance-definition
  - id: d-c0l4gwx2
    title: how an actor converses is deferred
    statement: >
      how an adventure holds a conversation with an actor — what the player is shown, where the
      words

      live, and who authors them — is deferred to a later increment of this product. the actors this

      increment defines are spawned, placed, named, looked at, and removed; they do not speak.
    status: deferred
    scope: library
