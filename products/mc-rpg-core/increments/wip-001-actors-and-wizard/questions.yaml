version: "1"
questions:
  - id: q-ac8gcffb
    question: >
      may an actor's client entity name a material the game ships? r-pngblab3 forbids an actor's
      appearance

      resolving to any "model, texture, animation, material, or identifier that the game ships" —
      material named

      explicitly — and d-3ggbl0kl has the wizard name a stock entity material rather than vendoring
      the evoker's.

      the two cannot both hold.


      it is a bind rather than a slip, and the reason is that a material cannot be vendored at all.
      every client

      entity must name a material: it is the render state a model and texture are drawn with, and
      the field is not

      optional. the names available are the engine's own — the evoker names `evoker`, and the
      general-purpose one

      is `entity_alphatest`. their definitions are not published: `Mojang/bedrock-samples` ships no
      `materials`

      directory and no `.material` file anywhere in the repository, so the source d-lyvjq8l1 vendors
      from does not

      carry them. naming something the game ships is therefore forced by the format, and r-pngblab3
      as written

      cannot be satisfied by any actor.


      the stability r-pngblab3 protects is also weakest here. it exists because a vanilla name can
      be renamed out

      from under a pack with no build failure — `geometry.evoker.v1.8` carries an engine-version
      suffix and the

      evoker is registered as `minecraft:evocation_illager`, so the hazard is real for geometry. a
      material name

      like `entity_alphatest` is a much older and flatter surface, and it is one string rather than
      the whole

      appearance.


      exempting materials from r-pngblab3 is what the survey's reading points to. amending owner
      fiat is not the

      agent's to do, so it is put here.
    answer: requirement
  - id: q-sf1l1ypo
    question: >
      how is d-xobjyw2e's check unit-tested, when r-hear6pun forbids the only doubles that would let
      it be?


      r-hear6pun, adopted from minecraft-addon@4, requires a pack's unit tests stand up
      `@minecraft/server` with

      `@twin-digital/minecraft-test-lib` "rather than a hand-rolled double or a module mock".
      d-xobjyw2e — pinned

      public-api, and the decision the product's failure behaviour rests on — turns on
      `EntityTypes.get` returning

      an entity type or `undefined`. The shared test lib cannot express either branch:


      - its README lists the eight registry classes under out-of-scope surfaces, "declared in full
      and throwing",
        and `src/generated/fakes/EntityTypes.ts` has `get()` throw `NotImplementedError`;
      - `createServer()` hands back the *same static* `FakeEntityTypes` for every bundle, so there
      is no
        per-bundle state a test could register a type into, and any test-time reassignment leaks into every other
        test file.

      So the registered branch cannot be arranged and the unregistered branch cannot be
      distinguished from the

      lib's own refusal. The three routes each cost something the fold does not authorise:


      - **take the registry through an injected seam** — changes the library's public surface, and a
      seam whose
        only purpose is the test arguably *is* the hand-rolled double r-hear6pun forbids;
      - **reassign the static in tests** — leaks across bundles, and reads as the forbidden double;

      - **have mc-test-lib model entity-type registration** — the honest fix, and a change in
      another product's
        package that this increment cannot make.

      The call is which of those the product takes, or whether this product carries a declared
      exception to

      r-hear6pun for the registry surface. Amending an adopted preset requirement, or exempting a
      product from

      one, is owner fiat.
    answer: requirement
