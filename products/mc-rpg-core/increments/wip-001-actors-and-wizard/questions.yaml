version: "1"
questions:
  - id: q-cam2g9om
    question: |
      does an entity type defined in one behavior pack resolve for a script running in a different
      behavior pack that declares a manifest dependency on it? the whole shape of this increment —
      an assets pack holding the entity definitions and adventures holding none — rests on the
      answer being yes, and nothing in the facts pool carries it. one spike on the dev server
      settles it: two packs, the entity defined in the first, spawned by identifier from the
      second's script, with and without the manifest dependency declared.
    answer: fact
    facets: [library, assets-pack]

  - id: q-abwhpdno
    question: |
      can a script module in one behavior pack import a module from another behavior pack? no
      first-party source found describes any resolution beyond the `@minecraft/` modules a manifest
      declares and paths inside the pack itself, which is why this increment sends the library to an
      adventure through npm and bundles it in. if cross-pack import does resolve, sharing the
      library at run time becomes an alternative to bundling a copy into every adventure, and the
      route the product takes is worth re-ruling. answerable in the same spike as
      [q-cam2g9om].
    answer: fact
    facets: library
