version: "1"
questions:
  - id: q-ac8gcffb
    question: >
      may an actor's client entity name a material the game ships? r-pngblab3 forbids an actor's
      appearance

      resolving to any "model, texture, animation, material, or identifier that the game ships", and

      d-3ggbl0kl requires the wizard to name a stock entity material. the two cannot both hold.


      it is a bind rather than a slip. materials are supplied by `materials/*.material`, a
      whole-file kind

      d-ny9lcyjg bars the pack from declaring in, so a custom material cannot be namespaced — while
      every

      client entity must name some material. naming a vanilla one is forced by the format.


      the stability r-pngblab3 protects is also weakest here: a stock material name such as

      `entity_alphatest` has outlived many identifier renames, unlike `geometry.evoker.v1.8`.
      exempting

      materials from r-pngblab3 is the resolution the survey's reading points to, but amending owner
      fiat is

      not the agent's to do.
    answer: requirement
