version: "1"
questions:
  - id: q-sf1l1ypo
    question: >
      how is d-xobjyw2e's check unit-tested, when r-hear6pun forbids the only doubles that would let
      it be?


      r-hear6pun, adopted from minecraft-addon@4, requires a pack's unit tests stand up
      `@minecraft/server` with

      `@twin-digital/minecraft-test-lib` "rather than a hand-rolled double or a module mock".
      d-xobjyw2e — pinned

      public-api, and the decision the product's failure behaviour rests on — turns on
      `EntityTypes.get` returning

      an entity type or `undefined`. The shared test lib cannot express either branch: its registry
      classes are

      declared and throw, and `createServer()` hands every bundle the same static fake, so there is
      no per-bundle

      state to register a type into and any reassignment leaks across test files.


      Of the three routes — an injected seam in the library's public surface, reassigning the
      static, or the shared

      lib modelling registration — the third is the only one that does not read as the double
      r-hear6pun forbids,

      and it is a change in another product.


      **the answer is in flight.** mc-test-lib's increment 007 takes it up: registration becomes a
      free function

      against a registry that starts empty, and the registry belongs to the bundle rather than a
      static, so both

      branches are arrangeable and nothing leaks. That draft states it closes this question on the
      third route,

      with no exception to r-hear6pun and no change to this product's public surface.


      So this question is not a choice left to make. It is removed when mc-test-lib 007 publishes
      and the shared

      lib carries the capability — which is also why this draft lands after that one.
    answer: requirement
