version: "1"

# Companion increment of the implementation targeting increment 004: the choices the build
# meets that the fold hands on — d-ksotjt7v first among them — or leaves open, recorded as
# they arise.
decisions:

  - id: d-ysxt6ihr
    title: the bindings are module-scope live exports
    statement: |
      `world` and `system` are live ESM exports of one module inside the package, reassigned
      wholesale by `__useServer`. While unset each is a function-target Proxy whose every trap
      throws ShimNotInstalledError. They are not fixed-identity Proxies over a store outside the
      module registry, so `server.world === world` answers true, `typeof world` reads `object`
      once installed, and `JSON.stringify(world)` works. A test file that both statically imports
      `world` and calls `loadPack` reads the pre-reset binding, which is the case loadPack's own
      return value answers
    status: delegated
    pinned:
      reason: other
      notes: consumer-visible identity and isolation behaviour — a fake's `===` against the bound singleton
    because:
      - d-ksotjt7v
      - r-rpm1k57j
      - d-gjzbiyl6
      - d-uj5gbt9w
      - d-ahlsuc8z
      - f:a-globalthis-store-survives-a-module-registry-reset
      - f:a-stable-proxy-binding-costs-identity-and-json-not-member-access
      - f:a-proxy-over-a-function-target-is-typeof-function
    facets:
      - shim

  - id: d-nb2ms40b
    title: the surface exports the library's error classes, one class object per name
    statement: |
      where the pinned declarations declare an error class the library also hand-writes, the
      aliased surface exports the library's class rather than a second class of the same name;
      `InvalidEntityError` is that case. Every other Error-ancestry class the declarations export
      is emitted as a real Error subclass setting its own name. `ArgumentOutOfBoundsError` and
      `InvalidArgumentError` are `@minecraft/common`'s and are not re-exported by
      `@minecraft/server`, so they stay library-only names that no surface class shadows
    status: delegated
    pinned:
      reason: public-api
      notes: a pack's `catch (e) { e instanceof InvalidEntityError }` splits across two class objects if this is answered the other way
    because:
      - d-ksotjt7v
      - d-9r5i9qog
      - d-d8m2q6iz
      - r-956kxrsc
    facets:
      - fakes
      - shim

  - id: d-639zdanq
    title: the fakes carry the declarations' class hierarchy on their prototype chains
    statement: |
      each generated fake's prototype is spliced onto its declared base's prototype where the base
      is also faked, so `player instanceof Entity` and `healthComponent instanceof
      EntityComponent` answer as the engine's do rather than only `instanceof Player` and
      `instanceof EntityHealthComponent`. `Component` joins the faked set so the component chain
      is complete. The classes stay flat — every member is written out on every class — so the
      splice adds a chain, not a lookup path
    status: delegated
    pinned:
      reason: other
      notes: consumer-observable through `instanceof`, and a reimplementation must preserve it
    because:
      - d-ksotjt7v
      - r-956kxrsc
      - r-0lbj68w9
      - d-tzww1yuv
      - f:entity-shape-is-identical-valid-or-invalid
    facets:
      - fakes
      - shim

  - id: d-mnmi8k8p
    title: an unimplemented surface class is a named class whose constructor throws
    statement: |
      a class the pinned declarations export that the fakes do not implement is exported as a real
      named class carrying no members, whose constructor throws NotImplementedError naming the
      class. `instanceof` against it answers false for everything, and a construction fails loudly
      rather than handing back a shape whose every read is undefined
    status: delegated
    because:
      - d-ksotjt7v
      - d-fd8y6nwv
      - d-qz2aoixe
      - r-62r76czb
    facets:
      - shim

  - id: d-1ykf2oxs
    title: sibling stubs are generated from each module's own declarations
    statement: |
      a `@minecraft/*` sibling stub is generated by the same pass as the aliased surface, from
      that package's own declarations: every declared enum as a frozen object, every
      Error-ancestry class as a real Error subclass naming itself, every other class as a
      constructor that throws NotImplementedError, and every module-level object constant as a
      Proxy whose every read throws NotImplementedError naming the member. The stubbed module list
      is one array in the generator
    status: delegated
    because:
      - d-ksotjt7v
      - r-w2ud6qa9
      - r-8r8gf6b7
      - d-bvhynmr8
    facets:
      - shim

  - id: d-7fcqi5b7
    title: sibling modules take their own stable pin
    statement: |
      a stubbed sibling module is pinned at its own stable line rather than at the
      `@minecraft/server` pin, and the generated stub's header states the version it was derived
      from. `@minecraft/server-ui` is pinned at 2.1.0, whose declarations peer-declare
      `@minecraft/server` ^2.0.0 and so admit the 2.8.0 the fakes take
    status: delegated
    because:
      - d-1ykf2oxs
      - r-29dlrp9r
      - r-6oj56on1
    facets:
      - shim

  - id: d-u52w8eim
    title: currentServer reaches the setup-installed server
    statement: |
      the root barrel exports `currentServer(): FakeServer`, returning the bundle the bindings
      point at and throwing ShimNotInstalledError when they are unset. It is how a test on the
      default static-import path reaches the bundle the free functions take
    status: delegated
    pinned:
      reason: public-api
    because:
      - d-ksotjt7v
      - d-03cbb3td
      - d-gjzbiyl6
      - d-ksk6d7ua
    facets:
      - shim

  - id: d-b2txf5mv
    title: the root barrel carries __useServer
    statement: |
      `__useServer` and `currentServer` are exported from the root barrel, so a consumer
      installing fakes of their own never depends on a test framework. Only `loadPack` and the
      plugin sit behind the `/vitest` subpath, which stays the one entry that reaches `vi`
    status: delegated
    pinned:
      reason: public-api
    because:
      - d-ksotjt7v
      - d-bvhynmr8
      - d-c9mjn8o5
      - r-2trs9aai
    facets:
      - shim

  - id: d-kxlf8c66
    title: fakes are recognised across module generations
    statement: |
      a fake carries its state under a key that is stable across module instances of the library,
      so a free function reached through one instance recognises a fake built by another. A
      module-private key would not: the plugin's alias target resolves by absolute path and the
      package barrel by bare specifier, which a runner may evaluate as distinct instances, and a
      module-registry reset makes that routine
    status: delegated
    pinned:
      reason: other
      notes: >
        without it `advanceTicks(await loadPack(...))` throws on a fake the library itself built;
        a reimplementation must preserve the property, whatever key it uses
    because:
      - d-c9mjn8o5
      - d-2mngzzpg
      - d-tzww1yuv
      - f:alias-and-control-subpath-are-one-module-instance
    facets:
      - fakes
      - shim

  - id: d-eknfn88y
    title: the derived version is SERVER_VERSION on the root barrel
    statement: |
      the exported version string is `SERVER_VERSION`, on the root barrel rather than on the
      aliased surface, whose export set stays exactly the declared one
    status: proposed
    pinned:
      reason: public-api
    because:
      - d-wygo3zhy
      - d-v6pg1wph
    facets:
      - shim

  - id: d-6c8ghlp2
    title: the one runner-config entry is minecraftTestLib()
    statement: |
      the plugin is `minecraftTestLib()`, a named export of the `/vitest` subpath, installed as
      `plugins: [minecraftTestLib()]`. Its config hook contributes anchored regex alias entries —
      so `@minecraft/server-ui` is not caught by the `@minecraft/server` entry, as a plain string
      key would prefix-match — plus one setupFiles entry, both absolute resolved paths inside the
      package
    status: proposed
    pinned:
      reason: public-api
    because:
      - r-uobnqsfg
      - d-bvhynmr8
      - f:a-vite-plugin-contributes-an-alias-and-a-setup-file
      - f:setup-files-resolve-as-modules-from-the-project-root
    facets:
      - shim

  - id: d-t0q6wnfs
    title: loadPack's options carry a server only
    statement: |
      `LoadPackOptions` is `{ server?: FakeServer }` — the case a server that must differ before
      the pack evaluates. Everything else about the load loadPack fixes itself
    status: proposed
    pinned:
      reason: public-api
    because:
      - d-c9mjn8o5
      - d-fa9h5y34
    facets:
      - shim

  - id: d-yv1yensc
    title: vitest is an optional peer dependency
    statement: |
      the package declares `vitest` as an optional peer dependency and carries no runtime
      dependency. Nothing outside the `/vitest` entry's own source imports a test framework, so a
      consumer who installs no runner tooling resolves the package without a warning
    status: proposed
    pinned:
      reason: other
      notes: consumer-visible install behaviour
    because:
      - r-2trs9aai
      - d-c9mjn8o5
      - d-vjeple9k
    facets:
      - shim
