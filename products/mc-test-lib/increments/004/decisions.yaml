version: "1"

# The probe-cycle rulings from the owner-run mctest8 sets (arity-expiry-and-filter-probe-run):
# each entry replaces an inherited decision the runs settled or the shipped package raised, and
# enters proposed for the owner's ratification. Numbered 004 because the open shim-facet PR
# claims 003; whichever of the two merges first renumbers down to 003 for density.
decisions:
  - id: d-b9j2z2ks
    title: generated members check both arity bounds before the guard
    statement: |
      each generated member opens with a check on both bounds — at least its declared required
      parameter count and at most its declared parameter count — throwing the engine's TypeError
      before the validity guard prologue runs, in the engine's own single message shape for either
      direction (`f:surplus-arguments-are-rejected`, `f:arity-checked-before-validity-guard`)
    status: proposed
    supersedes: d-nw4v0fag
    because:
      - f:surplus-arguments-are-rejected
      - f:arity-checked-before-validity-guard
    revisit_when:
      - a member accepts more arguments at runtime than its declaration lists — a rest parameter, or a
        trailing option the declarations do not carry — so a maximum read off the declarations rejects
        calls the engine allows, which is the direction that fails a test the engine would pass
      - the engine's minimum turns out not to be the declared required-parameter count — a member
        accepting fewer arguments at runtime than its signature requires — so a manifest read off the
        declarations rejects calls the engine allows
      - the check costs more than it buys, no pack calling a member with too few arguments on
        purpose, so the branch sits in front of all 1010 members to serve a case tests do not write
    facets: fakes

  - id: d-z49lg2ft
    title: subscribe options filter on the raised signals
    statement: |
      an options argument to subscribe filters delivery on the five raised signals that declare one,
      honouring every field they carry — entities as an instance filter, entityTypes against the
      subject entity's prefixed typeId with no normalisation, allowedDamageCauses, and entityFilter
      through the same six-field matcher entity lookups run — intersecting where two are given, as the
      engine was observed to (`f:subscribe-filter-fields-intersect`,
      `f:subscribe-filter-entity-types-requires-the-prefix`). Any other field, and any options
      argument on a signal the fakes do not raise, throws NotImplementedError naming the field at the
      subscribe call rather than at dispatch
    status: proposed
    supersedes: d-41hmcpd4
    because:
      - f:subscribe-filter-fields-intersect
      - f:subscribe-filter-entity-types-requires-the-prefix
    revisit_when:
      - packs subscribe with a block, item or container filter on the same install path a test drives,
        so the throw at subscription blocks tests that never meant to exercise that handler — a cost a
        dropped filter would not have carried on a signal the fake raises nothing for anyway
      - the subject entity differs on one of the three signals the probe did not reach —
        entityHealthChanged, entityRemove or the entityHurt before-event — so the reading taken from
        entityHurt and entityDie does not generalize across the five
      - a later version starts assuming the namespace on the filter, so matching the prefixed form
        exactly rejects a bare id the engine would by then honour
    facets: fakes

  - id: d-n1au8e2s
    title: effect expiry matches the observed boundary
    statement: |
      the library removes an effect on the tick its decaying duration reaches 0 — never readable at 0,
      getEffect undefined, absent from getEffects, the handle left as removeEffect leaves one — which
      is the boundary the engine was measured at (`f:effect-expiry-boundary-observed`). It dispatches
      nothing on the way, 2.8.0 declaring no effect-remove or effect-expire signal
    status: proposed
    supersedes: d-94hinqww
    because:
      - f:effect-expiry-boundary-observed
    revisit_when:
      - the boundary proves duration-dependent, the three short durations measured landing where a
        long one does not, so a rule read off 3, 5 and 8 misses the case a pack actually applies
      - the engine raises something on expiry that a later version's declarations expose, so silent
        removal misses an event a handler depends on
      - a version bump moves the boundary a tick, so the fake and the engine disagree on the last tick
        an effect is readable and every test asserting on it reads the wrong side
    facets: fakes

  - id: d-7wwr2xtp
    title: before-event field writes are honoured, the duration write as the engine treats it
    statement: |
      a handler's write to entityHurt.damage or effectAdd.duration changes what the action does and
      what its after-event reports — the duration write as the engine treats it
      (`f:handler-written-effect-duration-is-validated-separately`), which is not how addEffect
      validates its own argument: truncated toward zero, dropped entirely at or below zero so that
      addEffect returns undefined and nothing is attached, and clamped to 20000000 above the maximum,
      with the setter itself throwing the engine's TypeError on NaN and Infinity and leaving the
      requested duration in place. The other four mutable before-event fields are writable and
      unread, because the fake raises no action that would consume them
    status: proposed
    supersedes: d-ka348xdn
    because:
      - f:handler-written-effect-duration-is-validated-separately
    revisit_when:
      - a modelled action grows behind one of the other four fields — healing or weather — so
        "writable and unread" becomes a silent wrong answer rather than an honest gap
      - honouring the write while applyDamage's boolean is settled from the requested amount reads
        as a contradiction to test authors, who see true returned for a handler-written zero
      - the clamp proves not to cover the whole band above the maximum, some value between 20000001
        and 100000000 behaving differently from both, so a single clamp rule is wider than the two
        points it was read from
      - a handler's throw on the NaN setter, absorbed by handler isolation, leaves test authors
        unable to tell a rejected write from a write that never ran, where a fake refusing the add
        outright would have failed loudly
      - the split between the two validation paths closes in a later version — the field write coming
        to reject what the argument rejects — so reproducing today's asymmetry becomes the deviation
    facets: fakes
