version: "1"

questions:
  - id: q-2rr36skd
    question: |
      Does the merged package stay ESM-only, or must the shim's module surface and runner tooling
      also support CJS consumers? The owner's July ruling that the shim's writer designs for CJS
      consumers too predates merging the shim into `@twin-digital/minecraft-test-lib`, which the
      adopted nodejs-library@1 preset binds to shipping as ESM only — the two cannot both hold
      without a ruling.
    answer: requirement
    facets: shim

  - id: q-mzfp1udy
    question: |
      What does the one-entry install owe a pack that imports `@minecraft/server-ui`? Every probe
      run needed a consumer-written stub alias for that import — a second module the supplied
      surface does not cover — so such a pack meets `r-uobnqsfg` (one runner-config entry, no
      consumer setup) and `r-vzz9rnrc` (unmodified pack code loads) only if the package grows a
      `server-ui` surface, which is scope nothing has ruled, or the requirements carve the second
      module out and the stub-alias workaround is documented.
    answer: requirement
    facets: shim
