version: "1"

decisions:
  - id: d-c1awo33f
    title: the root entry point is the fakes' barrel
    statement: |
      the package's root entry point re-exports every fake type and free function, and the entry
      points carrying the aliased module surface and the runner tooling are this increment's
      design to lay out
    status: delegated
    because:
      - r-3dgnq0sp
      - r-qklf4op9
    revisit_when:
      - the library's own parts come to import each other through the root barrel, and the cycle
        that creates cannot be broken without a subpath export a builder can import directly
      - a sibling package must depend on the error classes at a version cadence independent of the
        fakes, which one entry point in one package cannot express
      - this increment's layout needs the fakes reachable from somewhere other than the root, so
        the two halves of the package cannot both be laid out as this says
    supersedes: d-19qu2ih2
    facets:
      - fakes
      - shim

  - id: d-bslnaeg6
    title: the default path is boilerplate-free with per-test isolation
    statement: |
      with the one runner-config entry in place and nothing else, a consumer's test file holds
      static imports alone — the pack imported for its side effects, `world` and `system` imported
      to arrange and assert — with no install call, no reset prelude, and no ordering the consumer
      hand-writes. Each test starts against a fresh world with the pack's module-scope
      subscriptions and scheduled runs still live. A test that wants fakes of its own installs
      them in place of the default without failing; the loud failure the July ruling kept guards
      a duplicate tooling install within one module-registry generation
    status: rejected
    rejection_reason: |
      dynamic import and module reset is the accepted pattern in test libraries for this case;
      the fake library is not shipping a reset
    pinned:
      reason: other
      notes: consumer-visible ergonomics contract — the documented default path and its per-test isolation behaviour
    because:
      - r-uobnqsfg
      - r-vzz9rnrc
      - r-rpm1k57j
      - r-qayd22z2
      - f:a-setup-file-server-makes-a-pack-test-file-boilerplate-free
      - f:one-server-per-file-carries-state-into-the-next-test
      - f:pack-isolation-comes-from-under-the-fakes-not-from-the-shim
      - f:a-fake-server-can-be-cleared-in-place-with-its-subscriptions-intact
      - f:test-lib-ships-no-reset-hook
    facets:
      - fakes
      - shim

  - id: d-2mngzzpg
    title: per-test isolation is module reset and dynamic import
    statement: |
      a test that needs a fresh world resets the module registry and dynamically imports the
      pack and the surface it asserts through — the accepted test-library pattern — and the
      package ships no reset of any kind, public or internal. A second install within one
      module-registry generation fails loudly
    status: accepted
    pinned:
      reason: other
      notes: consumer-visible isolation contract and misuse behaviour
    because:
      - r-rpm1k57j
      - r-qayd22z2
    supersedes: d-bslnaeg6
    facets:
      - fakes
      - shim

  - id: d-vjeple9k
    title: the version statement is inert
    statement: |
      the package states the `@minecraft/server` version its supplied values derive from, where a
      consumer reads it, and nothing checks a consumer's own engine pin against it: the package
      carries no runtime dependencies and no `@minecraft/server` peer range, and no check at
      configuration or run time warns or fails on a mismatch
    status: proposed
    pinned:
      reason: other
      notes: consumer-visible install behaviour — a consumer on a different engine pin never has an install or a run fail over it
    because:
      - r-29dlrp9r
      - r-uobnqsfg
      - f:an-unsatisfiable-peer-range-fails-npm-and-warns-pnpm-and-yarn
    supersedes: d-c5odl61n
    facets: shim

  - id: d-bvhynmr8
    title: exports are the root barrel plus one runner-tooling subpath
    statement: |
      the package's published exports are the root barrel and one subpath per supported runner's
      tooling — vitest, the one runner supported at this increment, at
      `@twin-digital/minecraft-test-lib/vitest` — and nothing else: the aliased
      `@minecraft/server` surface and the sibling-module stubs are files inside the package the
      plugin references by resolved path, not published subpaths
    status: proposed
    pinned:
      reason: public-api
    because:
      - d-c1awo33f
      - r-3dgnq0sp
      - r-uobnqsfg
      - f:a-vite-plugin-contributes-an-alias-and-a-setup-file
      - f:setup-files-resolve-as-modules-from-the-project-root
      - f:alias-and-control-subpath-are-one-module-instance
    facets:
      - fakes
      - shim

  - id: d-gjzbiyl6
    title: the bundle is the fakes API's route, not the only one
    statement: |
      createServer returns one bundle whose properties are named as `@minecraft/server` exports
      them — world, system, and the eight registry classes — and that bundle is the fakes API's
      route to them; code reaching the engine through the module import reaches the same objects
      by the surface the package supplies
    status: proposed
    because:
      - r-qklf4op9
      - r-rpm1k57j
    supersedes: d-nmjafny2
    facets:
      - fakes
      - shim

  - id: d-ksotjt7v
    title: surface details handed to the implementation
    statement: |
      handed to the implementation's companion increment: the placeholder behaviour of
      module-surface classes the fakes do not implement; the failure mode of reading `world` or
      `system` before any install; the install function's name and signature, amending the
      free-function list; the `world`/`system` binding mechanism within what the ruled isolation
      shape fixes; and the sibling-module stubs' surface and behaviour
    status: delegated
    because:
      - d-2mngzzpg
      - r-w2ud6qa9
      - d-ksk6d7ua
      - d-qz2aoixe
    facets:
      - fakes
      - shim
