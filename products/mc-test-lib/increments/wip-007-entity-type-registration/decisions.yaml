version: "1"

# d-duelxt32's first revisit condition fired: mc-rpg-core's d-xobjyw2e puts `EntityTypes.get` on
# every library entry point, so the throwing registry blocks the test rather than sitting in
# startup code no test enters. Only EntityTypes is reopened; the other seven registries keep the
# ruling.
decisions:

  - id: d-uky2xju6
    title: EntityTypes behaves; the other seven registries throw
    statement: |
      `EntityTypes.get` and `getAll` read a registry the test arranges. The other seven registry
      classes stay declared with every member throwing NotImplementedError. The engine's refusal to
      answer a registry read during early execution is not modelled: the fakes have no early phase,
      and a lookup answers whenever a test makes it.
    status: proposed
    pinned:
      reason: public-api
    because:
      - f:entity-type-registry-refuses-early-execution
      - r-0lbj68w9
    supersedes: d-duelxt32
    revisit_when:
      - a pack resolves an id through one of the other seven on the path its test exercises, so that
        registry blocks the test the way this one did
      - a pack ships startup code relying on the engine's refusal — a catch around the lookup, or a
        deferral to world load — which no test can exercise while the early phase is unmodelled
    facets: fakes

  - id: d-herh9vjy
    title: the registry belongs to the bundle
    statement: |
      `createServer()` returns an `EntityTypes` bound to that bundle's own registry, so two bundles
      in one process share nothing and a test needs no reset hook. The aliased surface's
      module-scope `EntityTypes` is a third binding beside `world` and `system`, moving with them on
      install and throwing ShimNotInstalledError while unset. No registry state lives at module
      scope.
    status: proposed
    pinned:
      reason: public-api
      notes: |
        `server.EntityTypes` is per-bundle rather than the one shared class object every bundle
        holds today, so a consumer comparing the two across bundles reads a different answer.
    because:
      - r-qayd22z2
      - r-rpm1k57j
      - d-nmjafny2
      - d-ysxt6ihr
      - d-uj5gbt9w
    revisit_when:
      - the aliased surface's `EntityTypes` is required to satisfy `typeof MC.EntityTypes` in a way
        a per-bundle object cannot, so only one shared class object typechecks
    facets:
      - fakes
      - shim

  - id: d-fhq1ng5m
    title: registration is a free function and the registry starts empty
    statement: |
      A bundle's registry starts empty, and a test fills it through an exported free function over
      the bundle rather than through a member `@minecraft/server` does not declare. Both branches
      are arrangeable from the start: a registered type, and a lookup that misses. `getAll` reports
      in registration order.
    status: proposed
    pinned:
      reason: public-api
    because:
      - r-5mlc26io
      - r-qak2scbs
      - r-rnnnz98l
    revisit_when:
      - nearly every suite opens by registering the same vanilla set, so the empty start costs more
        preamble than the arranged miss is worth — the point at which a preset, or a package built
        on this one, carries the vanilla registry instead
    facets: fakes

  - id: d-0m25p71q
    title: lookup reproduces the engine, misses included
    statement: |
      A lookup reproduces the engine's recorded behaviour: a miss returns `undefined` rather than
      throwing or fabricating, a bare identifier means `minecraft:<id>` and nothing else, and
      matching is otherwise exact. The arity and argument-type guards are the engine's.
    status: proposed
    pinned:
      reason: public-api
    because:
      - f:entity-type-lookup-misses-return-undefined
      - f:entity-type-bare-id-means-the-minecraft-namespace
      - f:entity-type-entries-are-stable-objects
      - f:entity-type-registry-holds-pack-defined-types
      - f:entity-type-lookup-argument-guards
      - r-0lbj68w9
      - r-62r76czb
      - r-v1r7n10i
    revisit_when:
      - a later observation shows the bare form searching namespaces rather than assuming
        `minecraft:`, so a pack-defined type does answer to its bare name
    facets: fakes

  - id: d-dub2g4kr
    title: creating an entity consults the registry
    statement: |
      Creating a fake entity resolves its type through the bundle's registry and throws
      InvalidArgumentError naming the identifier where nothing registers it, as the engine does.
      The registry starts empty, so a test arranges the types it creates — through a preset for the
      vanilla set, and by registration for a pack's own.
    status: proposed
    pinned:
      reason: other
      notes: |
        A consumer-visible behaviour rather than a surface: a suite creating an entity of a type it
        never registered is refused.
    because:
      - f:entity-type-lookup-agrees-with-spawnability
      - f:entity-type-lookup-argument-guards
      - d-1g2k3g56
      - r-0lbj68w9
      - r-62r76czb
    revisit_when:
      - arranging the registry costs more preamble than the misspelt-identifier bug it catches is
        worth, the vanilla preset having stopped covering what tests create
      - a pack legitimately creates entities of types no world registers, so agreeing with the
        engine here refuses a test the engine would not
    facets: fakes

  - id: d-m6ryo7ea
    title: localizationKey is registered or throws
    statement: |
      An `EntityType` carries `id` and `localizationKey` and nothing else. `localizationKey` reads
      back the key the test registered, and throws UnsetValueError where none was registered — so it
      is an accessor where the engine's is an own value property, a divergence stated with the rest.
    status: proposed
    pinned:
      reason: public-api
    because:
      - f:entity-type-carries-id-and-localization-key
      - r-62r76czb
      - r-ovyzy5ey
      - d-dk3rf1w8
    revisit_when:
      - a rule is found that reproduces the engine's key for vanilla and pack-defined types alike,
        so the throw obstructs tests that never touch the field
    facets: fakes

  # raised by the survey of the draft fold: choices the build meets that the six above left open
  - id: d-gr7gky6j
    title: registerEntityType takes an id and an optional key, and refuses a duplicate
    statement: |
      `registerEntityType(server, id, localizationKey?)` registers one type and returns it. The id
      normalizes on entry and is stored and reported in the canonical prefixed form. Registering an
      id already registered throws rather than replacing the entry, which would strand an
      `EntityType` a test already holds.
    status: proposed
    pinned:
      reason: public-api
    because:
      - d-fhq1ng5m
      - f:entity-type-entries-are-stable-objects
      - r-v1r7n10i
      - r-62r76czb
    revisit_when:
      - suites come to re-register deliberately — building a type up across a shared fixture and a
        test — so the refusal obstructs the arrangement rather than catching a mistake
    facets: fakes

  - id: d-5noauehh
    title: spawnEntity takes an EntityType; createEntity stays string-only
    statement: |
      `Dimension.spawnEntity` accepts an `EntityType` wherever it accepts an id, reading the type's
      `id` and nothing else. `createEntity` continues to take a `typeId` string.
    status: proposed
    pinned:
      reason: public-api
    because:
      - d-dub2g4kr
      - d-fhq1ng5m
      - r-nmkxdrga
      - r-5mlc26io
    revisit_when:
      - tests routinely convert an `EntityType` back to a string to reach `createEntity`, so the
        narrower control-plane signature costs more than the symmetry is worth
    facets: fakes

  - id: d-1g2k3g56
    title: four presets ship, and the vanilla pair composes into one call
    statement: |
      Four presets ship: `withVanillaDimensions`, `withVanillaEntityTypes`, `withVanillaWorld` —
      which supplies those two and nothing else — and `asSpawnedEntity`, which is per-entity and
      stands outside the composite. The vanilla entity-type ids come from `@minecraft/vanilla-data`
      rather than hand-authored. Widening the composite is a supersession of this decision.
    status: proposed
    pinned:
      reason: public-api
      notes: |
        The composite's membership is fixed here so it cannot widen silently into the implicit
        defaults r-qak2scbs forbids.
    supersedes: d-fkbx974k
    because:
      - r-b92y0kb7
      - r-qak2scbs
      - f:entity-type-registry-holds-pack-defined-types
    revisit_when:
      - a third server-scoped vanilla preset ships and the composite's fixed membership makes every
        consumer opt into it by name, so the composite saves nothing
    facets: fakes
