version: "1"

# d-duelxt32's first revisit condition fired: mc-rpg-core's d-xobjyw2e puts `EntityTypes.get` on
# every library entry point, so the throwing registry blocks the test rather than sitting in
# startup code no test enters. Only EntityTypes is reopened; the other seven registries keep the
# ruling.
decisions:

  - id: d-uky2xju6
    title: EntityTypes behaves; the other seven registries throw
    statement: |
      `EntityTypes.get` and `getAll` read a registry the test arranges. The other seven registry
      classes stay declared with every member throwing NotImplementedError. The engine's refusal to
      answer a registry read during early execution is not modelled: the fakes have no early phase,
      and a lookup answers whenever a test makes it.
    status: accepted
    pinned:
      reason: public-api
    because:
      - f:entity-type-registry-refuses-early-execution
      - r-0lbj68w9
    supersedes: d-duelxt32
    revisit_when:
      - a pack resolves an id through one of the other seven on the path its test exercises, so that
        registry blocks the test the way this one did
      - a pack ships startup code relying on the engine's refusal — a catch around the lookup, or a
        deferral to world load — which no test can exercise while the early phase is unmodelled
    facets: fakes

  - id: d-herh9vjy
    title: the registry belongs to the server
    statement: |
      `createServer()` returns an `EntityTypes` bound to that server's own registry, so two servers
      in one process share nothing and a test needs no reset hook. The aliased surface's
      module-scope `EntityTypes` is a third binding beside `world` and `system`, moving with them on
      install and throwing ShimNotInstalledError while unset. No registry state lives at module
      scope.
    status: accepted
    pinned:
      reason: public-api
      notes: |
        `server.EntityTypes` is per-server rather than the one shared class object every server
        holds today, so a consumer comparing the two across servers reads a different answer.
    because:
      - r-qayd22z2
      - r-rpm1k57j
      - d-4009wvxs
      - d-ysxt6ihr
      - d-uj5gbt9w
    revisit_when:
      - the aliased surface's `EntityTypes` is required to satisfy `typeof MC.EntityTypes` in a way
        a per-server object cannot, so only one shared class object typechecks
    facets:
      - fakes
      - shim

  - id: d-fhq1ng5m
    title: registration is a free function and the registry starts empty
    statement: |
      A server's registry starts empty, and a test fills it through an exported free function over
      the server rather than through a member `@minecraft/server` does not declare. Both branches
      are arrangeable from the start: a registered type, and a lookup that misses. `getAll` reports
      in registration order.
    status: accepted
    pinned:
      reason: public-api
    because:
      - r-5mlc26io
      - r-qak2scbs
      - r-rnnnz98l
    revisit_when:
      - nearly every suite opens by registering the same vanilla set, so the empty start costs more
        preamble than the arranged miss is worth — the point at which a preset, or a package built
        on this one, carries the vanilla registry instead
    facets: fakes

  - id: d-0m25p71q
    title: lookup reproduces the engine, misses included
    statement: |
      A lookup reproduces the engine's recorded behaviour: a miss returns `undefined` rather than
      throwing or fabricating, a bare identifier means `minecraft:<id>` and nothing else, and
      matching is otherwise exact. The arity and argument-type guards are the engine's.
    status: accepted
    pinned:
      reason: public-api
    because:
      - f:entity-type-lookup-misses-return-undefined
      - f:entity-type-bare-id-means-the-minecraft-namespace
      - f:entity-type-entries-are-stable-objects
      - f:entity-type-registry-holds-pack-defined-types
      - f:entity-type-lookup-argument-guards
      - r-0lbj68w9
      - r-62r76czb
      - r-v1r7n10i
    revisit_when:
      - a later observation shows the bare form searching namespaces rather than assuming
        `minecraft:`, so a pack-defined type does answer to its bare name
    facets: fakes

  - id: d-dub2g4kr
    title: the registry gates spawning, not the control plane
    statement: |
      `Dimension.spawnEntity` resolves its type through the server's registry and throws
      InvalidArgumentError naming the identifier where nothing registers it, as the engine does.
      `createEntity` and `createPlayer` do not consult the registry: the engine declares no
      function at all, so these are the library's own and have no engine behaviour to model. The
      package says so where a user of them will read it.
    status: accepted
    pinned:
      reason: other
      notes: |
        A consumer-visible behaviour rather than a surface: a suite spawning an unregistered type
        through the engine surface is refused.
    because:
      - f:entity-type-lookup-agrees-with-spawnability
      - f:engine-surface-outside-instances
      - d-a0jmbtbh
      - r-0lbj68w9
      - r-5mlc26io
      - r-ovyzy5ey
    revisit_when:
      - packs come to reach the fakes only through the control plane, so gating the engine surface
        alone catches no misspelt identifier that reaches a test
      - a control-plane creation of an unregistered type is found masking a bug the engine would
        have surfaced, so the asymmetry costs more than the free arrangement is worth
    facets: fakes

  - id: d-m6ryo7ea
    title: localizationKey derives from the id
    statement: |
      An `EntityType` carries `id` and `localizationKey` and nothing else, both own value
      properties as the engine's are. `localizationKey` is derived from the id by the engine's own
      rule, and a registration may supply one instead.
    status: proposed
    pinned:
      reason: public-api
    because:
      - f:entity-type-carries-id-and-localization-key
      - f:entity-type-localization-key-derives-from-the-id
      - r-0lbj68w9
      - r-62r76czb
    revisit_when:
      - a type is found whose key the rule does not produce, so deriving fabricates a value the
        engine reports differently
    facets: fakes

  # raised by the survey of the draft fold: choices the build meets that the six above left open
  - id: d-gr7gky6j
    title: registerEntityType takes an id and an optional key, and refuses a duplicate
    statement: |
      `registerEntityType(server, id, localizationKey?)` registers one type and returns it. The id
      normalizes on entry and is stored and reported in the canonical prefixed form. Registering an
      id already registered throws rather than replacing the entry, which would strand an
      `EntityType` a test already holds.
    status: delegated
    pinned:
      reason: public-api
    because:
      - d-fhq1ng5m
      - f:entity-type-entries-are-stable-objects
      - r-v1r7n10i
      - r-62r76czb
    revisit_when:
      - suites come to re-register deliberately — building a type up across a shared fixture and a
        test — so the refusal obstructs the arrangement rather than catching a mistake
    facets: fakes

  - id: d-5noauehh
    title: spawnEntity takes an EntityType; createEntity stays string-only
    statement: |
      `Dimension.spawnEntity` accepts an `EntityType` wherever it accepts an id, reading the type's
      `id` and nothing else. `createEntity` continues to take a `typeId` string.
    status: accepted
    pinned:
      reason: public-api
    because:
      - d-dub2g4kr
      - d-fhq1ng5m
      - r-nmkxdrga
      - r-5mlc26io
    revisit_when:
      - tests routinely convert an `EntityType` back to a string to reach `createEntity`, so the
        narrower control-plane signature costs more than the symmetry is worth
    facets: fakes

  - id: d-1g2k3g56
    title: four presets ship, and the vanilla pair composes into one call
    statement: |
      Four presets ship: `withVanillaDimensions`, `withVanillaEntityTypes`, `withVanillaWorld` —
      which supplies those two and nothing else — and `asSpawnedEntity`, which is per-entity and
      stands outside the composite. Widening the composite is a supersession of this decision.
    status: accepted
    pinned:
      reason: public-api
      notes: |
        The composite's membership is fixed here so it cannot widen silently into the implicit
        defaults r-qak2scbs forbids.
    supersedes: d-fkbx974k
    because:
      - r-b92y0kb7
      - r-qak2scbs
      - f:entity-type-registry-holds-pack-defined-types
    revisit_when:
      - a third server-scoped vanilla preset ships and the composite's fixed membership makes every
        consumer opt into it by name, so the composite saves nothing
    facets: fakes

  - id: d-a0jmbtbh
    title: the vanilla preset registers the ids its source carries
    statement: |
      `withVanillaEntityTypes` registers the entity-type ids `@minecraft/vanilla-data` carries, in
      that source's order. It skips an id already registered, so it composes with a test's own
      registrations rather than colliding with the duplicate refusal.
    status: proposed
    pinned:
      reason: public-api
      notes: |
        The list is `@minecraft/vanilla-data`'s, which is corroborated by the observed count and not
        compared id-for-id with a world's registry; the package states which it is.
    because:
      - d-1g2k3g56
      - d-gr7gky6j
      - r-b92y0kb7
      - r-8r8gf6b7
    revisit_when:
      - an id-for-id comparison finds `@minecraft/vanilla-data`'s list and a world's registry
        disagreeing, so the preset misdescribes the vanilla set it names
    facets: fakes

  - id: d-4009wvxs
    title: the server is the fakes API's route, not the only one
    statement: |
      `createServer` returns one server whose properties are named as `@minecraft/server` exports
      them — `world`, `system`, and the eight registry classes — and it is the fakes API's route to
      them; code reaching the engine through the module import reaches the same objects by the
      surface the package supplies. The design and the package call it the fake server, or the
      server where nothing else could be meant.
    status: accepted
    supersedes: d-gjzbiyl6
    because:
      - r-qklf4op9
      - r-rpm1k57j
    revisit_when:
      - a second thing in the package comes to be called the server, so the word stops picking out
        what `createServer` returns
    facets:
      - fakes
      - shim

  - id: d-1en7u7ki
    title: entity ids are sequential opaque strings
    statement: |
      an auto-assigned entity id is a decimal string issued sequentially from 1 per server and never
      reissued
    status: delegated
    supersedes: d-ow40nqqi
    because:
      - d-4009wvxs
    revisit_when:
      - a pack parses or orders ids in a way the engine's negative-integer spelling supports and this
        one does not
    facets: fakes

  - id: d-0wycxopa
    title: currentServer reaches the setup-installed server
    statement: |
      the root barrel exports `currentServer(): FakeServer`, returning the fake server the bindings
      point at and throwing ShimNotInstalledError when they are unset. It is how a test on the
      default static-import path reaches the server the free functions take
    status: accepted
    supersedes: d-u52w8eim
    pinned:
      reason: public-api
    because:
      - d-ksotjt7v
      - d-03cbb3td
      - d-4009wvxs
      - d-ksk6d7ua
    revisit_when:
      - the default path comes to hand a test its server directly, so a reader-function is a second
        way to reach what the test already holds
    facets:
      - shim
