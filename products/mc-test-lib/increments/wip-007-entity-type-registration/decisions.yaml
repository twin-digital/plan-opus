version: "3"

# d-duelxt32's first revisit condition fired: mc-rpg-core's d-xobjyw2e puts `EntityTypes.get` on
# every library entry point, so the throwing registry blocks the test rather than sitting in
# startup code no test enters. Only EntityTypes is reopened; the other seven registries keep the
# ruling.
decisions:

  - id: d-uky2xju6
    title: EntityTypes behaves; the other seven registries throw
    statement: |
      A registry class either behaves or throws, decided per class. The fakes have no early phase,
      so a lookup answers whenever a test makes it rather than reproducing the engine's refusal to
      answer during early execution.
    cases:
      - when: the class is `EntityTypes`
        then: "`get` and `getAll` read a registry the test arranges"
      - otherwise: it stays declared with every member throwing NotImplementedError
    status: accepted
    pinned:
      reason: public-api
    because:
      - f:entity-type-registry-refuses-early-execution
      - r-0lbj68w9
    supersedes: d-duelxt32
    scope: fakes

  - id: d-herh9vjy
    title: the registry belongs to the server
    statement: |
      `createServer()` returns an `EntityTypes` bound to that server's own registry, so two servers
      in one process share nothing and a test needs no reset hook. No registry state lives at module
      scope.
    cases:
      - when: a server is installed
        then: the aliased surface's module-scope `EntityTypes` is a third binding beside `world` and `system`, moving with them
      - otherwise: it throws ShimNotInstalledError, as the other two do while unset
    status: accepted
    pinned:
      reason: public-api
      notes: |
        `server.EntityTypes` is per-server rather than the one shared class object every server
        holds today, so a consumer comparing the two across servers reads a different answer.
    because:
      - r-qayd22z2
      - r-rpm1k57j
      - d-4009wvxs
      - d-ysxt6ihr
      - d-uj5gbt9w
    scope:
      - fakes
      - shim

  - id: d-fhq1ng5m
    title: registration is a free function and the registry starts empty
    statement: |
      A server's registry starts empty, and a test fills it through an exported free function over
      the server rather than through a member `@minecraft/server` does not declare. Both branches
      are arrangeable from the start: a registered type, and a lookup that misses. `getAll` reports
      in registration order.
    status: accepted
    pinned:
      reason: public-api
    because:
      - r-5mlc26io
      - r-qak2scbs
      - r-rnnnz98l
    scope: fakes

  - id: d-0m25p71q
    title: lookup reproduces the engine, misses included
    statement: |
      A lookup reproduces the engine's recorded behaviour, and its arity and argument-type guards
      are the engine's.
    cases:
      - when: the identifier is bare
        then: "it resolves as `minecraft:<id>` and nothing else — no other namespace is searched"
      - when: nothing registers the identifier it names
        then: "the lookup returns `undefined` rather than throwing or fabricating"
      - otherwise: it returns the registered type, having matched exactly — whitespace and case differences miss
    status: accepted
    pinned:
      reason: public-api
    because:
      - f:entity-type-lookup-misses-return-undefined
      - f:entity-type-bare-id-means-the-minecraft-namespace
      - f:entity-type-entries-are-stable-objects
      - f:entity-type-registry-holds-pack-defined-types
      - f:entity-type-lookup-argument-guards
      - r-0lbj68w9
      - r-62r76czb
      - r-v1r7n10i
    scope: fakes

  - id: d-dub2g4kr
    title: the registry gates spawning, not the control plane
    statement: |
      Whether a creation consults the registry follows whether the engine has a counterpart for the
      call. The package says so where a user of them will read it.
    cases:
      - when: the call is `Dimension.spawnEntity`
        then: it resolves through the server's registry and throws InvalidArgumentError naming the identifier where nothing registers it, as the engine does
      - otherwise: "`createEntity` and `createPlayer` do not consult it: the engine declares no function at all, so these are the library's own"
    status: accepted
    pinned:
      reason: other
      notes: |
        A consumer-visible behaviour rather than a surface: a suite spawning an unregistered type
        through the engine surface is refused.
    because:
      - f:entity-type-lookup-agrees-with-spawnability
      - f:engine-surface-outside-instances
      - d-a0jmbtbh
      - r-0lbj68w9
      - r-5mlc26io
      - r-ovyzy5ey
    scope: fakes

  - id: d-m6ryo7ea
    title: localizationKey derives from the id
    statement: |
      An `EntityType` carries `id` and `localizationKey` and nothing else, both own value properties
      as the engine's are.
    cases:
      - when: a registration supplied a `localizationKey`
        then: the type reads back what it supplied
      - otherwise: the key derives from the id by the engine's own rule
    status: proposed
    pinned:
      reason: public-api
    because:
      - f:entity-type-carries-id-and-localization-key
      - f:entity-type-localization-key-derives-from-the-id
      - r-0lbj68w9
      - r-62r76czb
    scope: fakes

  # raised by the survey of the draft fold: choices the build meets that the six above left open
  - id: d-gr7gky6j
    title: registerEntityType takes an id and an optional key, and refuses a duplicate
    statement: |
      `registerEntityType(server, id, localizationKey?)` registers one type. The id normalizes on
      entry and is stored and reported in the canonical prefixed form.
    cases:
      - when: nothing has registered the id
        then: the type is registered and returned
      - otherwise: the call throws rather than replacing the entry, which would strand an `EntityType` a test already holds
    status: delegated
    pinned:
      reason: public-api
    because:
      - d-fhq1ng5m
      - f:entity-type-entries-are-stable-objects
      - r-v1r7n10i
      - r-62r76czb
    scope: fakes

  - id: d-5noauehh
    title: spawnEntity takes an EntityType; createEntity stays string-only
    statement: |
      `Dimension.spawnEntity` accepts an `EntityType` wherever it accepts an id, reading the type's
      `id` and nothing else. `createEntity` continues to take a `typeId` string.
    status: accepted
    pinned:
      reason: public-api
    because:
      - d-dub2g4kr
      - d-fhq1ng5m
      - r-nmkxdrga
      - r-5mlc26io
    scope: fakes

  - id: d-1g2k3g56
    title: four presets ship, and the vanilla pair composes into one call
    statement: |
      Four presets ship: `withVanillaDimensions`, `withVanillaEntityTypes`, `withVanillaWorld` —
      which supplies those two and nothing else — and `asSpawnedEntity`, which is per-entity and
      stands outside the composite. Widening the composite is a supersession of this decision.
    status: accepted
    pinned:
      reason: public-api
      notes: |
        The composite's membership is fixed here so it cannot widen silently into the implicit
        defaults r-qak2scbs forbids.
    supersedes: d-fkbx974k
    because:
      - r-b92y0kb7
      - r-qak2scbs
      - f:entity-type-registry-holds-pack-defined-types
    scope: fakes

  - id: d-a0jmbtbh
    title: the vanilla preset registers the ids its source carries
    statement: |
      `withVanillaEntityTypes` registers the entity-type ids `@minecraft/vanilla-data` carries, in
      that source's order.
    cases:
      - when: a test has already registered one of those ids
        then: the preset skips it, composing with the test's own registration rather than colliding with the duplicate refusal
      - otherwise: the id is registered as the source carries it
    status: proposed
    pinned:
      reason: public-api
      notes: |
        The list is `@minecraft/vanilla-data`'s, which is corroborated by the observed count and not
        compared id-for-id with a world's registry; the package states which it is.
    because:
      - d-1g2k3g56
      - d-gr7gky6j
      - r-b92y0kb7
      - r-8r8gf6b7
    scope: fakes

  - id: d-4009wvxs
    title: the server is the fakes API's route, not the only one
    statement: |
      `createServer` returns one server whose properties are named as `@minecraft/server` exports
      them — `world`, `system`, and the eight registry classes. The design and the package call it
      the fake server, or the server where nothing else could be meant.
    cases:
      - when: a test reaches the fakes through what `createServer` returned
        then: that server is the fakes API's route to them
      - otherwise: code reaching the engine through the module import reaches the same objects by the surface the package supplies
    status: accepted
    supersedes: d-gjzbiyl6
    because:
      - r-qklf4op9
      - r-rpm1k57j
    scope:
      - fakes
      - shim

  - id: d-1en7u7ki
    title: entity ids are sequential opaque strings
    statement: |
      an auto-assigned entity id is a decimal string issued sequentially from 1 per server and never
      reissued
    status: delegated
    supersedes: d-ow40nqqi
    because:
      - d-4009wvxs
    scope: fakes

  - id: d-0wycxopa
    title: currentServer reaches the setup-installed server
    statement: |
      the root barrel exports `currentServer(): FakeServer`, returning the fake server the bindings
      point at and throwing ShimNotInstalledError when they are unset. It is how a test on the
      default static-import path reaches the server the free functions take
    status: accepted
    supersedes: d-u52w8eim
    pinned:
      reason: public-api
    because:
      - d-ksotjt7v
      - d-03cbb3td
      - d-4009wvxs
      - d-ksk6d7ua
    scope:
      - shim
