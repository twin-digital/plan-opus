version: 1
requirements:
  - id: r-wh01d5cg
    title: package config is repo-kit managed
    statement: |
      a package's shared configuration — its bundler, TypeScript, lint, and package-script
      setup — is generated by the monorepo's config manager from that monorepo's declarative
      configuration. it is neither written nor edited in the package, and an exception for one
      package is declared where that configuration lives.
    satisfied_when:
      - the package contains no hand-written bundler, TypeScript, lint, or package-script configuration, and regenerating from the monorepo's declarative configuration leaves a clean tree
      - any exception is declared where the shared configuration lives, not in the package

  - id: r-odoqiqo3
    title: packs use the shared build tooling
    statement: |
      a pack's bundle is built by the workspace's shared pack-build toolchain: its build
      configuration merges the fragment that toolchain exports, and it implements no build
      logic of its own. every route to a built pack — a build script, a watch rebuild, a
      continuous-integration run — goes through it.
    rationale: |
      a second path to a built pack is a path around manifest completion.
    satisfied_when:
      - the pack's build configuration merges the shared toolchain's exported fragment and defines no bundling of its own
      - every route to a built pack — script, watch, and continuous integration — invokes the shared toolchain

  - id: r-r316qhk6
    title: a pack does not deliver itself
    statement: |
      a pack implements no delivery of its own: whatever release or deploy hook the monorepo's
      conventions require of it delegates to shared tooling, and the pack itself publishes and
      deploys nothing.
    satisfied_when:
      - the pack's release and deploy hooks delegate to shared tooling, and the pack publishes and deploys nothing directly

  - id: r-hear6pun
    title: packs unit-test with the shared test lib
    statement: |
      a pack's unit tests stand up "@minecraft/server" with "@twin-digital/minecraft-test-lib"
      rather than a hand-rolled double or a module mock.
    satisfied_when:
      - unit tests obtain "@minecraft/server" through "@twin-digital/minecraft-test-lib", with no hand-rolled double or module mock of it
