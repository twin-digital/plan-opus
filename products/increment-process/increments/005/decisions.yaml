version: "1"
decisions:
  - id: d-uwnjk7rn
    title: the tooling is one package, one CLI
    statement: |
      the validator, the projection, and the id generator ship as one opus workspace package —
      @twin-digital/design-process at nodejs/plan/design-process, kind npm-cli — exposing one
      design-process CLI with check, project, and id subcommands; structure below that surface
      stays implementation.
    status: delegated
    because:
      - d-cfe28w5z
    facets: tooling

  - id: d-r9o8qni5
    title: the documents live under docs/design-process/
    statement: |
      the initial document packages live at docs/design-process/process-reference.md,
      docs/design-process/agent-guidance.md, and docs/design-process/process-migration.md — the
      domain directory named for the process, one file per package.
    status: delegated
    because:
      - d-lm8br2p2
      - d-hdz4drvp
    facets: process-doc

  - id: d-wb0qq8wv
    title: the gate reads preset conflict as id collision
    statement: |
      the mechanical conflict the merge gate blocks on is identity collision: a requirement id
      declared both by an adopted preset and by the product, or by two adopted presets. a
      semantic conflict between differently-numbered requirements stays with review and the
      open-question channel.
    status: delegated
    because:
      - r-bwtud1e5
    facets: design-validator

  - id: d-is1lgu15
    title: schema pool versions are dense
    statement: |
      the validator holds schema pool versions to dense integers per entity, the same rule the
      api pool carries by requirement.
    status: delegated
    because:
      - d-3wjypyx6
    facets: design-validator

  - id: d-emngkw5c
    title: pool immutability is content identity
    statement: |
      what the gate holds immutable about a bound pool version is its parsed content, keyed by
      identity: the file may move or be renamed freely, and any content change or removal of a
      bound identity blocks. binding is computed from every published increment — source
      version fields and model references, closed transitively over $refs.
    status: delegated
    because:
      - r-2fytqadu
    facets: design-validator

  - id: d-t03xkfj7
    title: both trees are checked until the migration empties design/
    statement: |
      npm run check runs the legacy checker over design/ and design-process check over
      products/, schemas/, apis/, and implementations/; the new validator ignores design/, and
      the legacy checker retires with the last design out.
    status: delegated
    because:
      - r-zcvxh2ty
    facets: design-validator

  - id: d-sjxyurcz
    title: an in-tree document's version is the record's built_at date
    statement: |
      a document package consumed from the tree has no released version, so an implementation
      record carries the record's built_at date as that package's version.
    status: delegated
    because:
      - d-lm8br2p2
      - d-0hedq82d
    facets: schema
