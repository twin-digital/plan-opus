version: "2"
requirements:
  - id: r-m8cwwkt3
    title: binding text and commentary are separate
    statement: |
      a foundation's binding text is separated from its commentary, and nothing binding lives
      in commentary; where the two diverge, the binding text governs.

  - id: r-0ls6xch4
    title: a binding statement fits a budget
    statement: |
      a foundation's binding statement fits a budget the validator checks mechanically.

  - id: r-q0969r5a
    title: implementers receive binding content only
    statement: |
      what an implementation binds to carries the fold's binding content and none of its
      commentary.
