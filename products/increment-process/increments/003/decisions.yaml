version: "1"
decisions:
  - id: d-u3u3sbmb
    title: api identity is a per-tech header
    statement: |
      an api pool file carries its identity in-file by a per-tech convention — "// api:
      /<namespace>/<name>@<version>" in typescript, "# api: ..." in yaml formats, info.x-api-id
      where openapi metadata fits — with the file's extension and content telling the design
      validator which extractor reads it.
    status: proposed
    because:
      - r-lll68661
    pinned:
      reason: data-format
    facets:
      - schema
      - design-validator

  - id: d-q8ur5u3f
    title: decomposition is design work
    statement: |
      the consumer-visible package set — each package's existence, kind, and home — is proposed
      and ratified in Plan, as decisions of the increment that calls for it; structure below the
      package surface is the implementer's. product.yaml reflects the packages an implementation
      has realized.
    status: proposed
    because:
      - d-8itv1czm
    facets:
      - process-doc
      - prompts

  - id: d-qb67fb8s
    title: kind selects the dispatch shape
    statement: |
      an implementation dispatches one implementer per package, and the package's kind selects
      its wave shape — each wave producing one artifact validated against what came before it.
      code kinds run Define, Stub, Code, Document; document kinds run Claims, Compose, Check;
      further kinds name their shapes as they earn them.
    status: proposed
    because:
      - d-q8ur5u3f
      - d-8itv1czm
    facets:
      - process-doc
      - prompts

  - id: d-dteorq7q
    title: escalation fires only on requirements and pins
    statement: |
      an implementation wave escalates only to change a requirement, change a pinned decision, or propose
      a decision that would be pinned; otherwise agents decide and record, including overturning
      unpinned decisions.
    status: proposed
    facets: prompts

  - id: d-0nl6sd96
    title: coverage is the implementation's artifact
    statement: |
      coverage manifests are produced by implementations, not checked into design increments; a
      manifest names the fold its implementation targeted, and only claims in force there.
    status: proposed
    because:
      - r-tue7kfgt
      - r-sk47gw08
    pinned:
      reason: data-format
    facets:
      - schema
      - tooling

  - id: d-0hedq82d
    title: implementations are recorded in a pool
    statement: |
      implementations/ is a repo pool like evidence/ — one record per implementation, linking
      the package versions produced to the targeted increment and carrying the coverage
      manifest; a record is immutable once its artifacts ship, and filing is convenience.
    status: proposed
    because:
      - d-0nl6sd96
    pinned:
      reason: data-format
    facets:
      - schema
      - tooling

  - id: d-w74sea6u
    title: implementations run by hand or autonomously, one record
    statement: |
      an implementation may be run by hand — the owner and agents working the increment's own
      branch, a document authored during its PR — or autonomously by an orchestrated Implement
      phase; both are the same mechanism, target a fold, and write the same implementations/
      record.
    status: proposed
    because:
      - d-0hedq82d
    facets:
      - process-doc
      - prompts

  - id: d-7qh9hx2x
    title: escalation aborts and retargets
    statement: |
      an implementation needing amendments after later design increments have landed does not
      fork the design: its amendments land as a new increment at head, the implementation
      retargets the fold that contains them, and the loop repeats if further increments land
      first.
    status: proposed
    because:
      - r-sk47gw08
      - d-0nl6sd96
    revisit_when:
      - agents autonomously manage increments at a pace where retargeting starves implementations,
        and designs go unimplemented while the head advances
    facets:
      - process-doc
      - prompts

  - id: d-0g9l44e4
    title: evidence is graded by provenance and coupling
    statement: |
      coverage kinds are attestation, code-test, manual-check, and conformance-case; a claim's
      rung is attested, checked, or conformance, and what raises a rung is who vetted the check
      and its tie to the claim, not automation.
    status: proposed
    pinned:
      reason: data-format
    facets: schema

  - id: d-4s0zoh1v
    title: code always attests
    statement: |
      the Code wave records an attestation for every claim it implemented, alongside whatever
      better evidence exists.
    status: proposed
    facets: prompts

  - id: d-lm8br2p2
    title: the process's documents live at docs/design-process/
    statement: |
      the process's document deliverables are document-kind packages under docs/design-process/
      in this repository — repo twin-digital/plan-opus, departing the mapping's default — one
      package per shipped document.
    status: proposed
    because:
      - r-yzkxa2hj
      - d-nzba0wqu
    pinned:
      reason: public-api
      notes: the paths are read straight from the tree; a move breaks every reader
    facets:
      - process-doc
      - schema

  - id: d-ig8vxolb
    title: implementation design output lands as increments
    statement: |
      everything fold-relevant an implementation produces — escalations mid-flight, unpinned
      overturns and proposed decisions at wrap-up — lands as ordinary design increments at
      head, ruled at the gate like any other; the implementation record carries no fold
      content, only the target, the packages produced, and the coverage manifest.
    status: proposed
    because:
      - d-dteorq7q
      - d-0hedq82d
    pinned:
      reason: data-format
    facets:
      - process-doc
      - schema

  - id: d-ki941p9b
    title: a record lands only at head
    statement: |
      a record's target is the product's newest published increment at the moment the record
      merges; a stale target is refused, and the implementation retargets before landing.
    status: proposed
    because:
      - d-j50yturh
      - d-7qh9hx2x
    facets:
      - process-doc
      - design-validator

  - id: d-rputf2bx
    title: releases wait for their design
    statement: |
      no package version releases and no document deliverable goes live before the design
      increment its implementation targets is published; the controls enforcing this ordering
      are deferred to a later increment.
    status: proposed
    because:
      - d-6x6l6ws7
    facets: process-doc
