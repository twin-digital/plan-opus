version: "1"
decisions:
  - id: d-29fjsjn2
    title: one recording bar, applied at two moments
    statement: |
      the recording bar — a consumer could observe the outcome, or a reimplementation must
      preserve it — is one bar: the planner classifying a choice during the survey and the
      builder declining to record one at wrap-up apply the same test.
    status: proposed
    because:
      - r-v4z0h7dn
      - d-rx3s2hqo
    facets:
      - process-doc
      - prompts

  - id: d-63f18oml
    title: a deferral is an ordinary decision
    statement: |
      a choice Plan cannot yet determine is deferred by a decision like any other: its
      statement names what is deferred and to whom, the owner rules it, and it stands in
      force as the license its answer cites. a question routed to a decision may close by
      minting a deferral. a deferral is not superseded by its answer.
    status: proposed
    because:
      - r-v4z0h7dn
      - r-d181l3s2
    facets:
      - process-doc
      - schema

  - id: d-uz9wis6a
    title: deferrals are marked in the source
    statement: |
      decision@2 adds one optional field, deferred_to — today always implementer — marking
      the decision as a deferral. the field is additive, and a decisions source adopts it
      by naming version "2".
    status: proposed
    pinned:
      reason: data-format
    because:
      - d-63f18oml
      - d-i47qv6oa
    facets:
      - schema
      - tooling

  - id: d-ub6h6h5u
    title: license by because, overturn by supersedes
    statement: |
      a companion increment entry is one of three: licensed — its because cites the
      deferral it answers; an overturn — it supersedes a plan-ruled decision, legal when
      unpinned and counted at the companion's ratify; or a discovery — neither. licensed
      entries and discoveries pass; overturns are litigated.
    status: proposed
    because:
      - d-63f18oml
      - d-eaw3u72o
      - d-ig8vxolb
      - d-98df3rlb
    facets:
      - process-doc
      - prompts

  - id: d-cau8oksc
    title: survey is a third implementer phase
    statement: |
      each kind-specific implementer skill partitions its waves into three phases the
      dispatcher can call: survey — read-only against a fold or draft fold, returning the
      census of choices the package's build would meet, each classified decided, deferred,
      or below the recording bar, plus the questions the fold cannot answer; prepare —
      standing up what sibling packages compile or check against, a package's public
      surface or its share of a cross-package allocation; and implement — running prepare
      where it has not run, then completing the package. a kind with nothing to stand up
      treats prepare as a no-op; the dispatcher never knows a kind's waves.
    status: proposed
    pinned:
      reason: public-api
      notes: the contract between the dispatcher and every implementer skill, present and future
    supersedes: d-sbcncyu2
    because:
      - r-v4z0h7dn
      - d-29fjsjn2
      - d-qb67fb8s
      - d-ng02vmcd
    facets:
      - process-doc
      - prompts

  - id: d-xxxo61q9
    title: the plan skill offers the survey and recommends
    statement: |
      before ratify, the plan skill reports what the increment has captured, asks the
      owner whether to dispatch the survey, and recommends from the delta's shape: for,
      when packages, contracts, or consumer surfaces change; against, when norm-only. the
      owner's word runs it, any number of times across the loop; the census's gaps route
      back into Clarify.
    status: proposed
    because:
      - r-v4z0h7dn
      - d-52uunxo6
      - d-cau8oksc
      - d-63f18oml
    facets: prompts
