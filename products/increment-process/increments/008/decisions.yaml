version: "1"
decisions:
  - id: d-29fjsjn2
    title: one recording bar, applied at two moments
    statement: |
      "below the recording bar" is the bar d-rx3s2hqo already sets — a consumer could
      observe the outcome, or a reimplementation must preserve it — applied identically by
      the planner classifying a choice during the survey and by the builder declining to
      record one at wrap-up. the two judgements are the same question asked at different
      times, and a builder recording what the survey classified below the bar is a visible
      disagreement to review, not two private calls.
    status: proposed
    because:
      - r-v4z0h7dn
      - d-rx3s2hqo
    facets:
      - process-doc
      - prompts

  - id: d-63f18oml
    title: a deferral is an ordinary decision
    statement: |
      a choice Plan cannot yet determine is deferred by a decision like any other: its
      statement names what is deferred and to whom, the owner rules it, and it stands in
      force as the license the answering entry cites. an open question routed to a decision
      may close by minting a deferral. deferrals are never superseded by their answers —
      the deferral is the standing record that the choice was implementation-tier by
      ruling.
    status: proposed
    because:
      - r-v4z0h7dn
      - r-d181l3s2
    facets:
      - process-doc
      - schema

  - id: d-uz9wis6a
    title: deferrals are marked in the source
    statement: |
      decision@2 adds one optional field, deferred_to, today always the implementer; a
      decision carrying it is a deferral the projection can list and the partition can
      count. the field is additive — every decision@1 entry is valid at @2 — and an
      increment adopts it by naming version "2" on its decisions source.
    status: proposed
    pinned:
      reason: data-format
    because:
      - d-63f18oml
      - d-i47qv6oa
    facets:
      - schema
      - tooling

  - id: d-ub6h6h5u
    title: license by because, overturn by supersedes
    statement: |
      a companion increment entry is one of three things, read mechanically: licensed — its
      because cites the deferral it answers; an overturn — it supersedes a plan-ruled
      decision, legal for unpinned decisions but counted and read at the companion's ratify
      as the re-litigation failure; or a discovery — neither, standing on information
      nobody had at Plan. licensed entries and discoveries are the rubber stamp; overturns
      are the short list the owner actually litigates, and the overturn count is the
      empirical feedback for the over-planning dial.
    status: proposed
    because:
      - d-63f18oml
      - d-eaw3u72o
      - d-ig8vxolb
      - d-98df3rlb
    facets:
      - process-doc
      - prompts

  - id: d-cau8oksc
    title: survey is a third implementer phase
    statement: |
      each kind-specific implementer skill partitions its waves into three generic phases
      the dispatcher can call: survey — read-only against a fold or draft fold, returning
      the census of choices its package's build would meet, each classified decided,
      deferred, or below the recording bar, plus the questions the fold cannot answer,
      building nothing — then prepare and implement as before: prepare standing up whatever
      sibling packages compile or check against, a package's public surface or its share of
      a cross-package allocation, and implement running prepare first where it has not run
      and then completing the package. a kind with nothing to stand up treats prepare as a
      no-op; the dispatcher never needs to know any kind's waves.
    status: proposed
    pinned:
      reason: public-api
      notes: the contract between the dispatcher and every implementer skill, present and future
    supersedes: d-sbcncyu2
    because:
      - r-v4z0h7dn
      - d-29fjsjn2
      - d-qb67fb8s
      - d-ng02vmcd
    facets:
      - process-doc
      - prompts

  - id: d-xxxo61q9
    title: the plan skill offers the survey and recommends
    statement: |
      before ratify, the plan skill reports what the increment has captured — the
      requirement and decision counts, the packages and surfaces its delta touches — asks
      the owner whether to dispatch the survey, and recommends for or against from the
      delta's shape: a delta proposing or changing packages, contracts, or consumer
      surfaces recommends for; a norm-only delta recommends against. the owner's word runs
      it, any number of times across the loop, and the census's gaps route back into
      Clarify: undetermined choices decided, deferrable ones minted as deferrals,
      sub-surface ones confirmed silent, unknowns raised as questions.
    status: proposed
    because:
      - r-v4z0h7dn
      - d-52uunxo6
      - d-cau8oksc
      - d-63f18oml
    facets: prompts
