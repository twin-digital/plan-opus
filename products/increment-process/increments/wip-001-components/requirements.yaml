version: "2"
requirements:
  - id: r-s0j3i7oh
    title: a foundation names the part of the product it concerns
    statement: |
      a requirement or decision may name the part of the product it concerns in a form the
      tooling reads; which claims reach which part is answerable without interpreting prose.

  - id: r-5endqgyi
    title: refining the decomposition re-homes nothing
    statement: |
      splitting a part of the product into finer parts neither restates nor re-homes
      foundations already in force; growth of the decomposition is additive.

  - id: r-r3bhwqno
    title: a preset adopts for part of a product
    statement: |
      a preset can be adopted for a named part of a product rather than the whole.
