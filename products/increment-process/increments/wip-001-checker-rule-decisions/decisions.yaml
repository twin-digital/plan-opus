version: "2"
decisions:
  - id: d-qo2qelw4
    title: a malformed pool file is a finding
    statement: |
      design-process check reports a facts/ or evidence/ pool file that fails to parse as YAML as
      a finding, rather than dropping it unseen. the facts and evidence pools are validated by the
      merge gate; a file the loader cannot parse contributes no entries and would otherwise pass
      silently, taking its facts and runs out of the pool with no signal. an unparseable pool file
      is itself the finding.

      this is the reading the evidence-bar port needed and did not have a ruling for: r-xxa1st52
      requires the pool be validated, and a file that cannot be parsed is not.
    status: proposed
    because:
      - r-xxa1st52
    facets:
      - design-validator
      - tooling

  - id: d-te89mei4
    title: every run's output file must exist, cited or not
    statement: |
      design-process check requires every run entry's output file to resolve in the tree, whether
      or not a fact cites the run — extending the output-existence check beyond the cited-run case
      the evidence bar already covers in d-0e325noj. a run records a captured execution, and an
      output path resolving to nothing is a broken record whatever cites it.

      recorded for the owner's ruling: the evidence bar in d-0e325noj scopes output-existence to a
      cited run source, and this widens it. an uncited run backs nothing, so the widening is the
      owner's call, not entailed.
    status: proposed
    because:
      - d-0e325noj
    facets:
      - design-validator
      - tooling
