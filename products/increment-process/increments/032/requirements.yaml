version: "2"
requirements:
  - id: r-s0j3i7oh
    title: a foundation names the part of the product it concerns
    statement: |
      a requirement or decision may name the part of the product it concerns in a form the
      tooling reads; which claims reach which part is answerable without interpreting prose.

  - id: r-5endqgyi
    title: refining the decomposition re-homes nothing
    statement: |
      splitting a part of the product into finer parts neither restates nor re-homes
      foundations already in force; growth of the decomposition is additive.

  - id: r-r3bhwqno
    title: a preset applies to part of a product
    statement: |
      a preset can be applied to a named part of a product rather than the whole.

  - id: r-lzit71be
    title: products declare their own requirements
    amends: r-bwtud1e5
    statement: |
      no requirement outside a product's own increments binds it; a preset applied at a pinned
      increment is the only way an external requirement takes force.
