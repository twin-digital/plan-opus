version: "2"
decisions:
  - id: d-ko3lggbr
    title: the session's lists show a draft's retirements
    statement: |
      each of the ratify session's lists carries the retirements the draft declares in the source
      that list reads — a retired decision in the decisions list, a retired requirement in the
      requirements list — after the entries the draft declares. a `retires:` entry names a
      published foundation and nothing else, so the row shows that foundation's title, recovered
      from the fold at head, over the retired id.

      `retired` stands where a staged ruling stands, and the row carries the recessive emphasis an
      entry closed by another of the same draft carries — a retirement is a closing, and the row is
      the entry it closes. it names no successor, so it carries no `closes` or `closed by` field. a
      retirement has no status to leave, so the entry takes a note and no ruling, as a requirement
      does.
    status: accepted
    because:
      - r-n86ssoew
      - d-g00ah4em
      - d-26vs308h
    pinned:
      reason: public-api
      notes: |
        which entries the session's lists hold
    facets:
      - tooling
