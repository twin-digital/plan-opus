version: "2"
model:
  - name: ratify-screen
    surface: /design-process/ratify-screen@5
    description: what the session renders — its two entry lists, the detail pane beside them, and the form of each field
  - name: fact
    schema: /design-process/fact@3
    description: one finding in the repo-wide facts/ pool, named by a title and frozen once merged
  - name: facts-source
    schema: /design-process/facts@3
    description: a facts/ file — its version and the facts it declares
