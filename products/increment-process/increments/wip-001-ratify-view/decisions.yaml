version: "2"
decisions:
  - id: d-9zot40jn
    title: the screen's shape is an authored contract, not prose
    statement: |
      what ratify mode renders is an authored surface in the repo-wide `apis/` pool, bound
      through this increment's model as `ratify-screen`. the contract carries the layout and the
      form of every field; the decisions carry the choices — which entries the list holds, how a
      cited id is resolved, what a submit writes.

      a screen is a public surface in the sense the api pool already means: it is what the owner
      interacts with, and it is falsifiable, since a render can be diffed against the authored
      shape. prose cannot be diffed, and a layout written as paragraphs drifts from the build
      without anything catching it.
    status: proposed
    because:
      - r-ax84j1s2
      - d-mhv8av8w
    pinned:
      reason: public-api
      notes: the screen the owner works from, and the first surface to enter the api pool
    facets:
      - tooling

  - id: d-8abusqwe
    title: the ratify list is the draft's whole decision set, beside the entry's full text
    statement: |
      ratify mode is a list of every decision the draft carries and every question still open,
      beside a pane carrying the selected entry in full. moving through the list moves the pane,
      and the ruling is taken on the selected entry from the statuses that entry admits.

      a decision the draft already rules appears in the list carrying that ruling as its staged
      value, and the owner changes it from the same list; a proposed one shows none. a draft is
      worked over several sittings, and a list holding only what is still open hides the rulings
      the owner is deciding against — and offers no way back to one already made.

      one bulk action is offered beside the per-entry ruling and not instead of it: setting every
      decision still unruled to one status. it is the secondary path — a draft is ruled entry by
      entry, and the bulk action is for the tail the owner has already decided as a group.

      the pane and the list render as the bound `ratify-screen` contract states.
    status: proposed
    supersedes: d-9g0poz7v
    because:
      - r-jf51jzor
      - r-ax84j1s2
      - d-mhv8av8w
    pinned: false
    facets:
      - tooling

  - id: d-mhlya385
    title: a cited id is shown as the title it resolves to
    statement: |
      the entries a shown entry cites — its `because`, what it supersedes, what a question's
      answer routes to — are resolved against the fold the draft sits on and the repo-wide facts
      pool, and each is shown as its title with its id beside it. the kind is read from the id's
      prefix; nothing stores it.

      an id that resolves to nothing is shown as the id alone. that is the whole of the handling:
      a dangling citation is already a merge-gate finding, and the session is not where it is
      reported.
    status: proposed
    because:
      - r-fipf2016
    pinned: false
    facets:
      - tooling

  - id: d-4xkyfjzu
    title: deferring is offered beside the four rulings
    statement: |
      the statuses ratify mode offers for a decision are the four rulings and `deferred`. the
      owner writing a deferral is authoring one rather than ratifying it — the process already
      has a deferral enter directly and the merge ratify it — and the session is where the owner
      is, so it is where the deferral is written.

      a deferred decision is settled for the purpose of landing: it is not proposed, and it does
      not hold the landing closed.
    status: proposed
    because:
      - r-ax84j1s2
      - d-ovlyaoht
    pinned: false
    facets:
      - tooling
      - process-doc

  - id: d-lqmwczg3
    title: the submit tallies what it ruled and pushes
    statement: |
      the commit a submit writes carries a body naming each status the set took and how many
      entries took it — `3 accepted, 1 rejected` — omitting any status no entry took. after
      committing, the submit pushes the branch to its remote.

      pushing on submit is what makes a sitting durable: a draft is ruled over several of them,
      and rulings that live only in a local branch are lost to whichever machine held them.
    status: proposed
    because:
      - r-clty5lqd
      - d-ovlyaoht
    pinned: false
    facets:
      - tooling

  - id: d-mhv8av8w
    title: one interactive command carries the draft, and it works a pull request
    statement: |
      `design-process increment` is a full-screen terminal application over a draft's pull
      request, and it is the whole flow: the owner rules from it and publishes from it, never
      switching commands. no new package, no service, and no browser — it reaches the fold, the
      projection, and the conflict check as library calls rather than reimplementing them.

      the pull request is what the session works, because by the time a draft is being ruled an
      agent has already opened one and posted it for review. `--pr <url>` names it, and is the
      ordinary way to start: the session resolves it to its head branch, fetches that branch,
      materialises a temporary git worktree from it, runs there, and removes the worktree when
      the session ends. the product comes from the draft the branch holds, so the product
      argument is optional. it needs a local clone of the pull request's repository, found from
      the working directory the command ran in; where there is none it says so and does nothing.

      without `--pr` the session works the draft the current tree holds, and opens a pull request
      for the branch before anything else where the branch has none. every session therefore has
      one, which is what lets a submit post a review.

      the session has modes, and what is open decides which are offered. ratify is where a draft
      carrying anything proposed or unanswered opens. landing becomes available exactly when
      nothing is proposed and no question is open, and is entered from the same session.
    status: proposed
    supersedes: d-gf6x5jzy
    because:
      - r-ycjjl48r
      - r-ax84j1s2
      - r-2keswxn8
      - d-h418ljtp
    pinned:
      reason: public-api
      notes: the command a published cli offers, what it accepts, and the gate on when landing appears
    facets:
      - tooling

  - id: d-pm6a29v6
    title: the pull request's diff names the draft, and the owner picks only where it is ambiguous
    statement: |
      the increment directories a pull request's diff touches are the drafts it carries, and the
      `products/<product>/` above each is its product. nothing is declared and nothing is passed:
      a draft is identified by the branch changing it.

      the diff rather than a `wip-` name, because a branch at landing has already renamed its
      directory into the number it claims — a session opened on a landing branch would find no
      draft by name, and the one it should work is the one the branch changed.

      where the diff carries exactly one, the session opens on it. where it carries several, a
      selection screen comes first, listing each by product and directory, and choosing one opens
      the ordinary view; a tree holds more than one draft only where they are stacked, so this is
      the uncommon path. a product named on the command line narrows the list to that product's
      drafts, and where that leaves one the selection screen is skipped. where the diff carries
      none, the session says the pull request holds no increment and exits.
    status: proposed
    because:
      - r-ycjjl48r
      - d-mhv8av8w
      - d-x0q4xgd8
    pinned: false
    facets:
      - tooling

  - id: d-f1b5r2f8
    title: a submit posts one review where it has something to say
    statement: |
      a submit posts exactly one review to the draft's pull request, after the commit and the
      push, so the review anchors to the state it describes. each note the owner attached is a
      comment in that review, against the lines of the entry it concerns in the source file that
      carries it; a note whose entry is not in the pull request's diff goes into the review's
      body naming the entry, rather than being dropped.

      the review's event is `APPROVE` where the submit leaves the draft with nothing proposed,
      nothing rejected, and no question open, and `COMMENT` otherwise. approving is the same
      judgement the landing gate makes, taken at the moment the owner makes it, so the pull
      request shows a settled draft as settled without a second action. a submit that neither
      approves nor carries a note posts nothing: the commit already records the statuses it
      changed, and an empty review on the pull request repeats it while burying the reviews that
      say something.

      the review is the owner's, so it is what the owner's credential is spent on. a note settles
      nothing and gates nothing: an entry can carry a note and be accepted in the same submit.
    status: proposed
    because:
      - r-y9eux47d
      - r-z0wcwwn0
      - d-lqmwczg3
      - d-mhv8av8w
    pinned:
      reason: public-api
      notes: what a submit writes to the pull request is what the owner and every later reader see there
    facets:
      - tooling

  - id: d-2b23mjrl
    title: the owner's credential is asked for once and held for the session
    statement: |
      the credential that acts as the owner is a github personal access token entered at the
      terminal the first time a session needs one, with the input not echoed. it lives in the
      process's memory for the rest of that session and nowhere else — not in a file, not in the
      environment, not in an argument — and a later session asks again.

      a session posts a review on every submit, so asking at each one would put a prompt in the
      middle of the flow the session exists to make continuous. holding it for the run is what
      `d-6fur4w53` already permitted; what changes is that the first use is now a submit rather
      than the landing.

      a session that cannot obtain one still stages, commits, and pushes; it reports what it
      could not post, and a landing run that way publishes everything up to the approval.
    status: proposed
    supersedes: d-6fur4w53
    because:
      - r-rxb7pn9z
      - d-f1b5r2f8
      - d-mhv8av8w
    pinned:
      reason: other
      notes: the owner's identity is what it spends; a later relaxation to a stored token would be silent
    facets:
      - tooling

  - id: d-ex0pr4e4
    title: the token is spent on the reviews and nothing else
    statement: |
      the calls that carry the owner's token are the reviews a submit and a landing post, in an
      authorization header read from memory. opening the pull request, pushing, and setting the
      merge to complete on its own use the credentials the environment already holds — the agent
      opened the draft's pull request, and the owner reviewing it is the point.

      the token's reach is the reviews, so what the owner's identity is spent on is exactly what
      carries their judgement.
    status: proposed
    supersedes: d-uap9qjz9
    because:
      - r-rxb7pn9z
      - d-2b23mjrl
      - d-f1b5r2f8
    pinned: false
    facets:
      - tooling

  - id: d-kjwswmro
    title: the header names the draft and what is not in the list
    statement: |
      a header spans the top of every mode, naming the product, the increment directory, the
      branch, and the pull request. the session is now started from a pull request url and runs
      in a worktree the tool made, so nothing else on screen says which draft is open.

      the header also names the draft's changed inputs that the ratify list does not hold —
      schema pool versions, api surfaces, facts, evidence, and drafts — counted from the branch's
      diff against the head the conflict check uses. it says they are there and does not render
      them: a draft binding a new contract is a thing the owner must know before approving, and
      a list of decisions alone does not show it.
    status: proposed
    because:
      - r-ax84j1s2
      - d-mhv8av8w
      - d-9zot40jn
    pinned: false
    facets:
      - tooling
