version: "2"
decisions:
  - id: d-9zot40jn
    title: the screen's shape is an authored contract, not prose
    statement: |
      what ratify mode renders is an authored surface in the repo-wide `apis/` pool, bound
      through this increment's model as `ratify-screen`. the contract carries the layout and the
      form of every field; the decisions carry the choices — which entries the list holds, how a
      cited id is resolved, what a submit writes.

      a screen is a public surface in the sense the api pool already means: it is what the owner
      interacts with, and it is falsifiable, since a render can be diffed against the authored
      shape. prose cannot be diffed, and a layout written as paragraphs drifts from the build
      without anything catching it.
    status: proposed
    because:
      - r-ax84j1s2
      - d-gf6x5jzy
    pinned:
      reason: public-api
      notes: the screen the owner works from, and the first surface to enter the api pool
    facets:
      - tooling

  - id: d-8abusqwe
    title: the ratify list is the draft's whole decision set, beside the entry's full text
    statement: |
      ratify mode is a list of every decision the draft carries and every question still open,
      beside a pane carrying the selected entry in full. moving through the list moves the pane,
      and the ruling is taken on the selected entry from the statuses that entry admits.

      a decision the draft already rules appears in the list carrying that ruling as its staged
      value, and the owner changes it from the same list; a proposed one shows none. a draft is
      worked over several sittings, and a list holding only what is still open hides the rulings
      the owner is deciding against — and offers no way back to one already made.

      one bulk action is offered beside the per-entry ruling and not instead of it: setting every
      decision still unruled to one status. it is the secondary path — a draft is ruled entry by
      entry, and the bulk action is for the tail the owner has already decided as a group.

      the pane and the list render as the bound `ratify-screen` contract states.
    status: proposed
    supersedes: d-9g0poz7v
    because:
      - r-jf51jzor
      - r-ax84j1s2
      - d-gf6x5jzy
    pinned: false
    facets:
      - tooling

  - id: d-mhlya385
    title: a cited id is shown as the title it resolves to
    statement: |
      the entries a shown entry cites — its `because`, what it supersedes, what a question's
      answer routes to — are resolved against the fold the draft sits on and the repo-wide facts
      pool, and each is shown as its title with its id beside it. the kind is read from the id's
      prefix; nothing stores it.

      an id that resolves to nothing is shown as the id alone. that is the whole of the handling:
      a dangling citation is already a merge-gate finding, and the session is not where it is
      reported.
    status: proposed
    because:
      - r-fipf2016
    pinned: false
    facets:
      - tooling

  - id: d-4xkyfjzu
    title: deferring is offered beside the four rulings
    statement: |
      the statuses ratify mode offers for a decision are the four rulings and `deferred`. the
      owner writing a deferral is authoring one rather than ratifying it — the process already
      has a deferral enter directly and the merge ratify it — and the session is where the owner
      is, so it is where the deferral is written.

      a deferred decision is settled for the purpose of landing: it is not proposed, and it does
      not hold the landing closed.
    status: proposed
    because:
      - r-ax84j1s2
      - d-ovlyaoht
    pinned: false
    facets:
      - tooling
      - process-doc

  - id: d-lqmwczg3
    title: the submit tallies what it ruled and pushes
    statement: |
      the commit a submit writes carries a body naming each status the set took and how many
      entries took it — `3 accepted, 1 rejected` — omitting any status no entry took. after
      committing, the submit pushes the branch to its remote.

      pushing on submit is what makes a sitting durable: a draft is ruled over several of them,
      and rulings that live only in a local branch are lost to whichever machine held them.
    status: proposed
    because:
      - r-clty5lqd
      - d-ovlyaoht
    pinned: false
    facets:
      - tooling

  - id: d-mhv8av8w
    title: the session opens on the draft a pull request names
    statement: |
      `--pr <url>` names the pull request to work. the session resolves it to its head branch,
      fetches that branch, materialises a temporary git worktree from it, runs there, and removes
      the worktree when the session ends. the product comes from the draft the branch holds, so
      the product argument is optional where `--pr` is given.

      the session still works a working tree, as it always has; what changes is that the tool
      makes the tree rather than the owner. it needs a local clone of the pull request's
      repository, found from the working directory the command ran in; where there is none it
      says so and does nothing. a landing run from such a session lands that branch.
    status: proposed
    because:
      - r-ycjjl48r
      - d-gf6x5jzy
      - d-h418ljtp
    pinned:
      reason: public-api
      notes: the option and what it accepts are what the owner types
    facets:
      - tooling

  - id: d-f1b5r2f8
    title: a note on an entry is written into the draft, not onto the pull request
    statement: |
      a note the owner attaches to an entry is written by the submit into
      `drafts/entry-notes.md` in the draft's own directory, each note naming the entry's id and
      title and carrying the owner's text. the file is raw material the fold outranks: the agent
      revising the text reads it and removes what it has consumed.

      the draft carries the note rather than the pull request, because a session runs before a
      pull request may exist — the landing is what opens one — and a note that cannot be taken
      until then is a note the owner could not leave.

      a note settles nothing and gates nothing. an entry can carry a note and be accepted in the
      same submit, and unconsumed notes do not hold a landing closed.
    status: proposed
    because:
      - r-z0wcwwn0
      - d-ovlyaoht
      - d-h418ljtp
    pinned: false
    facets:
      - tooling
