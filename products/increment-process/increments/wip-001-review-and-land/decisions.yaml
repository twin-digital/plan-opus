version: "2"
decisions:
  - id: d-gf6x5jzy
    title: one interactive command carries the draft from ruling to published
    statement: |
      `design-process increment <product>` is a full-screen terminal application over the draft
      the working tree holds, and it is the whole flow: the owner rules from it and publishes
      from it, never switching commands. no new package, no service, and no browser — it reaches
      the fold, the projection, and the conflict check as library calls rather than
      reimplementing them.

      the session has modes, and what is open decides which are offered. ruling is where a draft
      carrying anything proposed or unanswered opens. landing becomes available exactly when
      nothing is proposed and no question is open, and is entered from the same session.
    status: proposed
    because:
      - r-ax84j1s2
      - r-2keswxn8
    pinned:
      reason: public-api
      notes: the command a published cli offers, and the gate on when landing appears
    facets:
      - tooling

  - id: d-9g0poz7v
    title: the ruling mode is a master list beside the entry's full text
    statement: |
      ruling mode is a list of every open entry beside a pane carrying the selected one in full
      — its statement, its pinning proposal, what it supersedes or amends, and what it cites.
      moving through the list moves the pane, and the ruling is taken on the selected entry from
      the statuses that entry admits: the four rulings for a decision, an answer and its route
      for a question. the list shows each entry's staged ruling beside it, so what is settled
      and what is left is legible without moving.

      one bulk action is offered beside the per-entry ruling and not instead of it: setting every
      entry still unruled to one status. it is the secondary path — a draft is ruled entry by
      entry, and the bulk action is for the tail the owner has already decided as a group.
    status: proposed
    because:
      - r-ax84j1s2
      - d-gf6x5jzy
    pinned: false
    facets:
      - tooling

  - id: d-ovlyaoht
    title: rulings stage in the session and apply in one write
    statement: |
      ruling an entry stages it and writes nothing; the staged set applies to the draft's own
      sources and commits on its branch in one write, when the owner submits it or when landing
      takes it. a session abandoned before that leaves the tree untouched.

      a decision takes one of the four rulings, and a rejection carries the owner's reason. a
      question is answered in the same pass: the answer closes it, and where the answer routes
      to a decision or a requirement the tool writes the entry into the draft with its id
      already generated, for the owner to state. staging refuses what the sources could not
      carry — a rejection with no reason, a routed answer with no entry — so a submitted set
      validates.
    status: proposed
    because:
      - r-ax84j1s2
      - d-gf6x5jzy
      - d-9s4d3ww2
    pinned: false
    facets:
      - tooling
      - process-doc

  - id: d-qzpfyc6s
    title: land is one fixed sequence that stops at the first failure
    statement: |
      land runs the published steps in order and stops at the first that fails, reporting what
      to fix and leaving the branch as it found it: apply any staged rulings, run the conflict
      check against the head, rename the wip directory into the number the head yields, run the
      full design check, commit, push, approve the pull request as the owner, and set the merge
      to complete on its own once the gate is green.

      the approval follows the push rather than preceding it, because a push after an approval
      dismisses it. nothing in the sequence needs judgement, and an increment carrying a
      proposed decision or an open question is refused before any of it runs.

      the same sequence is also `design-process land <product>`, non-interactive, for an agent
      or a script that has no session to land from. it is the secondary surface: the interactive
      command runs the sequence itself rather than shelling out to it.
    status: proposed
    because:
      - r-2keswxn8
      - d-gf6x5jzy
      - d-1qn5jzgd
      - d-6x6l6ws7
    pinned:
      reason: public-api
      notes: the order is what the owner relies on; a step moving changes what a landing does
    facets:
      - tooling
      - process-doc

  - id: d-6fur4w53
    title: the approving credential is typed in and held only in memory
    statement: |
      the credential that approves as the owner is a github personal access token entered at
      the terminal when the landing reaches the approval, with the input not echoed. it lives
      in the process's memory for that run and nowhere else — not in a file, not in the
      environment, not in an argument — and a second landing asks again.

      the token is the owner's own, and the credentials the agents hold are never used to
      approve. a landing that cannot obtain one still publishes everything up to the approval
      and reports the pull request as awaiting it.
    status: proposed
    because:
      - r-rxb7pn9z
      - d-qzpfyc6s
    pinned:
      reason: other
      notes: the owner's identity is what it spends; a later relaxation to a stored token would be silent
    facets:
      - tooling
