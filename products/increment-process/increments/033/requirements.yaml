version: "2"
requirements:
  - id: r-m8cwwkt3
    title: a statement is separate from its commentary
    statement: |
      a foundation's statement is separate from its commentary, and commentary never carries
      anything the product must do or preserve; where the two read differently, the statement
      wins.

  - id: r-0ls6xch4
    title: a statement fits a budget
    statement: |
      a foundation's statement fits a budget the validator checks mechanically.

  - id: r-q0969r5a
    title: implementers read requirements and decisions, not commentary
    statement: |
      what an implementer builds from carries the requirements and decisions in force and none
      of the commentary.

  - id: r-uc90eb7v
    title: a term is defined once, then just used
    statement: |
      a term the design leans on is defined once, owner-ratified; statements then use the word
      without restating its definition. Coining a term or changing a definition's meaning is an
      input change the owner rules.
