version: "2"
decisions:
  - id: d-gpwpa7ma
    title: the tooling surfaces the backlog
    statement: |
      the process tooling lists and searches held items the same way it surfaces facts and
      foundations, whatever store backs the backlog; an agent or the owner reaches the
      backlog through the tooling without knowing the store.
    status: proposed
    because:
      - r-hbihi1xh
      - r-2gcehlp8
    facets: tooling

  - id: d-wpih0mc1
    title: adoption rewrites, then drains
    statement: |
      a later increment adopts an item by writing the foundations it plans into its own
      sources at the ordinary bar — the braindump is raw material, never moved text — and
      the item leaves the backlog once that increment merges. the increment's sources are
      the record; the backlog keeps none.
    status: proposed
    because:
      - r-hbihi1xh
      - r-fvi1hqkn
    facets: process-doc
