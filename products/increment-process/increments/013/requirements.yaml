version: "1"
requirements:
  - id: r-4z3yd1ri
    title: a draft increment is checked as it is worked
    statement: |
      the merge gate reads a draft increment while it is being worked: its sources validate
      against their schemas, its proposed decisions and open questions are reported, and its
      foundations project — so an author sees what is wrong before landing, not after.
    verification:
      - do: put a schema violation into an in-flight draft increment's requirements source
      - verify: the merge gate reports it while the draft increment is still in flight
      - do: ask for the product's projection while the draft increment is in flight
      - verify: the draft's own requirements and decisions appear in it
    facets:
      - tooling
      - design-validator
