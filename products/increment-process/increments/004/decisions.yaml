version: "1"
decisions:
  - id: d-uwnjk7rn
    title: the tooling is one package, one CLI
    statement: |
      the validator, the projection, and the id generator ship as one opus workspace package —
      @twin-digital/design-process at nodejs/plan/design-process, kind npm-cli — exposing one
      design-process CLI with check, show, and id subcommands; structure below that surface
      stays implementation.
    status: accepted
    because:
      - d-cfe28w5z
    facets: tooling

  - id: d-r9o8qni5
    title: the documents live under docs/design-process/
    statement: |
      the initial document packages live at docs/design-process/process-reference.md,
      docs/design-process/agent-guidance.md, and docs/design-process/process-migration.md — the
      domain directory named for the process, one file per package.
    status: rejected
    rejection_reason: |
      violates the intention of d-lm8br2p2, which was documents at docs/process-reference.md,
      docs/agent-guidance.md, and so on — the design-process is a special case, omitting the
      typical product-name path segment under docs.
    because:
      - d-lm8br2p2
      - d-hdz4drvp
    facets: process-doc

  - id: d-0w7imrfe
    title: the documents live at the docs/ root
    statement: |
      the initial document packages live at docs/process-reference.md, docs/agent-guidance.md,
      and docs/process-migration.md — the process's own documents omit the product-name path
      segment, one file per package.
    status: delegated
    supersedes: d-r9o8qni5
    because:
      - d-lm8br2p2
      - d-hdz4drvp
    facets: process-doc

  - id: d-wb0qq8wv
    title: the gate reads preset conflict as id collision
    statement: |
      the mechanical conflict the merge gate blocks on is identity collision: a requirement id
      declared both by an adopted preset and by the product, or by two adopted presets. a
      semantic conflict between differently-numbered requirements stays with review and the
      open-question channel.
    status: accepted
    because:
      - r-bwtud1e5
    facets: design-validator

  - id: d-is1lgu15
    title: schema pool versions are dense
    statement: |
      the validator holds schema pool versions to dense integers per entity, the same rule the
      api pool carries by requirement.
    status: delegated
    because:
      - d-3wjypyx6
    facets: design-validator

  - id: d-emngkw5c
    title: pool immutability is content identity
    statement: |
      what the gate holds immutable about a bound pool version is its parsed content, keyed by
      identity: the file may move or be renamed freely, and any content change or removal of a
      bound identity blocks. binding is computed from every published increment — source
      version fields and model references, closed transitively over $refs.
    status: delegated
    because:
      - r-2fytqadu
    facets: design-validator

  - id: d-t03xkfj7
    title: both trees are checked until the migration empties design/
    statement: |
      npm run check runs the legacy checker over design/ and design-process check over
      products/, schemas/, apis/, and implementations/; the new validator ignores design/, and
      the legacy checker retires with the last design out.
    status: accepted
    because:
      - r-zcvxh2ty
    facets: design-validator

  - id: d-a8hiceqo
    title: one increment may not both adopt and drop a preset
    statement: |
      a single increment's presets block declaring one name both adopted and dropped is a
      validator failure — the folded state would otherwise depend on entry order.
    status: accepted
    because:
      - d-k48jh86c
    facets: design-validator

  - id: d-sjxyurcz
    title: an in-tree package's version is the record's built_at date
    statement: |
      a package consumed from the tree — the document and agent-skill kinds — has no released
      version, so an implementation record carries the record's built_at date as that
      package's version.
    status: rejected
    rejection_reason: |
      the record should carry the package's own declared version; every current tree-consumed
      doc type supports yaml frontmatter, so the file can encode a version itself.
    because:
      - d-lm8br2p2
      - d-0hedq82d
    facets: schema

  - id: d-39d4o4fn
    title: tree-consumed packages version themselves in frontmatter
    statement: |
      a package consumed from the tree — the document and agent-skill kinds — declares its
      version in a version field of its file's yaml frontmatter, bumped by the implementation
      that changes the file; an implementation record carries that declared version. the
      agent-skill loader ignores unrecognized frontmatter fields, so skills carry the field
      the same way documents do.
    status: delegated
    supersedes: d-sjxyurcz
    because:
      - d-lm8br2p2
      - d-0hedq82d
    facets: schema

  - id: d-zj004h21
    title: agent-skill packages run the document wave shape
    statement: |
      the agent-skill kind runs Claims, Compose, Check: a skill is a shipped instruction
      document read by agents, composed against the claims it operationalizes and checked
      claim by claim like any document deliverable.
    status: delegated
    because:
      - d-qb67fb8s
      - d-o81xclq7
    facets:
      - process-doc
      - prompts

  - id: d-m0on5vin
    title: the implementer skills, and how they dispatch
    statement: |
      the implementation process ships as agent-skill packages in this repository:
      .claude/skills/implement — the dispatcher, running one implementer per package with the
      package's kind selecting the skill — .claude/skills/implement-code for npm-library,
      npm-cli, and minecraft-addon, and .claude/skills/implement-document for document and
      agent-skill kinds. a kind without a skill is an open question for the implementation
      that meets it.
    status: rejected
    rejection_reason: |
      one entry mixes the general structure with per-kind detail; split so kinds and their
      skills can be added, retired, or changed without superseding the general part, which is
      pinned.
    because:
      - d-qb67fb8s
      - d-w74sea6u
      - d-zj004h21
    facets: prompts

  - id: d-ng02vmcd
    title: the implementation process ships as agent skills
    statement: |
      the implementation process ships as agent-skill packages in this repository, and
      .claude/skills/implement is the dispatcher: it binds to the fold at the target, opens
      the companion increment, and runs one implementer per package with the package's kind
      selecting the kind-specific skill; a kind without a skill is an open question for the
      implementation that meets it.
    status: proposed
    supersedes: d-m0on5vin
    pinned:
      reason: public-api
      notes: the entry point every implementation of every product runs through
    because:
      - d-qb67fb8s
      - d-w74sea6u
    facets: prompts

  - id: d-x2xw2tp2
    title: the code-kind implementer skill
    statement: |
      .claude/skills/implement-code carries the code wave shape — Define, Stub, Code,
      Document — for the npm-library, npm-cli, and minecraft-addon kinds.
    status: delegated
    because:
      - d-ng02vmcd
      - d-rvvijts2
    facets: prompts

  - id: d-ydcyoa80
    title: the document-kind implementer skill
    statement: |
      .claude/skills/implement-document carries the document wave shape — Claims, Compose,
      Check — for the document and agent-skill kinds.
    status: delegated
    because:
      - d-ng02vmcd
      - d-o81xclq7
      - d-zj004h21
    facets: prompts
