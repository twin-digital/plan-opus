version: "2"
decisions:
  - id: d-4nez3mjh
    title: the projection counts deferrals and excludes them from coverage
    statement: |
      the decisions heading counts deferred entries beside the rulings — "N deferred —
      awaiting their answers" — and a deferred entry renders in the set like any other,
      its status line reading deferred. the coverage section omits deferred decisions
      from the claim list, and its summary line names how many it excluded.
    status: delegated
    because:
      - d-o1atez5i
      - d-3orwwaze
    facets: tooling

  - id: d-blant5zn
    title: the census is per-package YAML under the increment's drafts
    statement: |
      a survey returns one census per package: entries each carrying the choice met,
      where in the build it arises, and the implementer's reading, as structured YAML
      the dispatcher concatenates for Clarify. a census the increment acted on persists
      at drafts/survey-census.yaml in the increment that ran it; one acted on in no way
      is discarded.
    status: delegated
    because:
      - d-uupj1stg
    facets: prompts

  - id: d-e8h0g9e3
    title: the overturn count lands in the companion's pull request description
    statement: |
      the orchestrator counts the companion increment's overturns — entries whose
      supersedes names a plan-ruled decision — and states the count in the companion
      increment's pull request description, where the owner rules at ratify.
    status: delegated
    because:
      - d-o2jjvrk5
      - d-ub6h6h5u
    facets: prompts
