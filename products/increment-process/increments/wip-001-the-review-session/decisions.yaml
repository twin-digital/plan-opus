version: "2"
decisions:
  - id: d-4uz3egbj
    title: ratify is offered for every draft, settled or not
    statement: |
      ratify is offered for every draft, whatever statuses its entries hold, and is where a session
      opens. nothing proposed and no question open is the landing's condition, not the session's.
    status: accepted
    because:
      - r-0h5q1lfl
      - r-ax84j1s2
      - d-7i1l1kfy
    pinned:
      reason: public-api
      notes: |
        which drafts the published command opens on
    facets:
      - tooling
  - id: d-v2aky476
    title: the session works a draft, and a published increment is read through show
    statement: |
      the session works a draft on its pull request; a published increment is read through `show`.
      an entry that landed is changed by a later increment superseding it, not by a sitting
      reopening it.
    status: proposed
    because:
      - d-4uz3egbj
      - d-udx0fefp
      - d-9s4d3ww2
    pinned: false
    facets:
      - tooling
      - process-doc
  - id: d-nb5yg1w1
    title: a submit does not end the sitting
    statement: |
      a submit returns the owner to the list, with the staged set cleared of what it wrote. the
      session ends when the owner ends it or a landing completes, and no outcome of a submit ends
      it. the exit code is what the sitting was, not what a submit did.
    status: accepted
    because:
      - r-clty5lqd
      - r-ax84j1s2
      - d-ovlyaoht
      - d-x1jlr7jc
    pinned:
      reason: public-api
      notes: |
        whether a sitting continues is what the owner plans a sitting around
    facets:
      - tooling
  - id: d-x1jlr7jc
    title: a refused push pulls, reapplies by id, and tries again
    statement: |
      the commit a submit writes names each status the set took and its count — `3 accepted, 1
      rejected` — omitting a status no entry took and counting answered questions as their own
      clause; a sitting that changed nothing writes no commit. the submit then pushes.

      a refused push is not the end of it: the session fetches the tip, reapplies the sitting's
      rulings by entry id, and pushes again. it may unwind its own unpushed commit to do so, and
      never rewrites one the remote has accepted. an entry whose status differs at the tip is left
      as the tip has it and reported to the owner, its ruling leaving the stage. a second refusal is
      reported and the sitting continues.

      the owner's rulings are durable from the write until the push is accepted or the owner is told
      it was not.
    status: tolerated
    because:
      - r-clty5lqd
      - r-ax84j1s2
      - d-ovlyaoht
      - d-yfxziwwg
    supersedes: d-lqmwczg3
    pinned:
      reason: public-api
      notes: |
        the commit body every later reader of the branch sees
    facets:
      - tooling
  - id: d-26vs308h
    title: the draft's requirements are a second list beside its decisions
    statement: |
      the session holds a second list carrying the requirements the draft declares and its model
      bindings, in the ratify list's arrangement. a session opens on the decisions list, and the key
      that moves between them is the implementer's.

      an entry there takes a note and no ruling — the process gives it no status to leave. a submit
      carrying only notes writes no commit and posts its review against the branch as the remote
      already has it.
    status: accepted
    because:
      - r-84zd8sfk
      - r-ax84j1s2
      - d-8abusqwe
      - d-fi7zsgez
      - d-f1b5r2f8
    pinned:
      reason: public-api
      notes: |
        the screen the owner works from
    facets:
      - tooling
  - id: d-g00ah4em
    title: the list marks what an entry closes and what closed it
    statement: |
      an entry is marked where it closes another foundation — `supersedes`, `amends`, or a
      `retires` entry — and marked differently where a later entry of the same draft closes it. an
      entry that is both carries the closing mark. which colours carry them is the implementer's.
    status: tolerated
    because:
      - r-n86ssoew
      - d-8abusqwe
    pinned: false
    facets:
      - tooling
  - id: d-smnssz39
    title: the screen's reading rule holds for every ratify-screen version
    statement: |
      `d-q50z7iq1` states how `/design-process/ratify-screen@1` is read; it is read that way at
      every version. a build is checked against the frames of the version its product binds.
    status: delegated
    because:
      - d-q50z7iq1
      - d-9zot40jn
      - r-j232vwp4
    pinned:
      reason: public-api
      notes: |
        what conformance to the screen means, and so what a build is checked against
    facets:
      - tooling
      - schema
  - id: d-ufuosc77
    title: a companion increment is gated as a whole and reviewed entry by entry
    statement: |
      a companion increment reaches the owner as a plan draft does: its pull request opened,
      everything pushed, the url handed over, and the branch left alone while a sitting is open.

      what stays whole is the gate, not the review. the merge gate reads `proposed` entries and open
      questions, so an all-`delegated` companion lands without a per-entry ruling while every entry
      stays reachable in the session.
    status: delegated
    because:
      - r-0h5q1lfl
      - d-4uz3egbj
      - d-n23bxend
      - d-wtgyvwf3
      - d-msvpbva6
    pinned: false
    facets:
      - prompts
      - process-doc
  - id: d-r01s6ek8
    title: a note directing no change is answered by saying so
    statement: |
      a review thread carrying a note that asks for no change to any source is answered by replying
      that none was needed and resolving it.
    status: rejected
    because:
      - d-26vs308h
      - d-fi7zsgez
      - d-tmyu6t1y
      - r-z0wcwwn0
    pinned: false
    facets:
      - prompts
      - process-doc
    rejection_reason: >-
      what is the point of this? also, remove references to CLAUDE.md -- that should not really be a
      part of how this product is designed
