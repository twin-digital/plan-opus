version: "2"
decisions:
  - id: d-81dz2qz2
    title: landing replaces the number collision
    statement: |
      a draft holds no number while it is in flight, so two drafts cannot claim one number
      and nothing collides at merge. the number is claimed serially, by the landing rename;
      what the landing checks is overlapping or duplicated rulings against the fold at head,
      and the later of two overlapping drafts recomputes against the head that moved.
    status: delegated
    supersedes: d-d6hwdg9d
    because:
      - d-f7knzaf9
      - d-u3744xlr
      - r-c0zi3pv0
      - r-0701ctqx
    facets:
      - process-doc
      - design-validator

  - id: d-wcnyuwkv
    title: the plan skill drives one draft to publish
    statement: |
      the plan skill runs the Plan loop for one draft end to end: it opens the draft
      unnumbered on its own branch, works Clarify in the foundation sources — research
      landing as facts at the evidence bar, unknowns raised as open questions routed by
      answer, decisions entering proposed — checks the result against the authoring
      document's closing checklist, then runs the Ratify loop through the draft's pull
      request: presenting the projection and the question list, applying the owner's
      rulings, and consuming the feedback to raise more, iterating until the owner declares
      it settled, and landing it into the next number once the merge gate passes.
    status: delegated
    supersedes: d-52uunxo6
    because:
      - d-ebyludv0
      - d-auo2680a
      - d-af2v9seu
      - r-05tkrv7r
      - d-f7knzaf9
    facets: prompts
