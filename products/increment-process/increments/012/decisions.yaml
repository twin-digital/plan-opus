version: "2"
decisions:
  - id: d-dyfgmg2u
    title: the backlog command surface
    statement: |
      the backlog is worked through `design-process backlog <op>`, a subcommand group of the
      one design-process CLI. every operation takes `--root <dir>` (default `.`),
      `--remote <name>` (default `origin`), and `--offline` to skip the fetch that refreshes
      the local view; every mutating operation takes `--no-push` to commit without pushing.

        design-process backlog add <product> [--title <text>] [--tag <tag>]... [--file <path>]
        design-process backlog list [--product <id>] [--tag <tag>]... [--json]
        design-process backlog search <query> [--product <id>] [--tag <tag>]... [--json]
        design-process backlog show <id>
        design-process backlog update <id> [--title <text>] [--tag <tag>]... [--add-tag <tag>]...
                                           [--remove-tag <tag>]... [--file <path>] [--product <id>]
        design-process backlog delete <id>...
        design-process backlog send <increment-dir> [--item <id>]... [--product <id>] [--tag <tag>]...

      `add` takes the body from stdin, or from `--file <path>` (`-` for stdin); `--title` heads
      an untitled body with `# <title>`, and a body that already leads with a heading supplies
      the title itself — giving both is an error, giving neither is an error. `add` prints the
      new id and nothing else, so `ID=$(design-process backlog add ...)` is the capture idiom.
      the id is minted by the tooling as `b-` plus eight random lowercase base36 characters,
      unique against the ids already on the branch; `design-process id` still takes only
      r, d, and q — a backlog id is never asked for separately.

      `list` and `search` print one item per line as four space-separated, padded columns —
      id, product, title, comma-joined tags — with the product column always present and
      never suppressed, and a title of `(untitled)` where the item carries no heading. items
      sort by product, then id. `--tag` repeats and requires every tag named; `--product`
      narrows to one product. `search` matches case-insensitive substrings over an item's id,
      title, and body. `--json` emits an array of `{id, product, title, tags}`. an empty
      result writes a note to stderr and nothing to stdout, so the machine-readable stream
      stays clean.

      `update`'s `--tag` replaces the tag set outright; `--add-tag` and `--remove-tag` adjust
      it; `--product` moves the item to another product keeping its id. `delete` takes one or
      more ids in a single commit.

      `send` copies each selected item's content into the increment directory named and
      deletes the item from the branch in the same action, printing `<id>\t<path>` per item.
      `<increment-dir>` is a repo-relative `products/<product>/increments/<name>` — a
      slug-named draft directory as readily as a numbered one. at least one of `--item`
      (repeatable), `--product`, `--tag` is required; a bare `send` is an error rather than a
      drain of everything.

      commits on the branch are subject-lined `backlog: <op> <id> — <title>`, and
      `backlog: <op> <n> items` with the ids in the body when an operation touches several.
    status: delegated
    pinned:
      reason: public-api
      notes: the shipped skills and documents write these command lines, and agents script
        against add's single-token stdout
    because:
      - d-dxlllx6y
      - r-9qhjtznd
      - r-oabwygl2
      - d-ubltnjpp
      - d-kfy1sexh
      - d-wpih0mc1
    facets: tooling

  - id: d-z2n96v40
    title: the resolver and diff surfaces
    statement: |
      two commands, both taking `--root <dir>` (default `.`).

        design-process where <product> [--at <increment> | --at-ref <gitref>] [--next]
        design-process diff <product> (--from <increment> | --from-ref <gitref>)
                                      [--to <increment> | --to-ref <gitref>] [--json]

      `where` prints the product's latest published increment at `--at`, zero-padded to three
      digits, and nothing else — one token, for shell substitution. `--at` defaults to the
      working tree. `--next` prints the number a landing would claim instead: the latest plus
      one, or `001` for a product with no increments there. without `--next`, a product that
      has published nothing at that version writes a message to stderr and exits 1.

      `diff` reports the delta between two fold versions in four categories: `added` (a
      foundation in force at the later version and not the earlier), `amended` (a requirement
      replaced by a later requirement's `amends:`), `superseded` (a decision replaced by a
      later decision's `supersedes:`), and `retired` (an entry closed by a `retires:` entry,
      carrying its recorded reason). `--to` defaults to the working tree, so `--from 010`
      alone answers what this branch has changed since 010. the default rendering is markdown
      in the projection's idiom — an `# <product>: <from> → <to>` heading, then an
      `## <category> (<n>)` section per non-empty category, each entry
      `- <id> (<increment>) [<kind>] — <title>` for added and `- <id> (<increment>) by <id>`
      for a closure; `(no change)` when nothing moved. `--json` emits the same delta
      structurally. a `--to` that precedes `--from` is an error, not a reverse diff.

      both commands take their fold versions as d-9y7b8qtd fixes them: a bare parameter names
      an increment, its `-ref` counterpart a git ref. `show --at` is unchanged in meaning and
      gains `--at-ref`.
    status: delegated
    pinned:
      reason: public-api
      notes: skills and documents pass versions and parse where's single-token output
    because:
      - d-twb4uga9
      - r-tne4cdos
      - r-v6mknsh7
      - d-9y7b8qtd
    facets: tooling

  - id: d-imz61dd5
    title: the CLI carries the subcommands the fold requires
    statement: |
      the validator, the projection, and the id generator ship as one opus workspace package —
      @twin-digital/design-process at nodejs/plan/design-process, kind npm-cli — exposing one
      design-process CLI whose subcommands are check, show, id, where, diff, conflicts, and
      the backlog group; structure below that surface stays implementation. the enumeration
      grows as the fold requires tooling, and naming a subcommand here is not what makes it
      public: the surface decision that introduces one does that.
    status: delegated
    supersedes: d-uwnjk7rn
    because:
      - d-cfe28w5z
      - r-9qhjtznd
      - r-tne4cdos
      - r-v6mknsh7
      - r-0701ctqx
    facets: tooling

  - id: d-kmagri5u
    title: the landing conflict check is its own command, over mechanical overlaps only
    statement: |
      `design-process conflicts <product> [--root <dir>]
      [--against <increment> | --against-ref <gitref>]` runs the
      landing check. `--against` names the head to check against, defaulting to `origin/main`
      then `main`. it covers every increment directory in the working tree that is
      slug-named or numbered above the head — what this branch would add to the sequence —
      and reads slug-named directories, which `check` refuses by design.

      two overlaps are findings: a foundation id the draft declares that the head already
      declares (`landing-duplicate-id`), and an `amends:`, `supersedes:`, or `retires:` aimed
      at an entry not in force at the head (`landing-already-closed`). semantic overlap — two
      drafts ruling the same choice under different ids — is not machine-checkable and stays
      the owner's scan of open drafts, as d-u3744xlr rules.

      findings print in `check`'s shape — `✖ [<rule>] <path>: <message> (<claims>)` — and the
      command exits 1 when any exist, so landing can gate on it. the check ships as a
      separate command and not as a validator rule, keeping d-yu9hbn3h intact.
    status: accepted
    pinned:
      reason: public-api
      notes: the plan skill's landing step runs it and reads its exit code
    because:
      - r-0701ctqx
      - d-u3744xlr
      - d-yu9hbn3h
      - d-oel258yc
    facets: tooling

  - id: d-hg0f9shd
    title: a sent item lands in the increment's drafts
    statement: |
      send-to-capture writes an item's content to
      `products/<product>/increments/<name>/drafts/backlog/<id>.md`. the increment's `drafts/`
      folder is where the process already keeps raw material that is never normative, which is
      what d-wpih0mc1 calls the braindump; the `backlog/` subdirectory keeps adopted items
      identifiable as such. the file is the item's stored form verbatim, frontmatter included,
      so the tags travel with it. the adopting agent then writes foundations at the ordinary
      bar and the draft freezes with the increment at publish.
    status: accepted
    pinned:
      reason: data-format
      notes: a path written to disk that the plan skill and the process reference both name
    because:
      - d-wpih0mc1
      - r-9qhjtznd
      - d-kn05wb30
    facets: tooling

  - id: d-5pzfayi8
    title: the backlog is written with git plumbing, never a checkout
    statement: |
      every backlog write builds its commit with `hash-object`, a temporary index,
      `write-tree`, `commit-tree`, and `update-ref`, and pushes the branch by refspec. the
      working tree and the checked-out branch are never touched, so an agent captures an item
      mid-task with a dirty tree and nothing is interrupted — which is what r-pvcrlqg5's one
      action, task uninterrupted costs in practice. the first write creates `backlog` as a
      parentless commit, so the branch shares no history with main.

      the branch tip is the remote's where a remote exists; a best-effort fetch refreshes the
      local mirror before every operation, and `--offline` skips it, in which case a read may
      be stale. a repository with no such remote skips the push silently rather than failing.
    status: delegated
    because:
      - d-kfy1sexh
      - r-pvcrlqg5
      - d-dxlllx6y
    facets: tooling

  - id: d-81dz2qz2
    title: landing replaces the number collision
    statement: |
      a draft holds no number while it is in flight, so two drafts cannot claim one number
      and nothing collides at merge. the number is claimed serially, by the landing rename;
      what the landing checks is overlapping or duplicated rulings against the fold at head,
      and the later of two overlapping drafts recomputes against the head that moved.
    status: delegated
    supersedes: d-d6hwdg9d
    because:
      - d-f7knzaf9
      - d-u3744xlr
      - r-c0zi3pv0
      - r-0701ctqx
    facets:
      - process-doc
      - design-validator

  - id: d-fiul12e8
    title: a code package's public contract is minimised by default
    statement: |
      a code implementer builds to a minimal public surface: one entry point, no subpath
      wildcards, no export * from an entry point, and internals unreachable from outside.
      these are working defaults, not gates — a package that departs from one records the
      departure as a companion-increment decision, and internal structure stays free to
      reorganise.
    status: delegated
    because:
      - d-rx3s2hqo
      - d-x2xw2tp2
    facets: prompts

  - id: d-wcnyuwkv
    title: the plan skill drives one draft to publish
    statement: |
      the plan skill runs the Plan loop for one draft end to end: it opens the draft
      unnumbered on its own branch, works Clarify in the foundation sources — research
      landing as facts at the evidence bar, unknowns raised as open questions routed by
      answer, decisions entering proposed — checks the result against the authoring
      document's closing checklist, then runs the Ratify loop through the draft's pull
      request: presenting the projection and the question list, applying the owner's
      rulings, and consuming the feedback to raise more, iterating until the owner declares
      it settled, and landing it into the next number once the merge gate passes.
    status: delegated
    supersedes: d-52uunxo6
    because:
      - d-ebyludv0
      - d-auo2680a
      - d-af2v9seu
      - r-05tkrv7r
      - d-f7knzaf9
    facets: prompts

  - id: d-cueyrbon
    title: the package exports one entry point
    statement: |
      @twin-digital/design-process exports a single "." entry point whose named re-exports
      are the types and functions a consumer is meant to reach; the subpath wildcard that
      made every module under src/ importable is gone, and structure below the entry point
      is implementation the package may reorganise freely. the change is breaking and ships
      as a minor bump, which is what a 0.x version permits.
    status: accepted
    pinned:
      reason: public-api
      notes: the export map is what a consumer resolves against
    because:
      - d-fiul12e8
      - d-imz61dd5
      - d-cfe28w5z
    facets: tooling

  - id: d-euwmthl9
    title: a prepare-wave working list is transient
    statement: |
      the list a prepare wave builds to drive its own composition — the document kind's claim
      list, the code kind's test plan — is an input to the work, not a deliverable: it is kept
      outside the tree and discarded when the phase ends. only a survey census persists, and
      only where d-blant5zn places it.
    status: delegated
    because:
      - d-o81xclq7
      - d-rvvijts2
      - d-blant5zn
      - d-nt7tach6
    facets: prompts

  - id: d-i8qe4bmp
    title: an implementer's decisions are scoped to the work in front of it
    statement: |
      a choice the fold left open that an implementer must settle is settled for the case in
      front of it and recorded at that scope; the implementer does not generalise the ruling
      past what its package needed.
    status: delegated
    because:
      - d-98df3rlb
      - d-n23bxend
      - d-i1reuf3u
      - r-v4z0h7dn
    facets: prompts

  - id: d-211hgo91
    title: what the single entry point re-exports
    statement: |
      the "." entry point of @twin-digital/design-process re-exports, by name, the operations
      behind the CLI's subcommands — validateTree, projectProduct, collectIds and generateIds,
      parseFoldVersion, formatIncrement and resolveFold, diffFolds and renderFoldDiff,
      findLandingConflicts, and the seven backlog operations with BACKLOG_BRANCH — together
      with DirTree, GitTree, resolveGitRef, and the types those signatures name. nothing else
      under src/ is reachable, and no export is a wildcard or an `export *`.

      the enumeration is what is fixed here; a signature follows the decision that rules the
      surface it serves — parseFoldVersion takes a flag pair because d-9y7b8qtd made a fold
      version two parameters.
    status: delegated
    pinned:
      reason: public-api
      notes: the named exports a consumer resolves and can come to depend on
    because:
      - d-cueyrbon
      - d-9y7b8qtd
      - d-fiul12e8
      - d-imz61dd5
    facets: tooling

  - id: d-y8wvy666
    title: a losing backlog write retries against the winner
    statement: |
      a backlog write whose push is rejected because the branch moved puts the local branch
      back where it was, refetches the tip, re-applies the change over what the winner left,
      and pushes again — four attempts by default. exhausting them exits non-zero saying the
      branch moved, with the local branch unchanged. no item is lost and no manual recovery
      is needed.
    status: delegated
    because:
      - d-kfy1sexh
      - d-5pzfayi8
      - r-9qhjtznd
    facets: tooling

  - id: d-9y7b8qtd
    title: an increment and a git ref are separate parameters
    statement: |
      wherever the tooling takes a fold version it takes two parameters, not one: the bare
      parameter names an increment, and its `-ref` counterpart names a git ref. `--at` and
      `--at-ref`, `--from` and `--from-ref`, `--to` and `--to-ref`, `--against` and
      `--against-ref`. giving both members of a pair is an error.

      an increment parameter takes the number with or without padding — `9` and `009` are the
      same increment — because nothing is inferred from the argument's form any more. defaults
      are unchanged: `show --at` and `where --at` default to the working tree, `diff --to`
      defaults to the working tree, and `conflicts --against` defaults to origin/main then
      main. `diff` requires one of `--from` or `--from-ref`.

      the form a value takes no longer decides what it means. under d-0lkxin7b `--at 9` named a
      git ref, which is the natural way to type increment 9 and the wrong answer — silently so
      wherever a ref of that name exists.
    status: accepted
    supersedes: d-0lkxin7b
    pinned:
      reason: public-api
      notes: agents and the shipped documents pass versions in this form
    because:
      - r-tne4cdos
      - r-v6mknsh7
    facets: tooling
