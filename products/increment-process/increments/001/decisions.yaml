version: 1
decisions:
  - id: d-9dx9ryhk
    title: effective state is a fold
    statement: |
      an increment declares what changed; the effective requirement and decision sets are
      computed by folding across the product's increments, and the computed view is what the
      owner reads.
    status: proposed
    because:
      - r-caao9k3z
    pinned:
      reason: data-format
      notes: every product's foundations are written and read through the fold
    facets:
      - schema
      - tooling

  - id: d-kn05wb30
    title: increment sources live under products/
    statement: |
      increment artifacts live at products/<product>/increments/<NNN>/ — requirements.yaml,
      decisions.yaml, model.yaml, the sources later process increments define, and
      increment.yaml only when it has something to declare — with the product declared by the
      presence of products/<product>/product.yaml, whose directory name is the product id.
    status: proposed
    because:
      - d-9dx9ryhk
    pinned:
      reason: data-format
      notes: tooling resolves ids against these paths, and every product writes to them
    facets: schema

  - id: d-j4scg1vy
    title: publish is the merge
    statement: |
      an increment is draft while off main and published by merging; the gate runs at merge,
      main holds only published increments, dense and immutable, and draft-versus-published is
      location, not a stored field.
    status: proposed
    because:
      - r-caao9k3z
      - r-0axqvtcc
    pinned:
      reason: data-format
      notes: the fold and the design validator read main as settled history
    facets:
      - schema
      - design-validator

  - id: d-9v6m2n7r
    title: the fold at an increment is the bundle
    statement: |
      implementers implement against the fold at a published increment — product@N — derivable on
      demand and identical forever since every input is immutable; the increment number is the
      version, the declared delta the changelog, and no bundle artifact is published unless an
      external consumer needs a frozen file, in which case collation output releases like any
      package.
    status: proposed
    because:
      - r-sk47gw08
      - d-j4scg1vy
    pinned:
      reason: data-format
      notes: |
        product@N is the reference implementations and after: resolve against
    facets:
      - schema
      - tooling

  - id: d-2knvbahc
    title: files name their own schema version
    statement: |
      every structured file this process defines carries version — the pool version of the
      file's own schema, so a requirements source with version 2 is interpreted by the pool
      schema requirements@2. interpretation is one lookup, no fold, and a published file
      stays readable forever in the dialect it was written in; foundation files are keyed
      mappings, the version beside a key naming the entry kind.
    status: proposed
    because:
      - r-caao9k3z
      - r-2fytqadu
    pinned:
      reason: data-format
      notes: the first field every reader consults
    facets: schema

  - id: d-gkr3l8tx
    title: schema identity is declared, the path is convention
    statement: |
      a pool schema carries its identity as $id — <name>@<version>, names unique across the
      repository, versions dense integers per name — beside $schema; resolution scans the pool
      by identity, and the path carries no meaning to it. the current filing groups schemas by
      domain — schemas/design-process/<entity>.<version>.yaml — and aids navigation only; an
      id-to-file index, if scale ever wants one, is generated on demand and never committed.
    status: proposed
    because:
      - r-2fytqadu
    pinned:
      reason: data-format
      notes: every schema reference in every product resolves against this identity form
    facets: schema

  - id: d-ke7709uf
    title: the model is a per-increment source
    statement: |
      model.yaml lists entities — name, schema as <pool-name>@<version>, an optional
      description — and folds by name like the other sources, retiring an entity with a name
      and a reason; an entity's name is the design's word for it, free to differ from the pool
      schema's.
    status: proposed
    because:
      - r-bua9wl1s
    pinned:
      reason: data-format
      notes: part of the increment source shape every product writes
    facets: schema

  - id: d-y0vuo11f
    title: schemas are JSON Schema in YAML
    statement: |
      schemas are JSON Schema, draft 2020-12, authored as YAML; each file carries $schema for
      its dialect and $id for its identity. a more concise or expressive formalism meeting the
      foreseeable needs may displace it.
    status: proposed
    because:
      - r-2fytqadu
    pinned:
      reason: data-format
      notes: every schema file in every product is written in it
    facets: schema

  - id: d-9s4d3ww2
    title: rulings are accepted, tolerated, delegated, or rejected
    statement: |
      the owner's ruling on a decision is accepted, tolerated, delegated, or rejected;
      tolerated is a judgement and delegated an abstention, kept distinct; rejection is
      reserved for the impossible, non-viable, or incorrect, carries the owner's reason on the
      entry, and is closed by a replacement proposed by whoever proposed the rejected one.
    status: proposed
    because:
      - r-gc7a3m56
    pinned:
      reason: data-format
      notes: the status enum every decision entry carries
    facets: schema

  - id: d-wrjhfbei
    title: pinned is false or a named reason
    statement: |
      pinned is false or { reason, notes? }; reason is an enum — data-format, public-api,
      other — with notes required for other; pinning, not status, is what escalation reads.
    status: proposed
    pinned:
      reason: data-format
      notes: part of the decision shape every product writes
    facets: schema

  - id: d-e5ted839
    title: ids are opaque and random
    statement: |
      requirement and decision ids are {prefix}-{8 lowercase base36 characters}, random,
      produced by a CLI generator; title carries the human label and may churn freely; the id
      is the citation form.
    status: proposed
    pinned:
      reason: data-format
      notes: every citation in every product resolves against this format
    facets:
      - schema
      - design-validator

  - id: d-1sj9kxtj
    title: requirement presets are plan-only products
    statement: |
      shared requirements live in presets — products that build nothing — adopted whole at
      pinned increments via adopts and drops; adopting and dropping are owner fiat, and the
      wider requirement scopes are retired.
    status: proposed
    because:
      - r-bwtud1e5
    pinned:
      reason: data-format
      notes: adopts and drops are part of every increment's shape
    facets:
      - schema
      - process-doc

  - id: d-jy7x42nx
    title: retirement is an id and a reason
    statement: |
      a claim with no successor is retired by a retires: entry — one id, one one-line reason —
      in the increment source whose file scopes its kind; supersession is carried by the
      successor's supersedes or amends and needs no entry.
    status: proposed
    because:
      - d-9dx9ryhk
    pinned:
      reason: data-format
      notes: part of the increment source shape every product writes
    facets: schema

  - id: d-i8rwe1sv
    title: facets are labels no rule reads
    statement: |
      a claim may carry facets from the product's declared vocabulary; collation filters and
      groups by them, and no rule fences, escalates, or gates on them; wanting such a rule is
      the signal the facet has become a product.
    status: proposed
    pinned:
      reason: other
      notes: |
        the filter-only line is what keeps facets cheap to assign; a rule reading them would
        change their meaning repo-wide
    facets:
      - schema
      - tooling

  - id: d-8itv1czm
    title: products map to packages by path and kind
    statement: |
      product.yaml lists packages as path and kind, with an optional repo in owner/repo form
      defaulting to twin-digital/opus. the mapping describes what exists — a package enters it
      when the implementation that creates it does, and intent to ship one is a requirement or an ask —
      so anything else a kind needs is read from the package at that path rather than
      duplicated, a read that cannot dangle because every listed package has been implemented.
    status: proposed
    pinned:
      reason: data-format
      notes: coverage refs and release tracking resolve through this mapping
    facets: schema

  - id: d-nzba0wqu
    title: documents live under docs/, drafts under docs/proposals/
    statement: |
      shipped document packages live at permanent homes under docs/<domain>/, entering
      product.yaml at the merge that ships them; docs/proposals/ is the conventional home of
      synthesis drafts, confined to increment branches, and the merge gate rejects anything
      under it.
    status: proposed
    because:
      - r-yzkxa2hj
      - r-bs6wsobr
    pinned:
      reason: data-format
      notes: the paths every product's documents and drafts use
    facets:
      - schema
      - process-doc

  - id: d-eaw3u72o
    title: because cites requirements, facts, and decisions
    statement: |
      because: on a decision cites the requirements it follows from, the facts that drove it,
      and the decisions it builds on; collation orders the decision set by that topology, and
      superseding or retiring an entry surfaces its dependents.
    status: proposed
    because:
      - r-ei82daip
    pinned:
      reason: data-format
      notes: the citation field every product's decisions carry
    facets:
      - schema
      - tooling

  - id: d-keftop3f
    title: cross-product work orders by after
    statement: |
      a wave needing a change in another product files an ask there rather than reaching
      across; the consuming increment names the resulting increment in after:, and the publish
      gate holds it until everything named is published.
    status: proposed
    pinned:
      reason: data-format
      notes: part of the increment shape, and a rule the publish gate reads
    facets:
      - schema
      - design-validator

  - id: d-pm0a8api
    title: ask re-offers the deferred
    statement: |
      the collated view at ask leads with the tolerated decisions in force, the delegated
      count, and the attested share; no threshold fires — the numbers meet the owner at the
      moment of choosing what to implement next.
    status: proposed
    pinned: false
    facets:
      - tooling
      - prompts

  - id: d-rx3s2hqo
    title: decisions record the observable
    statement: |
      a decision is recorded when a consumer could observe its outcome or a reimplementation must
      preserve it; choices below that bar live in the code, and a reimplementation is free to re-make
      them.
    status: proposed
    because:
      - r-ei82daip
    pinned: false
    facets:
      - prompts
      - process-doc
