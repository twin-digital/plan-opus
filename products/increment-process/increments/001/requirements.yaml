version: 1
requirements:
  - id: r-caao9k3z
    title: shipped increments stay shipped
    statement: |
      a published increment is never unsettled by later work: drafting increment N+1 changes
      nothing about increment N.
    satisfied_when: |
      the checker rejects any edit to a file of a published increment, and later changes appear
      in the fold as new entries superseding or retiring earlier ones.
    facets: checker

  - id: r-ei82daip
    title: decisions are comprehensible as a set
    statement: |
      the owner can comprehend what was built from the decision set alone, read in full.
    satisfied_when: |
      not mechanically checkable — whether the collated view reads as a picture of the product
      is a judgement, verified by the owner reading it each increment.
    facets: collation

  - id: r-bs6wsobr
    title: no spec survives an increment
    statement: |
      no per-product spec document is maintained or merged; a synthesis draft is Clarify
      technique, confined to the increment's branch, and discarded once nothing in it would be
      lost — every claim extracted into a foundation or citing one.
    satisfied_when: |
      main holds no spec artifact, and the merge gate fails an increment still carrying its
      draft.
    facets:
      - process-doc
      - collation

  - id: r-yzkxa2hj
    title: the process ships its reference
    statement: |
      the process's normative reference — what agents and the owner read to run it — is a
      shipped deliverable: document-kind packages at permanent homes in this repository.
    satisfied_when: |
      product.yaml lists document packages whose paths exist and hold the current reference.
    facets: process-doc

  - id: r-0axqvtcc
    title: nothing publishes over a proposed decision
    statement: |
      no increment merges or publishes while one of its decisions is still proposed.
    satisfied_when: |
      the merge gate fails an increment carrying a decision whose status is proposed.
    facets: checker

  - id: r-gc7a3m56
    title: ruled-on is distinguishable from passed-over
    statement: |
      what the owner engaged and judged is distinguishable, product-wide, from what they
      abstained on.
    satisfied_when: |
      tolerated and delegated are distinct statuses, and collation reports the delegated count.
    facets:
      - schema
      - collation

  - id: r-sk47gw08
    title: design and build keep their own schedules
    statement: |
      finishing a plan and building it are separately schedulable: a ratified plan publishes
      without a build, and a build may come later — or never.
    satisfied_when: |
      a plan-only increment passes the merge gate, and a later increment's ask carries its
      requirements into a build.
    facets:
      - process-doc
      - checker

  - id: r-bwtud1e5
    title: nothing binds a product until it says so
    statement: |
      no requirement outside a product's own increments binds it; adoption at a pinned
      increment is the only way an external requirement takes force.
    satisfied_when: |
      the checker resolves a product's obligations only from its own increments' entries and
      adoptions, and no global or area scope exists to bind implicitly.
    facets: checker
