version: "1"
requirements:
  - id: r-gq90gngs
    title: foundations have defined shapes and meanings
    statement: |
      every foundation artifact — requirement, decision, model binding, product and increment
      declaration — has a formally defined shape and a stated meaning: its form checkable by
      machine, its intent readable by a person.
    satisfied_when:
      - every foundation file validates against a pool schema in force
      - the shipped process reference states each foundation's meaning
    facets:
      - schema
      - process-doc

  - id: r-6n45h5eb
    title: foundations are expressed and reviewed directly
    statement: |
      the owner and agents author foundations directly, as plain files; review is an ordinary
      pull-request diff, and the owner can read every claim in full.
    satisfied_when:
      - foundations are plain-text files, authored by hand or by agent, reviewed as ordinary diffs
    facets: process-doc

  - id: r-2gcehlp8
    title: tooling folds foundations
    statement: |
      tooling computes the effective state of a product at any increment by folding its
      declarations, and the computed view is what the owner reads.
    satisfied_when:
      - the projection of product@N — its effective requirement, decision, and model sets — renders on demand
    facets: tooling

  - id: r-zcvxh2ty
    title: the design validator gates merges
    statement: |
      the design validator runs as a required check on every pull request, applying every rule
      in force at that point; any failure blocks the merge. the merge gate is not advisory —
      nothing publishes over a failing check.
    satisfied_when:
      - the repository requires the design validator check to pass before any pull request merges
      - the check applies every validator rule in force, and a single failure fails the check
    facets: design-validator

  - id: r-caao9k3z
    title: shipped increments stay shipped
    statement: |
      a published increment is never unsettled by later work: drafting increment N+1 changes
      nothing about increment N.
    satisfied_when:
      - the design validator rejects any edit to a file of a published increment
      - later changes appear in the fold as new entries superseding or retiring earlier ones
    facets: design-validator

  - id: r-ei82daip
    title: decisions are comprehensible as a set
    statement: |
      the owner can comprehend what is to be built from the decision set alone, read in full.
    satisfied_when: |
      not mechanically checkable — whether the projected view reads as a picture of the product
      is a judgement, verified by the owner reading it each increment.
    facets: tooling

  - id: r-bs6wsobr
    title: no maintained spec exists
    statement: |
      the design phase produces no prose specification for an implementer to follow:
      implementation works strictly from the fold — requirements, decisions, and bound
      contracts. a synthesis draft lives in its increment's drafts/ folder, merges with the
      increment, and freezes at publish — raw material, never normative. separately, for
      package types whose deliverable is itself a document, the design phase may draft content
      that drives the implementation — anywhere from nothing at all to a mostly complete
      document, as this product's own increments do; the full range of such content is
      deliberately not defined in this increment.
    satisfied_when:
      - increment directories admit only the defined source files plus a drafts/ folder, whose contents freeze at publish like every increment file
      - a spec maintained anywhere else is review's to catch, not the gate's
    facets:
      - process-doc
      - design-validator

  - id: r-yzkxa2hj
    title: the process ships its reference
    statement: |
      the process's normative reference — what agents and the owner read to run it — is a
      shipped deliverable: document-kind packages at permanent homes in this repository.
    satisfied_when:
      - once the reference is implemented, product.yaml lists document packages whose paths hold its current text
      - until then the requirement is visibly unimplemented — in force, with no coverage
    facets: process-doc

  - id: r-0axqvtcc
    title: pending decisions may not be published
    statement: |
      no increment merges or publishes while one of its decisions is still proposed.
    satisfied_when: |
      the merge gate fails an increment carrying a decision whose status is proposed.
    facets: design-validator

  - id: r-gc7a3m56
    title: ruled-on is distinguishable from passed-over
    statement: |
      what the owner engaged and judged is distinguishable, product-wide, from what they
      abstained on.
    satisfied_when:
      - tooling output provides a documented mechanism for telling whether a decision was reviewed or the owner abstained
      - tooling output reports the abstention count
    facets:
      - schema
      - tooling

  - id: r-2fytqadu
    title: contracts are shared and versioned
    statement: |
      contracts — the schemas and public API surfaces products bind — live in shared,
      repo-wide pools, versioned. a version is immutable once an increment binding it
      publishes, directly or transitively, and stays present as long as anything published
      relies on it; drift is legal — no product is rebound by a new version appearing.
    satisfied_when:
      - every pool schema parses as JSON Schema and declares its $id identity root-relative; the design validator fails one that omits the leading slash, in an $id or a $ref
      - the design validator fails when two pool files claim one identity
      - the design validator resolves references by identity, and rejects an edit to, or removal of, a version some published increment binds — directly, or transitively through a bound schema's $ref
      - every structured file names its schema version in version, and validates against the schema that version names
    facets:
      - schema
      - design-validator

  - id: r-bua9wl1s
    title: the model binds schemas as requirements
    statement: |
      an increment binds contracts through its model — entity name, a schema or public-api
      reference, and an optional description anchoring what the entity is in the design. model
      entries are part of the increment's requirements: ratified with it, binding on
      implementers, folded by entity name; where prose references an entity, its bound
      contract is the authoritative shape.
    satisfied_when:
      - the design validator fails an increment whose model reference — or whose source file's version field — resolves to no pool entry
      - the design validator fails an increment which has duplicated entity names in the model in force at the increment
    facets:
      - schema
      - design-validator

  - id: r-sk47gw08
    title: design and implementation keep their own schedules
    statement: |
      finishing a plan and implementing it are separately schedulable: a ratified plan
      publishes without an implementation, and one may come later — or never. design
      increments publish on their own cadence, and several may accumulate before any
      implementation; one implementation may target the consolidated fold, and nothing obliges
      one per increment.
    satisfied_when:
      - a plan-only increment passes the merge gate
      - an implementer may take previously ratified requirements as an implementation's scope and implement them
      - an implementation targets the fold at a chosen increment and durably records that target
      - increments published since remain visible as ratified and unimplemented
    facets:
      - process-doc
      - design-validator
      - tooling

  - id: r-bwtud1e5
    title: products declare their own requirements
    statement: |
      no requirement outside a product's own increments binds it; adoption at a pinned
      increment is the only way an external requirement takes force.
    satisfied_when:
      - the design validator resolves a product's obligations only from its own increments' entries and adoptions
      - no global or area scope exists to bind implicitly
      - a preset is adopted whole and adopts no other preset
      - a conflict between an adopted requirement and a product-local one is an error the increment cannot publish over
    facets:
      - schema
      - design-validator
      - process-doc
