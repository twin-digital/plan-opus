version: 1
model:
  - name: requirements-source
    schema: /design-process/requirements@1
    description: the per-increment requirements file
  - name: decisions-source
    schema: /design-process/decisions@1
    description: the per-increment decisions file
  - name: product-declaration
    schema: /design-process/product@1
    description: products/<id>/product.yaml, whose presence declares the product
  - name: increment-declaration
    schema: /design-process/increment@1
    description: increment.yaml, present only when the increment declares scope or ordering
  - name: model-source
    schema: /design-process/model@1
    description: the per-increment model file, binding entity names to pool schemas
