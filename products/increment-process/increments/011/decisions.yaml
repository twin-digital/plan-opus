version: "2"
decisions:
  - id: d-f7knzaf9
    title: a draft lives on its branch, slug-named
    statement: |
      an unnumbered draft is products/<product>/increments/<slug>/ on its own pull-request
      branch; landing renames the directory into the next number on that branch before the
      merge, and main never holds a slug-named increment.
    status: accepted
    pinned:
      reason: data-format
    because:
      - r-c0zi3pv0
      - r-05tkrv7r
      - d-kn05wb30
      - f:check-rejects-slug-increment-dirs
    revisit_when:
      - in-flight drafts routinely exceed what the owner can scope disjointly — the recorded alternative is a per-product wip/<product> aggregation branch holding every draft in one tree
    facets:
      - process-doc
      - prompts

  - id: d-oel258yc
    title: stacking is the dependency
    statement: |
      a draft that builds on another branches from it, so the dependency is git ancestry
      and nothing is declared; the dependent draft's tree carries its ancestor's content,
      its landing diff shrinks to its own changes once the ancestor merges, and a tree
      that skips or repeats a number is refused by the density gate.
    status: tolerated
    because:
      - r-ca9witxh
      - f:check-enforces-dense-increments
    facets:
      - process-doc
      - prompts

  - id: d-u3744xlr
    title: conflicts are checked at landing, against the head
    statement: |
      landing runs the conflict check against the fold at head — overlapping or duplicated
      rulings surface there, and the later of two overlapping drafts recomputes when the
      head moves. no gate reads in-flight drafts against each other; the owner's scan of
      open drafts covers that window.
    status: accepted
    because:
      - r-0701ctqx
      - r-c0zi3pv0
    facets:
      - process-doc
      - prompts

  - id: d-0lkxin7b
    title: a fold version is an increment number or a git ref
    statement: |
      wherever the tooling takes a fold version, a three-digit argument names an increment
      number and anything else names a git ref; a ref resolves to the product's latest
      published increment at that ref.
    status: accepted
    pinned:
      reason: public-api
      notes: agents and the shipped documents pass versions in this form
    because:
      - r-tne4cdos
      - r-v6mknsh7
    facets: tooling

  - id: d-twb4uga9
    title: the resolver and diff surfaces are the implementer's
    statement: |
      the command names, flags, and output layout of the where-a-product-stands resolver
      and the fold diff are deferred to the implementer.
    status: deferred
    because:
      - r-tne4cdos
      - r-v6mknsh7
    facets: tooling

  - id: d-5xa0g4mp
    title: the draft branch name is plan/<product>/<slug>
    statement: |
      an agent opening a parallel draft creates its branch as plan/<product>/<slug>; no
      check requires the name — it is the anti-bikeshedding default agents reach for.
    status: accepted
    because:
      - d-f7knzaf9
      - r-05tkrv7r
    facets:
      - process-doc
      - prompts

  - id: d-yu9hbn3h
    title: the validator is unchanged
    statement: |
      no validator change ships for parallel drafting: a slug-named directory fails the
      name finding while the draft is worked — beside its proposed-decision and
      open-question findings — and the landing rename clears it. the check stays the merge
      gate it is.
    status: accepted
    because:
      - d-f7knzaf9
      - d-kn05wb30
      - f:check-rejects-slug-increment-dirs
    facets: tooling
