version: "2"
decisions:
  # the architecture, named
  - id: d-sm7l2s7l
    title: entries fall into three regimes
    statement: |
      the system's entries fall into three regimes. Append-only log entries — requirements,
      decisions — are immutable once published and close only through later declarations.
      State-shaped entries — presets, model entries, components, terms — fold by name, and a
      later redeclaration is the same identity. Pool entries — facts, runs — freeze in
      substance at merge and carry their own closure transition.
    status: proposed
    pinned:
      reason: data-format

  - id: d-05hxj5wc
    title: three consumer-protection models, assigned by citation geometry
    statement: |
      a consumer of a changed entity is protected by one of three models, assigned by citation
      geometry. Version-pinned channels — schemas, surfaces, preset adoption — drift: the
      consumer moves by explicit adoption. Product-local vocabularies — components, terms —
      guard: the retiring increment fixes its own citations. Unpinned cross-product citation —
      facts alone — is loud staleness: the corrector acts now, and each citing product answers
      at its own next landing.
    status: proposed
    pinned:
      reason: other
      notes: the model a future entity kind gets is read off this assignment rather than re-litigated

  # one closure vocabulary
  - id: d-cizeaklk
    title: retired is the one closure status
    statement: |
      `retired` is the one closure status, with a free-text `reason`, wherever an entry leaves
      force by status. A preset adoption entry is name, version, and a status of adopted (the
      default) or retired with its reason — adoption still owner fiat, still whole, still at a
      pinned version, still transitive with ids deduplicated across the closure.
      `/design-process/requirements@3` carries the enum.
    status: proposed
    supersedes: d-wis1whfn
    because:
      - r-5sdjvnr8
    pinned:
      reason: data-format

  - id: d-4i5k9nsi
    title: succession is one relation with two spellings
    statement: |
      a log entry's successor names its predecessor with `supersedes`; a state or pool entry's
      closing write names its successor with `superseded_by` — which spelling applies is fixed
      by regime. `amends` is retired, `/design-process/requirement@2` carrying `supersedes`,
      and a rejection's reason field is `reason`. Retirement without a successor stays a
      `retires:` entry — one id, one reason.
    status: proposed
    supersedes: d-jy7x42nx
    because:
      - r-5sdjvnr8
      - d-sm7l2s7l
    pinned:
      reason: data-format

  - id: d-vax1016k
    title: a model entry retires like everything else
    statement: |
      a model entry's `status` is `bound` (the default), `unbound`, or `retired` with a reason
      — entries of `name`, one `schema:` or `surface:` reference where bound, an optional
      `description`, folding by name; the entity name stays the design's word for the thing.
      `/design-process/requirements@3` carries the enum, and sources already written stay
      readable in the dialect they declare.
    status: proposed
    supersedes: d-pe4j25wq
    because:
      - r-5sdjvnr8
    pinned:
      reason: data-format

  # the facts pool
  - id: d-vkudjo4x
    title: fact@2 and run@2 — opaque ids, frozen substance
    statement: |
      `/design-process/fact@2` and `run@2` carry opaque ids — `f-` and `run-` — and a
      free-text retirement `reason`. A merged entry's substance is frozen: the gate refuses
      any change to a fact or run in force at head beyond the one closure transition. `@1`
      files keep their kebab ids and dialect, and references resolve across both.
    status: proposed
    supersedes: d-yc56w54u
    because:
      - r-wgtyrh2r
      - r-buek5llj
    pinned:
      reason: data-format

  - id: d-hxxlgaw9
    title: retiring a cited fact captures the debt it creates
    statement: |
      retiring a cited fact is never refused: supersede-and-retire lands in one change, and
      the gate requires that change to carry a backlog item per citing product, naming the
      retired fact, its replacement, and the citing entries. An in-force foundation resting on
      a retired fact is a reported finding that blocks only its own product's next landing,
      until a superseding entry re-bases or revises it.
    status: proposed
    supersedes: d-08yrcfd7
    because:
      - r-ajpjx5w0
      - d-05hxj5wc
    pinned:
      reason: other
      notes: the gate contract every fact-citing product relies on

  - id: d-a3agzjct
    title: the evidence checker keeps its bar, minus the enums
    statement: |
      the checker's evidence rules stand with two changes: a retirement's `reason` is free
      text, and the fact-citation rule moves to the staleness model. Unchanged: the
      backing-specific source minimums, verbatim quotes whitespace-normalised, in-repo paths
      resolving, a live run behind every `run:` source — a retired run uncitable by an
      in-force fact, satisfiable in one pool change — artifacts urls only on tested facts,
      and pool-wide id uniqueness.
    status: proposed
    supersedes: d-0e325noj
    because:
      - d-vkudjo4x
      - d-hxxlgaw9
    pinned: false

  # ids and products
  - id: d-kqofgshc
    title: prefixes default to three letters, the owner names exceptions
    statement: |
      generated ids are {prefix}-{8 lowercase base36 characters}, random; a new entity kind's
      prefix defaults to three letters, and the owner names a different one — minimum one
      letter — per kind, by how critical the entity is. Ratified now: `r-`, `d-`, `q-`, `b-`,
      `f-` at one letter; `run-` at three. The id is the citation form; titles churn freely.
    status: proposed
    supersedes: d-e5ted839
    because:
      - r-buek5llj
    pinned:
      reason: data-format

  - id: d-i849afta
    title: a product retires in its own declaration
    statement: |
      a product retires by `status: retired` with a `reason` in its `product.yaml` —
      `/design-process/product@2` carries the fields. A retired product's fold stays readable
      and its published increments stand; adopting a retired preset at a new version is a
      validator finding, and existing pinned adoptions are untouched.
    status: proposed
    because:
      - r-5sdjvnr8
    pinned:
      reason: data-format
