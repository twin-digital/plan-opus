# Survey census — dispatched 2026-08-10 against the stacked draft fold (wip-001 components,
# wip-002 statement-discipline, wip-003 lifecycle), one read-only implementer per package.
# Classification is Clarify's: decided (a foundation determines it), deferred (a ruled
# deferral hands it off), detail (implementation detail — no consumer could observe it, no
# reimplementation must preserve it; includes instruction/document composition the Compose
# wave settles against the fold), or closed-by (a foundation this survey caused to be written
# or edited).

