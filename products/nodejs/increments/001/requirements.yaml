version: "1"
requirements:
  - id: r-brdf1c2g
    title: node packages ship as ESM
    statement: |
      a Node.js package ships ESM only. no exports path resolves to a CommonJS file, and
      require() of the package from a CommonJS context fails.
    verification:
      - do: open the packed package.json
      - verify: '"type" is "module", and no exports path resolves to a CommonJS file'
      - do: require() the package from a CommonJS context
      - verify: it fails — no CJS entry exists

  - id: r-paoy41od
    title: node packages are TypeScript
    statement: |
      a Node.js package is written in TypeScript and ships its own type declarations.
    verification:
      - do: pack the package with npm pack --dry-run
      - verify: .d.ts declarations are in the file list
      - do: open the package's sources
      - verify: they are TypeScript

  - id: r-6r489hbd
    title: node packages support the current LTS
    statement: |
      a Node.js package supports the latest Node LTS release available when its implementation
      is created: its build target and its declared engine range both admit that release.
    verification:
      - do: look up the latest Node LTS release as of the implementation
      - do: open the package's build target and its declared engine range
      - verify: both admit that release

  - id: r-5bsbb4vf
    title: package config is repo-kit managed
    statement: |
      a package's shared configuration — its bundler, TypeScript, lint, and package-script
      setup — is generated by the monorepo's config manager from that monorepo's declarative
      configuration. it is neither written nor edited in the package, and an exception for one
      package is declared where that configuration lives.
    verification:
      - do: regenerate the package's shared configuration from the monorepo's declarative configuration
      - verify: the tree is clean, and the package holds no hand-written bundler, TypeScript, lint, or package-script configuration
      - do: look where the shared configuration lives
      - verify: any exception for this package is declared there
