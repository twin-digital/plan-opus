version: "2"

# Harvested from the unmerged branch design/minecraft-dev-server (tip c43cefe), where a full
# spec cycle proposed these and was never ruled. All sixteen re-enter as proposed; the owner
# rules them through this increment's PR. drafts/harvest-map.md carries the slug -> id table.
decisions:
  - id: d-thagewn2
    title: deploy transport is cp and console exec
    statement: |
      built packs reach the server with `docker compose cp` and reloads are issued with
      `docker compose exec` of the image's console helper; `develop.watch` is not used
    status: proposed
    because:
      - r-7fnwuaqz
      - d-imhq2v4w
      - f:compose-cp-copies-without-bind-mounts
      - f:bedrock-image-exposes-a-noninteractive-console-helper
      - f:compose-watch-path-constraints

  - id: d-4oyvz42j
    title: generated compose file is fully resolved
    statement: |
      the harness writes a generated compose file with every value already substituted and invokes
      it by absolute `-f` path, passing neither `--project-directory` nor an env file
    status: proposed
    because:
      - f:compose-env-file-not-loaded-from-cwd

  - id: d-imhq2v4w
    title: server image pinned with console helper
    statement: |
      the harness targets the itzg/minecraft-bedrock-server image, pinning the tag it generates and
      exposing only that tag as configuration
    status: proposed
    because:
      - f:bedrock-image-exposes-a-noninteractive-console-helper

  - id: d-ihbu9tu5
    title: world state lives in a named volume
    statement: |
      the server's `/data` is a named Docker volume the harness creates and never removes except
      under a reset flag on the stop command
    status: proposed
    because:
      - r-7fnwuaqz
      - r-tdif5vwf

  - id: d-br873uo4
    title: both pack kinds are routed by declared kind
    statement: |
      the harness deploys behavior and resource packs alike, routing each by the kind the kit reports
      to that kind's pool and that kind's world activation list
    status: proposed
    because:
      - r-o1lozc1k
      - f:dev-kit-pack-set-entry-names-package-kind-source-and-identity
      - f:pack-kind-mismatch-fails-silently-at-the-server

  - id: d-snejjjs6
    title: activation version read from the built manifest
    statement: |
      an activation entry's version is read from the header of the `manifest.json` in the pack's
      built output, not from the kit's pack set
    status: proposed
    because:
      - f:bedrock-activation-entry-is-header-uuid-and-version
      - f:dev-kit-pack-set-entry-names-package-kind-source-and-identity
      - f:dev-kit-reports-a-fixed-kind-named-output-location-and-writes-none

  - id: d-pz0ibyit
    title: live reload limited to active behavior pack content
    statement: |
      only a content change inside a behavior pack already in the pool and already listed at the same
      header identity is applied live; every other difference restarts the server
    status: proposed
    because:
      - r-gdsm5ykt
      - f:bedrock-reload-updates-scripts-not-pool-or-manifest
      - f:bedrock-activation-list-read-only-at-world-load

  - id: d-6m4kq00z
    title: changed pack set is an input to the reconcile
    statement: |
      a reconcile takes the set of packs whose built output changed as a third input beside desired
      and actual state, seeded at startup with every selected pack
    status: proposed
    because:
      - r-mty3gfy6
      - d-xz2c1pl7
      - d-bd2t71wn

  - id: d-dsrjqw4m
    title: start builds once before the first reconcile
    statement: |
      the start sequence runs each selected package's one-shot build to completion before the first
      reconcile, and starts the watch builds only after it
    status: proposed
    because:
      - r-hay27p5n
      - r-zbrdnvnu

  - id: d-xz2c1pl7
    title: reconcile reads live server state
    statement: |
      each reconcile reads the pool contents and activation lists off the running container rather
      than trusting a record of what the last deploy wrote
    status: proposed
    because:
      - r-mty3gfy6
      - d-thagewn2

  - id: d-hgci9q17
    title: packages rebuild and the harness watches built output
    statement: |
      the harness starts each selected package's own watch build and itself watches only the built
      output directories, deploying on a debounced change there
    status: proposed
    because:
      - r-582htwvl
      - r-zbrdnvnu

  - id: d-40xln0zd
    title: readiness is the world-load pack stack line
    statement: |
      the server counts as ready when the container log emits the world-load line reporting the pack
      stack, and that same line is read back as confirmation of what loaded
    status: proposed
    because:
      - d-imhq2v4w
      - f:bedrock-activation-list-read-only-at-world-load
      - f:pack-kind-mismatch-fails-silently-at-the-server

  - id: d-ezr24i10
    title: selection is flags with workspace profiles
    statement: |
      a run's selection is a repeatable `--pack` flag defaulting to every discovered pack, with
      `--profile <name>` naming a list held in the harness's workspace config file
    status: proposed
    pinned:
      reason: public-api
    because:
      - r-739ulzr0
      - r-ca9w2614
      - f:dev-kit-delivers-a-validated-pack-set-as-data

  - id: d-5ug7kj46
    title: command surface is start and stop
    statement: |
      the harness exposes one default start-and-watch command and one explicit stop command, the
      stop command carrying the reset flag that also removes the world volume
    status: proposed
    pinned:
      reason: public-api
    because:
      - r-hay27p5n
      - r-tdif5vwf
      - d-ihbu9tu5

  - id: d-1jvib0dk
    title: activity and server output share one tagged stream
    statement: |
      the harness has one output stream, owned solely by the command line and written to by every
      other part only through it, and every line on it is prefixed with a short source tag — the
      emitting package for build output, `deploy` for the harness's own activity, `server` for
      container logs
    status: proposed
    because:
      - r-hay27p5n

  - id: d-bd2t71wn
    title: content changes are recopied, not compared
    statement: |
      the harness compares only pack presence and activation identity against the server; a pack's
      file content is never read back, and a pack whose built output changed is re-copied in full
    status: proposed
    because:
      - r-mty3gfy6
