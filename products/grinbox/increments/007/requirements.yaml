version: "1"

requirements:
  - id: r-zmn2p7lf
    title: outside effects are capped, and the cap cannot be waived
    statement: |
      every effect grinbox has that reaches the user, changes their mailbox, or costs money is
      subject to a cap on how often it may happen, and nothing the user configures can exempt an
      effect from its cap. Reading from a mail provider to learn what has arrived is not such an
      effect and needs no cap.
    amends: r-llrpzkd1
    verification:
      - do: set a cap low and drive grinbox past it
      - verify: the further attempts do not reach the outside service, and grinbox's record of the message says they were capped
      - do: read every surface the user configures for a way to remove or loosen a cap grinbox itself seeded
      - verify: none exists
