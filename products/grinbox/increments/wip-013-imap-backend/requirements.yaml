version: "3"

terms:
  - id: arrival-mailbox
    scope: backends
    display: arrival mailbox
    definition: |
      the mailbox of an account that new mail is delivered into.

requirements:
  - id: r-5wpns28x
    title: a mailbox reachable only by IMAP is one grinbox can triage
    statement: |
      the user can put grinbox on a mailbox whose provider offers nothing but IMAP and a password
      of the user's own, and mail arriving there is triaged as any other account's mail is.
    commentary: |
      Everything grinbox does rests on the mail it can reach, and a mailbox that is not a Google
      one is the ordinary case outside one vendor: a work address on a company server, a personal
      one at a host that sells mail rather than advertising, a self-hosted mailbox. IMAP is what
      those have in common. What a particular server cannot do — keep a keyword, move a message —
      narrows what grinbox offers on that account rather than refusing the account.

  - id: r-g1iwlbzs
    title: the shape of the user's mailbox is theirs
    statement: |
      grinbox creates, renames, and deletes no mailbox in the user's account. Where what grinbox
      does must put a message somewhere other than where it found it, the user names where.
    commentary: |
      A mail account is a place the user lives, arranged the way they arranged it, and a tool that
      tidies it on their behalf has taken a liberty they did not offer. This is the sibling of
      "nothing grinbox does to a mailbox loses mail": that one governs the messages, this one the
      containers. It bites on IMAP, where getting a message out of the inbox means moving it into
      some other mailbox and no server has to have one to move it to.
