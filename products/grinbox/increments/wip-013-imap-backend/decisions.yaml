version: "3"

decisions:
  # what an account is
  - id: d-oevikmal
    scope: backends
    title: an account carries the backend it was added with
    statement: |
      an account names its backend when the user adds it, and that never changes. A mailbox to be
      read through another backend is added as another account.
    commentary: |
      Everything grinbox stores against an account — its cursor, where each message is, what the
      server was found to support — is written in the backend's own terms, and none of it survives
      being reinterpreted by a different one. Making the backend immutable is what lets the rest of
      the design read those fields without asking which backend wrote them.
    status: delegated
    because:
      - d-q2hx8vlm
      - d-8fvu0g4z
    pinned:
      reason: data-format
      notes: |
        every account row carries it, and the fields beside it are only readable through it

  - id: d-ioso3voc
    scope: backends
    title: an IMAP account is an address, a login, and a password
    statement: |
      adding an IMAP account takes the server's host and port, whether the connection is encrypted
      from the start or upgraded after connecting, a username, and a password the user obtained
      from their provider. The password is a credential the user obtained through grinbox and is
      stored as one.
    commentary: |
      This is the whole of what an IMAP server needs to be reachable, and the app password most
      providers issue for exactly this purpose is what the user pastes. Storing it as a
      user-obtained credential puts it in the state, encrypted, rather than in the deployment's
      configuration, which is where the split already puts anything the user obtained.
    status: accepted
    because:
      - r-5wpns28x
      - d-xe41okh9
    pinned:
      reason: data-format
      notes: the stored shape of an IMAP account, and what the interface asks the user for

  - id: d-fuln110d
    scope: backends
    title: a credential the user holds is authorized by logging in, and reaches no public path
    statement: |
      where a backend's authorization is a credential the user holds, they give it to grinbox's
      internal interface and a successful login is the authorization. Where it is a grant the
      provider issues, the internal interface mints a single-use, short-lived correlation token and
      the flow completes at one public path, which refuses any request carrying no token grinbox
      awaits.
    commentary: |
      An IMAP password has no consent screen to return from, so the public callback would sit
      unused in a flow that never leaves the machine. Keeping the public path to the grant case is
      what keeps the deployment's one exposed path narrow.
    status: accepted
    supersedes: d-a1pf497w
    because:
      - r-ieyj1wkn
      - r-ovi02v1m
      - d-ioso3voc
    pinned:
      reason: public-api
      notes: |
        the one publicly reachable path grinbox has, and the deployment is configured around it

  - id: d-v4mejzw5
    scope: backends
    title: a password the server rejects pauses the account until it is fixed
    statement: |
      where an IMAP server refuses grinbox's login and says the credential is what it refused,
      grinbox stops polling the account and reports that it needs the user. Polling resumes when the
      user gives a working password, and nothing about the account is deleted. Any other failure
      leaves the account as it is, retried at its next poll.
    commentary: |
      The counterpart of what a refused renewal does to a granted authorization: the two failures
      mean the same thing to the user, which is that grinbox needs them. The pause is a pause —
      the account, its folders, its cursor, and everything grinbox recorded about its mail stay
      exactly as they were, and a working password puts it straight back to work. Separating the
      credential rejection from the unreachable server is what keeps a night of network trouble
      from stopping every account the user has.
    status: accepted
    because:
      - r-fzuyjkts
      - d-v5fyd7xd
      - d-ioso3voc
      - f-x53bztdj
    pinned: false

  - id: d-r3ogwkv7
    scope: backends
    title: giving grinbox a working password means giving it the whole connection
    statement: |
      an account needing the user's attention is repaired by the user restating everything an IMAP
      account is configured with, not the password alone. Its backend still cannot change.
    commentary: |
      A provider that moved hosts, changed port, or renamed the mailbox leaves a user whose only
      lever is the password with no way back, and no shell to fix it from. The backend stays fixed
      because everything stored against the account is written in its terms.
    status: delegated
    because:
      - d-v4mejzw5
      - d-ioso3voc
      - d-oevikmal
      - r-t4jn8zvw
    pinned: false

  # the folders an account works in
  - id: d-zxvkt95o
    scope: backends
    title: the account names the folders grinbox watches
    statement: |
      an IMAP account names four folders: its arrival folder, and the ones standing for
      archived, trashed, and spam mail. Grinbox proposes them from the roles the server advertises
      and from the account's folder names, and what the user accepted is what is stored. No two of
      them name one folder.
    commentary: |
      No server has to advertise an archive folder: a stock dovecot does not and a hosted one does,
      so a design that discovered the destination would work on some accounts and not others for
      reasons the user could not see. Proposing what the roles say keeps the common case to a
      confirmation, and asking is what keeps grinbox out of the business of creating folders in an
      account someone else arranged.
    status: delegated
    because:
      - r-g1iwlbzs
      - f-ymu94ntb
      - f-yj818owe
      - f-33wb1igd
      - d-jr86qq8b
    pinned:
      reason: data-format
      notes: four stored per-account folder names the interface exposes and the poll path reads

  - id: d-qstpa7y0
    scope: backends
    title: an IMAP message's standing is the folder it is in
    statement: |
      a message in the account's arrival folder stands as present, and one in its archived,
      trashed, or spam folder stands as that. A message in none of the four is recorded as
      archived, and no message on an IMAP account is recorded as deleted.
    commentary: |
      A message the user filed into a folder of their own has left the inbox and has not been
      thrown away, which is what archived says. Reporting it deleted would be a claim grinbox
      cannot support and the more alarming of the two mistakes. Deleted stays in the vocabulary for
      backends that can tell.
    status: tolerated
    because:
      - d-jr86qq8b
      - d-zxvkt95o
      - r-ziitim35
    pinned: false

  - id: d-8jc4taom
    scope: backends
    title: an account begins when its folders are accepted
    statement: |
      an IMAP account exists once the user has accepted its four folders. A login that succeeded
      while the user was still adding the account leaves nothing behind, and grinbox holds the
      password no longer than the adding takes.
    commentary: |
      The folders cannot be proposed until a login has succeeded, so adding an account is two
      steps whatever the interface looks like. Storing the account at the first step would leave an
      abandoned add sitting in the account list, polled or not, which is a state nobody asked for
      and the user would have to clean up.
    status: accepted
    because:
      - d-zxvkt95o
      - d-fuln110d
      - d-ioso3voc
    pinned: false

  - id: d-8pdx8qsd
    scope: backends
    title: a folder can be re-pointed, and what grinbox recorded stands
    statement: |
      the user may name a different folder for any of an account's four roles at any time. What
      grinbox already recorded about a message keeps the standing it had, and the new folders are
      what the next poll and the next reconcile read.
    commentary: |
      A user who reorganizes their mail has to be able to say so, and the alternative — deleting
      and re-adding the account — loses every record grinbox holds of it. Re-pointing does not
      rewrite history: a message archived into the old folder was archived, and the reconcile finds
      it where it is or records it archived for sitting in none of the four.
    status: proposed
    because:
      - d-zxvkt95o
      - d-qstpa7y0
      - d-k4nt8zbu
      - r-t4jn8zvw
    pinned: false

  # finding a message again
  - id: d-k4nt8zbu
    scope: backends
    title: grinbox holds where an IMAP message is, and what it is
    statement: |
      grinbox stores an IMAP message's folder, that folder's UIDVALIDITY, and its UID as where
      the message currently is, and its Message-ID header as what identifies it. Where the stored
      location resolves to nothing, the message is looked for by Message-ID across the account's
      four folders, and is found only where exactly one message carries it.
    commentary: |
      IMAP identifies a message per folder, so the identifiers grinbox stored name nothing once
      the message moves — whether grinbox moved it or the user did. The header is the only thing
      that travels with it. A message whose headers carry none is still taken in and triaged; it
      simply cannot be found again after someone else moves it, and keeps the standing grinbox last
      recorded until it is seen somewhere.
    status: proposed
    because:
      - f-ubjw3f0i
      - f-1hjkefq3
      - d-qstpa7y0
      - d-zxvkt95o
    pinned:
      reason: data-format
      notes: what every IMAP message row holds, and what the reconcile matches on

  - id: d-cepkyeoa
    scope: backends
    title: the cursor is a UID, and a UIDVALIDITY change starts it over
    statement: |
      an IMAP account's cursor is its arrival folder's UIDVALIDITY together with the highest UID
      grinbox has taken in, and a poll asks for everything above that UID. Where the folder
      reports another UIDVALIDITY, the cursor names nothing and the next poll takes the bounded
      recent window a first poll takes.
    commentary: |
      Ascending UIDs are what make the incremental poll exact rather than approximate, and
      UIDVALIDITY is the server's only way of saying the stored ones are void. Re-taking a window
      already taken in costs nothing: the poll path already recognises what it holds, and matching
      by Message-ID is what recognises a message whose UID has changed underneath it.
    status: proposed
    because:
      - d-8fvu0g4z
      - d-sj4u6eyj
      - f-xbec6o46
      - f-4i4xtwwj
      - d-k4nt8zbu
    pinned: false

  - id: d-p82gksff
    scope: backends
    title: grinbox connects to poll and closes the connection after
    statement: |
      grinbox opens an IMAP connection when an account's poll comes due and closes it when that
      poll finishes. It holds no connection open between polls and does not wait on the server to
      announce an arrival.
    commentary: |
      Waiting on the server would mean a connection per account held open for the life of the
      process, which is a second thing keeping the daemon busy beside the work queue it already
      has. What the user is promised is triage within minutes of arrival, and the account's own
      polling interval already carries that.
    status: tolerated
    because:
      - d-81ouxrpi
      - d-nq4fk2xr
      - r-0lg2c2e4
      - f-31j9vxhp
    pinned: false

  - id: d-cd0jnrdj
    scope: backends
    title: the snapshot the reconcile reads reports a standing, not a presence
    statement: |
      the poll seam's whole-mailbox snapshot reports each message it finds with the standing that
      message has, and every backend produces it. A message the snapshot does not name is one the
      backend did not find.
    commentary: |
      Five standings cannot be inferred from a list of what is in the inbox: that supports present
      and archived and nothing else. This is the one place the IMAP backend reaches a sibling — the
      Gmail backend answers the same operation, and its own two-state reading now says so rather
      than being read into a bare list by the caller.
    status: proposed
    because:
      - d-qstpa7y0
      - d-x3aqw6up
      - d-gj8j4np0
      - d-jr86qq8b
    pinned:
      reason: public-api
      notes: |
        the shape every backend returns from the snapshot operation, and what the reconcile reads

  - id: d-lru4i8rp
    scope: backends
    title: a server's certificate is verified, and nothing waives it
    statement: |
      grinbox verifies the certificate an IMAP server presents, and refuses an account whose
      server it cannot verify. Nothing the user configures waives the check.
    commentary: |
      The alternative is a stored per-account waiver, which is a security downgrade the user is
      asked to evaluate at the moment they least can — while adding an account that is not working
      yet. A self-hosted mailbox whose certificate does not verify is a mailbox grinbox does not
      poll, and the remedy is on the server, where certificates are free.
    status: accepted
    because:
      - d-ioso3voc
      - r-5wpns28x
      - r-p2djwgjn
    pinned:
      reason: other
      notes: |
        which accounts can be added at all, and the one place a user might expect a knob and finds
        none

  - id: d-v55lpt3t
    scope: backends
    title: an account is worked one connection at a time
    statement: |
      grinbox holds at most one connection open to an IMAP account at once, whatever work is
      waiting. Work for that account that arrives while the connection is busy waits for it.
    commentary: |
      A shared host counts connections per account and the user's own mail client already holds
      some, so a triage loop running several messages at once could reach a limit that has nothing
      to do with grinbox and looks to the user like the account breaking. One at a time costs
      throughput on an account with a lot arriving at once, which is the cheaper failure.
    status: tolerated
    because:
      - d-p82gksff
      - d-hf3gfs9u
      - f-31j9vxhp
    pinned: false

  # what grinbox does to the mailbox
  - id: d-bl5oamiz
    scope: backends
    title: a category is a keyword on the message
    statement: |
      applying a category on an IMAP account stores a keyword of that category's name on the
      message. Where the account's arrival folder does not admit client-defined keywords, the
      account declares it cannot apply categories rather than storing one that will not last.
    commentary: |
      Keywords are IMAP's durable per-message metadata and the only mechanism a category can be
      carried by. A server admits client-defined ones only where the folder says so, and a store
      the server ignores or drops at the end of the session looks like success from the client's
      side — so declaring the gap is the only way it is visible. What a keyword does not reach is
      a client that keeps its own metadata locally: Outlook is one, and on an account read there a
      category is grinbox's record rather than something the user sees on their mail.
    status: accepted
    because:
      - d-hv2uue12
      - f-9z8o6n1l
      - f-ffnc43ku
      - d-f9tj4wnr
    pinned:
      reason: public-api
      notes: what the user sees on their own mail, and what another client of theirs reads

  - id: d-8v30vkou
    scope: triage
    title: a category is named in what a keyword admits
    statement: |
      a category a triage applies contains none of "(", ")", "{", space, a control character, "%",
      "*", a double quote, "\", or "]", and is not empty.
    commentary: |
      Exactly what an IMAP keyword admits and no tighter: everything else stays legal, "/" included,
      so the nested form the interface already suggests keeps working. A category grinbox could not
      carry is one it would have to mangle silently or fail on, and mangling what the user sees on
      their own mail is the worse of the two.
    status: accepted
    because:
      - d-bl5oamiz
      - f-xltd4r4v
    pinned:
      reason: public-api
      notes: the vocabulary the user configures in, and what a stored configuration may hold

  - id: d-mbh2pthe
    scope: triage
    title: a category's template is checked as far as it is knowable, its result when it renders
    statement: |
      a category is composed from a template, so what the user saves is checked for the characters
      the template's own text carries, and what a triage renders is made carriable before it is
      applied.
    cases:
      - when: the template's own text carries a character a category may not
        then: the save is refused, naming it
      - when: rendering the template produces a character a keyword cannot carry
        then: each such character becomes an underscore, the category is applied, and the run records what was applied
    commentary: |
      A template's result is not knowable when it is saved, since the tags it reads have not been
      produced, so the save-time check reaches the literal text and no further. What renders is
      substituted rather than refused because the alternative leaves the message uncategorized over
      a character, and a user who never opens the application would never learn why. Recording what
      was applied is what keeps the substitution from being silent: the run says what went on the
      message, so a category that arrived looking unfamiliar is explainable.

      Two categories can substitute to one — "Acme Corp" and "Acme_Corp" both land as "Acme_Corp" —
      which is the price of applying something rather than nothing.
    status: accepted
    because:
      - d-8v30vkou
      - d-t2gm7ryx
      - r-c5nm7ryw
      - r-5ezt7j0v
      - d-16geyxco
    pinned:
      reason: public-api
      notes: when a save is refused and when a triage fails instead, both of which the user meets

  - id: d-8am29x25
    scope: backends
    title: moving a message needs a safe move, and an account without one cannot archive or file
    statement: |
      archiving and filing on an IMAP account both move the message out of the arrival folder — by
      the server's own move where it advertises one, and otherwise by a copy followed by an expunge
      naming that message's identifier alone. Where the server advertises neither, the account
      declares it can do neither.
    commentary: |
      The fallback every client used before the move command exists ends in an expunge that also
      throws away anything else in the folder already flagged for deletion — someone else's
      messages, deleted by someone else's client. An account whose server offers no way to avoid
      that is one grinbox does not archive on, which is a narrower product and not a lost message.
    status: accepted
    because:
      - r-ziitim35
      - f-yawjn42g
      - f-np5bnzew
      - d-yjd4ag9q
      - d-jj2mymbi
      - d-zxvkt95o
      - d-f9tj4wnr
    pinned:
      reason: other
      notes: |
        what grinbox does to mail the user cannot get back, which is what the archive action's own
        ruling fixes for every backend

  - id: d-mtgha4ra
    scope: backends
    title: grinbox never changes whether a message is read
    statement: |
      the IMAP backend reads a message's headers and body without marking it seen, and sets or
      clears no flag of the user's. The keywords its categories name are the only flags it writes.
    commentary: |
      A fetch marks a message read unless the client asks for the peeking form, so a triage that
      read the body would empty the user's unread count overnight. The general rule this makes
      concrete for IMAP: grinbox owns what it put there and nothing else on the message.
    status: accepted
    because:
      - r-ziitim35
      - d-ypmi8g3g
      - d-nol93aud
    pinned:
      reason: other
      notes: |
        invisible in the code to anyone who does not know the peeking fetch is a commitment rather
        than a preference

  - id: d-q96iw28w
    scope: backends
    title: thread placement comes from the message's own headers
    statement: |
      the IMAP backend reports a message's place in its thread from that message's In-Reply-To and
      References headers read against the messages grinbox already holds, and asks the server for
      no threading of its own.
    commentary: |
      Server-side threading is an extension, and where a server has it, what it computes is its own
      business rather than a stated shape. The headers are carried by the message itself, which
      makes the answer the same on every server, and grinbox is already holding the account's
      messages to compare against.
    status: delegated
    because:
      - d-q2hx8vlm
    pinned: false

  # putting a message somewhere the user can see it
  - id: d-jj2mymbi
    scope: triage
    title: a file action
    statement: |
      grinbox ships an action that moves the message into a folder of the user's account, named
      literally in the action's own configuration rather than composed from the message. Where the
      account has no folder of that name, the operation fails, and grinbox creates none.
    commentary: |
      A folder is what every mail client shows, and metadata carried any other way is invisible in
      a client that keeps its own — which is most of them, Outlook among them. This is the action a
      user reaches for when the point is to see the outcome in the mail client they already read
      their mail in, and it is the only mechanism grinbox has that reaches one.

      Failing on an account without the folder is the consequence of not creating folders: a
      pipeline may be active on several accounts, and whether a folder of some name exists on each
      is not a thing the save-time check can see. The failure is an ordinary operator failure and
      settles the triage partial.

      The folder is literal where every other text the user configures is a template, which is the
      one place this action departs from the placeholder grammar. Composing a destination is how a
      tool ends up creating folders it was told not to create, and a template's result is not
      knowable until the message that produces it arrives.
    status: accepted
    because:
      - d-5n8oyi8c
      - r-g1iwlbzs
      - f-12lyvbmp
      - d-16geyxco
    pinned:
      reason: public-api
      notes: an operator type the user configures against, and the stored shape of that operator

  - id: d-hj9nac5f
    scope: triage
    title: a set-aside action, which categorizes where it can and files where it cannot
    statement: |
      grinbox ships an action carrying both a category and a folder. On an account that can apply
      categories it applies the category; on one that cannot but can file, it files into the
      folder; on an account that can do neither it fails.
    commentary: |
      The one action a user configures for mail they want marked for later, on every account they
      have. Two operators gated identically would be the alternative, and it asks the user to know
      which of their accounts supports what — the thing the backend seam exists to spare them.

      It carries both because neither can be derived from the other: a folder is not a category's
      name, and the user is the only one who knows where filed mail belongs. The order is fixed
      rather than configured, since categorizing leaves the message where it is and filing moves
      it, and the less invasive one is the one to prefer where both are available.
    status: proposed
    because:
      - r-blqzjemx
      - d-5n8oyi8c
      - d-bnw0na3n
      - d-jj2mymbi
      - d-bzw8qoiy
    pinned:
      reason: public-api
      notes: an operator type the user configures against, and the stored shape of that operator

  - id: d-x3aqw6up
    scope: backends
    title: filing is a resource operation the backend carries
    statement: |
      a mail backend implements two seams. The poll seam carries what the poll path needs —
      enumerating candidates, fetching metadata, applying a category, reporting thread placement,
      and taking the whole-mailbox snapshot the reconcile reads. The resource backends carry what
      an operator's declared operations reach: archiving, filing into a named folder, fetching a
      body, and sending mail.
    commentary: |
      Filing reaches outside grinbox and belongs where the other mail operations are, so that a
      backend which cannot carry it declares that the way it declares every other gap. The seam is
      otherwise unchanged.
    status: delegated
    supersedes: d-q2hx8vlm
    because:
      - r-etj0gluz
      - d-v5zamgjn
      - d-jj2mymbi
    pinned:
      reason: public-api
      notes: the surface a second backend is written against

  - id: d-93swk5rr
    title: the actions add, and archiving and filing move the message
    statement: |
      applying a category adds one grinbox-owned marker to the message and touches nothing else.
      Archiving takes the message out of the inbox and filing puts it in a folder the user named;
      each keeps every other marker, leaves the message findable, and is recorded by grinbox as
      where the message went. No built-in action deletes a message.
    commentary: |
      What grinbox does to mail the user cannot get back is what this fixes, and filing joins
      archiving as a thing that moves a message rather than one that adds to it. Neither loses the
      message, which is the guarantee the entry exists to hold.
    status: accepted
    supersedes: d-ypmi8g3g
    because:
      - r-ziitim35
      - d-5n8oyi8c
      - d-jj2mymbi
    pinned:
      reason: other
      notes: what grinbox does to mail the user cannot get back is exactly what this fixes

  - id: d-b4yifc70
    title: which outside calls grinbox retries
    statement: |
      grinbox retries an outside call within the operation that made it, invisibly to the operator
      that declared it, and on any failure rather than a classified subset. A retry stops at the
      operator's deadline. The poll path reaches its poll seam without passing through this, so a
      failed poll waits for the next heartbeat.
    cases:
      - when: the call is a read — listing a mailbox, fetching a message's metadata or body, invoking a model
        then: it takes up to three further attempts with a doubling wait
      - when: the call writes to the mailbox
        then: it takes up to two further attempts at a fixed wait
      - when: the call sends a notification or sends mail, or its operation has no policy of its own
        then: it is never retried
    commentary: |
      Unchanged but for the mailbox-write case, which named the two writes there were and now names
      the kind, so that filing is covered by what already governs archiving and applying a category.
    status: delegated
    supersedes: d-m5zk9xcw
    because:
      - d-g3xc9rmv
      - d-v5zamgjn
      - d-5xp2tv2d
      - d-jj2mymbi
    pinned:
      reason: other
      notes: |
        a retried send is an effect the user sees twice, and what rests on this rests on the
        reaching-the-user case not being retried

  - id: d-k8va629q
    scope: backends
    title: a folder is named as the user wrote it
    statement: |
      a folder name the user gave grinbox is matched against the names the server lists, character
      for character. Grinbox reads no hierarchy into it and translates no separator.
    commentary: |
      Servers separate hierarchy differently — "." on one of the accounts probed and "/" on the
      other — so a name grinbox took apart and put back together would mean different folders on
      different servers. Matching what the user wrote against what the server lists is the only
      rule that means one thing everywhere, and it pairs with grinbox creating no folder: an
      unmatched name is a name that is not there.
    status: accepted
    because:
      - f-33wb1igd
      - f-yj818owe
      - d-jj2mymbi
      - d-zxvkt95o
      - r-g1iwlbzs
    pinned:
      reason: public-api
      notes: what the user types into a file action and into the four folder fields

  - id: d-qzxvoph1
    scope: triage
    title: an operation an account cannot carry is reported, and never refused at save
    statement: |
      a configuration is not refused for naming an operation some account cannot carry. Saving the
      pipeline and activating it on an account each warn, naming the accounts that cannot carry it,
      and the operator fails on those accounts when it runs.
    commentary: |
      A pipeline runs on several accounts and which accounts it runs on changes after the save, so
      refusing would either block a configuration valid for the account the user cares about or
      break a stored one when an account is later activated. r-c5nm7ryw names the faults it wants
      refused — an input nothing produces, a cycle, two operators claiming one output — and a
      capability gap is not among them; it is a property of an account rather than of the
      configuration. Filing already works this way, and this puts archiving, categorizing, and
      sending on the same footing.

      Refusing could not be complete in any case: a server withdraws its willingness to keep new
      keywords when its folder reaches a limit, with nobody editing anything, so a save-time gate
      would promise more than it can hold. The warning is what gives the user the early signal at
      the moment they are editing, and the run-time failure is what stays honest afterwards.
    status: accepted
    because:
      - d-jj2mymbi
      - d-f9tj4wnr
      - d-bzw8qoiy
      - r-x3jb6wlq
      - d-16geyxco
    pinned:
      reason: other
      notes: |
        whether the user meets the gap when saving or when mail arrives, which is the whole of how
        it feels to configure a mixed set of accounts

  - id: d-y3uh9ofx
    scope: triage
    title: a field the backend does not supply is empty, and a thread counts what grinbox holds
    statement: |
      where a backend supplies no preview of a message, the snippet a configuration reads is
      empty rather than derived from the body. A thread's message count is the number of messages
      grinbox holds in that thread for that account.
    commentary: |
      Deriving a snippet would fetch a body the configuration never asked for, which is the one
      thing the lazy fetch exists to avoid. The count is what grinbox can answer for any backend,
      and on a thread older than the account's first poll it is smaller than the provider's — a
      rule counting on it is counting what grinbox has seen, which is what it could honestly mean
      either way.
    status: proposed
    because:
      - d-q96iw28w
      - d-nol93aud
      - d-t2gm7ryx
    pinned:
      reason: public-api
      notes: two fields of the vocabulary a user writes rules against

  # what an IMAP account cannot do
  - id: d-5h66e3zl
    scope: backends
    title: an IMAP account does not send
    statement: |
      the IMAP backend declares that it cannot send mail. An edition claims no occurrence for an IMAP
      account and no operator sending mail runs on one, and the interface says which accounts those
      are and why.
    commentary: |
      IMAP reads a mailbox; submitting mail is a second protocol with its own address, port, and
      credential to ask the user for. Pairing the two is held for its own increment, and until then
      an IMAP account is a mailbox grinbox triages rather than one it writes from.
    status: accepted
    because:
      - d-f9tj4wnr
      - d-p3vd6kxz
      - r-x3jb6wlq
    pinned: false

  - id: d-bzw8qoiy
    scope: backends
    title: what an IMAP account supports is read when grinbox logs in
    statement: |
      which operations an IMAP account supports is read from the server's capabilities and its
      arrival folder's permanent flags each time grinbox polls the account, and stored on the
      account. Everything else grinbox does reads what was stored. That reading is the declaration
      a backend owes, made per account rather than once per backend.
    commentary: |
      Two IMAP servers differ in what they offer, and one server differs from itself after an
      upgrade or a folder change, so a declaration fixed in grinbox's code would be a guess about
      the user's server. Reading it at login is what makes an account's gaps visible before an
      operator hits them.
    status: accepted
    because:
      - d-f9tj4wnr
      - d-bl5oamiz
      - d-8am29x25
      - f-9z8o6n1l
      - f-yawjn42g
    pinned: false
