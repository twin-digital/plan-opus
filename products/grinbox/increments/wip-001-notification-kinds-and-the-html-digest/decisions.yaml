  - id: d-r5wc2qnj
    title: listing messages is paged, ordered newest first, and filtered
    statement: |
      listing messages is paged with caller-supplied page bounds and a bounded page size,
      ordered by when the mail was received, newest first with a stable tiebreak, and filtered
      by account, pipeline, standing, tag, date, and a substring search over sender and subject.
      The page reports the total so a caller can size what it did not fetch.
    status: proposed
    supersedes: d-mu0k7nbu
    because:
      - d-1uo9p5wq
      - d-ti7vexo3
    pinned:
      reason: public-api
      notes: |
        every part of it is observable by any client of the API, and a reimplementation must
        reproduce the ordering to page consistently
