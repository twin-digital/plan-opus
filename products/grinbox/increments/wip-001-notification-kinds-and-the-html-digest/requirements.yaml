version: "3"

terms:
  - id: notification-kind
    display: notification kind
    definition: |
      what a push is about, named by the user and carried by the operators that send it.

  - id: throttle
    definition: |
      a minimum interval the user sets on a notification kind, suppressing pushes that fall
      inside it.

  - id: triage
    definition: |
      one application of a pipeline to one message: the unit grinbox enqueues, runs, settles, and
      records against.

  - id: delivery
    definition: |
      one firing of an edition for one account and occurrence.

requirements:
  - id: r-lph86tsg
    title: a burst of one notification kind costs one push
    statement: |
      the user decides how often a class of push may reach them, and a burst of related mail
      costs one push rather than one per message.
    commentary: |
      A push worth having loses its value the moment a burst of it teaches the user to swipe the
      channel away, and the same burst spends the push service's own rate limit that every other
      notification depends on.

  - id: r-m7y9ocdu
    title: a digest reaches the user whatever their client renders
    statement: |
      every item, count, prose passage, and footer a digest carries reaches the user as readable
      content, whatever formatting their mail client renders — including none.
    commentary: |
      The digest is the product's one outbound artifact. A delivery a client degrades into
      unreadable markup has spent its window's coverage for nothing.

  - id: r-8sg01qdd
    title: text taken from a message is never markup
    statement: |
      text a digest takes from a message reaches the user as the characters it is. Nothing a
      message contains alters the digest's structure or its presentation.
    commentary: |
      Message text is written by third parties. r-ut5mdtpx bars executing what the user
      configures, and text grinbox did not solicit has weaker standing than that.

  - id: r-735kq72h
    title: a digest shows money the way a person reads it
    statement: |
      a digest shows an extracted money value in the form a person reads money in, not in the
      form grinbox stores it.
    commentary: |
      Normalization exists so grinbox can compare values, and the form that serves comparison is
      not the form that serves a reader.
