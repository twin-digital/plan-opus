version: "3"

components:
  - id: digests
    description: the summarizing subsystem — editions, their cues and occurrences, and the digest mail they produce
  - id: triage
    description: per-message pipeline execution — operators, their runs, and what a triage records
  - id: backends
    description: grinbox's integration with mail backends — the poll seam, the resource backends, and authorization
  - id: notifications
    description: pushes and their grouping — notification kinds, cooldowns, and suppression
  - id: interface
    description: the surface the user works grinbox through — the browser application and the API it reads

terms:
  - id: notification-kind
    scope: notifications
    display: notification kind
    definition: |
      what a push is about, named by the user and carried by the operators that send it.

  - id: cooldown
    scope: notifications
    definition: |
      a minimum interval the user sets on a notification kind, suppressing pushes that fall
      inside it.

  - id: triage
    definition: |
      one application of a pipeline to one message: the unit grinbox enqueues, runs, settles, and
      records against.

  - id: cue
    scope: digests
    definition: |
      a moment an edition's schedule makes due, whether or not grinbox was awake to act on it.

  - id: occurrence
    scope: digests
    definition: |
      one execution of an edition for one account and cue: it selects, renders, and sends, and
      is claimed before any work begins.

  - id: limit
    definition: |
      a bound on how often a resource operation may happen — per user, scoped to a rolling
      window or to a single message.

  - id: category
    definition: |
      the grinbox-owned marker put on a message through the backend's durable-metadata
      mechanism, so the user sees it in their own mail client.

  - id: operator
    definition: |
      one configured unit of a pipeline: it declares the tags it reads and produces and the
      resource operations it reaches, and a triage runs it.

  - id: provider
    definition: |
      the external mail service an account belongs to and authorizes against.

  - id: resource
    definition: |
      an enumerated outside target grinbox acts on: operators reach it only through the
      operations they declared, and limits meter those operations.

  - id: resource-operation
    display: resource operation
    definition: |
      a named procedure a resource offers: what an operator declares, a client exposes, and a
      limit counts.

  - id: digest
    scope: digests
    definition: |
      the mail an occurrence sends: one edition's rendering of one span for one account.

  - id: edition
    scope: digests
    definition: |
      an operator instance whose configuration carries the schedule it fires on.

  - id: span
    scope: digests
    definition: |
      the half-open stretch of intake time one occurrence covers: after the last completed
      occurrence, up to when this one was claimed.

requirements:
  - id: r-lph86tsg
    scope: notifications
    title: a burst of one notification kind costs one push
    statement: |
      the user decides how often a class of push may reach them, and a burst of related mail
      costs one push rather than one per message.
    commentary: |
      A push worth having loses its value the moment a burst of it teaches the user to swipe the
      channel away, and the same burst spends the push service's own rate limit that every other
      notification depends on.

  - id: r-m7y9ocdu
    scope: digests
    title: a digest reaches the user whatever their client renders
    statement: |
      every item, count, prose passage, and footer a digest carries reaches the user as readable
      content, whatever formatting their mail client renders — including none.
    commentary: |
      The digest is the product's one outbound artifact. A digest a client degrades into
      unreadable markup has spent its span for nothing.

  - id: r-8sg01qdd
    scope: digests
    title: text taken from a message is never markup
    statement: |
      text a digest takes from a message reaches the user as the characters it is. Nothing a
      message contains alters the digest's structure or its presentation.
    commentary: |
      Message text is written by third parties. r-ut5mdtpx bars executing what the user
      configures, and text grinbox did not solicit has weaker standing than that.

  - id: r-735kq72h
    scope: digests
    title: a digest shows money the way a person reads it
    statement: |
      a digest shows an extracted money value in the form a person reads money in, not in the
      form grinbox stores it.
    commentary: |
      Normalization exists so grinbox can compare values, and the form that serves comparison is
      not the form that serves a reader.

  # The vocabulary pass: amendments carrying the requirements into the settled word for a
  # pipeline's configured unit. Each restates its predecessor with no other change.

  - id: r-2qw8xj5m
    scope: triage
    title: one operator's failure does not cost the rest
    statement: |
      where one operator of a message's triage fails, the operators that do not depend on it
      still run, and what they produced is kept. A triage that partly succeeded is recorded as
      such rather than discarded.
    supersedes: r-1698i3qa

  - id: r-9fkp4tzv
    scope: triage
    title: an operator reaches only what it declared
    statement: |
      an operator of a triage can reach outside grinbox only through the operations it declared,
      and declaring an operation is what makes it reachable.
    supersedes: r-p5jm5559

  - id: r-c5nm7ryw
    scope: triage
    title: a configuration that could not run is refused when it is saved
    statement: |
      a triage configuration that could not run — one whose operators depend on something
      nothing produces, that depends on itself, or that has two operators claiming the same
      output — is rejected when the user saves it, naming what is wrong, rather than accepted
      and found broken when mail arrives.
    supersedes: r-qu9y7wgg

  - id: r-dk3vq6tp
    scope: triage
    title: routing mail never requires a model
    statement: |
      grinbox can route a message without calling a model: what a pipeline decides can be
      configured to depend only on the message itself and on what earlier operators recorded.
    supersedes: r-xy0yd2nh

  - id: r-hw8gn2fs
    scope: triage
    title: the whole message is available without asking for it
    statement: |
      every operator of a triage can read any part of the message it is triaging, without
      having declared which parts it wanted.
    supersedes: r-sfvm6ib3

  # The digest-family ruling: the requirements that said delivery, carried into occurrence.

  - id: r-j2wn9xtb
    scope: digests
    title: a message is digested once
    statement: |
      a message appears in at most one digest, whatever a user has configured and however
      occurrences have failed or been delayed.
    supersedes: r-yq13riob

  - id: r-f7dk3qzm
    scope: digests
    title: an undelivered digest costs no coverage
    statement: |
      mail that a digest would have covered had it been delivered is covered by the next
      occurrence instead. A failed or missed occurrence narrows nothing.
    supersedes: r-g6n22sn9

  # The limit ruling: the requirements' own statements carried into the settled word.

  - id: r-q8vm3xtk
    title: outside effects are limited, and the limit cannot be waived
    statement: |
      every effect grinbox has outside its own process is subject to a limit on how often it may
      happen, and nothing the user configures can exempt an effect from its limit.
    supersedes: r-llrpzkd1

  - id: r-w6kq2mfp
    title: outside effects are limited, and the limit cannot be waived
    statement: |
      every effect grinbox has that reaches the user, changes their mailbox, or costs money is
      subject to a limit on how often it may happen, and nothing the user configures can exempt
      an effect from its limit. Reading from a mail provider to learn what has arrived is not
      such an effect and needs no limit.
    supersedes: r-zmn2p7lf

  - id: r-t4jn8zvw
    scope: interface
    title: running grinbox takes nothing but grinbox
    statement: |
      everything a user has to do to run grinbox — adding a mailbox, building and changing a
      configuration, reading what happened, adjusting a limit, re-examining a message — is done
      from grinbox's own interface. None of it requires a shell on the machine, or reading or
      writing grinbox's stored state directly.
    supersedes: r-bcbvl9g5

  - id: r-x3jb6wlq
    scope: interface
    title: grinbox says what it needs
    statement: |
      the user learns from grinbox's own interface that something needs them — a mailbox whose
      authorization lapsed, an operator that keeps failing, a limit being hit — rather than by
      going to look for it or by noticing that mail stopped being triaged.
    supersedes: r-56o7qts0
