version: "1"

requirements:
  - id: r-p2djwgjn
    title: a copy of the state is not a copy of the credentials
    statement: |
      the credentials grinbox holds on the user's behalf cannot be read out of grinbox's state on
      its own. Whoever obtains the state file — a backup, a disk image, a restored copy — obtains
      no usable credential with it.
    rationale: |
      A single machine's realistic leak is its offsite backup, not its running process, and this
      is the one thing that makes that leak survivable. It claims nothing about a live compromised
      machine, which necessarily holds what it needs to work.
    verification:
      - do: take a copy of grinbox's state as a backup would, and read the stored credentials from it without anything else from the host
      - verify: nothing usable against the mail provider comes out

  - id: r-ieyj1wkn
    title: authorizing a mailbox is done once, from grinbox
    statement: |
      the user authorizes a mailbox from grinbox's own interface, and grinbox keeps that
      authorization working from then on without the user returning to it.

  - id: r-fzuyjkts
    title: an account that stops working says so
    statement: |
      an account whose authorization no longer works is reported to the user as needing their
      attention, and grinbox stops polling it rather than failing against it repeatedly.

  - id: r-ls4dvyj7
    title: a restart loses no arrival
    statement: |
      a message that arrived is triaged even where grinbox stopped, at any moment, between
      noticing it and recording it. No arrival is skipped because of a restart.
    verification:
      - do: interrupt grinbox part-way through taking in a batch of new messages, then start it again
      - verify: every message in that batch is triaged, and none is triaged twice
