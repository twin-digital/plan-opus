version: "2"

# The design consequences of moving grinbox's code into the opus workspace.

decisions:
  - id: d-6ct1o00j
    title: the deployment fetches a versioned bundle the workspace releases
    statement: |
      opus builds grinbox into one self-contained bundle per release — the daemon's and the
      browser application's compiled output, plus a production manifest and lockfile pruned to the
      daemon's own dependencies — and attaches it to the tag changesets writes. The infrastructure
      repository names a version and fetches that asset, rather than copying a source tree out of
      a checkout.
    status: accepted
    because:
      - d-riyvvlx5
      - d-mq7vdduz
      - d-cjjd5c0w
    pinned:
      reason: data-format
      notes: |
        it is the seam between the two repositories: the infrastructure repository reads the
        bundle's layout, and the daemon's launch resolves paths inside it
