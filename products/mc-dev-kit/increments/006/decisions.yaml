version: "1"

# The pack-build rulings, harvested from the #123 branch (`design/minecraft-pack-build`, tip
# afd5881) and reconciled against this product's fold. `drafts/harvest-map.md` maps branch slug to
# id and records which statements the reconciliation changed. The branch's five rejected entries
# stay on the preserved branch as history and are not re-entered.
decisions:
  # the shape of the export
  - id: d-5ej8yfki
    title: the export is a fragment carrying a Rolldown plugin
    statement: |
      the build half exports one function returning a tsdown config fragment whose `plugins` array
      holds a single Rolldown plugin that performs the whole build
    status: accepted
    pinned:
      reason: public-api
    because:
      - r-yg1djnta
      - f:tsdown-takes-rolldown-plugins-through-its-config
    facets: build

  - id: d-qtq0ccy6
    title: the consumer hands over its package directory
    statement: |
      the exported function takes one required option, `packageDir`, the filesystem path of the
      package directory the build is for
    status: accepted
    pinned:
      reason: public-api
    facets: build

  - id: d-wss8fker
    title: the build export is a subpath, `packBuild`
    statement: |
      the build half is exported from `@twin-digital/mc-dev-kit/build` as `packBuild`, taking the
      options object of `d-qtq0ccy6`. A consumer of the discovery half therefore never resolves the
      bundler types the build export names.
    status: delegated
    pinned:
      reason: public-api
    because:
      - d-5ej8yfki
      - d-qtq0ccy6
      - r-yg1djnta
    facets: build

  - id: d-0341uo0g
    title: the fragment states the settings the build depends on
    statement: |
      the fragment sets `clean`, `format`, `dts`, `sourcemap`, `minify`, `noExternal`, `entry`,
      `outDir`, `outputOptions.entryFileNames`, and `resolve.conditionNames` itself rather than
      inheriting them, so the build behaves the same merged over a shared base as it does alone. In
      particular `clean` is false: emptying the output directory before the build would take the
      end-of-build prune's inputs with it.
    status: delegated
    pinned:
      reason: other
      notes: the keys a consuming package's own bundler configuration must not silently supply instead
    because:
      - d-jxv1x5ht
      - d-3sb0vrc2
      - d-p06hnnc0
      - f:tsdown-clean-empties-the-whole-output-directory-before-buildstart
      - f:opus-bundler-config-merges-partial-fragments
      - f:opus-bundler-base-forces-every-import-bundled
    facets: build

  - id: d-s1haiu19
    title: a pack package's build produces its packs and nothing else
    statement: |
      a package taking up the export devotes its bundler configuration and its `dist/` to its packs:
      the export's fragment is the whole of what that configuration builds, and the output tree is
      the build's to own and prune. The fragment reaches the package's configuration through
      whatever extension mechanism that configuration already offers — in the opus monorepo, a
      `tsdown.config.d/` fragment merged over the generated base — rather than by replacing it.
    status: delegated
    pinned:
      reason: public-api
    because:
      - r-8xmkne8a
      - d-0341uo0g
      - f:opus-package-config-is-generated-from-one-root-file
      - f:opus-bundler-config-merges-partial-fragments
    facets: build

  - id: d-vpwz0dps
    title: the build reads the kit pack set
    statement: |
      the build calls the dev kit at build time and takes the packs of its own package from the pack
      set, rather than reading the package's source manifests itself
    status: accepted
    because:
      - r-gyrsw1mq
    facets: build

  - id: d-ai68xorc
    title: the workspace root is the nearest one the kit recognises
    statement: |
      the workspace root handed to the kit is the nearest ancestor of the package directory that the
      kit's own rule recognises as one — a `pnpm-workspace.yaml`, else a workspace-declaring
      `package.json` — and a package directory with no such ancestor fails the build
    status: delegated
    because:
      - r-4f1obncy
      - d-xnv5kh7k
    facets: build

  - id: d-d727qv5z
    title: script sources live in the pack's scripts directory
    statement: |
      a behavior pack's script sources sit under `behavior_pack/scripts/`, with `main.ts` the bundle
      entry, and nothing under that directory is copied into the output tree: the directory holds
      build inputs, and the pack's script content is the bundle written in their place.
    status: delegated
    pinned:
      reason: other
      notes: the source layout a consuming pack package must follow
    because:
      - r-umoo5i1i
    facets: build

  - id: d-oln00v7s
    title: the script output path is set in config and checked against the kit
    statement: |
      the configuration points the bundler's `outDir` and entry filename at
      `<package>/dist/behavior_pack/scripts/main.js`, and the plugin fails the build when the pack
      set reports a script location for this package's behavior pack that is not that path. A pack
      for which the pack set reports no script location is not a mismatch.
    status: delegated
    pinned:
      reason: data-format
    because:
      - r-2alueo3d
      - d-jewbwtye
    facets: build

  - id: d-3sb0vrc2
    title: externals come from the manifest's module dependencies
    statement: |
      the external set is exactly the `module_name` dependencies the pack's completed manifest
      declares, and an undeclared `@minecraft/`-scoped import fails the build only when nothing
      importable resolves for it
    status: accepted
    pinned:
      reason: data-format
    because:
      - r-2alueo3d
      - f:a-plugin-resolveid-external-return-wins-over-noexternal
    facets: build

  - id: d-llnhw1k1
    title: the bundler writes its chunks and the plugin writes the rest
    statement: |
      the bundler writes the entry chunk and any chunk split out of it, and the plugin writes only
      the completed manifests and the copied assets
    status: delegated
    because:
      - f:tsdown-entry-chunk-name-comes-from-entryfilenames
    facets: build

  - id: d-5meg5uy7
    title: a chunk no pack claims is pruned like any other stale output
    statement: |
      a chunk the bundler writes for a package whose behavior pack declares no script module, or
      which holds no behavior pack at all, is removed by the end-of-build prune rather than prevented
      from being written
    status: delegated
    because:
      - d-p06hnnc0
    facets: build

  - id: d-64tw58t0
    title: a script-less package builds through a virtual entry
    statement: |
      a package whose behavior pack has no script sources builds with a virtual entry module the
      plugin resolves and loads, rather than with an empty entry list or a stub file on disk
    status: accepted
    facets: build

  - id: d-e7a7psq6
    title: a declared script module with no sources fails the build
    statement: |
      a behavior pack whose manifest declares a script module while
      `<package>/behavior_pack/scripts/main.ts` is absent fails the build, rather than shipping an
      empty bundle at the path the completed manifest names
    status: delegated
    because:
      - d-64tw58t0
      - d-wzmofsc8
    facets: build

  - id: d-876m8rnf
    title: a resource-pack-only package builds
    statement: |
      a package holding a resource pack and no behavior pack builds: its assets are copied and its
      manifest completed, the virtual entry's chunk is pruned at the end of the build, and no script
      location check applies to it
    status: delegated
    because:
      - d-5meg5uy7
      - d-64tw58t0
      - d-oln00v7s
    facets: build

  - id: d-3kcr1672
    title: a rebuild emits no report
    statement: |
      a build writes no record of which packs it changed; a watching consumer reads the output tree
    status: accepted
    pinned:
      reason: other
      notes: a watching consumer's contract — the output tree is the only change report
    because:
      - r-8xmkne8a
      - d-nclb1c8l
    facets: build

  - id: d-095jgny3
    title: the watch set is declared from what the build reads
    statement: |
      the plugin registers as extra watch inputs the package's pack source directories, its source
      manifests, its `package.json`, and the `package.json` of each workspace package a pack's
      manifest names as a dependency. Directories are registered rather than the files they hold, so
      a newly added asset triggers a rebuild.
    status: delegated
    because:
      - r-v8jjhds5
      - r-wi7qf6to
      - f:a-rolldown-plugin-can-declare-extra-watch-inputs
    facets: build

  # the archive
  - id: d-6ewrh1g3
    title: the archive is a single mcaddon per package
    statement: |
      a package is cut into one `.mcaddon` holding one `.mcpack` per pack in its output tree, whatever
      the number of packs
    status: accepted
    pinned:
      reason: data-format
    because:
      - r-phxrb6qn
    facets: build

  - id: d-r6vxh2qu
    title: an mcpack holds the pack directory's contents at its root
    statement: |
      each `.mcpack` member holds the contents of the pack's output directory at the archive root, so
      its `manifest.json` sits at the root of the member rather than under a directory
    status: delegated
    pinned:
      reason: data-format
    because:
      - d-6ewrh1g3
      - f:pack-is-a-directory-with-a-manifest-at-its-root
    facets: build

  # the owner tolerated this on the branch (thread 3673915455); delegated is this product's
  # status for a ruling that lets the choice stand without endorsing it
  - id: d-j9qge6s1
    title: the archive ships as a bin command
    statement: |
      the archive half is a command, `mc-pack-archive`, that the kit package declares in its `bin`
    status: delegated
    pinned:
      reason: public-api
    because:
      - r-yg1djnta
    facets: build

  - id: d-s5ymp8ai
    title: the archive command takes no arguments
    statement: |
      the archive command takes no arguments, works on the package directory it is run in, and writes
      into `.release-assets/`, creating that directory
    status: accepted
    pinned:
      reason: public-api
    because:
      - r-phxrb6qn
    facets: build

  - id: d-eb6tfefk
    title: the archive command clears its output directory
    statement: |
      `mc-pack-archive` removes any archive already sitting in `.release-assets/` before writing, so
      a previous version's `.mcaddon` is not published beside the current one
    status: delegated
    pinned:
      reason: other
      notes: what the release hook uploads is every file the directory holds
    because:
      - d-s5ymp8ai
      - f:opus-release-assets-come-from-a-per-package-script
    facets: build

  - id: d-gbh83fap
    title: the archive reads the output tree and consults nothing else
    statement: |
      `mc-pack-archive` finds a package's packs from the kind-named directories of its output tree and
      never calls the kit, so it archives what that tree holds — a tree stale with respect to source
      included
    status: delegated
    because:
      - d-mle1zwtz
      - d-6ewrh1g3
    facets: build

  - id: d-9hbe6ixx
    title: archive names come from the package name and version
    statement: |
      the archive is named `<package name with its npm scope stripped>-<version>.mcaddon` and its
      members `behavior_pack.mcpack` and `resource_pack.mcpack`
    status: accepted
    pinned:
      reason: data-format
    because:
      - r-kbgjy2pt
    facets: build

  - id: d-mle1zwtz
    title: a missing output tree fails the archive
    statement: |
      the archive command fails naming the missing directory when a package's output tree is absent,
      and never runs a build itself
    status: accepted
    because:
      - r-phxrb6qn
    facets: build

  # the output tree
  - id: d-h91x9nxz
    title: assets copy verbatim except the manifest and scripts
    statement: |
      every file under a pack's source directory reaches the output unchanged except its
      `manifest.json` and everything under `scripts/`; dotfiles and unknown extensions copy like the
      rest
    status: accepted
    pinned:
      reason: data-format
    because:
      - r-umoo5i1i
      - r-imfmv0qc
    facets: build

  - id: d-xnnslpns
    title: empty source directories produce no output directory
    statement: a source directory holding no files creates no directory in the output tree
    status: accepted
    facets: build

  - id: d-exzp1618
    title: the completed manifest is two-space JSON
    statement: |
      a completed `manifest.json` is written as JSON with two-space indentation and a trailing newline
    status: accepted
    pinned:
      reason: data-format
    facets: build

  - id: d-nclb1c8l
    title: output files are written only when their bytes change
    statement: |
      every file the build writes is compared with what already sits at that path and written only on
      a difference
    status: delegated
    pinned:
      reason: other
      notes: a watching consumer keys on unchanged files keeping their timestamps
    facets: build

  - id: d-mr3z6vy9
    title: an unchanged chunk is dropped before the bundler writes it
    statement: |
      a chunk the bundler produced whose bytes match what already sits at its output path is removed
      from the bundle before the bundler writes, so the compared write of `d-nclb1c8l` reaches the
      script bundle as well as the files the plugin writes itself
    status: delegated
    pinned:
      reason: other
      notes: without it a watching consumer sees the script bundle change on every build
    because:
      - d-nclb1c8l
      - d-llnhw1k1
      - f:tsdown-rewrites-an-output-file-whose-bytes-did-not-change
      - f:emptying-the-bundle-in-generatebundle-leaves-the-bundler-nothing-to-write
    facets: build

  - id: d-p06hnnc0
    title: stale output is pruned, not wiped
    statement: |
      output the current build did not write is deleted at the end of the build, rather than the
      output tree being cleared before it
    status: accepted
    because:
      - r-8xmkne8a
    facets: build

  - id: d-jxv1x5ht
    title: the bundle is one unminified ESM chunk
    statement: |
      the bundle is a single ESM chunk, unminified, with no type declarations and no sourcemap. The
      build does not split: a pack ships the one file its manifest names.
    status: delegated
    pinned:
      reason: data-format
    because:
      - d-0341uo0g
    facets: build

  # failures
  - id: d-no9a9s0x
    title: an invalid pack fails the build
    statement: |
      a pack of this package that the kit reports invalid fails the build with the kit's problems
      printed, and no sibling pack in the package is built
    status: delegated
    facets: build

  - id: d-y08itp8j
    title: an unreadable workspace fails the build, naming the file
    statement: |
      the build fails naming the file that could not be read when the kit's enumeration rejects
      rather than returning entries — a distinct failure from a pack the kit reports invalid, and one
      an unrelated package in the workspace can cause
    status: delegated
    because:
      - d-vpwz0dps
      - d-ydph1k7d
      - f:a-malformed-member-manifest-fails-the-whole-enumeration
    facets: build

  - id: d-4e0kt69q
    title: a package with no pack fails the build
    statement: |
      a package for which the kit reports no pack fails the build, naming the package directory that
      was searched
    status: accepted
    facets: build

  - id: d-wzmofsc8
    title: a stale virtual entry fails the build
    statement: |
      a build configured with the virtual entry fails at `buildStart` when
      `<package>/behavior_pack/scripts/main.ts` is on disk, rather than writing the empty script over
      sources the configuration was evaluated too early to see
    status: delegated
    because:
      - d-64tw58t0
    facets: build

  # documentation
  - id: d-9s4tdc8z
    title: documentation ships as TSDoc and a README section
    statement: |
      the export's documentation is TSDoc on the exported function and its options plus a usage
      section in the kit package's README, not a separate document
    status: accepted
    because:
      - r-ifvxhl2p
    facets: build
