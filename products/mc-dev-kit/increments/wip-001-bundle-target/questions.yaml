questions:
  - id: q-jvswl34o
    question: |
      is `d-jxv1x5ht`'s no-splitting rule still what the owner wants, now that the engine is
      measured to support splitting? It was ruled on the reading that a split chunk might not load
      at all; `f:bedrock-script-engine-loads-multiple-modules-and-appends-js-to-every-specifier`
      shows a multi-file graph and a dynamic `await import()` both work. Two measured reasons still
      argue for one file: a chunk named `.mjs` is unreachable, so splitting would need chunk names
      forced to `.js`, and
      `f:a-bedrock-script-reload-resolves-only-the-files-loaded-at-world-load` makes a chunk added
      since world load fail to resolve until a restart — a dev-loop failure a single file cannot
      have. Mojang's own tooling ships one file
      (`f:mojangs-own-bundler-emits-a-single-esm-bundle-with-game-modules-external`). Keeping the
      rule needs no change; relaxing it reverses a pinned decision, so the call is the owner's.
    answer: decision
    facets: build
