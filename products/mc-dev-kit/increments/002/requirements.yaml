version: "1"

requirements:
  # where the build lives, and what it is
  - id: r-gyrsw1mq
    title: build ships in the kit package
    statement: |
      the build capability ships in the same distributable as minecraft/dev-kit — one package, two
      designs. Nothing here is published, versioned, or installed separately from the kit.
    verification:
      - do: open the workspace's package manifests and the kit package's exports
      - verify: the build capability is exported from the kit's own package, and no other package publishes, versions, or installs it
    facets: build

  - id: r-if6t18ve
    title: build is an exported bundler config
    statement: |
      what this design produces is exported for a consuming package's bundler configuration to use —
      not a command the package runs. It embeds no bundler and ships no command line of its own.
    verification:
      - do: open the package's exports, dependencies, and declared commands
      - verify: the build capability is an export a consuming package's bundler configuration takes up, no command line for it is declared, and no bundler is a dependency of the package
    facets: build

  - id: r-e5bfrqzx
    title: a released pack is an archive of its output tree
    statement: |
      a pack's release archive is produced from that pack's built output tree by this design, exported
      for the pack's release hook to call.
    verification:
      - do: build a pack, then call the exported archive entry the way a release hook would
      - verify: an archive is produced, and its contents are the pack's built output tree
    facets: build

  - id: r-ifvxhl2p
    title: the exported config is documented
    statement: |
      what this design exports carries documentation of how a consuming package uses it and what
      using it produces.
    verification:
      - do: open the documentation shipped with the export
      - verify: it states how a consuming package uses the export and what using it produces
    facets: build

  # what a build produces
  - id: r-2alueo3d
    title: script module bundled, game modules external
    statement: |
      a pack's script module is bundled to the location the pack's output tree expects, with the
      modules the game provides at runtime left external.
    verification:
      - do: build a pack whose script module imports a module the game provides at runtime — `@minecraft/server`, say
      - verify: the bundle sits at the location the pack's output tree expects
      - verify: the game-provided module remains an external import in the bundle, not inlined
    facets: build

  - id: r-umoo5i1i
    title: every pack file reaches the output tree
    statement: |
      every file a pack is made of, and not only what the bundler emits — functions, entity and item
      definitions, textures, `.lang` files, and the rest — is placed into the output tree, so a
      finished build is loadable with no further processing by anything downstream.
    verification:
      - do: build a pack holding functions, entity and item definitions, textures, and `.lang` files
      - verify: every one of those files is present in the output tree
      - verify: the output tree is loadable as it stands, with no further processing by anything downstream
    facets: build

  - id: r-8xmkne8a
    title: assembly is authoritative over the output tree
    statement: |
      the output tree holds what the current source declares and nothing else: a file deleted or
      renamed in source is gone from the output after the next build, with no clean step first.
    rationale: |
      Otherwise a deleted file survives in the output and ships in whatever is cut from that tree.
    verification:
      - do: build a pack, then delete one source file and rename another, and build again with no clean step
      - verify: the deleted file is gone from the output tree, and the renamed file appears only under its new name
    facets: build

  - id: r-wsv90bxm
    title: rebuild triggers are declared, not inferred
    statement: |
      a rebuild is triggered by a change to any input a build reads, the pack files and
      `package.json` included — nothing imports those, so a module graph cannot find them. A source
      change rebundles; a change to a manifest input alone brings the output's manifests up to date
      without rebundling.
    verification:
      - do: start a watch build, then change a pack file nothing imports — a texture or a function file
      - verify: a rebuild runs, without the changed file being reachable from any module graph
      - do: change a manifest input alone — `package.json`, say
      - verify: the output's manifests come up to date, and no rebundle runs
    facets: build

  - id: r-kbgjy2pt
    title: the package version is the pack version
    statement: |
      a pack's version comes from its `package.json` and nowhere else — raising that version and
      building is what produces a new version of the pack. No separate release manifest is
      maintained.
    verification:
      - do: raise the pack's `package.json` version and build, editing nothing else
      - verify: the built output carries the new version
      - verify: no separate release manifest exists in the package
    facets: build
