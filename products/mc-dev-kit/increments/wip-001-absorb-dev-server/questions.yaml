version: "1"

# What the dev loop still rests on and cannot answer from the fold. Three of the stranded cycle's
# five questions asked what the kit's API does; inside this product those are the kit's own
# requirements and the decisions cite them directly. These four are what remains, plus two the
# survey of the draft fold found unrecorded.
questions:
  - id: q-gsr57mk0
    question: |
      Does an edit to a world's activation list take effect without a server restart, and is the
      world directory the only place the list is read from? The probe behind
      f:bedrock-activation-list-read-only-at-world-load restarts between every list change, so no
      observation in hand separates a list edit from the restart beside it; the world directory is
      likewise only where the list was observed to work, not a place shown to be the only one.
      Closed by a probe that edits a list without restarting, or by a documented source. If a list
      edit lands live, d-ftlfhac8 prices a restart for a change that does not need one.
    answer: fact
    facets: dev-loop

  - id: q-12jwzs0h
    question: |
      Does any console command — `/reload all` among them — bring a pack newly copied into the pool
      into the running world, or is a restart the only path? The reload probe behind
      f:a-bedrock-script-reload-resolves-only-the-files-loaded-at-world-load measured files inside a
      pack already loaded, never a pack newly pooled, so the newly-pooled case is untested. If a
      console command does pool a pack live, d-ftlfhac8's boundary is drawn one case too tight.
    answer: fact
    facets: dev-loop

  - id: q-qk2r4e5q
    question: |
      Does `docker compose cp` read from a container to the host against a remote daemon, and can
      the image's console helper — or `exec` more generally — list a pool directory and return a
      file's contents? d-q8ikxtdk reads pool contents and activation lists off the running
      container every reconcile, and the evidence in hand covers only the host-to-container
      direction and only `send-command`. Closed by a probe against a remote daemon.
    answer: fact
    facets: dev-loop

  - id: q-h34y88go
    question: |
      What is a world's resource-pack activation list called, where does it sit, and does an entry
      carry the same uuid-and-version shape a behavior-pack entry does?
      f:bedrock-activation-entry-is-header-uuid-and-version is scoped to
      `world_behavior_packs.json`; `world_resource_packs.json` appears only inside a probe quote for
      a misrouted pack, and nothing establishes its shape. d-4iepnry2 deploys resource packs and
      d-cw6pder5 writes their entries. Closed by a probe or a documented source.
    answer: fact
    facets: dev-loop
