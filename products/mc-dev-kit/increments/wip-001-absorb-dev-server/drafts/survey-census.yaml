  - package: nodejs/minecraft/mc-dev-kit
    published_as: "@twin-digital/mc-dev-kit"
    kind: npm-library
    note: |
      implementations/mc-dev-kit/002-1.yaml covers increments 001-002 only (v0.2.0, the discovery
      half). Increments 003-007 — the whole build facet, and increment 005's scriptOutput on the
      entry — are designed and unbuilt. Every entry is read against that gap.
    entries:
      - choice: >-
          whether the library exports workspace-root resolution, or the harness reimplements the kit's root rule in a second package
        arises: >-
          d-imdfu09l derives project identity from the workspace root's absolute path and says a run from a subdirectory addresses the same server. The library's only root input is DiscoverOptions.workspace defaulting to process.cwd() (d-rl1msrus); the root rule (d-xnv5kh7k) lives unexported, and discoverPacks reports no root. d-ai68xorc already answered this in prose for the build half without saying whether the rule is reachable from outside.
        reading: >-
          the strongest cross-package allocation problem the draft creates, and the only one plausibly needing new public surface. Three ways out — export a resolver (new pinned surface, so an escalation); reimplement the marker precedence in the harness (two packages silently disagreeing about which workspace they are in); or require running from the root (contradicts d-imdfu09l). The first is correct and the second is the failure to avoid. d-ai68xorc needs the same answer, so it is one export serving two consumers.
      - choice: >-
          whether a pack entry can be joined back to an absolute path without the consumer separately tracking the root it passed in
        arises: >-
          every reported path is workspace-relative POSIX (d-s43hmdgr, d-fm9m41kc); the harness needs absolute paths for cp sources, build cwds, and watched output directories
        reading: >-
          mechanically a one-liner harness-side — an implementation detail. Recorded because d-s43hmdgr's revisit_when names exactly this consumer, and is now satisfied only by the harness never letting entries out of the scope that resolved the root. That is a discipline, not a guarantee. Merges with the entry above.
      - choice: >-
          what version form an activation entry carries, and whether a pool pack whose completed manifest declares a SemVer string matches an entry's three-number array
        arises: >-
          d-cw6pder5 takes uuid and version from the pack set; the pack set's version is the completed header.version (d-f72ia08n), which r-wi7qf6to writes as a SemVer string, while the fact records the entry as the header's three-number array which must match the pool pack
        reading: >-
          two residuals. The small one is a parse the harness performs — a detail. The large one is that the probe matched an array-versioned pool pack against an array entry; nothing establishes that a pool pack carrying a string version matches at all, and pre-release versions have no array form. Must be probed before the harness ships; if the string form does not match, the fact contradicts r-wi7qf6to for every pack the harness deploys, which is the owner's call.
      - choice: >-
          how the harness learns a selected package declares the build and watch scripts d-j3ayhwv1 invokes, and what happens when it declares neither
        arises: >-
          the pack set reports packageName and packageDir and nothing of the package manifest; the kit parses every candidate package.json already and keeps it internal
        reading: >-
          this should not become library surface — exporting a parsed package.json widens the entry type for one consumer and re-opens d-a8lgrojc's minimal surface. Re-reading one package.json per selected package belongs to the harness. What is genuinely undecided is the missing-script behaviour, and the discovery-only case is real: this very library declares build but no watch.
      - choice: >-
          how often the harness re-reads the pack set, and therefore whether discoverPacks stays a cold whole-workspace read per call
        arises: >-
          d-k7py0qqv fixes one read per call and its revisit_when names this consumer. d-ftlfhac8 restarts on a version change, but a version comes from package.json (r-kbgjy2pt), which the harness watches nothing of
        reading: >-
          the sharpest correctness interaction with an existing decision. Discover once at startup and a version bump changes the built manifest, the harness redeploys, and its activation entry keeps the stale version — the pack silently stops loading, exactly the failure f:bedrock-activation-entry-is-header-uuid-and-version describes. The fix is harness-side and cheap — re-run discoverPacks at the head of every reconcile — which keeps d-k7py0qqv intact. But the cadence is decided nowhere, and cache-once is the natural pick.
      - choice: >-
          who stats a reported outputDir, and what a deploy does when a selected pack's output tree is absent
        arises: >-
          d-6g8oo8je reports outputDir whether or not it exists and the kit never reads the output tree (r-iavfb8qj, r-1bvvl9k7); d-ftlfhac8 needs the built file set
        reading: >-
          allocation is settled and should not be disturbed — d-3kcr1672 says a watching consumer reads the output tree, and r-iavfb8qj keeps the library out of it, so no built-output reader belongs on this package. The residual is absent-tree behaviour, harness-side. d-6g8oo8je's revisit_when is now met by a real consumer but does not read as triggered.
      - choice: >-
          what a run does with a selected pack the kit reports invalid
        arises: >-
          d-c1kvyord selects by owning package name and errors on an unmatched --pack. PackCriteria has a status field; nothing says the harness filters. uuid and version are optional on InvalidPackEntry (d-61fegb3o), and d-oo8256gl names a pool directory for the uuid
        reading: >-
          the library needs nothing — the filter and the optional typing force a consumer to confront this rather than crash, which is d-61fegb3o working as intended. The undecided part is policy, harness-side. Leaning toward failing loudly: r-pcq10f2b says the server's pack state equals the built output of the selected packs, and a silently-skipped selected pack breaks that.
      - choice: >-
          the dependency range the harness declares on the kit, and whether the kit's version moves out of 0.x now that a second published package pins to its surface
        arises: >-
