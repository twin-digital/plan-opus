# Survey census — mc-dev-kit @ wip-001-absorb-dev-server
#
# The Plan phase dispatched the implement phase in survey mode, read-only, against this draft fold
# on its branch: one implementer per package the fold names — nodejs/minecraft/mc-dev-server
# (npm-cli, proposed by d-zyo6kku9) and nodejs/minecraft/mc-dev-kit (npm-library, existing). Both
# censuses are below as returned, every proposed decision assumed in force.
#
# The draft acted on this census: q-npz0np7l records the activation version form the library survey
# surfaced, and d-ftlfhac8 and d-a9jaqn8m were repaired where the CLI survey found the file-set
# reload rule and the reattach path written against each other. drafts/absorption-map.md carries the
# classification of every entry.

censuses:
