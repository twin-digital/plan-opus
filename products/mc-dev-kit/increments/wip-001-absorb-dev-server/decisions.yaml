  - id: d-5ocyva9w
    title: the harness reads a running server rather than a record of it
    statement: |
      the harness learns what a running server is from the server, not from anything it stamped there.
      Container-level settings — the image and the published port — are read by inspecting the running
      container. The world a server is serving is read from the level name in its configuration on the
      volume.

      What cannot be read back is the seed a world was generated from: the server records the seed it was
      asked for, not the one an existing world already had, and the world's own copy is binary. So the
      harness keeps one small file on the volume naming, per world it generated, the seed it generated it
      from — which it can always do, because d-41m3iws5 has it choose the seed rather than the server.
      That file is a record, which a reconcile is otherwise forbidden to trust (d-q8ikxtdk) — the
      exception holds because a world's generation seed is immutable history rather than state that can
      drift, and because nothing else can answer the question.
    status: delegated
    pinned:
      reason: data-format
      notes: a file the harness writes on the volume and reads back on a later run
    facets: dev-loop
