version: "1"
decisions:
  - id: d-zyo6kku9
    title: the harness is its own package beside the library
    statement: >
      the harness ships as a second package of this product,
      `nodejs/minecraft/mc-dev-server`,

      published as `@twin-digital/mc-dev-server` with kind `npm-cli`. It depends
      on

      `@twin-digital/mc-dev-kit`; the library depends on nothing of the
      harness's, and a pack

      package consuming the kit's discovery or build halves takes on no
      dependency on Docker.


      `product.yaml` declares the package when the package's files exist, not
      before.
    status: accepted
    pinned:
      reason: public-api
      notes: the published name a consumer installs, and the split that keeps Docker
        out of a pack package's dependencies
    facets: dev-loop
    because:
      - r-8et233c9
      - r-whacwz1b
      - r-jvb29tpu
  - id: d-wtziwjh5
    title: server image pinned with console helper
    statement: >
      the harness targets the `itzg/minecraft-bedrock-server` image, pinning the
      tag it generates

      and exposing only that tag as configuration.
    status: accepted
    pinned:
      reason: public-api
      notes: the one server-side knob a consumer sets, and the tag every log-matching
        decision below is calibrated against
    facets: dev-loop
    because:
      - f:bedrock-image-exposes-a-noninteractive-console-helper
  - id: d-uqdxo2w6
    title: deploy transport is cp and console exec
    statement: >
      built packs reach the server with `docker compose cp` and reloads are
      issued with

      `docker compose exec` of the image's console helper. Compose's own
      `develop.watch` is not

      used.
    status: tolerated
    facets: dev-loop
    because:
      - r-whacwz1b
      - d-wtziwjh5
      - f:compose-cp-copies-without-bind-mounts
      - f:bedrock-image-exposes-a-noninteractive-console-helper
      - f:compose-watch-path-constraints
  - id: d-w8cc8n18
    title: generated compose file is fully resolved
    statement: >
      the harness writes a generated compose file with every value already
      substituted and invokes

      it by absolute `-f` path, passing neither `--project-directory` nor an env
      file.
    status: delegated
    facets: dev-loop
    because:
      - f:compose-env-file-not-loaded-from-cwd
  - id: d-imdfu09l
    title: the project identity is derived from the workspace root
    statement: >
      the compose project name is derived from the absolute path of the
      workspace root, so one

      workspace addresses one server and two workspaces on one daemon do not
      collide. The world's

      level name and the generated compose file's location are settings of that
      project, not of the

      current directory, and a run started from a subdirectory addresses the
      same server as one

      started from the root.
    status: tolerated
    facets: dev-loop
    because:
      - r-7lroj1cg
      - r-kfu7pcms
      - d-w8cc8n18
  - id: d-zo2yl18y
    title: a world lives for one run and no longer
    statement: |
      the server's `/data` is a named Docker volume the harness creates on `start` and removes on
      `stop`. A world therefore survives every restart the loop spends and every Ctrl+C and reattach,
      and no `stop` at all: the next `start` generates a fresh world.

      A volume rather than the container's own writable layer, so the world is independent of the
      container's lifecycle for as long as the run owns it, and so there is one named thing to
      snapshot when snapshots arrive.
    status: proposed
    pinned:
      reason: data-format
      notes: whether an author's world survives a stop, and what a stop destroys
    facets: dev-loop
    because:
      - r-kfu7pcms
      - r-whacwz1b
      - d-imdfu09l
  - id: d-4iepnry2
    title: both pack kinds are routed by the kind the pack set reports
    statement: >
      the harness deploys behavior and resource packs alike, routing each to its
      kind's pool and

      its kind's world activation list by the kind the pack set reports. It
      reads no pool directory

      name as a declaration of kind and re-derives kind from nothing: a
      misrouted pack is not

      observable from the server's output, so the routing is prevented rather
      than caught.
    status: delegated
    facets: dev-loop
    because:
      - r-hpu39brj
      - r-rlh87pau
      - r-fghzi5qq
      - f:pack-kind-mismatch-fails-silently-at-the-server
  - id: d-cw6pder5
    title: activation entries are written from the pack set
    statement: >
      an activation entry's uuid and version are taken from the pack set the kit
      returns, and its

      version is written in whatever form the kit reports it. The harness reads
      no `manifest.json`,

      in the built output or anywhere else, and converts nothing — the entry is
      known before a build

      runs, the server accepts a SemVer string as readily as an array, and the
      two sides need not

      agree on the spelling.
    status: accepted
    facets: dev-loop
    because:
      - r-rlh87pau
      - r-kbgjy2pt
      - r-imfmv0qc
      - f:bedrock-activation-entry-is-header-uuid-and-a-matching-version
  - id: d-oo8256gl
    title: a pack occupies a pool directory named for its uuid
    statement: >
      inside its kind's pool a pack occupies a directory named for its header
      uuid, lowercased.

      That name is the whole of what a later read of the pool has to go on.
    status: accepted
    facets: dev-loop
    because:
      - r-xcz7nzr6
      - r-iby30nx1
      - d-0thqo4n0
  - id: d-q8ikxtdk
    title: reconcile reads live server state
    statement: >
      each reconcile reads the pool contents and activation lists off the
      running container rather

      than trusting a record of what the last deploy wrote, so a hand-edited
      container, a crash

      mid-copy, or a server left running from a previous session all converge on
      the next save.
    status: delegated
    facets: dev-loop
    because:
      - r-pcq10f2b
      - d-uqdxo2w6
      - f:compose-cp-copies-without-bind-mounts
  - id: d-a9jaqn8m
    title: the harness compares presence and identity, never content
    statement: >
      the harness compares pack presence, activation identity, and the file
      names a pack's pool

      directory holds. No file's content is ever read back. A pack whose built
      output changed is

      re-deployed in full.
    status: delegated
    facets: dev-loop
    because:
      - r-pcq10f2b
      - d-q8ikxtdk
  - id: d-n0dz38ky
    title: a pool directory is replaced, not merged into
    statement: >
      deploying a pack removes its pool directory before copying, so the pool
      holds what the output

      tree holds and nothing else. A copy over a directory already in place
      merges, which would

      leave a file deleted from the output tree sitting on the server
      indefinitely.
    status: accepted
    facets: dev-loop
    because:
      - r-pcq10f2b
      - r-8xmkne8a
      - d-a9jaqn8m
  - id: d-ftlfhac8
    title: a reload is used only when the pack's file set is unchanged
    statement: >
      the harness applies a change with the console reload only when the pack is
      already in its

      pool, already listed at the same identity, and the file names its built
      output holds are the

      same ones its pool directory already holds — only file contents differ. An
      added or removed

      file, an added or removed pack, a version change, and any activation-list
      edit all restart

      the server.


      The file set is what the cheap path is drawn around because a reload
      re-evaluates a loaded

      module against the current contents of its files, whichever of them
      changed, while a file

      first deployed after the world load fails to resolve with the same error a
      genuinely absent

      one gives — silently, from the harness's side. The comparison is against
      the pool the

      reconcile already reads, not against anything the harness remembers, so it
      holds on the first

      change after a reattach as it does on any other.
    status: delegated
    facets: dev-loop
    because:
      - r-cekp2mcb
      - r-8xmkne8a
      - d-a9jaqn8m
      - f:a-bedrock-script-reload-resolves-only-the-files-loaded-at-world-load
      - f:bedrock-reload-re-evaluates-an-edited-script-module
      - f:bedrock-reload-updates-scripts-not-pool-or-manifest
      - f:bedrock-activation-list-read-only-at-world-load
  - id: d-i4oryd9x
    title: readiness is the world-load pack stack line
    statement: >
      the server counts as ready when the container log emits the world-load
      line reporting the

      pack stack, and the harness reports that line as what the load actually
      brought up.
    status: delegated
    facets: dev-loop
    because:
      - d-wtziwjh5
      - f:bedrock-activation-list-read-only-at-world-load
  - id: d-vrq7lc2o
    title: a pack that will not build is deployed as a stub
    statement: |
      the start sequence runs each selected package's one-shot build, and a build that fails does
      not stop it. A pack whose build failed is deployed as a stub — a valid pack carrying the
      pack's own identity and version and no content — so the world loads with every selected pack
      present and its activation list complete, and the failure is reported on the stream. The watch
      builds start either way.

      A stub is replaced by the real pack on the first build that succeeds, through the ordinary
      reconcile. That replacement changes the pack's file set, so it costs the restart d-ftlfhac8
      prices rather than a reload: what an author gets is a server that came up and a loop that
      carries the fix, not a live patch.
    status: proposed
    facets: dev-loop
    because:
      - r-8et233c9
      - r-97fvutt9
      - d-ftlfhac8
      - d-j3ayhwv1
  - id: d-j3ayhwv1
    title: the harness runs a package's own build scripts and watches its output
    statement: >
      the harness invokes a selected package's own `build` and `watch` package
      scripts — the kit

      ships no command line of its own to call — and itself watches only the
      built output

      directories, deploying on a debounced change there.
    status: accepted
    facets: dev-loop
    because:
      - r-97fvutt9
      - r-hlnbi41r
      - r-8h864ke8
      - r-un786n7v
      - r-1bvvl9k7
      - r-v8jjhds5
  - id: d-0yrfifhi
    title: the command is minecraft-server, with start and stop subcommands
    statement: |
      the package's executable is `minecraft-server`. It takes two subcommands, `start` and `stop`,
      each named explicitly — there is no bare default invocation. Ctrl+C stops the watchers and the
      log follow and nothing else; `stop` tears the server down and takes the world with it, per
      d-zo2yl18y, and carries no flag to keep one.
    status: proposed
    pinned:
      reason: public-api
      notes: the executable, the two verbs, and that stop destroys the world
    facets: dev-loop
    because:
      - r-8et233c9
      - r-kfu7pcms
      - d-zyo6kku9
      - d-zo2yl18y
  - id: d-ifke5eeh
    title: start is idempotent against a running server
    statement: >
      the start command brings the compose project up only when it is not
      already running; finding

      it running, it attaches to it — no `up`, no recreate, no restart — and
      reaches readiness from

      the world-load line already in the container's log rather than waiting for
      a new one. A

      project running under settings the current configuration would not produce
      is reported to the

      author and left alone, never silently recreated — recreating the container
      is what loses the

      world and disconnects the client, and a regenerated compose file differing
      from the running

      project would otherwise do exactly that on every reattach.
    status: proposed
    facets: dev-loop
    because:
      - r-kfu7pcms
      - d-w8cc8n18
      - d-imdfu09l
      - d-i4oryd9x
  - id: d-c1kvyord
    title: a profile is a named scenario, and flags override it
    statement: |
      a run's selection is a repeatable `--pack` flag naming owning package names, or
      `--profile <name>` naming a profile in the file `--config` supplied. Given neither, the run
      takes the config's `default_profile` where one is named, and every pack the kit discovers
      otherwise.

      A profile names more than a selection: it is a named scenario, carrying the packs to host and
      the world to host them against. `--seed` and `--spawn` on the command line override whatever
      the profile or the file's top level says, and a profile's own values override the top level's.

      A `--pack` value matching no discovered pack is an error, and so is a `--profile` naming no
      profile the file holds, or a `--profile` given with no `--config` — a run hosts what was asked
      for or it does not start. `--pack` and `--profile` together are an error rather than a union:
      each is a complete statement of the selection, and `--pack` takes the world settings from the
      file's top level. A profile holding an empty pack list selects no packs, which is a valid run.
    status: proposed
    pinned:
      reason: public-api
      notes: the flags a consumer invokes the harness with, what each selects, and how they compose
    facets: dev-loop
    because:
      - r-u8cg9vi6
      - r-co6glnme
      - d-wkcxcv2b
      - d-0yrfifhi
      - d-41m3iws5
  - id: d-wkcxcv2b
    title: the config file is optional and named on the command line
    statement: |
      there is no conventional name or location for a workspace config file: the harness reads one
      only where `--config <path>` names it, and a run without that flag reads none. Every setting
      has a default, so a bare `minecraft-server start` in a workspace is a complete run — every
      pack the kit discovers, the level name `dev`, the image tag the harness pins, the default
      port, a world the server seeds however it likes, and no profiles.

      Where a file is given it is YAML, and every key is optional: `level`, `image`, `port`, `eula`,
      `seed`, `spawn` — a `[x, y, z]` array — `profiles`, and `default_profile` naming one of them.
      A profile is a mapping that may carry `packs`, a list of owning package names, and its own
      `seed` and `spawn`. A key the harness does not define is an error, and so is a value of the
      wrong shape. A file named by `--config` that cannot be read or parsed fails the run naming the
      file and the parse error, rather than falling back to defaults and hosting the wrong thing.
    status: proposed
    pinned:
      reason: data-format
      notes: an author writes and commits this file by hand, and the flag that reaches it
    facets: dev-loop
    because:
      - r-u8cg9vi6
      - r-8et233c9
      - d-wtziwjh5
      - d-imdfu09l
      - d-41m3iws5
  - id: d-jv1zleaj
    title: the server's on-disk layout
    statement: >
      the harness fixes one layout for everything it reads and writes on the
      server: a behavior

      pack's pool is `/data/development_behavior_packs`, the world is
      `/data/worlds/<level>`, and

      its behavior activation list is `world_behavior_packs.json` inside it. A
      pack occupies a

      directory named for its uuid in its kind's pool.


      A resource pack's pool is `/data/development_resource_packs` and its world
      activation list is

      `world_resource_packs.json` beside the behavior one, entries taking the
      same shape.


      Activation entries are written in the run's selection order, so a
      reconcile that changed

      nothing writes the same bytes.
    status: delegated
    pinned:
      reason: data-format
      notes: paths and file contents on the author's server, read back by every
        reconcile
    facets: dev-loop
    because:
      - r-pcq10f2b
      - d-oo8256gl
      - d-q8ikxtdk
      - d-imdfu09l
      - f:bedrock-activation-entry-is-header-uuid-and-a-matching-version
      - f:bedrock-resource-packs-mirror-the-behavior-pack-layout
  - id: d-duvygv2f
    title: the first deploy of a fresh world pays a restart
    statement: >
      the server creates a world directory on its first load and no activation
      list in it, so the

      first run against a fresh volume loads a world with no packs, deploys into
      it, and restarts

      to bring them up. The harness reports that restart as part of starting
      rather than as a

      change it detected.
    status: delegated
    facets: dev-loop
    because:
      - r-8et233c9
      - d-jv1zleaj
      - d-ftlfhac8
      - f:bedrock-activation-entry-is-header-uuid-and-a-matching-version
      - f:bedrock-activation-list-read-only-at-world-load
  - id: d-e956frnx
    title: the author accepts the server EULA on the command line or in the config
    statement: |
      the generated project sets the image's EULA acceptance from either an `--accept-eula` flag on
      the command line or an `eula: true` key in a config file `--config` named. Given neither, the
      start command fails naming both routes and linking the EULA, and brings nothing up. The
      harness does not accept on the author's behalf.

      Everything else about the server's posture is the harness's and is not configurable: the world
      is offline-mode with no allow-list, a development server on the author's own machine or
      daemon; the image's content log is enabled to the console — without it a pack's script output
      never reaches the harness's stream at all; and resource packs are offered rather than
      required, so a client is prompted to download them and may decline, which is the author's
      call to make per join rather than the harness's to force.
    status: proposed
    pinned:
      reason: public-api
      notes: a legal acknowledgement the author makes, and the two ways they make it
    facets: dev-loop
    because:
      - r-8et233c9
      - d-wtziwjh5
      - d-wkcxcv2b
      - f:bedrock-script-console-output-is-not-a-deploy-signal
      - f:bedrock-resource-packs-mirror-the-behavior-pack-layout
  - id: d-joa4eefg
    title: the kit exports workspace-root resolution
    statement: >
      the library exports the workspace-root rule it already applies internally:
      given a starting

      directory it returns the root it would discover packs from, or reports
      that there is none.

      The harness resolves the root through that export rather than
      reimplementing the marker

      precedence, so both packages always agree which workspace they are in.
    status: accepted
    pinned:
      reason: public-api
      notes: a new export on the published library, depended on by a sibling package
    facets: discovery
    because:
      - r-ziw808ls
      - d-xnv5kh7k
      - d-rl1msrus
      - d-ai68xorc
      - d-imdfu09l
  - id: d-1u13wl57
    title: discovery runs at the head of every reconcile
    statement: >
      the harness calls the kit's discovery again at the start of each reconcile
      rather than

      holding the pack set from startup, so a version raised in a
      `package.json`, a pack added to

      the workspace, and a pack removed from it all reach the next deploy.
    status: accepted
    facets: dev-loop
    because:
      - r-pcq10f2b
      - r-kbgjy2pt
      - d-cw6pder5
      - d-k7py0qqv
  - id: d-n81zkitr
    title: a run launches best-effort and reports what it could not build
    statement: |
      nothing about an individual pack stops a run. A selected pack the kit reports invalid, a
      selected package declaring no `build` script, a build that fails at start or mid-session, and
      a build that leaves no output tree are each reported on the stream, naming the package and the
      problem, and the run continues — deploying a stub where the pack has nothing to deploy, per
      d-vrq7lc2o, and leaving the last good deploy in place where it already had one. A selected
      package declaring no `watch` script is built once and not watched, reported at start. A watch
      process that exits is reported and not restarted.

      A run fails only where it cannot be a run at all: no Docker, no reachable daemon, a `--config`
      file that will not parse, or a selection naming something the workspace does not hold.
    status: proposed
    facets: dev-loop
    because:
      - r-8et233c9
      - r-pcq10f2b
      - d-vrq7lc2o
      - d-c1kvyord
      - r-iby30nx1
  - id: d-plnvasfo
    title: pool content the harness did not deploy is removed
    statement: >
      a reconcile removes any pool directory and any activation entry the
      selected packs do not

      account for, whoever put it there. The server's pack state is the
      selection's, not a

      union with whatever a previous run or a hand edit left behind.
    status: proposed
    facets: dev-loop
    because:
      - r-pcq10f2b
      - d-q8ikxtdk
      - d-jv1zleaj
  - id: d-0qo3xvev
    title: one reconcile at a time, and changes during one coalesce
    statement: >
      the harness runs one reconcile at a time. Changes arriving while one is in
      flight — the

      restart it may be performing included — accumulate into a single follow-up
      reconcile that

      begins when the current one returns. A reconcile is never cancelled
      part-way and never runs

      beside another.
    status: proposed
    facets: dev-loop
    because:
      - r-pcq10f2b
      - r-cekp2mcb
      - d-ftlfhac8
  - id: d-7ayy4btp
    title: a restart lets the world save first
    statement: >
      every restart the harness performs is a console `stop` through the image's
      helper, waited

      for, then a start — never a container kill. The world is written before
      the process goes

      down.
    status: accepted
    facets: dev-loop
    because:
      - r-kfu7pcms
      - d-zo2yl18y
      - d-uqdxo2w6
      - d-ftlfhac8
  - id: d-wgzr4lvx
    title: one attached run per workspace
    statement: >
      the start command refuses to attach when another harness is already
      attached to the same

      compose project, naming the running one. Two loops watching one server
      would race each

      other's reconciles and restarts.
    status: accepted
    facets: dev-loop
    because:
      - r-pcq10f2b
      - d-ifke5eeh
      - d-imdfu09l
  - id: d-62bpn2h2
    title: the command line's exits, signals, and diagnostics
    statement: >
      the harness exits `0` when the foreground loop is closed by the author and
      when `stop`

      succeeds, and non-zero on every failure. `SIGINT`, `SIGTERM`, and `SIGHUP`
      all detach: they

      stop the watchers and the log follow, take the package watch processes
      down with them, and

      leave the server running. A second signal during that shutdown exits
      immediately.


      Every line the harness emits goes to the one tagged stream on stdout,
      including diagnostics;

      nothing is written to stderr. `--help` and `--version` are the only flags
      beside `--pack`,

      `--profile`, and `--reset`; an unrecognised flag fails the run.
    status: proposed
    pinned:
      reason: public-api
      notes: exit codes and the flag set anything scripting the harness depends on
    facets: dev-loop
    because:
      - r-kfu7pcms
      - d-0yrfifhi
      - d-c1kvyord
      - d-e956frnx
      - d-41m3iws5
      - d-5e00ndwi
  - id: d-a3fyy34f
    title: POSIX hosts, and the ambient Docker connection
    statement: >
      the harness supports Linux and macOS hosts. Windows is out of scope. The
      Docker connection

      is whatever the environment already selects — `DOCKER_HOST`, or the active
      Docker context —

      and the harness offers no setting of its own for it.
    status: tolerated
    facets: dev-loop
    because:
      - r-whacwz1b
      - d-uqdxo2w6
      - d-imdfu09l
  - id: d-5e00ndwi
    title: activity and server output share one tagged stream
    statement: >
      the harness has one output stream, owned solely by the command line and
      written to by every

      other part only through it, and every line on it is prefixed with a short
      source tag — the

      emitting package for build output, `deploy` for the harness's own
      activity, `server` for

      container logs. A pack's own script output arrives on that stream as
      `server` lines and is

      never read as a signal: a reload that took effect emits nothing the
      harness can match.
    status: delegated
    pinned:
      reason: data-format
      notes: the per-line prefix anything consuming the harness's output reads
    facets: dev-loop
    because:
      - r-8et233c9
      - f:bedrock-script-console-output-is-not-a-deploy-signal

  - id: d-41m3iws5
    title: a run chooses its world's seed and spawn
    statement: |
      a run may fix the world it generates: `seed` sets the level seed the server generates from,
      and `spawn`, an `[x, y, z]` array, sets where a joining player arrives. Either may come from
      the config file, from a profile in it, or from `--seed` and `--spawn` on the command line.
      Given neither, the server seeds the world as it likes and keeps the spawn point it chose.

      The seed reaches the server as the generated project's level seed, since it is read only when
      a world is generated. The spawn point is set with a console command once the world has loaded,
      because the server offers no setting for it. Both are only ever meaningful because a world
      lasts one run: d-zo2yl18y is what makes a seed reproducible rather than a one-time accident.
    status: proposed
    pinned:
      reason: public-api
      notes: the two settings that decide which world an author is developing against
    facets: dev-loop
    because:
      - r-8et233c9
      - d-zo2yl18y
      - d-wtziwjh5
      - d-uqdxo2w6
      - d-i4oryd9x
