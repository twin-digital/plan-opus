  - id: d-3ya31m19
    title: the reconcile is the deploy, and it has one shape
    statement: |
      the harness changes what the server holds through one operation, and the deploy r-pcq10f2b speaks of
      is a run of it. It runs at start once the one-shot builds have finished, and again on every
      debounced change to a selected pack's built output.

      A run has five steps, in order:

      1. re-run discovery and resolve the selection
      2. read the server's pool contents, activation lists, and the file names each pool directory holds
      3. compare those against the built output of the selected packs
      4. apply the difference — copy packs, remove pool directories, write activation lists
      5. bring the change live, by console reload or by restart

      A run with nothing to apply applies nothing and brings nothing live, which is what makes the
      operation idempotent. Nothing else writes to the server.
    status: accepted
    facets: dev-loop
    because:
