  - id: d-5vjxmr4u
    title: a volume holds many worlds and serves one
    statement: |
      the server's volume holds a world directory per level name the run has asked for, and the server
      serves the one `level` names. Switching to another world the volume already holds costs a container
      recreate and nothing else: the volume survives it, so every world on it does.

      A level name the volume does not hold yet is generated, from the run's seed. So naming a new level
      is how an author gets a second world, and naming an old one is how they go back to it — neither
      disturbs the other, and both keep across a stop.

      What accumulates is therefore a library an author builds up over sessions, and the two things that
      empty it are `destroy` and nothing else. A world is reproducible from its level name and seed; what
      is not reproducible is what the author did inside it, which is what snapshots are for.
    status: accepted
    facets: dev-loop
    because:
      - r-7lroj1cg
