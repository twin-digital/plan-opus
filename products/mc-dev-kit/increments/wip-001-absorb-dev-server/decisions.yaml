  - id: d-owprl7uy
    title: what start does when a server is already running
    statement: |
      start compares only what a reconcile cannot fix. Pack selection and spawn point are never part of
      that comparison: the first is what the reconcile is for, and the second is set on a live world with
      a console command. What remains is the level name, the seed, the image and the port, and an
      unspecified one matches anything.

      Given a running server, start takes the first of these that applies:

      - every specified setting matches — attach, and reconcile as usual
      - the level differs, and the volume holds that world — recreate the container onto it, and say so;
        worlds survive, connected clients do not
      - the level differs and the volume does not hold that world — generate it and recreate the container
        onto it, and say so; the world that was serving is untouched
      - only the image or port differs — recreate the container, and say so; the worlds survive
      - the level matches but a specified seed is not the one that world was generated from — this is the
        only rung that destroys a world. Warn, name the world and both seeds, and ask; regenerate on
        agreement and bail out otherwise. Where nothing can be asked, bail out.

      A recreate is never silent, and the destructive rung is never taken without an answer. Worlds are
      long-lived now (d-zo2yl18y), so the one being regenerated may be weeks of an author's work rather
      than minutes of it.
    status: accepted
    pinned:
      reason: public-api
      notes: what an author's second start does to the first one's server
