version: "3"

# The implement-011 companion: the concrete spellings the vendoring build and the engine-side
# runtime share, and the choices building them forced. The two format decisions rest on
# f-5acfquxr, probed for this implementation.
decisions:
  - id: d-jej5f2em
    title: the injected constant is a frozen global holding the namespace and the pack token
    statement: |
      for a namespaced pack the build assigns
      `globalThis.__MC_PACK_RUNTIME__ = Object.freeze({ namespace, packToken, prefixes })` ahead
      of every module in the bundle — `packToken` the package's npm name with the `@` dropped and
      the `/` a hyphen, `prefixes` the frozen, sorted prefixes of the merged vendored packs. With
      namespacing off nothing is assigned, and every runtime read sees the global absent.
    status: proposed
    scope: [build, runtime]
    pinned:
      reason: public-api
      notes: the spelling every built bundle carries, shared by both halves and any reimplementation
    because:
      - d-zm6pxfrg
      - r-tvea5tvf
      - d-zk0c48uy

  - id: d-vwyuhb7e
    title: the stamped family is mcdk_pack_ plus the pack token
    statement: |
      the type family the build stamps on every entity type a namespaced pack declares is
      `mcdk_pack_<packToken>` — the pack token rather than the namespace, so two packs
      contending for one namespace still tell apart. `packFamily()` exposes the token for an
      author's own filters.
    commentary: |
      A contended identifier resolves to one whole definition, and the loser's family is what
      goes absent (f-1yo29upp) — a namespace-keyed family could not say whose definition won.
    status: proposed
    scope: [build, runtime]
    pinned:
      reason: public-api
      notes: a family visible to any pack, built on by authors' selectors and filters
    because:
      - d-wj60379v
      - d-jej5f2em
      - f-1yo29upp
      - f-5acfquxr

  - id: d-2dg93d2a
    title: the claim type is the namespace, mcdk_claim_, and the pack token
    statement: |
      the entity type the build adds to a namespaced pack's behavior half is
      `<namespace>:mcdk_claim_<packToken>`. The runtime reads rivals by enumerating the
      registered types whose identifier carries its own namespace and the `mcdk_claim_` prefix
      with another pack's token. The `mcdk_claim_` name space is reserved: a bare name that
      would land in it fails the build.
    status: proposed
    scope: [build, runtime]
    pinned:
      reason: public-api
      notes: an identifier every namespaced pack declares, and the prefix a reader parses
    because:
      - d-q7mz2qb0
      - d-jej5f2em
      - f-te6cfwkw
      - f-5acfquxr
      - f-o8xk7go5

  - id: d-y86n5etq
    title: the runtime's exported surface
    statement: |
      `@twin-digital/mc-pack-runtime` exports, from its one entry point: `packId(name)`, spelling
      an unnamespaced name — bare, or `<prefix>.<name>` against the injected prefixes — into the
      pack's namespace; `packNamespace()` and `packFamily()`; the checked `spawnEntity`,
      `getEntity` and `getEntities`, with `ForeignEntityError`; and `foreignNamespaceClaims()`
      returning `NamespaceClaim` entries. The checked calls are for the pack's own types.
    cases:
      - when: the name carries a `:`, no namespace was injected, or its first dot-segment is not an injected prefix
        then: "`packId` throws, the last naming the segment and the known prefixes"
      - otherwise: only the first segment is validated — `pack1.a.b` is prefix `pack1`, name `a.b`
    commentary: |
      `packNamespace()` and `packFamily()` answer undefined with namespacing off. Vanilla and
      foreign entities are reached through `@minecraft/server` directly — the checked calls
      guard the pack's own types and nothing else. A dotted first segment is always a prefix
      claim, since bare declarations are dot-free by build rule, so an unknown one is a typo or
      an un-merged dependency and silent passthrough would spell a nonexistent entity.
    status: proposed
    scope: [runtime]
    pinned:
      reason: public-api
      notes: the importable surface of a package consumers install
    because:
      - d-4idoxbul
      - d-zm6pxfrg
      - d-wj60379v
      - d-q7mz2qb0
      - r-l4e55kqu
      - f-i8fx23h0

  - id: d-nqb3dtxv
    title: the claim report throws until the world has loaded
    statement: |
      `foreignNamespaceClaims()` answers the most recent world-load enumeration, and called
      before one has happened it throws naming the boundary — never an empty list, which would
      read as "no rivals" while nothing is known yet.
    status: proposed
    scope: [runtime]
    pinned:
      reason: public-api
      notes: when the value a pack reads its rivals from becomes readable, and what a too-early read does
    because:
      - d-q7mz2qb0
      - d-y86n5etq
      - f-rtmfaoba
    commentary: |
      An empty answer before load is a silent false negative — a check appearing to cover what
      it cannot. The engine itself refuses catalog reads in early execution (f-rtmfaoba), so the
      boundary is real and the throw surfaces it. Undefined would also distinguish the states;
      the package's other guards throw on misuse, and one signaling style is worth keeping.
      Enumerating on demand is not available — the catalog answers nothing before world load.

  - id: d-l45sm4ja
    title: own names carry the pack namespace; vendored assets a library token and hash
    statement: |
      the entity identifiers a pack declares carry its namespace, and so do its own asset names,
      as their token. A vendored asset's name carries its library's token and a content hash
      instead, so an identical name is identical bytes: consumers share names exactly where
      content is unchanged, and an upgrade renames exactly the assets that changed.
    status: proposed
    scope: [build]
    pinned:
      reason: data-format
      notes: the literal names inside a built pack, and the property that a shared name is a shared definition
    supersedes: d-tnhykfkz
    because:
      - r-jxzqhhmo
      - r-293j8n70
      - d-82zp77fo
      - d-zk0c48uy
      - f-8bxtf5w7
      - f-1yo29upp
    commentary: |
      Winner-takes-all resolution is decided by activation order, not version (f-1yo29upp), so
      any name shared between packs holding different bytes drifts arbitrarily per world. Hashing
      makes sharing exact: a shared name cannot resolve to anything but the bytes every sharer
      built with. Own assets need no hash — they change under the author's own hand, and hashing
      them would rename on every tweak, forcing a dev-loop restart per save.

  - id: d-sycw8wo2
    title: the asset token structures and the vendored content hash
    statement: |
      a token is written into each name kind's structure: `geometry.<token>.<name>`,
      `controller.render.<token>.<name>`, `animation.<token>.<name>`,
      `controller.animation.<token>.<name>`, `<token>_<name>` for materials, and
      `textures/<token>/<path>` for textures, whose file moves with its name. A vendored token is
      `<packToken>-<hash>`: sixteen hex digits of sha256 over the declaring file's bytes and the
      sorted final names it references. A vendored definition file's output basename carries the
      packToken.
    cases:
      - when: one vendored pack declares an asset name in two files
        then: the build fails naming both files — two hashes would leave references nothing to pick
      - when: a vendored material names a vendored parent
        then: the parent's final name folds into the hash, recursively; a cycle fails the build naming the file
      - otherwise: a file's hash is its bytes alone, and every declaration in the file shares it
    status: proposed
    scope: [build]
    pinned:
      reason: data-format
      notes: the literal names inside every built namespaced pack, and what makes them deterministic across rebuilds
    because:
      - d-l45sm4ja
      - d-hqtqb43i
      - f-8bxtf5w7

  - id: d-ru4zegfs
    title: vendored entities carry a consumer-chosen prefix in the name half
    statement: |
      with namespacing on, own entities build as `<ns>:<name>` and a merged vendored pack's as
      `<ns>:<prefix>.<name>` — the prefix per dependency from the `vendor` option, defaulting to
      the unscoped npm name. A bare declaration may not contain a dot, so a composed name's first
      segment is always the prefix. A vendored module's runtime import arrives bound to its
      prefix.
    cases:
      - when: a prefix holds anything outside lowercase letters, digits, underscore and hyphen, or lands in `mcdk_claim_*`
        then: the build fails naming what it found
      - when: two merged dependencies resolve to one prefix
        then: the build fails naming both; an explicit `vendor` prefix is the fix
      - when: a vendored module imports the runtime
        then: its `packId` is bound as `name => packId('<prefix>.' + name)`, so computed names work
    status: proposed
    scope: [build, runtime]
    pinned:
      reason: public-api
      notes: the ids a consumer's worlds and commands address, and the option surface that names them
    because:
      - d-82zp77fo
      - d-zk0c48uy
      - d-zm6pxfrg
      - r-tvea5tvf
      - f-te6cfwkw
      - f-dlia9v1f
    commentary: |
      Dots are the separator because they are proven command-safe in the name half while a slash
      is unwritable in any command (f-dlia9v1f). Localization keys follow the final ids. The
      family and claim machinery are untouched; a vendored entity's id merely carries the prefix
      segment.

  - id: d-vi1sct9w
    title: what merges is the consumer's own dependencies and vendor-block names
    statement: |
      a package merges the `vendored_pack/` of the packages in its own `dependencies` and of
      those its `vendor` block names — a transitive supplier is admitted by either — and of
      nothing else; `devDependencies` never, and a package reached by several paths merges once.
      The transitive tree is still read: a dangling reference fails naming the supplier and the
      fix.
    cases:
      - when: a merged pack's reference resolves to no merged declaration and a reachable un-merged vendored pack declares the name
        then: the build fails naming the referencing file, the name, the supplying package, and the fix
      - when: a `vendor` name resolves to no package holding a `vendored_pack/` tree
        then: the build fails naming it
      - otherwise: a name nothing reachable declares copies through as written
    status: proposed
    scope: [build]
    pinned:
      reason: public-api
      notes: what makes a dependency's content arrive, and what a shipped pack can contain unchosen — nothing
    supersedes: d-xoz6pwt8
    because:
      - d-27lzrwsu
      - d-82zp77fo
      - r-dge04upw
      - d-ru4zegfs
      - r-c9bu8xes

  - id: d-i4oeiclv
    title: entity ids cannot contend; asset references resolve per scope
    statement: |
      composed ids end cross-pack entity contention: own and vendored declarations of one bare
      name build to distinct ids, and the failure that remains is two merged dependencies
      resolving to one prefix. An asset reference resolves first against the pack whose file
      wrote it, then across the other merged packs when exactly one declares the name.
    cases:
      - when: an own reference names an asset that own and vendored content both declare
        then: it resolves to the own declaration
      - when: it names an asset that only several vendorings declare
        then: the build fails naming every candidate declaration and its file
      - when: an own dotted entity spelling names a merged prefix whose pack declares no such entity
        then: the build fails naming the file, the spelling, and the dependency
      - otherwise: a name no merged pack declares copies as written, or fails with the dangling diagnosis where an un-merged supplier declares it
    status: proposed
    scope: [build]
    pinned:
      reason: public-api
      notes: which declaration an author's reference lands on, and the collision that remains a failure
    supersedes: d-1vhwdhk1
    because:
      - d-ru4zegfs
      - d-l45sm4ja
      - d-ni5n2r3c
      - r-c9bu8xes
      - d-82zp77fo

  - id: d-3bmgnb25
    title: what a namespaced pack's own source may hold
    statement: |
      with namespacing on, a package's own pack holds the modeled content kinds, `scripts/`, and
      its manifest freely; every other file copies unchanged unless it could carry an
      engine-readable name. Namespacing off keeps the copy-everything behavior.
    cases:
      - when: the file is one of d-7aqne91n's content kinds or a `.lang` file, sits under `scripts/`, or is the manifest
        then: it is read, rewritten, bundled or composed as the build defines
      - when: the file is `.json`, `.material`, `.lang` or `.mcfunction` outside the modeled locations
        then: the build fails naming the file
      - otherwise: the file copies unchanged, dotfiles and unknown extensions included
    status: proposed
    scope: [build]
    pinned:
      reason: public-api
      notes: what an author may put in a pack once they set the namespace option
    because:
      - r-c9bu8xes
      - d-8qkamvz7
      - d-hqtqb43i
      - d-7aqne91n
    commentary: |
      Those four extensions are where engine-readable names live — a function can summon an
      entity by id — so copying one unexamined would ship a name the build cannot carry into its
      new spelling. An author turning namespacing on gives up functions, spawn rules, items and
      the like until the rewriter models them.

  - id: d-l12ch4vq
    title: the reference positions the rewrite reaches
    statement: |
      references are rewritten in the schema positions where the joined-halves guarantee lives: a
      client entity's description identifier and its geometry, texture, material, animation and
      render-controller names; a behavior entity's identifier and animation names; a material's
      parent; geometry identifiers in both declaration forms; and the two localization key forms.
      A declared name anywhere else copies as written.
    status: proposed
    scope: [build]
    pinned:
      reason: public-api
      notes: which of an author's references survive the build rewritten
    because:
      - d-ni5n2r3c
      - r-c9bu8xes
      - f-gvmc2wfa
    commentary: |
      A string in an arbitrary component position — a summon trigger naming the pack's own
      entity, say — is indistinguishable from data, so it is not recognized as a reference and
      an author must not expect the rewrite there.

  - id: d-pc2nrqxj
    title: only .lang files compose; any other shared path fails
    statement: |
      where merged packs contribute one output path, `.lang` files are composed — the own pack's
      entries first, then each vendored pack's in name order — and any other shared path fails
      the build naming both contributing files. Vendored files otherwise keep their
      source-relative paths, textures excepted, whose path moves with their name.
    status: proposed
    scope: [build]
    pinned:
      reason: data-format
      notes: which files survive merging and how a shared localization file is assembled
    because:
      - d-hqtqb43i
      - d-82zp77fo
      - r-c9bu8xes
