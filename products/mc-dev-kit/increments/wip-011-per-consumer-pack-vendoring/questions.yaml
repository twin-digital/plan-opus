version: "1"

questions:
  - id: q-fe0dhxvy
    answer: requirement
    question: |
      does `r-ds3q3en9` reach the engine-side package? It is adopted from `nodejs-library@1` and its
      subject is "a Node.js library" — ESM, TypeScript, its own declarations, "targeting active Node
      LTS", verified by opening the build target configuration. `d-4idoxbul` adds a package that
      never runs in Node: it runs in the Bedrock script engine, which `d-1w5rjhg6` builds for at
      `target: es2022` with `shims: false` and no node platform, on two measured facts — the engine
      rejects the ES2024 RegExp `v` flag, and a surviving node shim's `node:url` import kills the
      module.

      The reading turns on whether the preset's subject covers a package that is an npm library by
      packaging and an engine library by execution. If it does, the requirement and the facts
      collide and one gives way. If it does not, nothing collides and an implementer needs telling,
      because the default is to read a preset requirement as reaching every package of that kind and
      `product.yaml` records the new package as `npm-library` — which is what pulls the preset in.

      Getting it wrong is not cosmetic: built to Node rules the package does not load, and the
      failure is the engine killing the module rather than anything the build reports.
