version: "1"

questions:
  - id: q-sywqp93y
    answer: requirement
    question: |
      does a run host a vendored pack? `r-u8cg9vi6` has a run host every pack the kit discovers where
      no profile narrows it, and `r-zcdmh9p6` makes source-manifest presence the whole membership
      test — so a vendored pack is discovered, and the requirement hosts it. `d-27lzrwsu` says it
      never deploys, which is the collision. Hosting it puts its un-namespaced names in the same pack
      stack as its vendorings, and it has no namespace of its own to build under in any case, so
      `d-vrq7lc2o` would deploy it as a stub. Amending `r-u8cg9vi6` to except a vendored pack is the
      owner's call; the alternative is that `d-27lzrwsu` gives way and a vendored pack ships twice.

  - id: q-zvn4dqpp
    answer: fact
    question: |
      what becomes of an entity already in a world when the identifier it was spawned under stops
      resolving? A consumer's namespace is the prefix of every actor identifier it ships, so renaming
      it — or vendoring a pack that renames content — changes those identifiers for a world that
      already holds entities under the old ones. Whether they vanish, persist unrendered, or refuse to
      load decides whether the kit owes an additive-only discipline of the kind an author would
      otherwise have to keep by hand. It needs a measurement: spawn an entity, rebuild the pack under
      a changed identifier, reload the world, and see what the world reports.
