version: "1"

questions:
  - id: q-sywqp93y
    answer: requirement
    question: |
      does a run host a vendored pack? `r-u8cg9vi6` has a run host every pack the kit discovers where
      no profile narrows it, and `r-zcdmh9p6` makes source-manifest presence the whole membership
      test — so a vendored pack is discovered, and the requirement hosts it. `d-27lzrwsu` says it
      never deploys, which is the collision. Hosting it puts its un-namespaced names in the same pack
      stack as its vendorings, and it has no namespace of its own to build under in any case, so
      `d-vrq7lc2o` would deploy it as a stub. Amending `r-u8cg9vi6` to except a vendored pack is the
      owner's call; the alternative is that `d-27lzrwsu` gives way and a vendored pack ships twice.

  - id: q-30iz7m0l
    answer: fact
    question: |
      does a type family a pack declares read back off an entity it spawned? `d-wj60379v` rests on
      it, and the pool carries the surrounding pieces but not this one. `minecraft:type_family` is a
      real component on spawned entities — an `xp_orb` arrives carrying one and a villager's
      component list holds it — and the engine honours families in behavior filters, as the iron
      golem's `is_family != creeper` gate shows. What is not recorded is that a *custom* family, one
      a pack invents rather than one vanilla ships, is readable from script off the entity. The
      measurement: declare an entity type with a family of an invented token, spawn it, and read the
      families back; then have a second pack declare the same identifier with a different token and
      confirm the reading changes when the other definition wins.

      Buried in that second half is the part that matters more: when two behavior packs declare one
      identifier, does the winner replace the loser wholesale or do the definitions merge? Nothing
      measures it — `f-8bxtf5w7` covers resource-side names only and does not carry over. Under a
      merge the entity would hold both families, which is a better signal than absence since it
      names who else is there. `d-wj60379v` is written to hold either way, asking whether the
      pack's own token is present rather than which token is; the answer decides what the report can
      say, not whether the check works.

  - id: q-c8zq5pss
    answer: fact
    question: |
      what may a namespace be spelled with? Nothing in the pool records the character set an
      identifier admits, and every recorded example is lowercase letters and underscores —
      `mctest:probe_dummy`, `minecraft:evocation_illager`, `geometry.evoker.v1.8` — and the community
      convention is snake_case, which is a signal about the character set without settling it.
      Package names are
      full of hyphens, so whether `mc-rpg-core` is a namespace or has to become `mc_rpg_core`
      decides what `d-zk0c48uy`'s default actually produces, and a length limit would decide whether
      it is usable at all. It also disposes of reverse-domain namespaces: a dot already separates the
      segments of an internal asset name, so `com.example.rpg` inside `geometry.<ns>.wizard` may not
      be parseable even where it is legal. It needs a measurement — build packs whose namespace
      carries a hyphen, a dot, an uppercase letter, and a long run of characters, and see which load
      and render.

  - id: q-zvn4dqpp
    answer: fact
    question: |
      what becomes of an entity already in a world when the identifier it was spawned under stops
      resolving? A consumer's namespace is the prefix of every actor identifier it ships, so renaming
      it — or vendoring a pack that renames content — changes those identifiers for a world that
      already holds entities under the old ones. Whether they vanish, persist unrendered, or refuse to
      load decides whether the kit owes an additive-only discipline of the kind an author would
      otherwise have to keep by hand. It needs a measurement: spawn an entity, rebuild the pack under
      a changed identifier, reload the world, and see what the world reports.
