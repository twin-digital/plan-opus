version: "1"

questions:
  - id: q-fcuue13t
    question: |
      what happens when a source manifest names its own script entry? The kit computes the built
      script location from the pack's kind and reads the script module's `entry` for nothing, so a
      manifest naming a different path is reported as it was written and nothing says the two
      disagree — a build placing the script where the kit says then ships a pack whose manifest
      names a file that is not there. The rule that would close the gap is the one already governing
      what a partial source manifest may not specify: a script module's `entry` joins `header.name`,
      `header.version`, and a workspace dependency's `version` as fields the source must leave out
      and completion writes — a tightening of `r-11l92k9x`. Honoring a manifest's own `entry`
      instead would soften that requirement, so whichever way it goes the call is the owner's alone.
    answer: requirement
    facets: discovery
