# Runs backing facts about the design process's own surfaces in this repository.
#
# A run records one execution and the output it captured. It makes no claim: the output says
# what happened, the fact that cites it says what that means.

- id: validator-shape-probe-slug
  command: sh products/increment-process/increments/010/artifacts/validator-shape-probes/probe.sh
  output: products/increment-process/increments/010/artifacts/validator-shape-probes/OUTPUT-slug-increment.txt
  ran_at: 2026-08-04
  environment: |
    design-process 0.2.0 from this repository's node_modules, Node 24, against the
    increment-010 draft tree with the probe's fixture directory present, run by an agent. The
    same tree without fixtures reports design check passed.

- id: validator-shape-probe-backlog-dir
  command: sh products/increment-process/increments/010/artifacts/validator-shape-probes/probe.sh
  output: products/increment-process/increments/010/artifacts/validator-shape-probes/OUTPUT-backlog-dir.txt
  ran_at: 2026-08-04
  environment: |
    design-process 0.2.0 from this repository's node_modules, Node 24, against the
    increment-010 draft tree with the probe's fixture file present, run by an agent. The same
    tree without fixtures reports design check passed.

- id: sequence-gap-probe
  command: sh products/increment-process/increments/011/artifacts/sequence-gap-probe/probe.sh
  output: products/increment-process/increments/011/artifacts/sequence-gap-probe/OUTPUT.txt
  ran_at: 2026-08-04
  environment: |
    design-process 0.2.0 from this repository's node_modules, Node 24, against the
    increment-011 draft tree with the probe's fixture directory present, run by an agent.
    The same tree without the fixture reports only the draft's carried question.

- id: draft-visibility-probe
  command: sh products/increment-process/increments/013/artifacts/draft-visibility-probe/probe.sh
  output: products/increment-process/increments/013/artifacts/draft-visibility-probe/OUTPUT.txt
  ran_at: 2026-08-04
  environment: |
    design-process 0.3.0 from this repository's node_modules, Node 24, on the draft-visibility
    branch, run by an agent. The probe injects one schema violation the requirement schema
    forbids, runs check and show with the directory slug-named, renames it to the number
    where --next reports, runs both again, renames it back and removes the fixture.
