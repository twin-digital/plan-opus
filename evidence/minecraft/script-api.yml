      080eede9-d882-4606-a68d-9240d3fc3f92, triggered from the server console against a stationary
      armor stand at (38.5, 81, 22.5) on a 17x17 stone platform inside the mctest ticking area. The
      pack was run by the design's owner, not by the author of the facts citing it. Each of the four
      sets ran three times, with no PROBE CRASHED lines and every complete line present, and each
      set's whole body is byte-identical across its three runs once the timestamp and the entity ids
      are normalised. The arity set's 18 controls all read CONTROL-RETURNED, the handlerwrite set's
      11 cases all read handler-ran=true, and both filter RUN-VALIDITY gates pass, so no reading is
      vacuous. Every observation is that engine build's behaviour and would differ against another.

  # Runs backing the village-guard protection design's facts. Headless: the pack reports through
  # console.warn and the driver reads the container log, so no client attaches.

  - id: protection-probe-sources
    command: node evidence/minecraft/script-api/protection-probe/run.mjs 3
    output: evidence/minecraft/script-api/protection-probe/OUTPUT.txt
    ran_at: 2026-08-06
    environment: |
      itzg/minecraft-bedrock-server, Bedrock dedicated 1.26.40.8, @minecraft/server 2.8.0 as a pack
      manifest dependency with no experiments enabled, difficulty hard. protection-probe-pack 0.1.0,
      uuid 7a3d1c40-5e21-4b88-9f0e-2c6a4d81b503, triggered as `scriptevent vgprobe:sources` from the
      server console with no source entity, against a walled stone platform the pack builds at
      (163, 100, 170) inside its own ticking area. The driver brings the stack up on a fresh volume
      and runs the set three times. 3/3 runs, no PROBE CRASHED lines, every complete line present.
      The results document is evidence/minecraft/script-api/protection-probe/RESULTS.md. Every
      observation is that engine build's behaviour and would differ against another.

  - id: protection-probe-conversion
    command: node evidence/minecraft/script-api/protection-probe/run.mjs 3
    output: evidence/minecraft/script-api/protection-probe/OUTPUT.txt
    ran_at: 2026-08-06
    environment: |
      Same server, module version, pack and driver as protection-probe-sources, triggered as
      `scriptevent vgprobe:conversion`. Difficulty hard, where vanilla zombie-to-villager conversion
      is certain. Each run pairs a guarded villager against an unguarded control, three zombies
      each, over a 1200-tick window. 3/3 runs, no PROBE CRASHED lines.

  - id: protection-probe-reaction
    command: node evidence/minecraft/script-api/protection-probe/run.mjs 3
    output: evidence/minecraft/script-api/protection-probe/OUTPUT.txt
    ran_at: 2026-08-06
    environment: |
      Same server, module version, pack and driver as protection-probe-sources, triggered as
      `scriptevent vgprobe:reaction`. A zombie deals every hit, so the knockback is the engine's
      own; one sampler reads the subject's velocity each tick and the before-event records the tick
      each hit landed on. 3/3 runs, no PROBE CRASHED lines. Hit counts differ per run because they
      depend on zombie pathing; the peak-speed readings they turn on do not.

  - id: damage-source-type-probe
    command: node evidence/minecraft/script-api/damage-source-probe/probe.mjs
    output: evidence/minecraft/script-api/damage-source-probe/probe.out.txt
    ran_at: 2026-08-06
    environment: |
      Reads @minecraft/server 2.8.0's index.d.ts, copied beside the script so the run is repeatable
      against the exact declarations it was taken from. The counts are that version's and would
      differ against another.

  - id: protection-probe-client
    command: send-command scriptevent vgprobe:client
    output: evidence/minecraft/script-api/protection-probe/CLIENT-OUTPUT.txt
    ran_at: 2026-08-06
    environment: |
      Same server, module version and pack as protection-probe-sources, brought up with the
      compose.client.yaml overlay so a Bedrock client can join. The set pens three villagers side by
      side — one hit vanilla, one through a 0.5 clamp, one whose entityHurt event is cancelled — and
      runs a five-minute window. The log records only that the lanes were staged and how many hits
      landed on each; the flinch, the sound and the panic are rendered on the client and were
      observed there by the design's owner, whose report is cited as its own source.

  - id: protection-probe-gossip
    command: send-command scriptevent vgprobe:control  # then vgprobe:vanilla
    output: evidence/minecraft/script-api/protection-probe/GOSSIP-OUTPUT.txt
    ran_at: 2026-08-06
    environment: |
      Same server, module version and pack as protection-probe-sources, with the compose.client.yaml
      overlay and a Bedrock client attached. The subject is a villager the design's owner cured from
      a zombie villager, carrying the cure discount, penned alone on the probe's platform with a
      composter as its job site and no village structures anywhere. Two attachments in sequence
      against the same standing subject, nothing cleared between them: `vgprobe:control` rewrites
      each player hit up to 15 damage and restores health every tick, and `vgprobe:vanilla` writes
      nothing and cancels nothing, reading the hits only and healing solely as a rescue below 7
      health. Prices were read at the client by the owner, before and after each attachment.


  # Runs backing the facts the implementation of village-guard 004 produced. Same headless shape as
  # the protection probe: the pack reports through console.warn and the driver reads the container
  # log, so no client attaches. The probe pack transcribes the shipped pack's own handler logic, so
  # the restore, hazard, operator and convert sets exercise what @twin-digital/village-guard 0.1.0
  # does rather than an approximation of it, with the clamp constant the one thing varied.

  - id: gap-probe-run
    command: node evidence/minecraft/script-api/gap-probe/run.mjs 3
    output: evidence/minecraft/script-api/gap-probe/OUTPUT.txt
    ran_at: 2026-08-07
    environment: |
      itzg/minecraft-bedrock-server, Bedrock dedicated 1.26.40.8, @minecraft/server 2.8.0 as a pack
      manifest dependency with no experiments enabled, difficulty hard. gap-probe-pack 0.1.0, uuid
      b1f8d240-3c77-4e6a-9a15-8d40e2c7f931, triggered as `scriptevent vggap:<set>` from the server
      console with no source entity, against a walled stone platform the pack builds at
      (163, 100, 170) inside its own ticking area. Covers the zeroclamp, subclamp, water, restore and
      operator sets, three runs each, no PROBE CRASHED lines. The results document is
      evidence/minecraft/script-api/gap-probe/RESULTS.md, which records the four rig faults found
      while writing these probes and what each had corrupted. Entity handles go stale after the first
      run in a session, so a case reporting its subject gone without being struck is that fault
      rather than a reading. Every observation is that engine build's behaviour and would differ
      against another.

  - id: gap-probe-conversion
    command: node evidence/minecraft/script-api/gap-probe/run.mjs 1 convert  # three times, each on a destroyed and rebuilt volume
    output: evidence/minecraft/script-api/gap-probe/CONVERT-OUTPUT.txt
    ran_at: 2026-08-07
    environment: |
      Same server, module version, pack and driver as gap-probe-run, triggered as
      `scriptevent vggap:convert`. Difficulty hard, where vanilla zombie-to-villager conversion is
      certain. The set pens one villager and four zombies together in a walled 3x3, re-centring both
      sides on a timer, and varies only the subject's starting health and the pack's clamp constant;
      an unguarded villager at the same starting health is the control. Driven one run per destroyed
      and rebuilt volume, because entity handles go stale after the first run in a session. 3/3 runs
      reach the same verdict on every case, no PROBE CRASHED lines.

  - id: gap-probe-hazard
    command: node evidence/minecraft/script-api/gap-probe/run.mjs 1 hazard  # three times, each on a destroyed and rebuilt volume
    output: evidence/minecraft/script-api/gap-probe/HAZARD-OUTPUT.txt
    ran_at: 2026-08-07
    environment: |
      Same server, module version, pack and driver as gap-probe-run, triggered as
      `scriptevent vggap:hazard`. The subject is held in a sealed one-block stone shaft — flooded and
      capped for drowning, its head block made solid for suffocation — with the shipped pack's own
      handlers installed and the clamp constant varied. Driven one run per destroyed and rebuilt
      volume, for the same reason as gap-probe-conversion.

  # Runs backing the golem-retaliation facts, from the same session that implemented village-guard
  # 005. Headless, and the attacker in every case is a probe entity carrying a named `type_family`
  # rather than a client-driven player — every fact resting on these says so.

  - id: golem-probe-aggro
    command: OUT_FILE=AGGRO-OUTPUT.txt node evidence/minecraft/script-api/golem-probe/run.mjs 1 aggro
    output: evidence/minecraft/script-api/golem-probe/AGGRO-OUTPUT.txt
    ran_at: 2026-08-07
    environment: |
      itzg/minecraft-bedrock-server, Bedrock dedicated 1.26.40.8, @minecraft/server 2.8.0 as a pack
      manifest dependency with no experiments enabled, difficulty hard. golem-probe-pack 0.1.0, uuid
      19729136-3a4c-4243-8a5d-e1bbec325650, triggered as `scriptevent vggolem:aggro` from the server
      console, against a 9x9 walled stone pen the pack builds at (163, 100, 170) inside its own
      ticking area. The attacker is `vgprobe:swinger_<family>`, a mob the probe pack defines in three
      copies differing only in `type_family`. Driven on its own destroyed and rebuilt volume. The
      results document is evidence/minecraft/script-api/golem-probe/RESULTS.md.

  - id: golem-probe-fromplayer
    command: OUT_FILE=FROMPLAYER-OUTPUT.txt node evidence/minecraft/script-api/golem-probe/run.mjs 1 fromplayer
    output: evidence/minecraft/script-api/golem-probe/FROMPLAYER-OUTPUT.txt
    ran_at: 2026-08-07
    environment: |
      Same server, module version, pack and driver as golem-probe-aggro, triggered as
      `scriptevent vggolem:fromplayer`, on its own destroyed and rebuilt volume.

  - id: golem-probe-timing
    command: OUT_FILE=TIMING-OUTPUT.txt node evidence/minecraft/script-api/golem-probe/run.mjs 1 timing
    output: evidence/minecraft/script-api/golem-probe/TIMING-OUTPUT.txt
    ran_at: 2026-08-07
    environment: |
      Same server, module version, pack and driver as golem-probe-aggro, triggered as
      `scriptevent vggolem:timing`, on its own destroyed and rebuilt volume. The set sends
      `minecraft:from_player` at a named moment — at spawn, deferred one tick from the first hit, or
      at a fixed tick after the golem is already angry — and records the tick of every strike.

  - id: golem-probe-enrol
    command: OUT_FILE=ENROL-OUTPUT.txt node evidence/minecraft/script-api/golem-probe/run.mjs 1 enrol
    output: evidence/minecraft/script-api/golem-probe/ENROL-OUTPUT.txt
    ran_at: 2026-08-07
    environment: |
      Same server, module version, pack and driver as golem-probe-aggro, triggered as
      `scriptevent vggolem:enrol`, on its own destroyed and rebuilt volume. The set subscribes
      entitySpawn and entityLoad and sends `minecraft:from_player` on arrival, then drives a
      player-family attacker, a plain attacker and a zombie against the enrolled golem.
