name: rename-probe
services:
  bedrock:
    image: itzg/minecraft-bedrock-server
    ports:
      - "19136:19132/udp"
    environment:
      EULA: "TRUE"
      LEVEL_NAME: dev
      SERVER_NAME: rename-probe
      GAMEMODE: creative
      DIFFICULTY: hard
      ALLOW_CHEATS: "true"
      CONTENT_LOG_FILE_ENABLED: "true"
      CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
      LEVEL_SEED: "1"
    volumes:
      - data:/data
volumes:
  data:
