# The run behind the cross-pack facts: what crosses a behavior-pack boundary — an entity type one
# pack defines and a script module one pack holds — as seen from a script in a different pack.

version: "1"
runs:
  - id: cross-pack-probe
    command: node evidence/minecraft/rpg-core/cross-pack-probe/probe.mjs
    output: evidence/minecraft/rpg-core/cross-pack-probe/OUTPUT.txt
    ran_at: 2026-08-10
    environment: |
      An itzg/minecraft-bedrock-server container running Bedrock dedicated server 1.26.43.1, driven
      by the script beside this entry over a remote Docker daemon. The probe authors its packs, copies
      them into the server's development_behavior_packs pool, writes each world's behavior activation
      list, restarts the server, and captures what the packs' own scripts report through console.warn
      into the server console, which needs content-log-console-output-enabled set. The pool is emptied
      before each scenario. Each scenario runs against a freshly generated world on the same volume. No
      Minecraft client is involved, so nothing here observes rendering. Observations are this server
      version's behaviour and would need re-running against another.

  - id: rp-detection-probe
    command: node evidence/minecraft/rpg-core/rp-detection-probe/probe.mjs
    output: evidence/minecraft/rpg-core/rp-detection-probe/OUTPUT.txt
    ran_at: 2026-08-10
    environment: |
      The same containerised Bedrock 1.26.43.1 harness as `cross-pack-probe`, holding one behavior pack
      constant while varying only the resource-pack side: no resource pack, a resource pack staged and
      activated, and a resource pack staged but left out of the activation list. Both pack pools are
      emptied per scenario. The behavior pack reports every server-side signal that might vary with the
      resource pack — entity bounding boxes and head locations, `getPackSettings`, `getPackStructureIds`,
      script events, and the result of running `packstack` — through console.warn into the server
      console, and the probe additionally reads the same commands' printed output through the server's
      own console, which a script cannot see. No Minecraft client is involved, so anything requiring a
      player-type selector is out of its reach.

  - id: rp-dependency-probe
    command: node evidence/minecraft/rpg-core/rp-dependency-probe/probe.mjs
    output: evidence/minecraft/rpg-core/rp-dependency-probe/OUTPUT.txt
    ran_at: 2026-08-10
    environment: |
      The same containerised Bedrock 1.26.43.1 harness as the other two runs. One behavior pack, declaring
      a manifest `dependencies` uuid entry for a resource pack, held byte-identical across three worlds
      while only the resource side varies: the resource pack absent from the pool, staged and listed
      active, and staged but absent from the resource activation list. Both pack pools are emptied per
      scenario. The behavior pack reports through console.warn whether its script evaluated, whether its
      own entity type resolves via `EntityTypes.get`, and the client pack stack count — so no spawn is
      attempted and no ticking area is needed. No Minecraft client is involved; nothing here observes
      rendering.

  - id: rp-render-check
    command: node evidence/minecraft/rpg-core/rp-render-check/setup.mjs up
    output: evidence/minecraft/rpg-core/rp-render-check/OBSERVATION.md
    ran_at: 2026-08-10
    environment: |
      A joinable Bedrock 1.26.43.1 server on the same containerised harness, flat creative world, resource
      pack required and confirmed active in the client pack stack. Four actors identical in behaviour stand
      in a row, differing only in what the resource pack says about their appearance: a complete client
      entity, none at all, one naming an unresolvable geometry, and one naming an unresolvable texture. The
      script's own output — that all four spawned, and which packs the world loaded — is captured in the
      server console. The rendering half is not machine-readable: the owner joined with a real Bedrock
      client and reported what each actor looked like, and that report is transcribed verbatim in the
      output file alongside the captured server-side half. A visual observation by one person on one
      client, not a measurement.

  - id: duplicate-uuid-probe
    command: node evidence/minecraft/rpg-core/duplicate-uuid-probe/probe.mjs
    output: evidence/minecraft/rpg-core/duplicate-uuid-probe/OUTPUT.txt
    ran_at: 2026-08-10
    environment: |
      The same containerised Bedrock 1.26.43.1 harness. Two behavior packs declaring one shared uuid but
      distinguishable content — one defines entity `dup:from_a`, the other `dup:from_b` — are placed in the
      pool together across seven scenarios that vary the versions each copy declares, the version the
      world's activation list names, whether the list names the uuid twice, and the directory names the
      copies sit in; a resource-pack pair sharing a uuid is covered too. A separate observer pack with its
      own uuid reports which entity type resolves, and so which copy won, plus the client pack stack count.
      Both pools are emptied per scenario and each scenario runs against its own freshly generated world.

  - id: asset-collision-check
    command: node evidence/minecraft/rpg-core/asset-collision-check/setup.mjs up
    output: evidence/minecraft/rpg-core/asset-collision-check/OBSERVATION.md
    ran_at: 2026-08-10
    environment: |
      A joinable Bedrock 1.26.43.1 server on the same containerised harness, flat creative world, both
      resource packs required and active with pack one listed first. Two resource packs declare the same
      geometry identifier and the same texture path with different content — a tall pillar against a flat
      slab, solid magenta against solid green — and four actors from one behavior pack use them, two
      exercising the shared geometry name and two the shared texture path over uniquely named cubes so the
      two collisions cannot be confounded. The geometries and the textures are generated by the script, so
      nothing is fetched. Which definition won is only visible on a client: the owner joined with a real
      Bedrock client and reported what each actor looked like, transcribed verbatim in the output file
      beside the captured server-side half. A visual observation by one person on one client.

  - id: published-materials-probe
    command: node evidence/minecraft/rpg-core/published-materials-probe/probe.mjs
    output: evidence/minecraft/rpg-core/published-materials-probe/OUTPUT.txt
    ran_at: 2026-08-10
    environment: |
      A read of `Mojang/bedrock-samples` through the GitHub API at the pinned tag `v1.21.130.3`, commit
      84aa19df535fcf6d044f28bf76f236029bd8407a: the published resource pack's top-level listing, a direct
      request for its `materials` directory, a recursive tree walk counting every path ending `.material`,
      and the `materials` block of the evoker's own client entity. Pinned rather than read at `main` so the
      reading is reproducible, since the repository moves. Nothing but the public API is involved.
