name: world-seed-spawn-probe
services:
  bedrock:
    image: itzg/minecraft-bedrock-server
    environment:
      EULA: "TRUE"
      LEVEL_NAME: dev
      LEVEL_SEED: ${LEVEL_SEED:-}
      SERVER_NAME: world-seed-spawn-probe
      GAMEMODE: creative
      CONTENT_LOG_FILE_ENABLED: "true"
      CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
    volumes:
      - data:/data
  listener:
    image: nginx:alpine
volumes:
  data:
