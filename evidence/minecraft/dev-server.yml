# Runs backing facts about the Bedrock dev server and the Compose project that drives it.
#
# No record of the execution dates survives; ran_at is the date each output was committed.

version: "1"
runs:
  - id: activation-list-probe
    command: node evidence/minecraft/dev-server/activation-list-probe/run.mjs
    output: evidence/minecraft/dev-server/activation-list-probe/OUTPUT.txt
    ran_at: 2026-07-25
    environment: |
      A real itzg/minecraft-bedrock-server container under Compose v5.2.0, against a remote daemon
      (DOCKER_HOST=ssh://…, no bind mount). The probe restarts the server between every
      activation-list change and reads the Pack Stack line a fresh world load emits, which is what
      makes the list's effect observable. Its pack is pack/manifest.json beside the script, header
      uuid b1a7d0c2-3f4e-4a5b-8c9d-0e1f2a3b4c5d and data module uuid
      c2b8e1d3-4a5f-4b6c-9d0e-1f2a3b4c5d6e. Observations would differ against another server image or
      Compose version.

  - id: compose-watch-probes
    command: node evidence/minecraft/dev-server/compose-watch-probes/run.mjs
    output: evidence/minecraft/dev-server/compose-watch-probes/OUTPUT.txt
    ran_at: 2026-07-25
    environment: |
      Compose v5.2.0 against Docker Engine 29.5.3 on a remote daemon (DOCKER_HOST=ssh://…, no bind
      mount). Four compose projects beside the script are each brought up, `docker compose watch
      --no-up` attached, files written under the watched path, and the container inspected with
      `find`. The behaviour is Compose's own and would differ at another version; NOTES.md beside the
      output records the case table.

  - id: env-file-resolution
    command: node evidence/minecraft/dev-server/env-file-resolution/run.mjs
    output: evidence/minecraft/dev-server/env-file-resolution/OUTPUT.txt
    ran_at: 2026-07-25
    environment: |
      Compose v5.2.0. The script builds a cwd and a separate compose-file directory, each holding a
      `.env` and a `svc-env/` that a relative `env_file`, volume source and watch path all name, then
      reports `docker compose config` under `-f` alone, `--project-directory .` and `--env-file .env`
      — with a `.env` in both places, then in the cwd only. Resolution is Compose's own and would
      differ at another version.

  - id: dev-loop-probe
    command: node evidence/minecraft/dev-server/dev-loop-probe/run.mjs
    output: evidence/minecraft/dev-server/dev-loop-probe/OUTPUT.txt
    ran_at: 2026-08-05
    environment: |
      An itzg/minecraft-bedrock-server container (engine 1.26.40.8) under Compose v5.2.0 against a
      remote daemon (DOCKER_HOST=ssh://…, no bind mount), with CONTENT_LOG_FILE_ENABLED and
      CONTENT_LOG_CONSOLE_OUTPUT_ENABLED set — without the latter no script output reaches the
      console at all. Packs are generated by the script and carry a script module that logs on
      evaluation. Groups: the activation version form at manifest format_version 2 and 3, whether a
      list edit or a newly pooled pack lands without a restart, what a console reload re-evaluates,
      the resource-pack pool and activation list, and reading state back out of the container.
      NOTES.md beside the output records what each group establishes and what it does not — its B
      and C steps scored a reload by a console.warn line, which reload-detection-probe later showed
      is not a signal that survives a reload.

  - id: reload-detection-probe
    command: node evidence/minecraft/dev-server/reload-detection-probe/run.mjs
    output: evidence/minecraft/dev-server/reload-detection-probe/OUTPUT.txt
    ran_at: 2026-08-05
    environment: |
      The same image, engine build, and remote daemon as dev-loop-probe. One pack is loaded once and
      then edited and reloaded four times with no restart between, alternating between editing the
      script module's entry file and a file the entry imports. The detector is an uncaught error
      carrying a token that changes with every edit, because a script's console.warn reaches the
      console at world load and not on a reload — the output shows both at load and only the error
      afterwards. A case counts only when the new token appears, so no stale or suppressed line can
      fake one.

  - id: resource-pack-activation-probe
    command: node evidence/minecraft/dev-server/resource-pack-activation-probe/run.mjs setup|activate|deactivate|teardown
    output: evidence/minecraft/dev-server/resource-pack-activation-probe/OUTPUT.txt
    ran_at: 2026-08-05
    environment: |
      The same image, engine build 1.26.40.8, and remote daemon as dev-loop-probe, with the port
      published to the daemon's host, ONLINE_MODE off and no allow list. Whether a resource pack
      activates is not readable from the server — the Pack Stack line names behavior packs only and
      a resource pack runs no script — so the observer is a person with a Bedrock client attached
      and the probe runs in phases they drive between observations. The pack's only content is a
      texts/en_US.lang line renaming the diamond sword, so nothing but the activation list differs
      between phases. The OBSERVED lines in the output are the owner's report from the client,
      appended as each phase was observed; everything else is the server's own. NOTES.md beside the
      output records the phase table and what the probe does not cover.

  - id: world-seed-and-spawn-probe
    command: node evidence/minecraft/dev-server/world-seed-and-spawn-probe/run.mjs
    output: evidence/minecraft/dev-server/world-seed-and-spawn-probe/OUTPUT.txt
    ran_at: 2026-08-05
    environment: |
      The same image, engine build 1.26.40.8, and remote daemon as dev-loop-probe. Three worlds are
      generated from scratch — a `down -v` and a new volume each time — under the same seed twice and
      then a different one, and fingerprinted by the blocks the generator produced at four fixed
      coordinates. The reader is a behavior pack whose script reports through an uncaught error, the
      signal that survives a reload, with the read deferred one tick because
      World::getDefaultSpawnLocation cannot be called during module evaluation. The probe adds a
      ticking area before sampling: with nobody connected no chunks are resident and every sample
      reads back unloaded. It then issues `send-command setworldspawn` against a running world and
      reads the spawn point back after a restart. NOTES.md beside the output records the fingerprint
      table and what the probe does not cover.
