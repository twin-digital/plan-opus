# Runs backing facts about the planning format and the checker that reads it.
#
# A run records one execution and the output it captured. It makes no claim: the output says what
# happened, the fact that cites it says what that means.

version: "1"
runs:
  - id: closed-schema-enforcement-probe
    command: node design/how-to-plan/doc-structure/artifacts/closed-schema-enforcement/probe.mjs
    output: design/how-to-plan/doc-structure/artifacts/closed-schema-enforcement/OUTPUT.txt
    ran_at: 2026-07-29
    environment: |
      bin/check-design.mjs as it stands at 04062d0, run by an agent on Node v24.16.0 against the
      five-entry fixture committed beside the probe — a fact, a requirement, a decision, a component,
      and an open question, each well-formed but for a `checked` key no schema defines. The fixture
      design holds an open question, so it computes as draft and the settle gate does not fire. The
      observation is of the checker at that commit and would differ once the enforcement lands.
