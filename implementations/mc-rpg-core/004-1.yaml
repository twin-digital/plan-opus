      - kind: manual-check
        ref:
          - README.md
        note: "`pnpm sync` regenerated every rule for both packages and left the tree clean"
  - claim: r-lqfu2ki9 # a library's public surface is minimal
    covered_by:
      - kind: attestation
        ref:
          - package.json
          - src/index.ts
        note: >
