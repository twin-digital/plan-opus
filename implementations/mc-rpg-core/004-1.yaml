      - kind: code-test
        ref:
          - src/package-manifest.test.ts
        note: the type field and the exact conditions are asserted, and that no `require` or `.cjs` appears in the map
  - claim: r-paoy41od # node packages are TypeScript
    covered_by:
      - kind: attestation
        ref:
