      - kind: code-test
        ref:
          - src/package-manifest.test.ts
          - src/actor.test.ts
        note: the exports map is read for its single entry and no wildcard, and the entry point's export list is pinned exactly
  - claim: r-brdf1c2g # node packages ship as ESM
    covered_by:
      - kind: attestation
        ref:
