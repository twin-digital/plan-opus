version: "1"
product: mc-rpg-core
target: 4
built_at: 2026-08-18
packages:
  - path: nodejs/minecraft/rpg-core
    version: 1.0.0
  - path: nodejs/minecraft/rpg-core-example
    version: 0.1.0
coverage:
  # ---- requirements ----
  - claim: r-lna5xlfe # an actor is spawned by naming a preset
    covered_by:
      - kind: attestation
        ref:
          - src/presets.ts
          - src/actor.ts
        note: >
          spawnActor's first argument is a preset name and nothing else, and PRESETS holds only a
          preset's name and default name; adding a preset is a new key, changing no signature
      - kind: code-test
        ref:
          - src/actor.test.ts
          - src/adventure.test.ts
        note: >
          an actor is obtained from the name and a place with no identifier, namespace, or asset
          supplied by the caller; the example's gallery is built by mapping PRESET_NAMES
      - kind: manual-check
        ref:
          - README.md
        note: >
          executed headless 2026-08-18 (rpg-core-example): 'wizard' was the whole of what the story
          named, and a named, drawn actor stood in a live world
  - claim: r-apu8m7vz # an actor faces a player who approaches
    covered_by:
      - kind: attestation
        ref:
          - vendored_pack/behavior_pack/entities/wizard.json
        note: >
          minecraft:behavior.look_at_player at probability 1.0 is the entity's only behavior and
          minecraft:movement is 0 — it turns to face and otherwise holds still
      - kind: code-test
        ref:
          - src/vendored-pack.test.ts
        note: >
          the look-at-player component is asserted present and sole, and the zeroed movement beside
          it; the turn itself is drawn at a client and no headless route reaches it
  - claim: r-qi348761 # an actor's appearance does not depend on the game's own assets
    covered_by:
      - kind: attestation
        ref:
          - vendored_pack/resource_pack/
        note: >
          every geometry, texture, animation, and render controller is committed here under bare
          re-identified names; the stock `evoker` material is the one vanilla name
      - kind: code-test
        ref:
          - src/vendored-pack.test.ts
        note: >
          each declared name resolves to one this tree commits and the texture file exists;
          materials are pinned to exactly ['evoker'], so a second vanilla name would fail
  - claim: r-pop72yk6 # adventures built against different versions coexist in one world
    covered_by:
      - kind: attestation
        ref:
          - src/actor.ts
          - src/presets.ts
        note: >
          no version token appears in any identifier, key, or record; identifiers are composed from
          the adventure's namespace at call time, so two adventures produce disjoint identifiers
          and disjoint dynamic-property keys
      - kind: code-test
        ref:
          - src/actor.test.ts
        note: >
          both the composed identifier and the world-state key are shown to vary with the
          adventure's namespace, not with this package's version
  - claim: r-6q7adtpo # an adventure keeps working as the product gains releases
    covered_by:
      - kind: attestation
        ref:
          - src/presets.ts
          - src/index.ts
        note: >
          what an adventure names is a preset name and the exported catalogue; the wizard preset and
          its meaning are unchanged by anything a later release adds
  - claim: r-rpcudvbl # a wizard preset
    covered_by:
      - kind: attestation
        ref:
          - src/presets.ts
          - vendored_pack/
        note: >
          the wizard preset exists, defaults to `Wizard`, and renders from the evoker's geometry,
          texture, and animations
      - kind: code-test
        ref:
          - src/shipped-pack.test.ts
        note: >
          the built pack declares twin-digital-rpg-core-example:rpg.wizard and ships its model,
          texture, and animations
      - kind: manual-check
        ref:
          - README.md
        note: >
          executed headless 2026-08-18 (rpg-core-example): the wizard stood and answered to its
          identifier. 'reads as an elderly robed spellcaster' is a human judgement at a client and
          was not made this run
  - claim: r-0fmfslpl # a player in creative cannot edit, rename, remove, or harm an actor
    covered_by:
      - kind: attestation
        ref:
          - vendored_pack/behavior_pack/entities/wizard.json
        note: >
          damage_sensor deals no damage, no nameable component so a name tag cannot rename it,
          is_spawnable false so no spawn egg reaches the creative menu, pushable off both ways
      - kind: code-test
        ref:
          - src/vendored-pack.test.ts
        note: >
          one assertion per verb of the requirement — refuses damage, cannot be renamed, reaches the
          creative menu through no spawn egg, blocks every stoppable displacement vector
      - kind: manual-check
        ref:
          - README.md
        note: >
          executed headless 2026-08-18 (rpg-core-example): damage under entity_attack and void both
          reported 'Could not apply damage' and both actors survived. rename-by-name-tag and
          shove-by-hand are client actions and were not exercised
  - claim: r-rytfox4t # an actor keeps its place until the adventure removes it
    covered_by:
      - kind: attestation
        ref:
          - vendored_pack/behavior_pack/entities/wizard.json
        note: >
          minecraft:persistent with no despawn component and zeroed movement — it stays where it was
          put until the adventure removes it
      - kind: code-test
        ref:
          - src/vendored-pack.test.ts
          - src/actor.test.ts
        note: >
          persistence and the absence of despawn are asserted, and removal is shown to be the
          adventure's own call
      - kind: manual-check
        ref:
          - README.md
        note: >
          executed headless 2026-08-18 (rpg-core-example): across a real stop/start with no player
          ever connected, the same two uniqueIds stood at the same coordinates under the same names
  - claim: r-wwha7y68 # an adventure's author writes no actor content
    covered_by:
      - kind: attestation
        ref:
          - vendored_pack/
          - package.json
        note: >
          every entity definition, model, texture, animation, and default name is in the actors
          package and `files` ships vendored_pack; an author writes one dependencies entry
      - kind: code-test
        ref:
          - src/vendored-pack.test.ts
          - src/shipped-pack.test.ts
        note: >
          the content exists in the actors package for each preset, while the example's committed
          tree carries no actor-content file and its built resource pack carries all of it
      - kind: manual-check
        ref:
          - README.md
        note: >
          executed headless 2026-08-18 (rpg-core-example): complete, named actors stood in a live
          world from a package that authored none of them
  - claim: r-tbk2pm77 # the library returns no handle to an actor it did not create
    covered_by:
      - kind: attestation
        ref:
          - src/actor.ts
        note: >
          every handle is built from an entity returned by the runtime's checked getEntity or
          spawnEntity; no path constructs one from an unchecked entity, and no call reports on
          rendering
      - kind: code-test
        ref:
          - src/actor.test.ts
          - src/adventure.test.ts
        note: >
          a handle is refused with ForeignEntityError for an entity answering the identifier without
          this pack's family, on both the spawn and the findActor path
  - claim: r-hear6pun # packs unit-test with the shared test lib
    covered_by:
      - kind: attestation
        ref:
          - vitest.config.d/minecraft-test-lib.ts
        note: >
          "@minecraft/server" resolves only through the shared test lib's vitest plugin; there is no
          hand-rolled double and no module mock of it in either package
      - kind: code-test
        ref:
          - src/actor.test.ts
          - src/entry.test.ts
        note: both packages' suites drive their code against the shared fakes
  - claim: r-cyd08e6q # packs are built by the dev kit
    covered_by:
      - kind: attestation
        ref:
          - tsdown.config.ts
          - tsdown.config.d/minecraft-pack.ts
          - tsdown.config.d/namespace.ts
        note: >
          both fragments call the kit's packBuild and define no bundling; build, watch, dev, and
          release-assets all route through it
      - kind: manual-check
        ref:
          - README.md
        note: >
          executed 2026-08-18 (rpg-core-example): the kit completed the manifests, merged the
          vendored tree, and pruned dist to what it wrote
  - claim: r-w2vh7olv # a pack does not deliver itself
    covered_by:
      - kind: attestation
        ref:
          - package.json
        note: >
          private, release-assets is mc-pack-archive, and the package publishes and deploys nothing
          of its own
      - kind: manual-check
        ref:
          - README.md
        note: >
          executed 2026-08-18 (rpg-core-example): pnpm release-assets produced
          rpg-core-example-0.1.0.mcaddon through the kit alone
  - claim: r-992moral # packs run against the dev server
    covered_by:
      - kind: attestation
        ref:
          - package.json
          - .minecraft.yml
        note: >
          dev and dev:stop delegate to mc-dev-server; the package holds no server, container, world,
          or activation file
      - kind: manual-check
        ref:
          - README.md
        note: >
          executed 2026-08-18 (rpg-core-example): pnpm dev and nothing else brought up a Bedrock
          server with this pack deployed and active in the world .minecraft.yml names
  - claim: r-82ck2fax # package config is repo-kit managed
    covered_by:
      - kind: attestation
        ref:
          - eslint.config.js
          - tsconfig.json
          - vitest.config.ts
          - package.json
        note: >
          every shared config file is repo-kit's, unedited; the actors package's one exception
