version: "1"
facts:
  - id: bundle-identity-comes-from-the-product-manifest
    claim: |
      a design's bundle name comes from the product manifest, the file `products.yaml` at the
      repository root, which maps each product either to one design scope or to a mapping of feature
      names to design scopes; a design the manifest does not name has no bundle name at all
    backing: documented
    sources:
      - url: design/how-to-plan/spec-bundles/requirements.yaml
        where: product-manifest-declares-bundle-identity — statement
        quote: |
          a design's bundle name comes from the product manifest, the file `products.yaml` at the
          repository root, which maps each product to one design scope or to a mapping of feature names
          to design scopes; a design the manifest does not name has no bundle name

  - id: bundle-package-name-is-td-spec-scoped
    claim: |
      a bundle's package name is the literal scope `@td-spec` followed by the product, and where the
      product subdivides, a dot and the feature
    backing: documented
    sources:
      - url: design/how-to-plan/spec-bundles/requirements.yaml
        where: bundle-name-is-the-td-spec-scope — statement
        quote: |
          a bundle publishes as `@td-spec/<product>`, or as `@td-spec/<product>.<feature>` where the
          product subdivides

  - id: bundle-commitments-are-one-flat-list-of-prefixed-id-and-statement
    claim: |
      a spec bundle publishes its commitments as one flat sequence whose entries carry exactly two
      fields — an `id` prefixed with its kind letter, `r:` or `d:`, and a `statement` — with nothing
      telling the two kinds apart
    backing: documented
    sources:
      - url: design/how-to-plan/spec-bundles/requirements.yaml
        where: commitments-are-a-flat-id-and-statement-list — statement
        quote: |
          a bundle's commitments are one flat sequence whose entries carry exactly two fields: an `id`
          prefixed with its kind letter, `r:` or `d:`, and a `statement`. Nothing marks which entries are
          the owner's fiat and which the spec's own

  - id: bundle-edges-come-from-cited-fact-sources
    claim: |
      a bundle's upstream dependencies are exactly the designs whose `requirements.yaml` or `spec.md`
      its spec's cited facts source; no other kind of source yields an edge
    backing: documented
    sources:
      - url: design/how-to-plan/spec-bundles/requirements.yaml
        where: bundle-dependencies-come-from-cited-fact-sources — statement
        quote: |
          a bundle depends on the bundles of the designs whose `requirements.yaml` or `spec.md` its
          spec's cited facts source, and on nothing else

  - id: token-strip-preserves-the-line
    claim: |
      stripping a spec's citation tokens changes the source nowhere but where a token stood: a run of
      spaces the removal doubles collapses to one, and a token that ended a line takes the space
      before it
    backing: documented
    sources:
      - url: design/how-to-plan/spec-bundles/requirements.yaml
        where: token-strip-leaves-the-line-as-written — statement
        quote: |
          a spec's prose with its citation tokens stripped differs from the source nowhere but where a
          token stood: the spacing a removal doubles collapses to one, and a token that ended a line
          takes the space before it
