# Facts about the design process's own surfaces in this repository.

- id: foundations-script-callers
  claim: the legacy foundations script is named by the legacy prompt library, CLAUDE.md, the plan
    skill, package.json's foundations alias, and legacy design documents — and by nothing else in
    the tracked tree
  backing: tested
  caveat: |
    An observation of the tree at the increment-009 draft; the list shifts as files change, and
    the run's script re-answers it in one command.
  sources:
    - run: foundations-script-reference-search
      where: the full match list
      quote: |
        .claude/skills/plan/SKILL.md:30:  Search `node bin/foundations.mjs --facts` and cite what exists before recording.
        CLAUDE.md:77:`node bin/foundations.mjs --facts` and cite what is already there. File a new fact at the
        package.json:7:    "foundations": "node bin/foundations.mjs"

- id: backlog-schema-validates
  claim: a backlog file holding one item validates against /design-process/backlog@1 as authored,
    and the item id pattern rejects a malformed id
  backing: tested
  sources:
    - run: backlog-schema-probe
      where: the probe's output, and its environment note on the rejected nine-character id
      quote: |
        valid: example backlog conforms to /design-process/backlog@1
