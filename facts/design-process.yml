# Facts about the design process's own surfaces in this repository.

- id: check-rejects-slug-increment-dirs
  claim: npm run check fails a slug-named directory under a product's increments/ with the
    increment-dir-name finding, citing d-kn05wb30's zero-padded-number rule
  backing: tested
  sources:
    - run: validator-shape-probe-slug
      where: the finding and closing lines
      quote: |
        ✖ [increment-dir-name] products/increment-process/increments/some-future-idea/item.md: increment directory "some-future-idea" is not a zero-padded number (d-kn05wb30)
        design check failed: 1 finding(s)

- id: check-ignores-product-backlog-dir
  claim: npm run check passes unchanged with a backlog/ directory of free markdown beside a
    product's product.yaml
  backing: tested
  caveat: |
    The baseline tree without the fixture also passes; the probe shows the fixture adds no
    finding, not that the validator reads the directory.
  sources:
    - run: validator-shape-probe-backlog-dir
      where: the closing lines
      quote: |
        design check passed
        exit: 0

- id: check-enforces-dense-increments
  claim: npm run check fails a product whose increment numbers skip a value, with the
    increment-sequence-dense finding naming the missing number
  backing: tested
  sources:
    - run: sequence-gap-probe
      where: the finding line
      quote: |
        ✖ [increment-sequence-dense] products/increment-process: increment numbers are not dense: missing 12 (d-6x6l6ws7, d-d6hwdg9d)

- id: slug-named-draft-is-invisible-to-the-gate
  claim: while an increment directory is slug-named, its sources are not schema-validated and
    its foundations do not project; only the increment-dir-name finding fires, and the rest
    appear when the landing rename makes the directory a number
  backing: tested
  sources:
    - run: draft-visibility-probe
      where: the two sections, whose content differs only by the directory's name
      quote: |
        === A. slug-named, as a draft is worked ===
        ✖ [increment-dir-name] products/increment-process/increments/draft-visibility/requirements.yaml: increment directory "draft-visibility" is not a zero-padded number (d-kn05wb30)
        design check failed: 1 finding(s)
        draft requirement projected (occurrences): 0
        === B. identical content, renamed to 013 ===
        ✖ [source-validates] products/increment-process/increments/013/requirements.yaml: /requirements/0 must NOT have additional properties (r-gq90gngs, d-i47qv6oa)
        design check failed: 1 finding(s)
        draft requirement projected (occurrences): 3
