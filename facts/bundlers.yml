# The bundler toolchain itself — tsdown and the Rolldown plugin API beneath it. Reality any design
# that ships bundler configuration has to fit.

- id: tsdown-takes-rolldown-plugins-through-its-config
  claim: |
    tsdown is built on Rolldown and accepts every Rolldown plugin, as well as most Rollup and
    Unplugin plugins. A plugin is supplied through the `plugins` array of the configuration file and
    cannot be supplied on the command line, so behaviour a design wants a tsdown build to perform
    travels as a plugin inside the configuration rather than as an invocation.
  backing: documented
  caveat: |
    The quotes carry the Rolldown half — all Rolldown plugins are supported, and a plugin is
    declared in the `plugins` array and not on the CLI. They say nothing about Rollup or Unplugin
    plugins, so a design relying on one of those needs its own evidence.
  sources:
    - url: https://tsdown.dev/advanced/plugins
      where: Rolldown Plugins — what tsdown accepts
      quote: |
        Since `tsdown` is built on Rolldown, it supports all Rolldown plugins.
    - url: https://tsdown.dev/advanced/plugins
      where: Using Plugins — where a plugin is declared
      quote: |
        To use plugins in `tsdown`, you need to add them to the `plugins` array in your configuration
        file. Plugins **cannot** be added via the CLI.

- id: tsdown-externalises-a-packages-declared-dependencies-by-default
  claim: |
    tsdown leaves an import of a package listed in the building package's `dependencies` external
    by default: the output carries the bare specifier rather than the package's code. Setting
    `noExternal` to a predicate that matches nothing does not switch externalisation off — it drops
    the override and restores that default, so the import stays external. Only a `noExternal` that
    matches forces such an import into the bundle.
  backing: tested
  sources:
    - run: tsdown-externals-probe
      where: the results — the same fixture built with no `noExternal` and with one matching nothing
      quote: |
        noExternal unset, no plugin: dep-a=EXTERNAL dep-b=EXTERNAL
        noExternal () => true, no plugin: dep-a=BUNDLED dep-b=BUNDLED
        noExternal () => false, no plugin: dep-a=EXTERNAL dep-b=EXTERNAL

- id: a-plugin-resolveid-external-return-wins-over-noexternal
  claim: |
    A specifier a plugin's `resolveId` returns as `{ external: true }` is left external even under
    `noExternal: () => true`, which would otherwise force every import into the bundle. Imports the
    plugin does not claim still follow the `noExternal` setting. A plugin can therefore own the
    external set outright: with `noExternal` forcing everything else bundled, exactly what the
    plugin returns as external stays external, and no upstream default is consulted.
  backing: tested
  sources:
    - run: tsdown-externals-probe
      where: the results — the plugin case under each `noExternal` setting
      quote: |
        noExternal () => true, plugin externalises dep-a: dep-a=EXTERNAL dep-b=BUNDLED
        noExternal () => false, plugin externalises dep-a: dep-a=EXTERNAL dep-b=EXTERNAL

- id: emptying-the-bundle-in-generatebundle-leaves-the-bundler-nothing-to-write
  claim: |
    A plugin that deletes every key from the bundle object in `generateBundle` leaves the bundler
    nothing to write: `writeBundle` receives an empty bundle and no chunk file appears in the output
    directory, which then holds only what the plugin wrote itself. Left alone, the same build writes
    its chunk there. The two never overlap in time — `generateBundle` runs to completion before any
    file is written — so a plugin writing from that hook is not racing the bundler's write. With
    `clean: false` the bundler creates and removes nothing else: a file already in the output
    directory is still there, unchanged, after the build.
  backing: tested
  sources:
    - run: tsdown-emit-probe
      where: the emptied case — what each hook saw and what the output directory held afterwards
      quote: |
        --- plugin empties the bundle and writes its own file
            generateBundle saw: main.mjs
            plugin wrote: dist/plugin-empties-the-bundle-and-writes-its-own-file/scripts/main.js
            writeBundle saw: (nothing)
            outDir after: scripts/main.js
    - run: tsdown-emit-probe
      where: the untouched case, and the seeded case under clean false
      quote: |
        --- plugin leaves the bundle alone
            generateBundle saw: main.mjs
            outDir after: main.mjs
    - run: tsdown-emit-probe
      where: the seeded case — what clean false leaves alone
      quote: |
        outDir after: left-over.txt | scripts/main.js
            seeded left-over.txt: STALE-SEED

- id: a-rolldown-plugin-can-declare-extra-watch-inputs
  claim: |
    A Rolldown plugin's context carries `addWatchFile(id)`, which registers a path the bundler
    watches so a change to it triggers a rebuild. The path may name a file or a directory, so a file
    no module graph reaches — an asset, a manifest, a `package.json` — can be made a rebuild trigger
    by the plugin that reads it, and a directory can be registered for the files it does not hold
    yet.
  backing: documented
  sources:
    - url: https://rolldown.rs/reference/Interface.PluginContext
      where: addWatchFile — the method's description
      quote: |
        Adds additional files to be monitored in watch mode so that changes to these files will
        trigger rebuilds.
    - url: https://rolldown.rs/reference/Interface.PluginContext
      where: addWatchFile — the `id` parameter
      quote: |
        The path to be monitored. This can be an absolute path to a file or directory or a path
        relative to the current working directory.
