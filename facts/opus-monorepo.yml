# The opus monorepo's own mechanisms — how a package there is configured, built, versioned, and
# released. These are reality any design shipping into that monorepo has to fit, not decisions any
# design here makes. Sources are pinned to a commit so a quote cannot drift out from under its url.

version: "1"
facts:
  - id: opus-workspace-members-sit-two-levels-under-nodejs
    claim: |
      The opus monorepo's workspace members are whatever matches `nodejs/*/*`, plus the two named
      `tooling/` paths. A package there sits exactly two levels under `nodejs/` — a group
      directory, then the package — and a directory nested deeper than that is not a workspace
      member, since neither `*` crosses a path separator. An application wanting several packages
      of its own therefore gets a group directory holding them, not a tree beneath one package.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/a18908f1808750128c75c8e7cd9280181b6b4156/pnpm-workspace.yaml
        where: packages — the workspace's member patterns
        quote: |
          packages:
            - nodejs/*/*
            - tooling/scripts
            - tooling/renovate-tools

  - id: opus-package-config-is-generated-from-one-root-file
    claim: |
      In the opus monorepo a package's shared configuration is not written in the package. It is
      generated and synced by `@twin-digital/repo-kit` from a single root `.repo-kit.yml` —
      `eslint.config.js`, `tsconfig*.json`, `package.json` scripts, engines and devDependencies,
      `.nvmrc`, and `tsdown.config.ts` among the files it owns. A generated file edited in place is
      overwritten on the next sync, so a package's copy is never the source of truth, and a
      per-package exception is declared in the root file rather than in the package.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/a3ff0e1a0805202fd24663a8990dcaaa6a9c22a0/CLAUDE.md
        where: Config is repo-kit–managed — do not hand-edit generated files
        quote: |
          Per-package config is **generated/synced** by `@twin-digital/repo-kit` from the root
          **`.repo-kit.yml`**: `eslint.config.js`, `tsconfig*.json`, `package.json`
          scripts/engines/devDependencies, `.nvmrc`, `tsdown.config.ts`, and the README package list.
          These are not the source of truth.
      - url: https://github.com/twin-digital/opus/blob/a3ff0e1a0805202fd24663a8990dcaaa6a9c22a0/CLAUDE.md
        where: Config is repo-kit–managed — the sync behaviour and the opt-out
        quote: |
          Editing a generated file directly will be overwritten on the next sync. Per-package opt-outs
          live in `.repo-kit.yml` under `packages.<name>.rules`.

  - id: opus-bundler-config-merges-partial-fragments
    claim: |
      A package's bundler configuration in the opus monorepo is composed, not written: a shared base
      plus per-package fragments, where each `*.ts` file in a `tsdown.config.d/` directory beside the
      package's `tsdown.config.ts` default-exports a partial config. Fragments are applied in filename
      order and shallow-merged over the base, so a top-level key a fragment sets replaces the base's
      wholesale and a fragment overriding a nested key must restate what it still needs. A package's
      bundler configuration is therefore assembled from merged values rather than written in the
      package.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/a3ff0e1a0805202fd24663a8990dcaaa6a9c22a0/nodejs/devtools/tsdown-config/src/index.ts
        where: defineBundleConfig — the doc comment describing how overrides compose
        quote: |
          Overrides live next to the calling `tsdown.config.ts` in a `tsdown.config.d/`
          directory: each `*.ts` file default-exports a partial config, applied in
          filename order and **shallow-merged** over the base (a top-level key replaces
          the base's wholesale — so if you override a nested key like `inputOptions`,
          re-include what you still need from the base).

  - id: opus-bundler-base-forces-every-import-bundled
    claim: |
      The shared base config in the opus monorepo sets `noExternal: () => true`, its default being
      that every import is bundled. The setting is a top-level key like any other, so a fragment that
      does not set `noExternal` itself inherits it from the base.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/a3ff0e1a0805202fd24663a8990dcaaa6a9c22a0/nodejs/devtools/tsdown-config/src/index.ts
        where: base — the exported base config object
        quote: |
          export const base: UserConfig = {
            dts: true,
            entry: 'src/**/*.ts',
            fixedExtension: false,
            hash: false,
            inputOptions: {
              resolve: {
                conditionNames: ['source'],
              },
            },
            noExternal: () => true,
            shims: true,
            unbundle: false,
          }

  - id: opus-release-assets-come-from-a-per-package-script
    claim: |
      A package in the opus monorepo puts files on its GitHub release by declaring a `release-assets`
      script that writes them into a `.release-assets/` directory in the package. Continuous
      integration runs that script for each published package and uploads what it finds, and a package
      declaring no such script gets no release assets at all. Only the top-level regular files are
      uploaded, so an asset is a flat file and a directory of them is not. An artifact therefore
      reaches a release only through a hook the package itself declares.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/a3ff0e1a0805202fd24663a8990dcaaa6a9c22a0/docs/CICD.md
        where: Release assets — how a package declares them
        quote: |
          A package publishes files to its GitHub release by defining a **`release-assets`** script that
          writes them into a `.release-assets/` directory in the package (creating it; the directory is
          gitignored). The script takes no arguments, and packages that don't define one simply get no
          GitHub-hosted assets.
      - url: https://github.com/twin-digital/opus/blob/a3ff0e1a0805202fd24663a8990dcaaa6a9c22a0/docs/CICD.md
        where: Release assets — what is uploaded
        quote: |
          A release asset is a flat file, so only the **top-level regular files** in `.release-assets/` are
          uploaded — subdirectories are ignored.

  - id: opus-package-versions-are-written-by-changesets
    claim: |
      A package's version in the opus monorepo is written by the changesets release process, not by
      hand and not by a build: a change declares its affected packages and bump type, and a publish
      workflow opens and merges a "Version Packages" pull request that applies the bumps and
      publishes. Private and unpublished packages are versioned and tagged the same way. So a
      package's `package.json` version is the one record of what version it is, and nothing else may
      write it.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/a3ff0e1a0805202fd24663a8990dcaaa6a9c22a0/CLAUDE.md
        where: Deployment & CI/CD — Versioning/publishing
        quote: |
          **Versioning/publishing** uses **changesets**. A changeset is **required for every change to
          project code** — any edit under a package's `src/` (or that otherwise affects a published
          package) must include a changeset (`pnpm exec changeset`) selecting the affected packages and
          bump type.
      - url: https://github.com/twin-digital/opus/blob/a3ff0e1a0805202fd24663a8990dcaaa6a9c22a0/CLAUDE.md
        where: Deployment & CI/CD — private packages and the publish workflow
        quote: |
          the changeset config sets `privatePackages.version: true`, so private packages are versioned
          and tagged too — a dependency bump or shared-config change that touches them belongs in the
          changeset just like a published library. The publish workflow opens/merges the "Version
          Packages" PR and publishes.

  - id: opus-pack-archive-carries-only-the-packages-own-packs
    claim: |
      `mc-pack-archive` cuts a package's release `.mcaddon` from that package's own `dist/` output
      tree, and its members are fixed in source: `dist/behavior_pack` and `dist/resource_pack`, one
      `.mcpack` each. The command's input is the package directory it runs in and nothing else, so
      an adventure's archive cannot carry a dependency's packs — bundling a foreign pack would be a
      kit capability that does not exist.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/dfd8f1bf51ef0cd64a6737ee235bb065c3340859/nodejs/minecraft/mc-dev-kit/src/internal/archive.ts
        where: PACK_MEMBERS — the fixed member list
        quote: |
          /** The pack kinds an output tree may hold, and the mcpack member each is cut into. */
          export const PACK_MEMBERS = [
            ['behavior_pack', 'behavior_pack.mcpack'],
            ['resource_pack', 'resource_pack.mcpack'],
          ] as const
      - url: https://github.com/twin-digital/opus/blob/dfd8f1bf51ef0cd64a6737ee235bb065c3340859/nodejs/minecraft/mc-dev-kit/src/internal/archive.ts
        where: archivePackage — the doc comment describing the input tree
        quote: |
          The tree is the whole of the input: the packs are the kind-named directories `dist/` holds, and
          the kit is never called, so a tree stale with respect to source is archived as it stands. Each
          pack becomes one `.mcpack` member holding the contents of its output directory at the archive
          root, and the `.mcaddon` holds one member per pack whatever the number of packs.

  - id: a-vendored-librarys-runtime-prefix-binds-by-package-directory-containment
    claim: |
      The kit binds a vendored library's `packId` to that library's prefix by package-directory
      containment. Resolving the runtime import, the build finds the merged vendored pack whose
      package directory holds the importing module — a `startsWith` test on the importer's real
      path — and only where one is found does it hand that module a runtime whose `packId` is
      bound to the pack's prefix. A library whose code sits in a different package from the
      `vendored_pack/` tree its entities come from matches no merged pack, so its `packId('x')`
      composes the un-prefixed `<namespace>:x` while its entities build as
      `<namespace>:<prefix>.x`, and every lookup misses. Shipping the library's source and the
      `vendored_pack/` tree in one package is what makes the binding land.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-dev-kit/src/internal/pack-build-plugin.ts
        where: resolveId — the runtime import a vendored module makes
        quote: |
          // a vendored library's modules get the runtime with packId bound to the library's prefix,
          // so its compiled-in calls — computed names included — land in its own entity cell
          if (id === RUNTIME_PACKAGE && state.namespace !== undefined && importer !== undefined) {
            const owner = await owningVendoredPack(state.vendored, importer)
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-dev-kit/src/internal/pack-build-plugin.ts
        where: owningVendoredPack — the containment test itself
        quote: |
          /** The merged vendored pack whose package directory holds `importer`, if any. */
          async function owningVendoredPack(
            vendored: readonly VendoredPack[],
            importer: string,
          ): Promise<VendoredPack | undefined> {
            let real: string
            try {
              real = await realpath(importer)
            } catch {
              return undefined
            }
            return vendored.find((pack) => real.startsWith(`${pack.packageDir}${path.sep}`))
          }

  - id: a-vendored-librarys-prefix-is-the-consumers-then-defaultalias-then-the-npm-name
    claim: |
      The token a vendored library's content is spelled under resolves in one order: the shipping
      package's own explicit `minecraft.vendor` `prefix` entry for that dependency, else the
      dependency's shipped `minecraft.defaultAlias`, else the dependency's unscoped npm name. For
      the package whose build ships the packs the token also fixes the output entity-id segment,
      `<namespace>:<prefix>.<name>`. A token holds lowercase letters, digits, underscore and
      hyphen and never a dot; two dependencies resolving to one token fail the build naming both,
      and an explicit `prefix` is the fix. A library changing its `defaultAlias` is a breaking
      change for its consumers: their token references fail loudly rather than rebinding, and
      pinning the old token as an explicit `prefix` restores the build and preserves shipped-world
      entity ids exactly.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-dev-kit/README.md
        where: Vendoring shared packs — how a token resolves
        quote: |
          explicit `prefix` entry, else the dependency's shipped **`minecraft.defaultAlias`** — a sibling
          of `vendor` a shared package may declare (`{ "minecraft": { "defaultAlias": "fx" } }`) — else
          the dependency's unscoped npm name (`@rpg-libs/spell-fx` is written as `spell-fx.*`). A token
          holds lowercase letters, digits, underscore and hyphen — never a dot, the separator — and two
          dependencies resolving to one token fail the build naming both, with an explicit prefix as the
          fix; an invalid `defaultAlias` fails its own package's build, and at a consumer's build fails
          naming the library with the same fix. A library changing its `defaultAlias` is a **breaking
          change**: your token references fail loudly, listing the resolved tokens — they never rebind or
          silently rename — and pinning the old token as an explicit `prefix` entry restores your build
          and preserves shipped-world entity ids exactly. For the package whose build ships the packs, the token
          additionally fixes the output entity-id segment, `<namespace>:<prefix>.<name>`; a vendored
          library's entries are source-side aliases only — the output naming of a supplier's entities is
          always governed by the shipping consumer's token for that supplier.

  - id: a-vendoring-package-supplies-the-namespace-the-uuids-and-a-manifest-of-every-kind
    claim: |
      Vendoring requires a namespace, and it is the vendoring package's: a shared package's
      content merges into the vendoring package's own pack, under that package's namespace and
      header uuid, so the same shared pack's entity identifiers get a different spelling and
      identity in every package that takes it up. The vendoring package must hold its own source
      manifest of every kind it vendors, and so ships one behavior pack and one resource pack
      whatever it vendors. The build reads the shared package's `vendored_pack/` source tree
      directly and the shared package never needs to have been built, and `mc-pack-archive`
      archives the merged output tree as it stands, vendored content included.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-dev-kit/README.md
        where: Vendoring shared packs — what the vendoring package must supply
        quote: |
          Vendoring requires a namespace, and the vendoring package must hold its own source manifest of
          every kind it vendors — the vendored content merges into that pack, under the vendoring package's
          namespace and header uuid, so each vendoring package ships one behavior pack and one resource pack
          whatever it vendors, and the same shared pack's entity identifiers get a different spelling and
          identity in every package that takes it up. The build reads the vendored source tree directly; the
          depended-on package never needs to have been built. Its `vendored_pack/` tree joins the watch
          inputs, and the `mc-pack-archive` command archives the merged output tree as it stands, vendored
          content included.

  - id: a-vendored-pack-may-carry-entity-keyed-localization-and-lang-files-compose
    claim: |
      A vendored pack may declare entity definitions, geometries, textures, materials, render
      controllers, animations, animation controllers, and localization entries keyed by an entity
      identifier; content of any other kind fails the build naming the file. In a vendored tree
      the localization restriction is enforced per line: a `.lang` key matching neither
      `entity.<id>.name` nor `item.spawn_egg.entity.<id>.name` is reported as not being a
      localization entry keyed by an entity identifier, and the keys that do match are rewritten
      to follow the composed identifiers the build produced. A `.lang` path more than one merged
      pack contributes entries to is composed from every contribution rather than one silently
      winning, and one the build cannot compose fails it naming both contributors.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-dev-kit/README.md
        where: Vendoring shared packs — the content kinds and the composed files
        quote: |
          A vendored pack may hold entity definitions, geometries, textures, materials, render controllers,
          animations, animation controllers, and localization entries keyed by an entity identifier; content
          of any other kind fails the build naming the file.
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-dev-kit/src/internal/merge-plan.ts
        where: rewriteLang — the per-line key rule in a vendored tree
        quote: |
          const LANG_ENTITY_KEY = /^(entity\.|item\.spawn_egg\.entity\.)(.+)(\.name)$/u

          /** Rewrites a `.lang` file's entity-keyed entries; in a vendored tree any other entry faults. */
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-dev-kit/README.md
        where: Vendoring shared packs — composition of a shared file
        quote: |
          A file more than one merged pack
          contributes entries to — `texts/en_US.lang`, say — is composed; one the build cannot compose
          fails it, naming both contributors.

  - id: mc-pack-runtime-spells-identifiers-and-checks-the-packs-own-family
    claim: |
      `@twin-digital/mc-pack-runtime` is the kit's engine-side half, bundled into a pack's own
      script bundle and reading the namespace, pack token and vendored prefixes the build injects
      ahead of every module, with nothing passed per call. From one entry point it exports
      `packId(name)`, spelling a bare or `<prefix>.<name>` name into the pack's namespace;
      `packNamespace()` and `packFamily()`; checked `spawnEntity`, `getEntity` and `getEntities`
      that hand back only entities carrying the pack's own type family — a spawn that answers
      foreign is removed and raises `ForeignEntityError`, a lookup raises it where it stands, and
      a query leaves foreign entities out; and `foreignNamespaceClaims()`. `packId` throws where
      the name already carries a `:`, where no namespace was injected, and where its first
      dot-segment is not an injected prefix.
    backing: documented
    sources:
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-pack-runtime/src/index.ts
        where: the module doc comment and the entry point's exports
        quote: |
          A pack takes it as an ordinary dependency. In a namespaced pack the build injects the pack's
          namespace and token ahead of every module, and everything here reads that injection with
          nothing passed per call:
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-pack-runtime/src/checked.ts
        where: the module doc comment on the checked calls
        quote: |
          The checked entity calls: each hands back only entities carrying this pack's own type family,
          so a definition a rival pack's content replaced (the engine keeps one whole definition per
          identifier) is caught at use instead of acting under this pack's name. They are for the pack's
          own types — a vanilla or foreign entity is reached through `@minecraft/server` directly.
      - url: https://github.com/twin-digital/opus/blob/fa6362c71fe5d48eaef5af14c30d9c0402d61b6a/nodejs/minecraft/mc-pack-runtime/src/identifier.ts
        where: packId — what it spells and what it refuses
        quote: |
          Throws where the name already carries a `:` — the helper spells unnamespaced names only — and
          where no namespace was injected, since the engine would read a bare name as `minecraft:<name>`
          and a silent wrong-namespace lookup is the bug this helper exists to prevent. A pack built
          with namespacing off spells its identifiers in full and has no bare names to spell.
