version: "1"
facts:
  - id: bedrock-negative-reputation-only-cancels-discounts
    claim: |
      Bedrock Edition does not implement Java Edition's gossip effect on prices. A villager's
      negative reputation there cannot raise a price at all — it only cancels positive reputation
      and other discounts. So attacking a villager in Bedrock costs a player whatever discount they
      had built up with that villager and nothing beyond it, and a villager the player has never
      traded with has nothing for the attack to take.
    caveat: |
      The Minecraft Wiki is the reference work for this mechanic rather than a first-party
      specification; Mojang publishes no document stating it. The observation below is consistent
      with the wiki but does not on its own establish it, because it was made against villagers
      carrying almost no positive reputation.
    backing: documented
    sources:
      - url: https://minecraft.wiki/w/Villager
        where: the Gossiping section, on how reputation changes prices
        quote: "In Bedrock Edition negative reputation can only cancel out positive reputation and other price discounts but not increase the price."
      - description: |
          Observed against Bedrock dedicated 1.26.40.8 on 2026-08-06, in the staged session
          `protection-probe-client` extended with its gossip set: two penned farmers, each traded
          with once and then struck — one of them until a stone sword broke — and traded with again.
          No price rose on either. The reading is consistent with the claim and is not decisive for
          it: a single trade earns little positive reputation, so there was next to no discount for
          the attack to cancel, which is exactly the case the wiki says produces no visible change.

  - id: attacking-a-cured-villager-does-not-cost-it-its-discount
    claim: |
      A player attacking a cured villager in Bedrock 1.26.40.8 did not move its prices at all. The
      subject was cured from a zombie villager and its discount read at the client first — 16
      carrots per emerald, against the 22 a second uncured farmer asked, and 1 emerald per paper on
      a second cured subject — then struck repeatedly and re-read, with no change either time. It
      held across 165 hits amplified to 15 damage each and again across a run where nothing at all
      touched the damage path. So whatever the documented gossip table says a `minor_negative`
      should do, an attack did not cancel this discount here.
    caveat: |
      Scoped to the configuration measured, which leaves one candidate untested: the subject was
      penned alone with a composter and no village structures — no beds, no bell, no boundary — and
      Bedrock's village mechanics require those. Whether an attack costs reputation inside a real
      village is not answered, and that is the ordinary case for an installed pack rather than an
      exotic one. What the second attachment does rule out is the measuring rig: the first reading
      was taken with a before-event handler rewriting `damage`, which could plausibly have displaced
      the engine's own bookkeeping, and the second took the same reading with nothing on the damage
      path and got the same answer.
    backing: tested
    sources:
      - run: protection-probe-gossip
        where: "the vanilla attachment — an untouched player hit landing on the cured subject"
        quote: "[2026-08-06 17:02:01:094 WARN] [Scripting] [vgprobe] vanilla-hit :: player hit 1 damage=8 cause=entityAttack health-now=number:12 alive=true — nothing of ours touched this hit"
      - run: protection-probe-gossip
        where: "the amplified attachment — 165 hits at 15 damage, the subject never dying"
        quote: "[2026-08-06 17:00:02:944 WARN] [Scripting] [vgprobe] discount-under-attack :: player hit 165 landed damage=15 health-now=number:20 alive=true"
      - description: |
          The prices are the owner's readings at a Bedrock client on 2026-08-06, taken against the
          staged sessions above: 22 carrots per emerald uncured against 16 cured, and 7 emeralds
          down to 1 per paper on the other cured subject, with no movement in either after the
          attacks. Trade prices are not on the script API's surface
          [[f:no-damage-cause-names-the-attacker-and-none-names-reputation]], so no run captures
          them and the owner's report is the evidence.

  - id: cancelling-a-players-hit-prevents-the-reputation-change
    claim: |
      A player's hit that is cancelled in `beforeEvents.entityHurt` costs the player nothing in
      standing with the villager, because the reputation change rides on the damage the cancellation
      prevents rather than on the swing that was attempted.
    caveat: |
      Assumed, not measured. The direct test could not be made to discriminate: an attack did not
      move a cured villager's prices even with nothing of the pack on the damage path
      [[f:attacking-a-cured-villager-does-not-cost-it-its-discount]], so there was no observable
      reputation change for a cancellation to be seen preventing. The subject also had no village
      around it, and that case is untested. If Bedrock books the reputation off the swing rather
      than off the damage, this is false — and the failure would be silent, since trade prices are
      not on the script API's surface
      [[f:no-damage-cause-names-the-attacker-and-none-names-reputation]] and no pack can read back
      what it did. What bounds the risk is that the whole exposure is a discount already earned:
      negative reputation in Bedrock cannot raise a price, only cancel a discount
      [[f:bedrock-negative-reputation-only-cancels-discounts]].
    backing: assumed
    sources:
      - description: |
          The mechanism is the before-event gate. A cancelled call lands nothing at all — no health
          moves and the whole after-event cascade is empty
          [[f:cancelled-call-return-values-observed]] — so the engine does not process the hit, and
          the bookkeeping the wiki hangs off an attack has no attack to hang off.
      - description: |
          The visible corroboration is the cancelled lane in the staged client comparison
          [[f:a-clamped-hit-is-indistinguishable-from-a-vanilla-one-at-a-client]]. Struck with the
          same weapon as the two lanes beside it, it showed none of what they showed: no red damage
          particles, no flinch, no hurt grunt, no agitation. The particles are vanilla's own damage
          feedback rather than anything the pack adds, since the unmodified lane shows them too, and
          their absence is the observable that the hit was never processed as a hit. That the
          villager registered nothing visible is the ground for assuming it registered nothing
          invisible either.


  # Facts from the village-structure probe (Bedrock 1.26.40.8), recorded in
  # evidence/minecraft/gameplay/village-structures-probe/RESULTS.md. Read out of the world's own
  # LevelDB records rather than inferred from the mobs, because the script API exposes no village.

  - id: bedrock-keeps-a-village-in-four-leveldb-records
    claim: |
      A Bedrock world stores each village as four NBT records in its LevelDB, keyed
      `VILLAGE_<dimension>_<uuid>_INFO`, `_DWELLERS`, `_POI` and `_PLAYERS` — the village's bounds,
      the entities belonging to it, its points of interest, and the per-player reputation. The
      dimension is part of the key, not only the uuid. A world holding no village holds no village
      key at all, so presence of the record is itself the test for whether a village exists.
    backing: tested
    sources:
      - run: village-structures-wreck
        where: "`wreck` — the village record after every structure was destroyed and the chunk reloaded"
        quote: |
          village 50-after-reload :: id=Overworld_89703a4e-63c0-43c0-add4-8b6984bea968 dwellers=30/0/0/0 poiEntries=30 poiInstances=30 poiNames={"villager":30} players=0 bounds=132,196,88,112,133,197
      - run: village-structures-baseline
        where: "`baseline` — a world before any village formed"
        quote: |
          records 00-empty :: totalKeys=7 villages=0 ids=[]

  - id: a-destroyed-bed-does-not-release-its-village-point-of-interest
    claim: |
      Breaking a bed leaves the village's record of it standing.
    backing: tested
    status: retired
    reason: superseded
    superseded_by: a-villagers-claimed-bed-poi-outlives-the-bed
    sources:
      - run: village-structures-wreck
        where: "`wreck` — the world after every village block was destroyed"
        quote: |
          [2026-08-07 18:49:48:944 WARN] [Scripting] [vgvil] destroy :: destroyed=all counts={"beds":0,"occupied":0,"jobs":0,"bells":0}
      - run: village-structures-wreck
        where: "`wreck` — the village record still naming 30 beds"
        quote: |
          village 50-after-reload :: id=Overworld_89703a4e-63c0-43c0-add4-8b6984bea968 dwellers=30/0/0/0 poiEntries=30 poiInstances=30 poiNames={"villager":30} players=0 bounds=132,196,88,112,133,197

  - id: villager-breeding-continues-with-every-bed-destroyed
    claim: |
      Destroying every bed does not stop villagers breeding. 3 villagers were born in the 2,400
      ticks after all 30 beds were destroyed, and 11 in the 7,200 ticks after the beds, job sites
      and bell had all been destroyed together. Breeding is not interrupted and so does not need to
      resume.
    backing: tested
    sources:
      - run: village-structures-breed
        where: "`breed` — the phase after every bed was destroyed"
        quote: |
          [2026-08-07 18:52:01:551 WARN] [Scripting] [vgvil] watch :: phase-end name=no-beds ticks=2400 bornInPhase=3 golemSpawnsInPhase=0 deathsInPhase=0
      - run: village-structures-wreck
        where: "`wreck` — the phase after beds, job sites and bell were all destroyed"
        quote: |
          [2026-08-07 18:56:14:995 WARN] [Scripting] [vgvil] watch :: phase-end name=razed ticks=7200 bornInPhase=11 golemSpawnsInPhase=0 deathsInPhase=0

  - id: villagers-survive-an-unload-with-no-village-structures-standing
    claim: |
      Villagers are not lost when a village's structures are gone. With no bed, job site or bell in
      the world, dropping the ticking area took all 30 villagers out of view and re-adding it
      brought all 30 back, still breeding afterwards. No villager was lost in any phase of any
      scenario, with or without structures.
    backing: tested
    sources:
      - run: village-structures-wreck
        where: "`wreck` — the chunk unload"
        quote: |
          [2026-08-07 18:56:55:692 WARN] [Scripting] [vgvil] unload :: unload villagersVisible=0
      - run: village-structures-wreck
        where: "`wreck` — the reload"
        quote: |
          [2026-08-07 18:57:31:194 WARN] [Scripting] [vgvil] reload :: reload villagersVisible=30 golemsVisible=0

  - id: destroying-a-villages-bell-changes-nothing-observable
    claim: |
      Removing a village's bell while its beds and job sites stand changes nothing this probe could
      observe: villagers went on breeding at the same rate — 7 births in the 2,400 ticks after the
      bell was destroyed against 9 before — and the village record was unaffected.
    caveat: |
      Only counts, positions and the village records were observed. The bell's vanilla role is the
      midday gathering and the raid warning, neither of which is reachable without a client
      watching, so this says the village survives the bell rather than that nothing at all changes.
    backing: tested
    sources:
      - run: village-structures-bell
        where: "`bell` — the bell destroyed, beds and job sites left standing"
        quote: |
          [2026-08-07 18:58:02:341 WARN] [Scripting] [vgvil] destroy :: destroyed=bell counts={"beds":30,"occupied":0,"jobs":15,"bells":0}
      - run: village-structures-bell
        where: "`bell` — the phase after"
        quote: |
          [2026-08-07 19:00:28:642 WARN] [Scripting] [vgvil] watch :: phase-end name=no-bell ticks=2400 bornInPhase=7 golemSpawnsInPhase=0 deathsInPhase=0

  - id: a-villager-that-never-claimed-a-job-site-keeps-its-profession
    claim: |
      A command-spawned villager arrives carrying a profession it did not take from a block, and
      destroying every job site in the village does not change it: all seven tracked villagers read
      the same profession triple before and after, and again after the blocks were rebuilt.
    caveat: |
      This is measured only on villagers whose profession did not come from a job site — the
      village's point-of-interest slots for job sites read unclaimed throughout, so no villager ever
      held one to lose. Whether a villager that earned its profession at a block keeps it when that
      block goes, and whether trading first locks it, are both unmeasured: they need a player, and
      neither the script API nor this rig has one.
    backing: tested
    sources:
      - run: village-structures-jobs
        where: "`jobs` — the professions either side of destroying every job site"
        quote: |
          [2026-08-07 18:39:44:300 WARN] [Scripting] [vgvil] diff :: professions after-jobs-destroyed tracked=7 unchanged=7 moves=[4584:v14m0s2->v14m0s2,4590:v10m0s5->v10m0s5,4591:v4m0s1->v4m0s1,4587:v8m0s2->v8m0s2,4585:v11m0s3->v11m0s3,4589:v10m0s2->v10m0s2,4588:v13m0s4->v13m0s4]

  - id: a-villagers-claimed-bed-poi-outlives-the-bed
    claim: |
      A village's `POI` record holds one entry per villager, keyed by that villager's id, each with
      three claim slots. A villager that has claimed a bed carries it in the first slot as a named
      point at the bed's own coordinates, with the other two slots unclaimed; the entry count
      therefore tracks villagers rather than beds — 30 beds and 5 villagers gave 5 entries, not 30.

      That claim outlives the block. Across four captures of one run — beds standing, beds just
      destroyed, a window with no beds at all, and beds rebuilt — every villager's slot held the same
      coordinates throughout, matching the grid the beds were placed on. Destroying the bed does not
      clear the claim, and rebuilding does not cause it to be re-taken.
    caveat: |
      What the claim's persistence costs is unmeasured. No villager ever slept — occupancy read zero
      in every capture, including through a full night — so whether a stale claim still functions as
      a bed for sleeping, breeding or golem spawning is not established here. The related reading
      that a village's breeding ceiling is its recorded bed count is *not* supported: villagers and
      POI entries move together because there is one entry per villager, which makes the comparison
      circular. This supersedes
      [[f:a-destroyed-bed-does-not-release-its-village-point-of-interest]], which made that mistake.
    backing: tested
    sources:
      - description: |
          The `beds` scenario captures the village records at four points — beds standing, beds just
          destroyed, a window with no beds, and beds rebuilt — parsed into
          evidence/minecraft/gameplay/village-structures-probe/records/beds/. Every villager's first
          claim slot holds the same coordinates in all four, and those coordinates fall on the grid
          the probe placed beds on (x = 149 + 3*col, z = 153 + 3*row about the arena centre), which
          is what identifies the slot as the bed claim.
      - run: village-structures-breed
        where: "`breed` — 5 villagers in a village of 30 beds, giving 5 POI entries rather than 30"
        quote: |
          village 10-breeding :: id=Overworld_0de543f0-9834-4571-9790-cfe3dd0e3c02 dwellers=5/0/0/0 poiEntries=5 poiInstances=5 poiNames={"villager":5} players=0 bounds=117,181,88,112,133,197
      - run: village-structures-wreck
        where: "`wreck` — the world with every village block destroyed"
        quote: |
          [2026-08-07 18:49:48:944 WARN] [Scripting] [vgvil] destroy :: destroyed=all counts={"beds":0,"occupied":0,"jobs":0,"bells":0}
