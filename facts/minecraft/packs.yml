version: "1"
facts:
  - id: ecosystem-models-one-pack-per-kind-per-project
    status: retired
    reason: stale
    claim: |
      Every pack config and build tool surveyed models a project as at most one pack of each kind.
      The Bedrock-OSS project config standard — shared by Regolith and bridge. — keys its `packs` map
      by pack type with one path each, both tools let a pack's path move while the pack-type keys
      stay fixed, and Microsoft's `@minecraft/core-build-tasks` merges every listed source folder
      into one `development_behavior_packs/<PROJECT_NAME>` directory. What no surveyed tool can
      express is two packs of the *same* kind in one project.
    backing: documented
    caveat: |
      The operative half of the claim — at most one pack of a *given* kind — is carried by the
      project-config-standard `packs` map and Regolith's `Packs` struct, each holding one path per
      pack type. The other two legs are weaker than they look: the bridge. quote counts pack *types*
      ("up to four different pack types"), not packs per type, and no quote here states that bridge.
      shares the Bedrock-OSS standard; the `core-build-tasks` merge argument needs
      `copyToBehaviorPacks` to be a list of folders, which the quoted call site does not show.
    sources:
      - url: https://github.com/Bedrock-OSS/project-config-standard
        where: README — the `packs` field of the config interface
        quote: |
          	/**
          	 * Maps the id of packs this project contains to a path relative to the config.json
          	 *
          	 * @example { "behaviorPack": "./BP", "resourcePack": "./RP" }
          	 */
          	packs: {
          		[
          			packId:
          				| 'behaviorPack'
          				| 'resourcePack'
          				| 'skinPack'
          				| 'worldTemplate'
          				| 'dataPack'
          		]: string
          	}
      - url: https://github.com/Bedrock-OSS/regolith/blob/main/regolith/config.go
        where: the `Packs` struct
        quote: |
          type Packs struct {
          	BehaviorFolder string `json:"behaviorPack,omitempty"`
          	ResourceFolder string `json:"resourcePack,omitempty"`
          }
      - url: https://bridge-core.app/extensions/misc/pack-types.html
        where: Pack Types — Basics
        quote: |
          Each bridge. project can contain up to four different pack types.
      - url: https://github.com/Mojang/minecraft-scripting-libraries/blob/main/tools/core-build-tasks/src/tasks/copy.ts
        where: the deploy pool path constants
        quote: |
          const BehaviorPacksPath = 'development_behavior_packs';
          const ResourcePacksPath = 'development_resource_packs';
      - url: https://github.com/Mojang/minecraft-scripting-libraries/blob/main/tools/core-build-tasks/src/tasks/copy.ts
        where: copyTask — every listed source folder copied into one per-project directory
        quote: |2
                  copyFiles(params.copyToBehaviorPacks, path.join(deploymentPath, BehaviorPacksPath, projectName));
                  copyFiles(params.copyToScripts, path.join(deploymentPath, BehaviorPacksPath, projectName, 'scripts'));

  - id: module-type-enumerations-disagree
    claim: |
      The set of module `type` values a manifest may declare is not enumerable from the format's own
      documentation. Microsoft's add-on manifest reference lists four — `resources`, `data`,
      `world_template`, `script`. Its Creator Tools manifest validator raises an error on an
      unrecognised type but names six, and says its list "include"s them rather than that they are the
      set. And the reference page's own example behavior-pack manifest declares a `client_data` module
      that appears in neither list. A kit validating a module type against any published enumeration
      would report a problem against Microsoft's own reference pack.
    backing: documented
    sources:
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: modules — type
        quote: |
          This is the type of the module. Can be any of the following: `resources`, `data`,
          `world_template` or `script`.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/mctoolsvalreference/chkmanif
        where: CHKMANIF109 — Invalid Module, severity Error
        quote: |
          A module has an unrecognized type. Valid module types include: persona\_piece,
          world\_template, skin\_pack, data, script, and resources.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: Examples — Behavior Pack, the second entry of its modules array
        quote: |
          {
                      "description": "Example client scripts module",
                      "type": "client_data",
                      "uuid": "c05a992e-482a-455f-898c-58bbb4975e47",
                      "version": [1, 0, 0]
                  }

  - id: manifest-declares-pack-identity-version-and-module-kinds
    claim: |
      A Bedrock add-on pack is defined by its own `manifest.json`: the header's `uuid` uniquely
      identifies the pack and the header's `version` is the pack version, while the `modules`
      array's `type` states what kind of pack it is — `data` for behavior content, `script` for
      scripting code, which is embedded within behavior packs, and `resources` for a resource
      pack. A pack's own content therefore carries what kind of content it holds, without reference
      to how it is stored or built.
    backing: documented
    sources:
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/manifestreference/packmanifestdocument
        where: opening paragraph — the root structure of a manifest.json
        quote: |
          The root structure of a manifest.json file that defines an add-on pack. Every behavior
          pack and resource pack requires a manifest with a unique UUID, version info, and module
          declarations. This is the entry point Minecraft uses to identify and load your content.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/manifestreference/packmanifestdocument
        where: 3.0.0.Module — what a module declares
        quote: |
          Declares a module within the pack. Modules define what the pack contains: 'data' for
          behavior packs, 'resources' for resource packs, or 'script' for packs with
          JavaScript/TypeScript code. Script modules require an entry point file path.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: Properties — header — uuid
        quote: |
          This is a special type of identifier that uniquely identifies this pack from any other
          pack. UUIDs are written in the format xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx where each x
          is a hexadecimal value (0-9 or a-f).
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: Properties — header — version, the full row including its Type column
        quote: |
          version | Vector [a, b, c] or SemVer String | This is the version of your pack in the
          format [majorVersion, minorVersion, revision]. The version number is used when importing
          a pack that has been imported before. The new pack will replace the old one if the
          version is higher, and ignored if it's the same or lower. In version 3, currently in
          preview, you must use a string for version.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: modules — type
        quote: |
          This is the type of the module. Can be any of the following: `resources`, `data`,
          `world_template` or `script`.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/bedrockserver/scripting
        where: '"Enable differentiated module permissions" — opening sentence'
        quote: |
          You can set different permissions for different references to scripts that are embedded
          as modules within behavior packs.

