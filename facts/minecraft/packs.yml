  - id: name-dependency-script-and-location-heuristics-misfire
    claim: |
      Detection rules keyed on a package's name, its dependencies, its scripts, or its position in
      the tree misclassify real workspaces. Scored against a 41-package monorepo holding two
      behavior packs, a dependency on the Minecraft scripting API also selects a shared library
      that scripts against that API without being a pack; the presence of build and watch scripts
      selects three unrelated packages; a package name matching `pack` selects a build config and
      misses both packs; and living under a `minecraft/` directory also selects a build config,
      the dev harness itself, and that same shared scripting library. A package.json marker field
      or pack keyword selects nothing at all, missing both packs. Other rules that read no manifest
      do score cleanly on this workspace, so what misfires is these signals, not manifest-blindness
      as such.
    backing: tested
    sources:
      - run: pack-detection-probe
        where: '"rules (selected / missed / false positives)" — the heuristic rules and the directory-location rule, with the packages each selects'
        quote: |
          [heuristic] any dependency on @minecraft/server
            selected(3): @twin-digital/hello-world, @twin-digital/mc-scripting-core, @twin-digital/village-guard
            missed: none
            false positives: @twin-digital/mc-scripting-core

          [heuristic] has both build and watch scripts
            selected(5): @twin-digital/bookify, @twin-digital/bookify-cli, @twin-digital/bookify-render-api, @twin-digital/hello-world, @twin-digital/village-guard
            missed: none
            false positives: @twin-digital/bookify, @twin-digital/bookify-cli, @twin-digital/bookify-render-api

          [heuristic] package.json keywords contain a pack keyword
            selected(0): (none)
            missed: @twin-digital/hello-world, @twin-digital/village-guard
            false positives: none

          [heuristic] explicit package.json marker field (minecraft/mcpack/bedrock key)
            selected(0): (none)
            missed: @twin-digital/hello-world, @twin-digital/village-guard
            false positives: none

          [heuristic] package name matches /pack/
            selected(1): @twin-digital/mc-pack-config
            missed: @twin-digital/hello-world, @twin-digital/village-guard
            false positives: @twin-digital/mc-pack-config

          [external] directory location under a minecraft/ folder
            selected(5): @twin-digital/dev-bedrock-server, @twin-digital/hello-world, @twin-digital/mc-pack-config, @twin-digital/mc-scripting-core, @twin-digital/village-guard
            missed: none
            false positives: @twin-digital/dev-bedrock-server, @twin-digital/mc-pack-config, @twin-digital/mc-scripting-core
      - run: pack-detection-probe
        where: '"rules (selected / missed / false positives)" — the three manifest-blind rules that score cleanly'
        quote: |
          [external] devDependency on the repo's shared pack build config
            selected(2): @twin-digital/hello-world, @twin-digital/village-guard
            missed: none
            false positives: none

          [external] a build-tool fragment the repo's sync tool writes
            selected(2): @twin-digital/hello-world, @twin-digital/village-guard
            missed: none
            false positives: none

          [external] the repo's release-assets script
            selected(2): @twin-digital/hello-world, @twin-digital/village-guard
            missed: none
            false positives: none
      - run: pack-detection-probe
        where: "\"rules that diverge from the format's own answer\" — the summary of each heuristic's error counts"
        quote: |2
            [heuristic] any dependency on @minecraft/server: missed=0 falsePositives=1
            [heuristic] has both build and watch scripts: missed=0 falsePositives=3
            [heuristic] package.json keywords contain a pack keyword: missed=2 falsePositives=0
            [heuristic] explicit package.json marker field (minecraft/mcpack/bedrock key): missed=2 falsePositives=0
            [heuristic] package name matches /pack/: missed=2 falsePositives=1
            [external] directory location under a minecraft/ folder: missed=0 falsePositives=3

  - id: content-independent-pack-heuristics-misfire
    status: retired
    reason: superseded
    superseded_by: name-dependency-script-and-location-heuristics-misfire
    claim: |
      Detection rules that do not read a pack's manifest misclassify real workspaces. Scored
      against a 41-package monorepo holding two behavior packs, a dependency on the Minecraft
      scripting API also selects a shared library that scripts against that API without being a
      pack; the presence of build and watch scripts selects three unrelated packages; and living
      under a `minecraft/` directory also selects a build config and the dev harness itself. A
      package.json marker field or pack keyword selects nothing, because no package carries one
      until every pack is edited to add it.
    backing: tested
    sources:
      - run: pack-detection-probe
        where: "\"rules that diverge from the format's own answer\" — the summary of each heuristic's error counts"
        quote: |2
            [heuristic] any dependency on @minecraft/server: missed=0 falsePositives=1
            [heuristic] has both build and watch scripts: missed=0 falsePositives=3
            [heuristic] package.json keywords contain a pack keyword: missed=2 falsePositives=0
            [heuristic] explicit package.json marker field (minecraft/mcpack/bedrock key): missed=2 falsePositives=0
            [heuristic] package name matches /pack/: missed=2 falsePositives=1
            [external] directory location under a minecraft/ folder: missed=0 falsePositives=3

  - id: pack-is-a-directory-with-a-manifest-at-its-root
    claim: |
      A Bedrock pack is a directory whose only required file is `manifest.json`, sitting at that
      directory's root; everything else is optional content in format-named subfolders. A directory
      holding a `manifest.json` at its root is therefore the format's own definition of a pack, with
      nothing outside the directory needed to recognise it.
    backing: documented
    sources:
      - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/comprehensivepackcontents
        where: intro, before "Comprehensive Behavior Pack"
        quote: |
          The only required file in either type of pack is manifest.json.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/behaviorpackfromscratch
        where: opening paragraph
        quote: |
          A behavior pack is a folder structure that contains files that drive entity behaviors,
          loot drops, spawn rules, items, recipes, and trade tables.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/documents/behaviorpackfromscratch
        where: '"Create the manifest file", step 1 — where the manifest goes'
        quote: |
          Create a new document in your My_BEHAVIOR_Pack folder and name it manifest.json.

  - id: pack-dependency-entries-name-a-uuid-or-a-module-name-plus-a-version
    claim: |
      A pack declares what it requires in its manifest's `dependencies` array. An entry carries a
      `version` — the specific version depended on, which should match the depended-on pack's own,
      written as a `[a, b, c]` vector or a SemVer string — alongside either a `uuid`, which must be
      the exact header uuid of the depended-on pack, or a `module_name` naming a built-in scripting
      module such as `@minecraft/server`. The documented behavior-pack manifest shows both shapes in
      one array, a uuid entry and a `module_name` entry with no uuid, so a dependency entry does not
      always name another pack.
    backing: documented
    caveat: |
      The sources define the `uuid`, `module_name`, and `version` fields and show one entry of each
      shape. None of them states that an entry must carry exactly one of `uuid` and `module_name`, so
      an entry carrying neither, or both, is outside what this evidence covers.
    sources:
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: Properties table — dependencies row
        quote: |
          Section containing definitions for any other packs that are required in order for this
          manifest.json file to work.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: dependencies table — uuid row
        quote: |
          This is the unique identifier of the pack that this pack depends on. It needs to be the
          exact same UUID that the pack has defined in the header section of its manifest file.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: dependencies table — version row, Type and Description cells
        quote: |
          Vector [a, b, c] or SemVer String | This is the specific version of the pack that your
          pack depends on. Should match the version the other pack has in its manifest file.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: dependencies table — module_name row
        quote: |
          For dependencies on built-in scripting modules, contains the name of the module. (for
          example, @minecraft/server)
      - url: https://learn.microsoft.com/en-us/minecraft/creator/reference/content/addonsreference/packmanifest
        where: Examples — Behavior Pack manifest, `dependencies` array
        quote: |
          "dependencies": [
              {
                  "uuid": "66c6e9a8-3093-462a-9c36-dbb052165822",
                  "version": [1, 0, 0]
              },
              {
                  "module_name": "@minecraft/server",
                  "version": "1.9.0"
              }
          ],

  - id: an-entity-type-resolves-for-a-script-in-any-other-loaded-pack
    claim: |
      An entity type one behavior pack defines is resolvable from a script in a different behavior
      pack, and a declared manifest dependency is not what makes it so. On Bedrock 1.26.43.1 a
      consumer pack's script spawned the provider pack's `probe:actor` in three arrangements — the
      dependency declared with both packs listed active, no dependency declared at all, and the
      dependency declared with the provider absent from the world's activation list — and all three
      read identically: `spawnEntity` returned an entity whose `typeId` was `probe:actor`, the
      dimension then held one of them, a `summon` of the same identifier succeeded, and the count
      read two. With the provider pack not in the pool at all the same calls fail at the identifier
      rather than anywhere else. What the resolution turns on is the defining pack being loaded, and
      nothing else — so an addon may hold its entity definitions in one pack and spawn them from
      another.
    backing: tested
    caveat: |
      Spawning needs the target location in a loaded, ticking chunk, which on a server with no
      player connected means a ticking area has to be created first and given time to settle: before
      that, every arrangement fails alike with a chunk error that says nothing about the identifier.
      The probe covers behavior packs only; nothing here observes a resource pack, and nothing
      observes rendering.
    sources:
      - run: cross-pack-probe
        where: scenario q1nodep — the consumer declares no dependency on the provider
        quote: |
          [2026-08-10 01:40:18:836 WARN] [Scripting] PROBE q1-nodep spawnEntity=ok
          [2026-08-10 01:40:18:836 WARN] [Scripting] PROBE q1-nodep spawned-typeId=probe:actor
          [2026-08-10 01:40:18:836 WARN] [Scripting] PROBE q1-nodep count-after-spawn=1
          [2026-08-10 01:40:18:836 WARN] [Scripting] PROBE q1-nodep summon-command=ok
          [2026-08-10 01:40:18:836 WARN] [Scripting] PROBE q1-nodep count-after-summon=2
      - run: cross-pack-probe
        where: scenario q1missing — the provider pack is absent from the pool
        quote: |
          [2026-08-10 01:41:39:719 WARN] [Scripting] PROBE q1-dep spawnEntity=THREW
          [2026-08-10 01:41:39:719 WARN] [Scripting] PROBE q1-dep spawnEntity-error=Invalid value passed to argument (0). 'probe:actor' is not a valid entity type.
          [2026-08-10 01:41:39:719 WARN] [Scripting] PROBE q1-dep count-after-spawn=0

  - id: a-script-module-does-not-resolve-across-packs
    claim: |
      No import reaches a module held in another behavior pack. Four static specifier shapes — a
      pool-relative `../../<uuid>/scripts/lib.js`, a `../../../development_behavior_packs/<uuid>/…`
      walk, an absolute `/development_behavior_packs/<uuid>/…`, and a bare `probe-provider/lib.js` —
      each fail at load with `ReferenceError: Import [<specifier>] not found.`, after which the
      importing pack's entry reports `ran with error` and none of its code runs. A dynamic `import()`
      of the pool-relative shape is accepted syntactically and its promise rejects with the same
      message. Every importing pack declared a manifest dependency on the pack holding the module, so
      a declared dependency opens no module path. Code shared between packs is therefore shared at
      build time or not at all.
    backing: tested
    sources:
      - run: cross-pack-probe
        where: scenario q2 — the four static specifier shapes, one per pack
        quote: |
          [2026-08-10 01:42:08:139 ERROR] [Scripting] [probe importer rel-pool] ReferenceError: Import [../../4a1f0000-0000-4000-8000-000000000001/scripts/lib.js] not found.
          [2026-08-10 01:42:08:139 ERROR] [Scripting] [probe importer rel-up] ReferenceError: Import [../../../development_behavior_packs/4a1f0000-0000-4000-8000-000000000001/scripts/lib.js] not found.
          [2026-08-10 01:42:08:139 ERROR] [Scripting] [probe importer abs-pool] ReferenceError: Import [/development_behavior_packs/4a1f0000-0000-4000-8000-000000000001/scripts/lib.js] not found.
          [2026-08-10 01:42:08:139 ERROR] [Scripting] [probe importer bare] ReferenceError: Import [probe-provider/lib.js] not found.
      - run: cross-pack-probe
        where: scenario q2 — the importing pack's entry after the failed resolution
        quote: |
          [2026-08-10 01:42:08:149 ERROR] [Scripting] Plugin [probe importer rel-pool - 1.0.0] - [main.js] ran with error: [ReferenceError: Import [../../4a1f0000-0000-4000-8000-000000000001/scripts/lib.js] not found.]
      - run: cross-pack-probe
        where: scenario q2 — the dynamic import's rejection
        quote: |
          [2026-08-10 01:42:12:085 WARN] [Scripting] PROBE q2-dynamic dynamic-rejected=Import (../../4a1f0000-0000-4000-8000-000000000001/scripts/lib.js] not found.

  - id: a-declared-pack-dependency-activates-the-depended-on-pack
    claim: |
      A behavior pack a world activates brings the packs its manifest depends on into the pack stack
      with it, without their being listed. A world whose activation list named only the consumer
      loaded the consumer at stack position 00 and the provider at 01, the provider reaching the
      stack through the consumer's `dependencies` entry alone, and the provider's own script then
      evaluated. The pulled-in pack lands after the pack that named it: a world listing both
      explicitly, provider first, loaded them in that listed order instead.
    backing: tested
    caveat: |
      The depended-on pack has to be present in the server's pack pool for this to happen — a
      dependency entry does not fetch or install anything
      [[f:an-unsatisfiable-pack-dependency-is-not-enforced-at-load]].
    sources:
      - run: cross-pack-probe
        where: scenario q1pull — activation list naming only the consumer, and the resulting stack
        quote: |
          activation list: [{"pack_id":"4a1f0000-0000-4000-8000-000000000002","version":[1,0,0]}]
      - run: cross-pack-probe
        where: scenario q1pull — the stack the unlisted dependency reached
        quote: |
          [2026-08-10 01:40:45:777 INFO] Pack Stack - [00] probe consumer dep (id: 4a1f0000-0000-4000-8000-000000000002, version: 1.0.0) @ development_behavior_packs/4a1f0000-0000-4000-8000-000000000002
          [2026-08-10 01:40:45:777 INFO] Pack Stack - [01] probe provider (id: 4a1f0000-0000-4000-8000-000000000001, version: 1.0.0) @ development_behavior_packs/4a1f0000-0000-4000-8000-000000000001
      - run: cross-pack-probe
        where: scenario q1dep — both packs listed, provider first, loaded in the listed order
        quote: |
          [2026-08-10 01:39:24:621 INFO] Pack Stack - [00] probe provider (id: 4a1f0000-0000-4000-8000-000000000001, version: 1.0.0) @ development_behavior_packs/4a1f0000-0000-4000-8000-000000000001
          [2026-08-10 01:39:24:621 INFO] Pack Stack - [01] probe consumer dep (id: 4a1f0000-0000-4000-8000-000000000002, version: 1.0.0) @ development_behavior_packs/4a1f0000-0000-4000-8000-000000000002

  - id: an-unsatisfiable-pack-dependency-is-not-enforced-at-load
    claim: |
      A behavior pack whose manifest depends on a pack that is not present loads and runs regardless.
      With the depended-on pack absent from the pool, the dependent still entered the stack at
      position 00, its script evaluated, and its delayed work ran to completion; nothing refused the
      load and no dependency error appeared in the log. The only trace of the absence was that the
      missing pack's entity type would not resolve. A pack therefore cannot treat its manifest as a
      guarantee that what it depends on is there, and has to detect the absence itself at run time.
    backing: tested
    sources:
