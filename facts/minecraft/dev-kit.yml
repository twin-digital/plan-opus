# What mc-dev-kit commits to, as its published increments state it — the interface a design that
# builds on the kit leans on. Each fact is sourced by repo-relative url and verbatim quote to the
# product's requirements. All are PROPOSED by an agent and await owner review.

- id: dev-kit-library-is-published-as-mc-dev-kit
  claim: |
    The npm package holding the dev-kit library is named `@twin-digital/mc-dev-kit`, so anything
    shipping in that same distributable is imported from that package name.
  backing: documented
  sources:
    - url: products/mc-dev-kit/increments/001/requirements.yaml
      where: r-jvb29tpu — the library name
      quote: |
        the name of the npm package containing the dev-kit library is `@twin-digital/mc-dev-kit`

- id: dev-kit-discovery-returns-the-whole-workspace-set-unfiltered
  claim: |
    A discovery call passing no filter returns every pack in the workspace, as one flat list. A
    filter narrows that list by the owning npm package name, the pack name, the pack uuid, or the
    entry status, matched exactly and conjunctively. So a consumer needing both its own package's
    packs and the workspace's other packs reads the set once unfiltered and selects within it,
    rather than calling twice.
  backing: documented
  sources:
    - url: products/mc-dev-kit/increments/001/requirements.yaml
      where: r-7v7o1jy8 — pack search, the criteria a search takes and how they combine
      quote: |
        the kit allows users to search for packs using the following criteria:

          - npm package name
          - pack name
          - pack uuid
          - entry status

        Every criterion matches on the exact name, identity, or status; no substring or
        case-insensitive matching. Where more than one criterion is given, an entry matches only if it
        satisfies all of them. No filter is applied by default: a search that does not constrain status
        returns every pack regardless of status.
    - url: products/mc-dev-kit/increments/001/requirements.yaml
      where: r-co6glnme — pack discovery, the single flat list
      quote: |
        Every discovered pack is returned as one entry in a single flat list, so that list is the whole
        of what was found: nothing is reported in one place and omitted from another.

- id: dev-kit-completes-a-workspace-dependency-version-from-the-owning-package
  claim: |
    A source manifest leaves the version off a `dependencies` entry naming a pack in the same
    workspace, and the kit completes it from that pack's owning package's `package.json` version.
    A pack's completed manifest therefore changes whenever a `package.json` other than its own is
    edited, so anything that keeps a completed manifest current reads those files too.
  backing: documented
  sources:
    - url: products/mc-dev-kit/increments/001/requirements.yaml
      where: r-11l92k9x — kit completes partial source manifests, how a workspace dependency's version is populated
      quote: |
        a `dependencies` entry whose `uuid` names a pack within the same workspace has its `version`
        set to that pack's owning package's `package.json` version, using the same parsing and error
        reporting rules described for `header.version`

- id: pack-sources-sit-at-fixed-kind-named-directories
  claim: |
    A workspace package holds its packs at fixed paths: `behavior_pack/manifest.json` and
    `resource_pack/manifest.json` within the package. The presence of those source manifests is the
    whole membership test, so a package structurally holds at most one behavior pack and at most one
    resource pack, and a package holding two of a kind is out of scope. A tool working from a package
    directory can therefore find that package's pack sources without a marker field, a central list,
    or a directory walk.
  backing: documented
  sources:
    - url: products/mc-dev-kit/increments/001/requirements.yaml
      where: r-zcdmh9p6 — membership from source manifest presence
      quote: |
        a workspace package is a pack-bearing package when its source holds `behavior_pack/manifest.json`
        or `resource_pack/manifest.json`; presence of those source manifests is the whole membership
        test. Both kinds are discovered. No marker field, keyword, or central list is required, and
        adding, removing, or renaming a pack needs no edit anywhere but the package itself. Note that
        this makes it structurally impossible for a workspace package to hold more than one behavior pack
        or more than one resource pack. A package holding two packs of the same kind is out of scope.
