  - id: effect-readd-not-unconditional
    status: retired
    reason: superseded
    superseded_by: effect-replacement-rule-observed
    claim: |
      `addEffect` on an effect already present does not replace unconditionally: re-adding
      `speed` at 100 ticks/amplifier 0 over an active 600 ticks/amplifier 2 left the original
      in place (read back one tick later as duration=599 amplifier=2, the original ticking
      down). The full replacement rule — which combinations of amplifier and duration do take —
      is unmeasured.
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`effect-replace-unconditional` probe lines"
        quote: |
          [2026-07-24 18:56:30.406] [mctest] effect-replace-unconditional :: after-lower-readd duration=599 amplifier=2
  - id: invalidation-guards-observed
    status: retired
    reason: superseded
    superseded_by: invalidation-guard-list-complete
    claim: |
      On an invalidated entity the engine keeps `id`, `typeId`, `isValid`, and
      `scoreboardIdentity` answering, and throws `InvalidEntityError` from annotated members
      (`hasTag`, `getComponent`, `location`) — but also from `nameTag` and `isSneaking`, which
      carry no `@throws` annotation at all. The declaration-derived never-throw set is
      therefore wrong for those two members: annotations under-report the guard.
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`invalidation-nonuniformity-in-engine` probe lines"
        quote: |
          [2026-07-24 18:56:31.907] [mctest] invalidation-nonuniformity-in-engine :: id ok value=string:-47244640208
          [2026-07-24 18:56:31.907] [mctest] invalidation-nonuniformity-in-engine :: typeId ok value=string:minecraft:sheep
          [2026-07-24 18:56:31.907] [mctest] invalidation-nonuniformity-in-engine :: isValid ok value=boolean:false
          [2026-07-24 18:56:31.907] [mctest] invalidation-nonuniformity-in-engine :: nameTag threw name=InvalidEntityError ctor=InvalidEntityError instanceofInvalidEntityError=true message="Failed to set property 'nameTag' due to Entity being invalid (has the Entity been removed?)."
          [2026-07-24 18:56:31.907] [mctest] invalidation-nonuniformity-in-engine :: isSneaking threw name=InvalidEntityError ctor=InvalidEntityError instanceofInvalidEntityError=true message="Failed to get property 'isSneaking' due to Entity being invalid (has the Entity been removed?)."
          [2026-07-24 18:56:31.907] [mctest] invalidation-nonuniformity-in-engine :: scoreboardIdentity ok value=undefined
          [2026-07-24 18:56:31.907] [mctest] invalidation-nonuniformity-in-engine :: hasTag threw name=InvalidEntityError ctor=InvalidEntityError instanceofInvalidEntityError=true message="Failed to call function 'hasTag' due to Entity being invalid (has the Entity been removed?)."
          [2026-07-24 18:56:31.907] [mctest] invalidation-nonuniformity-in-engine :: getComponent threw name=InvalidEntityError ctor=InvalidEntityError instanceofInvalidEntityError=true message="Failed to call function 'getComponent' due to Entity being invalid (has the Entity been removed?)."
          [2026-07-24 18:56:31.907] [mctest] invalidation-nonuniformity-in-engine :: location threw name=InvalidEntityError ctor=InvalidEntityError instanceofInvalidEntityError=true message="Failed to get property 'location' due to Entity being invalid (has the Entity been removed?)."
  - id: invalidation-throws-non-uniformly
    status: retired
    reason: superseded
    superseded_by: invalidation-guard-list-complete
    caveat: |
      Disproven in part by the engine run: `nameTag` throws InvalidEntityError rather than
      staying readable. The component half is carried by attribute-guard-classes-observed.
    claim: |
      Once an entity reference becomes invalid (unloaded or removed), member access throws
      `InvalidEntityError` — but not uniformly. `id`, `typeId`, `isValid`, and `nameTag` stay
      readable; `isValid` never throws, as it is the safe validity probe. A component follows its
      owner: `Component.isValid` and `typeId` stay readable while `EntityComponent.entity` throws.
    backing: documented
    sources:
      - description: |
          @minecraft/server 2.8.0 index.d.ts: nearly every Entity member carries an
          `@throws … InvalidEntityError` TSDoc annotation, while id, typeId, isValid, and nameTag
          carry none. The Component / EntityComponent declarations show the same split — isValid
          and typeId unannotated, entity annotated `@throws InvalidEntityError`.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
        where: Properties — id, typeId, isValid
        quote: |
          This property is accessible even if @minecraft/server.Entity.isValid is false.

  - id: invalidation-throws-are-mechanically-derivable
    status: retired
    reason: superseded
