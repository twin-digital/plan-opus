  - id: throwing-handler-is-isolated
    claim: |
      A subscriber that throws is isolated in all three directions: the throw does not reach the
      call that caused the event, the other subscribers on the same signal still run, and the later
      events of the cascade still fire. Observed on `entityHurt` with the thrower first and with
      the thrower last, 3/3 runs — the engine absorbs the error rather than surfacing it at the call
      site. The control case pins the ordering independently: `applyDamage` returns before any
      after-event handler runs.
    backing: tested
    sources:
      - description: |
          The mctest4 damage-threshold pack subscribes two handlers to entityHurt, has one of them
          throw deliberately, and records whether the throw reaches the caller, whether the sibling
