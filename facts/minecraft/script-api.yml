- id: fresh-health-component-values-populated
  claim: |
    A freshly spawned entity's health component answers all four of its values before any
    write: on a sheep, currentValue 8, defaultValue 8, effectiveMin 0, effectiveMax 8. No
    attribute value rests undefined awaiting a write.
