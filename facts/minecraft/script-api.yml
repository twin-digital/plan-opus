        quote: "[2026-08-07 00:55:43:891 WARN] [Scripting] [vggap] zero-clamp :: [cancel] before-events=33 after-events=0 health(number:20 -> number:20) health-lost=number:0 subject-alive=true samples=400 peak-speed-overall=0.269 per-hit=[entityAttack@3:rest=0.108->peak=0.096, entityAttack@3:rest=0.108->peak=0.096, entityAttack@3:rest=0.056->peak=0.2, entityAttack@3:rest=0.1->peak=0.231, entityAttack@3:rest=0.14->peak=0.231, entityAttack@3:rest=0.01->peak=0.123, entityAttack@3:rest=0->peak=0, entityAttack@3:rest=0.102->peak=0.008] delivered=[entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3] verdict=SEE-NUMBERS"

  - id: drowning-and-suffocation-raise-the-before-event
    claim: |
      `world.beforeEvents.entityHurt` is raised for drowning and for suffocation, each carrying its
      own `damageSource.cause` — `drowning` and `suffocation` — at 2 damage a tick-group. Both were
      driven on a villager held in a sealed one-block stone shaft, flooded and capped for the first
      and with its head block made solid for the second.

      This closes the two routes r-pe87rfqq names that
      [[f:entity-hurt-before-event-sees-engine-dealt-damage]] left open: its caveat records
      suffocation as dealing no health in any run, and drowning was never attempted. Both readings
      were the rig — a villager walks out of an open arena before either route reaches it.
    backing: tested
    sources:
      - run: gap-probe-run
        where: "`water-and-walls` — drowning, observed without a write"
        quote: "[2026-08-07 01:27:16:620 WARN] [Scripting] [vggap] water-and-walls :: [drowning/observe] cell-block=string:minecraft:water recentred=0 health(number:20 -> undefined) health-lost=undefined died=1 subject-alive=false before-events=10 after-events=10 delivered=[drowning@2, drowning@2, drowning@2, drowning@2, drowning@2, drowning@2, drowning@2, drowning@2, drowning@2, drowning@2] verdict=BEFORE-EVENT-RAISED"
