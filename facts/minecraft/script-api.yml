- id: kill-no-health-behaviour
  claim: |
    `kill()` on an entity that has no health component (an arrow) returns true and fires only
    `entityDie` with cause `selfDestruct` — no `entityHurt`, no `entityHealthChanged` — and the
    entity reads invalid synchronously, in the same statement sequence as the `kill()` call and
    before the next tick, staying invalid through at least tick+5. A killed mob's corpse by
    contrast stays valid for several ticks: post-death validity is not a uniform grace period;
    despawn timing varies by entity.
  backing: tested
  sources:
    - run: engine-deep-probe-run
      where: "`kill-no-health-and-repeat` probe lines"
      quote: |
        [2026-07-24 19:26:01.776] [mctest] kill-no-health-and-repeat :: arrow healthComponent=undefined kill ok value=boolean:true sequence=[die(cause=selfDestruct)] stillValid=false
    - run: resting-state-probe-run
      where: "`kill-no-health-invalidation-timing` probe lines"
      quote: |
        [2026-07-25 02:26:22.867] [mctest] kill-no-health-invalidation-timing :: before-kill isValid=true healthComponent=undefined
        [2026-07-25 02:26:22.867] [mctest] kill-no-health-invalidation-timing :: kill ok value=boolean:true synchronous-isValid ok value=boolean:false
        [2026-07-25 02:26:22.912] [mctest] kill-no-health-invalidation-timing :: tick+1 isValid ok value=boolean:false
        [2026-07-25 02:26:22.967] [mctest] kill-no-health-invalidation-timing :: tick+2 isValid ok value=boolean:false
        [2026-07-25 02:26:23.012] [mctest] kill-no-health-invalidation-timing :: tick+3 isValid ok value=boolean:false
        [2026-07-25 02:26:23.062] [mctest] kill-no-health-invalidation-timing :: tick+4 isValid ok value=boolean:false
        [2026-07-25 02:26:23.117] [mctest] kill-no-health-invalidation-timing :: tick+5 isValid ok value=boolean:false
- id: after-event-deferral-subtick
  claim: |
    An after-event is deferred past the mutating call's return but delivered within the same
    game tick: applyDamage was called, returned, and its entityHurt handler ran all at
    `system.currentTick` 72309 (delay 0 ticks), while no event had been delivered before
    applyDamage returned. Delivery is same-tick-deferred, neither synchronous within the call
    nor postponed to a later tick.
  backing: tested
  sources:
    - run: engine-deep-probe-run
      where: "`after-event-tick-delay` probe lines"
      quote: |
        [2026-07-24 19:26:02.171] [mctest] after-event-tick-delay :: called-at=72309 returned-at=72309 delivered-at=72309 delay-ticks=0
# Facts from the resting-state run: what a freshly created engine object already holds before
# any test writes to it.

- id: fresh-entity-is-never-component-empty
  claim: |
    A freshly spawned entity always arrives carrying components — every type tried reported
    `zeroComponents=false`, with a floor of one: sheep 14, armor_stand 5, arrow 1
    (`minecraft:projectile`), xp_orb 1 (`minecraft:type_family`). The set is type-dependent
    rather than a shared baseline plus extras: a connected player carries 16 components, seven
    of which no sheep has, while the sheep carries five the player lacks. There is no empty or
    common starting set an engine entity rests at.
