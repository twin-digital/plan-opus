  - id: unbound-native-method-raises-reference-error
    claim: |
      A native `Entity` method invoked without its receiver — `const fn = e.kill; fn()` rather than
      `fn.call(e)` — raises a `ReferenceError` reading
      `Native function [Entity::<name>] object bound to prototype does not exist.`, not the
      illegal-invocation `TypeError` such a call raises on ordinary host objects. It is observed on
      all 14 members probed, and `instanceofInvalidEntityError` is false on every one, so it is
      cleanly distinguishable from the validity guard firing.
    backing: tested
    sources:
      - description: |
          The mctest6 access-guard pack records the bound and the unbound invocation on the same case
          line, so the receiver-less failure cannot be mistaken for a guard throw. 14/14 in 3/3 runs.
      - run: access-guard-probe-run
        where: Raw log — mctest6:access run 1, the [2-access-then-call] kill line carrying both invocations
        quote: |
          [2026-07-28 04:31:43.285] [mctest] access-versus-call :: [2-access-then-call] kill subject=-120259084282 access ok typeof=function value=function(name="" length=0) then fn.call(subject, ) threw name=InvalidEntityError ctor=InvalidEntityError instanceofInvalidEntityError=true message="Failed to call function 'kill' due to Entity being invalid (has the Entity been removed?)." unbound fn(...) threw name=ReferenceError ctor=ReferenceError instanceofInvalidEntityError=false message="Native function [Entity::kill] object bound to prototype does not exist." verdict=ACCESS-THEN-CALL-THREW-INVALID-ENTITY


  - id: entity-shape-is-identical-valid-or-invalid
    claim: |
      Every structural read a pack could use for feature detection answers identically on a valid
      `Entity` and on one invalidated by `remove()`. `'teleport' in entity` and
      `'nameTag' in entity` are `true` and `'notAMember'` is `false`; `typeof entity.teleport` is
      `"function"` and `typeof entity.notAMember` is `"undefined"`; `instanceof Entity` and
      `instanceof Object` are true and `instanceof Player` false; `constructor.name` is `"Entity"`.
      A real `Entity` carries exactly **two own enumerable properties, `typeId` and `id`**, so
      `Object.keys` and `getOwnPropertyNames` both return `["typeId", "id"]` and
      `JSON.stringify` yields `{"typeId":…,"id":…}`, while `for-in` walks 62 keys down the
      prototype chain. Invalidity is therefore undetectable structurally: a pack must read
      `isValid` or call something and catch.
    backing: tested
    sources:
      - description: |
          The mctest6 access-guard pack runs the same block of structural reads against a live control
          and an invalidated subject in one pass, reporting
          `valid-and-invalid-read-identically=true`. Identical in 3/3 runs. JSON.stringify succeeds
          on the invalidated entity precisely because the two properties it serialises are among the
          three that survive invalidation.
