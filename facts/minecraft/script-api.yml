  - id: handler-written-effect-duration-is-validated-separately
    claim: |
      A value a before-event handler writes to `EffectAddBeforeEvent.duration` is validated by a
      different path from `addEffect`'s own duration argument, and the two disagree. The write is
      truncated toward zero: 2.5 produces an effect of duration 2, and 300.7 one of 300. A written
      value at or below zero produces no effect at all — `addEffect` returns `undefined` and nothing
      is attached — for 0, −1 and −400 alike. A written value above the maximum is *clamped* to
      20000000 rather than refused, at 20000001 and at 100000000 alike, so the whole tested band above
      the maximum lands on the same value. `NaN` and `Infinity` are rejected by the assignment
      itself, which throws a `TypeError` reading
      `NaN value is not supported. Function return value expected type: number`, so the field keeps
      the duration the caller requested and that is what the resulting effect carries.

      The contrast with the call argument is the point. `addEffect`'s own duration argument rejects 0
      and 20000001 with `ArgumentOutOfBoundsError` and clamps nothing
      [[f:addeffect-argument-bounds-observed]]. Both of those values reach an effect through the field
      write instead — one silently dropping the add, the other landing at the maximum.
    backing: tested
    sources:
      - description: |
          The mctest8 handlerwrite set drives 11 addEffect calls at a requested duration of 400, each
          with a before-event handler writing a different value to EffectAddBeforeEvent.duration, and
          reads the effect back immediately and two ticks later. Every case reports handler-ran
          separately from the readback and all 11 read handler-ran=true. The pack was run by the
          design's owner, not by the author of this fact. Identical in 3/3 runs. Each case line's
          `verdict=` is the probe's own label, derived from the value written rather than from the
          readback in the same line; where the two differ — above-max is labelled
          WRITE-TOOK-AS-WRITTEN-20000001 while reading back duration=20000000 — this fact follows the
          readback, in all three runs.
      - run: arity-expiry-and-filter-probe-run
        where: Raw logs — mctest8:handlerwrite, handlerwrite run 1, the control, the at-or-below-zero cases and the truncation cases
        quote: |
          [2026-07-29 12:51:16.168] [mctest] out-of-range-duration-write :: [control-in-range] subject=-141733920740 requested=400 handler-writes-duration=300 truncated-toward-zero=300 handler-ran=true addEffect ok value=object(Effect) returned-effect=true immediate(present=true duration=300 amplifier=2) after-2-ticks(present=true duration=298 amplifier=2) spec-predicts=300 matches-spec=true verdict=WRITE-TOOK-AS-WRITTEN-300
          [2026-07-29 12:51:16.168] [mctest] out-of-range-duration-write :: [control-in-range] handler-notes=[handler-entered duration-as-delivered=400 | wrote duration=300 readback-in-handler=300]
          [2026-07-29 12:51:16.368] [mctest] out-of-range-duration-write :: [zero] subject=-141733920739 requested=400 handler-writes-duration=0 truncated-toward-zero=0 handler-ran=true addEffect ok value=undefined returned-effect=false immediate(present=false duration=undefined amplifier=undefined) after-2-ticks(present=false duration=undefined amplifier=undefined) spec-predicts="NO-EFFECT" matches-spec=true verdict=NO-EFFECT
