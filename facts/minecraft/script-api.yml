- id: world-resting-state-observed
  claim: |
    A world with no one connected answers every top-level member: `beforeEvents`,
    `afterEvents`, `scoreboard`, and `gameRules` are objects, `isHardcore` is false, and `seed`
    is a *string* (not a number). `afterEvents` exposes 55 event signals and `beforeEvents` 13.
    Its collections are genuinely empty, not absent — `scoreboard.getObjectives()` and
    `getAllPlayers()` both length 0 — so an empty collection is a real resting state for a
    world rather than a sign of an unconfigured object.
  backing: tested
  sources:
    - run: resting-state-probe-run
      where: "`resting-world-fields` probe lines"
      quote: |
        [2026-07-25 02:21:09.017] [mctest] resting-world-fields :: beforeEvents ok value=object(WorldBeforeEvents)
