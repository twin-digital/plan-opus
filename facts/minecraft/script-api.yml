- id: invalidation-guards-observed
  status: retired
  reason: superseded
  superseded_by: invalidation-guard-list-complete
  claim: |
    On an invalidated entity the engine keeps `id`, `typeId`, `isValid`, and
    `scoreboardIdentity` answering, and throws `InvalidEntityError` from annotated members
    (`hasTag`, `getComponent`, `location`) — but also from `nameTag` and `isSneaking`, which
    carry no `@throws` annotation at all. The declaration-derived never-throw set is
    therefore wrong for those two members: annotations under-report the guard.
  backing: tested
  sources:
    - run: engine-probe-run
      where: "`invalidation-nonuniformity-in-engine` probe lines"
