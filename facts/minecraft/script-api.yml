  - id: effect-replacement-compares-remaining-duration
    claim: |
      The duration half of the replacement rule compares against the duration *remaining*, not the
      duration originally applied. Over a base of amplifier 1 / duration 400 decayed 150 ticks to 250
      remaining, a re-add at duration 320 — longer than the 250 remaining, shorter than the 400
      applied — replaces and reads back exactly 320, at equal amplifier and at higher amplifier, in
      3/3 runs. Duration decays one per tick (`decayPerTick=1` in all 11 cases of all 3 runs).

      The reading rests on those six equal-amplifier and higher-amplifier cases only. The three
      lower-amplifier cases in the same runs carry a probe-emitted `verdict=ORIGINAL-APPLIED-BASIS`
      label that is not evidence about the basis: a lower amplifier never replaces whatever the
      duration, so the amplifier rule rejects the re-add before any duration comparison happens, and
      those rows are equally consistent with either basis. The two `verdict=anchor` cases read
      `strictly-between-remaining-and-applied=false` by construction — they are the 200 and 500
      controls placed deliberately outside the discriminating band.
    backing: tested
    sources:
      - description: |
          The guard-and-effect probe pack drives a real Bedrock dedicated server (1.26.31.1,
          @minecraft/server 2.8.0): it applies amplifier 1 / duration 400, waits 150 ticks, re-applies
          duration 320 at a lower, equal and higher amplifier, and reads the effect back, with 200 and
          500 re-applications as anchors. Duration 320 lies strictly between the remaining 250 and the
          applied 400, so the two candidate rules predict different read-backs. Three runs, identical
          case for case.
      - run: guard-and-effect-probe-run
        where: Raw logs — mctest3:effects, Effects run 1, the equal-amp/between #1 case
        quote: |
          [2026-07-27 12:45:34.346] [mctest] effect-duration-basis :: [equal-amp/between #1] applied(amp1,dur400) waited=150ticks remaining=250 remainingAmp=1 decayPerTick=1 reapply(amp1,dur320) strictly-between-remaining-and-applied=true -> readback(amp1,dur320) matches=the-reapplied-value verdict=REMAINING-BASIS (the re-add was treated as longer, so the comparison is against the duration remaining)
      - run: guard-and-effect-probe-run
        where: Raw logs — mctest3:effects, Effects run 1, the higher-amp/between #1 case
        quote: |
          [2026-07-27 12:45:57.441] [mctest] effect-duration-basis :: [higher-amp/between #1] applied(amp1,dur400) waited=150ticks remaining=250 remainingAmp=1 decayPerTick=1 reapply(amp2,dur320) strictly-between-remaining-and-applied=true -> readback(amp2,dur320) matches=the-reapplied-value verdict=REMAINING-BASIS (the re-add was treated as longer, so the comparison is against the duration remaining)

  # Retired: superseded by the deep-run measurements. Kept for the record.


  # Facts from the mctest4 damage-threshold and mctest5 return-value packs (Bedrock 1.26.31.1,
  # @minecraft/server 2.8.0). Both packs were run by the design's owner, not by the author of these
  # facts; every source below says so, and n=3 throughout.

  - id: cancelled-call-return-values-observed
    claim: |
      Cancelling a before-event gates the action on every surface where the question can be asked,
      but the three calls do not agree on what they then return. `entity.applyDamage`,
      `entity.addEffect` and `dimension.createExplosion` are the complete set of calls that are
      script-initiable, carry a cancellable before-event, and return non-void. Cancelled,
      `applyDamage` returns `true` while dealing no damage, `addEffect` returns `undefined`, and
      `createExplosion` returns `false`. `applyDamage` is the sole surface whose return says the
      action happened when it did not, so this is a per-surface quirk rather than an engine-wide
      convention either way.
    backing: tested
    sources:
      - description: |
          The mctest5 return-value pack cancels each call's before-event and reads the return beside
          what the action actually did; the createExplosion control confirms the case discriminates,
          entering the handler, returning true and killing its witness sheep when not cancelled.
          Three runs, byte-identical SUMMARY blocks.
      - run: return-value-probe-run
        where: Raw logs — mctest5:returns, returns run 1, the [cancelled] applyDamage line
        quote: |
