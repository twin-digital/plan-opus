  - id: before-event-field-writes-take-effect
    claim: |
      A before-event handler writing a mutable payload field changes what the action does, in both
      directions, and the written value is what the after-event reports downstream.
      `EntityHurtBeforeEvent.damage` written to 2 against a requested 10 took 2 health, and written
      to 4 against a requested 1 took 4; `EffectAddBeforeEvent.duration` written to 600 against a
      requested 100, and to 100 against a requested 400, each produced an effect carrying the
      written duration. The `entityHurt` after-event in each cascade carries the written damage
      rather than the requested amount, so the write is not a private adjustment.
