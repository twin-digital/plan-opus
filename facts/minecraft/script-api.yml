          single unlucky death. Set A deliberately installs no restore; set B, which does, held full
          health in 3/3 runs.

  - id: no-damage-cause-names-the-attacker-and-none-names-reputation
    claim: |
      Nothing in `EntityDamageCause` distinguishes a player's hit from a mob's: all 35 members were
      surveyed and none contains "player" or "mob" — a player's swing and a zombie's both arrive as
      `entityAttack`. The only attribution a handler gets is `EntityDamageSource`'s two optional
      entity fields, `damagingEntity` and `damagingProjectile`, so a pack that must treat a player's
      damage differently reads the entity rather than the cause. `damagingEntity` is the responsible
      entity rather than the projectile, which has its own field, so one test covers a melee swing
      and a loosed arrow alike. Separately, villager reputation is not on the surface at all: the
      module contains zero identifiers matching `gossip` or `reputation`, so a pack can neither read
      a villager's standing towards a player nor write it.
    backing: tested
    sources:
      - run: damage-source-type-probe
        where: "the cause survey — no member names a player or a mob"
        quote: "EntityDamageCause members containing \"player\": none"
      - run: damage-source-type-probe
        where: "the cause survey — the full member list"
        quote: "EntityDamageCause values=anvil,blockExplosion,campfire,charging,contact,drowning,entityAttack,entityExplosion,fall,fallingBlock,fire,fireTick,fireworks,flyIntoWall,freezing,lava,lightning,maceSmash,magic,magma,none,override,piston,projectile,ramAttack,selfDestruct,sonicBoom,soulCampfire,stalactite,stalagmite,starve,suffocation,temperature,thorns,wither"
      - run: damage-source-type-probe
        where: "the damage source's fields, and the reputation search"
        quote: "EntityDamageSource fields=cause,damagingEntity?,damagingProjectile?"
      - run: damage-source-type-probe
        where: "the reputation search over the whole module"
        quote: "reputation/gossip identifiers in the module: 0"

  - id: a-clamped-hit-is-indistinguishable-from-a-vanilla-one-at-a-client
    claim: |
      Watched at a Bedrock client, a hit whose `entityHurt.damage` was written down produces the
      same reaction as an unmodified hit, and a cancelled hit produces none. Three villagers were
      penned side by side — one hit vanilla, one through a 0.5 clamp, one whose event was
      cancelled — and struck with the same weapon. The vanilla and clamped lanes both flashed the
      red damage particles, both recoiled, both played the villager's hurt grunt, and both grew
      agitated afterwards; the cancelled lane did none of the four and simply stood there. Nothing
      appeared on the clamped villager that the vanilla one did not have: no added particle, no
      tint, no name-tag change, no chat output. This closes the half of the reaction question a
      dedicated server cannot reach, the flinch and the sound being rendered on the client
      [[f:a-clamped-hit-knocks-back-and-a-cancelled-one-does-not]].
    caveat: |
      An eye-level comparison, not an instrumented one: it establishes that the two lanes are
      indistinguishable to a person looking for a difference, which is the standard the requirement
      sets, and not that they are identical frame by frame. The red particles are vanilla's own
      damage feedback, since the unmodified lane shows them too.
    backing: tested
    sources:
      - run: protection-probe-client
        where: "the staged comparison — three lanes, three subjects"
        quote: "[2026-08-06 15:33:37:485 WARN] [Scripting] [vgprobe] client-comparison :: staged lanes=3 subjects=3 centre=(163,100,170)"
      - run: protection-probe-client
        where: "the session's own count — both reacting lanes were struck comparably, the cancelled lane landed nothing"
        quote: "[2026-08-06 15:38:37:482 WARN] [Scripting] [vgprobe] client-comparison :: session-ended damage-landed-by-lane=[control=9, clamped=10, cancelled=0] note=the cancelled lane lands no after-event by construction; the counts say which lanes were actually struck"
      - description: |
          The observation is the design's owner's, made at a Bedrock client against the staged
          session on 2026-08-06, and reported back in the session that recorded this fact: control
          and clamped alike showed the red particles and the recoil, "same grunt and sound on
          control and clamped", "nothing extra on clamped", and panic "on both that took the hit,
          cancelled just stood there". Flinch and sound reach no server log, so no run captures
          them and the owner's report is the evidence.


  # Facts from the village-guard gap probe (Bedrock 1.26.40.8, @minecraft/server 2.8.0), recorded in
  # evidence/minecraft/script-api/gap-probe/RESULTS.md. Headless: the pack reports through
  # console.warn and the driver reads the container log, so no client attaches. The probe pack
  # transcribes the shipped pack's own handler, so these read on what village-guard actually does.

  - id: a-clamped-hit-reaching-the-minimum-kills-and-converts
    claim: |
      A hit written down in the before-event still kills when the mob's health is at or below what
      the write leaves, and the death is vanilla's whole death rather than an event: a zombie
      converts the villager. A villager set to 0.5 health under a 0.5 clamp died on the first hit in
      3/3 penned runs, each ending with zero villagers and two zombie villagers — the same verdict
      an unguarded control at the same health reached. A restore in the after-handler does not undo
      it: the restore ran, and the villager was already gone.

      The boundary is the clamp's own value. At 0.5 health under a 0.5 clamp the death fires; at 1
      health under the same clamp it does not; at 0.5 and at 0.25 health under a *zero* clamp it does
      not, and the subject survived 129, 137 and 133 hits across three runs at full health. So a
      clamp that leaves the mob any health at all is survivable and one that can reach the effective
      minimum is not, which makes the fatal case reachable for any mob sitting at or below the
      constant when the pack first sees a hit on it.
    backing: tested
    sources:
      - run: gap-probe-run
        where: "`sub-clamp` — 0.5 health under a 0.5 clamp, the death the restore hides"
        quote: "[2026-08-07 01:26:34:371 WARN] [Scripting] [vggap] sub-clamp :: [at-0.5/clamp-0.5] effectiveMin=number:0 health(number:0.5 -> number:20) applyDamage=ok value=boolean:true died=1 subject-alive=true before=[entityAttack@4->clamp] after=[entityAttack@0.5->clamp] verdict=DIED"
      - run: gap-probe-run
        where: "`sub-clamp` — the same subject under a zero clamp"
        quote: "[2026-08-07 01:26:38:370 WARN] [Scripting] [vggap] sub-clamp :: [at-0.5/clamp-0] effectiveMin=number:0 health(number:0.5 -> number:20) applyDamage=ok value=boolean:true died=0 subject-alive=true before=[entityAttack@4->clamp] after=[entityAttack@0->clamp] verdict=SURVIVED"
      - run: gap-probe-conversion
        where: "`clamp-death-conversion` — the 0.5 clamp, penned against zombies"
        quote: "[2026-08-07 01:59:20:780 WARN] [Scripting] [vggap] clamp-death-conversion :: [at-0.5/clamp-0.5] health(number:0.5 -> undefined) hits=1 restores=1 died=1 subject-alive=false villagers-now=0 zombie-villagers-now=2 verdict=CONVERTED"

  - id: a-hit-written-down-to-zero-still-knocks-back
    claim: |
      Writing `entityHurt.damage` to zero takes no health and leaves the engine's knockback intact,
      so a zero write is a clamp rather than a quiet cancel. Measured as the peak speed in the six
      ticks after a zombie's swing against the resting speed in the four before it, over nine blocks
      of four lanes: a vanilla control peaked 0.578–0.693, a hit written down to 0.5 peaked
      0.521–0.687, a hit written down to 0 peaked 0.533–0.700, and a cancelled hit peaked
      0.194–0.274. The zero lane sits inside the vanilla band and roughly three times above the
      cancelled one, and lost 0 health in 9/9 blocks.

      This extends [[f:a-clamped-hit-knocks-back-and-a-cancelled-one-does-not]], which measured the
      same separation for a 0.5 write, to the bottom of the range.
    caveat: |
      Nothing here says anything about how often a hit lands. Hit counts ranged from 0 to 69 across
      the nine blocks with no pattern by lane, so whether a zero write changes the invulnerability
      window between hits is unmeasured. Flinch and the hurt sound are rendered on the client and
      reach no server log, so neither is observed here.
    backing: tested
    sources:
      - run: gap-probe-run
        where: "`zero-clamp` — the vanilla control"
        quote: "[2026-08-07 00:54:41:191 WARN] [Scripting] [vggap] zero-clamp :: [control] before-events=7 after-events=7 health(number:20 -> undefined) health-lost=undefined subject-alive=false samples=122 peak-speed-overall=0.654 per-hit=[entityAttack@3:rest=0.192->peak=0.654, entityAttack@3:rest=0.162->peak=0.519, entityAttack@3:rest=0.223->peak=0.58, entityAttack@3:rest=0.32->peak=0.542, entityAttack@3:rest=0.186->peak=0.579, entityAttack@3:rest=0.33->peak=0.579, entityAttack@3:rest=0.19->peak=0.192] delivered=[entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3] verdict=SEE-NUMBERS"
      - run: gap-probe-run
        where: "`zero-clamp` — the zero lane, in the same run"
        quote: "[2026-08-07 00:55:22:991 WARN] [Scripting] [vggap] zero-clamp :: [clamp0] before-events=69 after-events=19 health(number:20 -> number:20) health-lost=number:0 subject-alive=true samples=400 peak-speed-overall=0.651 per-hit=[entityAttack@3:rest=0.073->peak=0.624, entityAttack@3:rest=0.624->peak=0.425, entityAttack@3:rest=0.188->peak=0.605, entityAttack@3:rest=0.605->peak=0.327, entityAttack@3:rest=0.284->peak=0.651, entityAttack@3:rest=0.651->peak=0.348, entityAttack@3:rest=0.16->peak=0.548, entityAttack@3:rest=0.548->peak=0.373] delivered=[entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3, entityAttack@3] verdict=SEE-NUMBERS"
      - run: gap-probe-run
