  - id: effect-display-name-amplifier-mapping
    claim: |
      An effect's `displayName` follows the amplifier only to a point. At amplifier 0 it is the bare
      base name ("Speed"); at amplifiers 1 through 5 it is the base name plus the Roman numeral of
      *amplifier + 1* ("Speed II" … "Speed VI"); at amplifier 6 it reverts to the bare base name, and
      stays there for every amplifier above. Across the full accepted range 0…255 a type therefore has
      only six distinct names. The reversion holds for all 37 vanilla effect types without exception,
      over 259 type × amplifier cells all read successfully. A name computed as
      `base + roman(amplifier + 1)` is correct for exactly five of the 256 accepted amplifiers.
      Nothing in the engine's registry supplies the base name either: `EffectTypes.getAll()` returns
      38 types — the 37 `@minecraft/vanilla-data` ships plus `minecraft:empty` — and every one of
      them answers `getName()` with its own identifier rather than a display name.
    caveat: |
      The runs captured one server's locale, and `Effect.displayName` is documented only as the
      "player-friendly name" with no locale contract stated. Both the base strings and the placement
      of the numeral are therefore that locale's until a second one is observed; a locale that
      translates the bases, or positions the level marker differently, would not match.
    backing: tested
    sources:
      - description: |
          The mctest5 effect-name pack applies all 37 vanilla effect types at amplifiers 0 through 6
          to one surviving subject, reading displayName from both the addEffect return and the
          getEffect read-back and reporting whether the two agree; the bounds set then sweeps
          minecraft:speed across the whole accepted amplifier range. Identical in 3/3 runs, with
          subject-respawns=0, so no cell was measured against a different entity than its neighbours.
