- id: vanilla-dimensions-resolve-with-populated-fields
  claim: |
    `world.getDimension` resolves the three vanilla dimensions from either spelling — bare
    `overworld` / `nether` / `the_end` and the `minecraft:`-prefixed forms all return a
    Dimension reporting the prefixed `id` — and each carries a populated `heightRange`
    (overworld −64..320, nether 0..128, the_end 0..256) and `localizationKey`
    (`dimension.dimensionName0`/`1`/`2`). The spaced alias `"the end"` also resolves. An id
    naming no dimension throws, per [[f:get-dimension-unknown-id-error]].
  backing: tested
  sources:
    - run: resting-state-probe-run
      where: "`vanilla-dimensions` probe lines"
      quote: |
        [2026-07-25 02:21:08.912] [mctest] vanilla-dimensions :: requested="overworld" -> id="minecraft:overworld" heightRange={"max":320,"min":-64} localizationKey="dimension.dimensionName0"
        [2026-07-25 02:21:08.913] [mctest] vanilla-dimensions :: requested="nether" -> id="minecraft:nether" heightRange={"max":128,"min":0} localizationKey="dimension.dimensionName1"
        [2026-07-25 02:21:08.913] [mctest] vanilla-dimensions :: requested="the_end" -> id="minecraft:the_end" heightRange={"max":256,"min":0} localizationKey="dimension.dimensionName2"
