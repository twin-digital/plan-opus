- id: post-spawn-mob-motion-is-per-run-not-per-type
  claim: |
    Whether an AI-driven mob has begun moving by 22 ticks after spawn is drawn per run, not
    fixed per type. Across four runs of the same probe: `zombie` moved in 2/4, `sheep` in 1/4,
    `cow` in 1/4, `chicken` in 0/4, and run 3 inverted run 1 (sheep moved while cow and zombie
    stayed put). No AI-driven type is reliably still at 22 ticks and none reliably moves, so a
    single run cannot tell the two apart and a fake cannot hardcode either. The non-AI types
    are the contrast: `armor_stand`, `boat` and `arrow` read zero velocity and zero positional
    delta at both the 2- and 22-tick samples in 4/4.
  backing: tested
  caveat: |
    `chicken` at 0/4 is consistent with the same mechanism firing at a lower rate, not with a
    stationary type; four runs cannot distinguish those. Only the presence of drift by 22 ticks
    is reproducible — its direction, magnitude and timing are not.
