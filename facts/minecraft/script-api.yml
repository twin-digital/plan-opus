          [2026-07-27 21:35:57.013] [mctest] duration-bound :: SUMMARY read-back=[1=>read 1, 2=>read 2, 20=>read 20, 200=>read 200, 19999999=>read 19999999, 20000000=>read 20000000] — an accepted duration that reads back as a different number is a clamp


  - id: addeffect-coerces-non-integer-arguments
    claim: |
      `addEffect` truncates a non-integer amplifier or duration toward zero and then applies the
      bounds check to the truncated value: amplifier `0.5` and `1.5` are accepted and read back as
      `0` and `1`, duration `1.5` is accepted and reads back `1`, and duration `0.5` is *rejected*
      because it truncates to `0`, which is below the minimum. `NaN` and `Infinity` are refused
      earlier and differently, with a `TypeError` rather than `ArgumentOutOfBoundsError`, and the
      two arguments word even that differently — the amplifier message speaks of an interface
      property, the duration message of a function argument.
    backing: tested
    sources:
      - description: |
          The mctest5 effect-name pack's bounds set probes 0.5, 1.5, NaN and Infinity on each
          argument alongside the integer sweep. Identical in 3/3 runs.
