  - id: fresh-entity-resting-field-values
    status: retired
    reason: superseded
    superseded_by: fresh-entity-spawn-frame-field-values
    caveat: |
      Written from a single sheep, so it stated the zeroed rotation and velocity as if they held
      for any entity and at any moment after spawn. The kinematics runs show both readings are
      spawn-frame readings, and that `minecraft:xp_orb` spawns with neither.
    claim: |
      A freshly spawned entity's own fields are populated before any test writes to it, and the
      values are not all empty: `nameTag` is the empty string (length 0), `localizationKey` is
      populated (`entity.sheep.name` on a sheep), `location` and `dimension.id` are real,
      `getRotation()` and `getVelocity()` read all-zero vectors, `getTags()` is empty, and
      `isValid` is true.
    backing: tested
    sources:
      - run: resting-state-probe-run
        where: "`resting-entity-fields` probe lines"
        quote: |
