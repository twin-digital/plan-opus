  - id: reaching-effective-minimum-is-fatal
    claim: |
      A health write landing exactly on `effectiveMin` kills, by either path, and one landing a
      single point above it does not. `setCurrentValue` and `applyDamage` driving
      `minecraft:sheep` and `minecraft:cow` to exactly their minimum each fired `entityDie` — with
      cause `override` from the component write and the damage's own cause from `applyDamage` —
      while all six `min+1` controls across three types survived with no death event, and no case
      reached the minimum and lived. A survey of eleven entity types found none with a non-zero
      `effectiveMin`, so the boundary is observed only where that minimum is zero.
