    properties and 46 methods invoked with no arguments — and found exactly four properties
    still readable: `id`, `isValid`, `typeId`, and `scoreboardIdentity` (which reads
    `undefined`). Every other property throws `InvalidEntityError`, including `nameTag` and
    `isSneaking`, which carry no `@throws` annotation. The engine guard list is therefore not
    derivable from the `.d.ts` `@throws` annotations, which under-report it. The methods split:
    the 19 that a no-argument call reached threw `InvalidEntityError`, while 27 threw a
    `TypeError` on arity before the validity guard ran — for those, the guard is unobserved
    rather than shown absent [[f:arity-checked-before-validity-guard]].
