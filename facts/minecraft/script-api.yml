  - id: fresh-entity-nametag-is-empty-string
    claim: |
      `nameTag` on a freshly spawned entity is the empty string, not `undefined` and not a
      type-derived name: it read `""` (`length=0`) for all eight types sampled — `sheep`, `cow`,
      `chicken`, `zombie`, `armor_stand`, `xp_orb`, `arrow`, `boat` — in every run. The empty
      string is the engine's representation of an unnamed entity, so a fake may treat it as a
      universal starting value rather than a per-type one.
