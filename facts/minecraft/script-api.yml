- id: boat-spawn-location-offset
  status: retired
  reason: superseded
  superseded_by: boat-spawn-offset-magnitude-constant
  claim: |
    `spawnEntity` does not always place an entity on the requested point: `minecraft:boat`
    lands `0.2` off it on both x and z, `delta={x:0.20000076293945312, y:0,
    z:0.20000076293945312}` identical to the last digit in 4/4 runs from a fixed base. The
    magnitude is constant and the sign tracks the spawn position, so this is a deterministic
    placement adjustment rather than a random one. Every other type sampled lands exactly,
    `delta={x:0, y:0, z:0}`, and the boat's offset is already present on its spawn frame.
