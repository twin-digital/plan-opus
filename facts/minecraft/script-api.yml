version: "1"
facts:
  - id: server-package-ships-types-only
    claim: |
      `@minecraft/server` ships type declarations with no runtime JavaScript — its published
      package is `index.d.ts`, `package.json`, and a README. The engine supplies the
      implementation at runtime, so in a test process there is nothing importable to construct or
      module-mock, and enum members such as `EntityComponentTypes.Health` have a type but no
      usable value.
    backing: tested
    sources:
      - run: package-contents-probe
        where: the file list and byte counts
        quote: |
          ## Files shipped by @minecraft/server
          README.md (278 bytes)
          index.d.ts (751641 bytes)
          package.json (384 bytes)
      - run: package-contents-probe
        where: the runtime-JavaScript check and the import attempt
        quote: |
          ## Runtime JavaScript present?
          .js/.cjs/.mjs files: none
  - id: invalid-entity-error-shape
    claim: |
      `@minecraft/server` 2.8.0 declares `InvalidEntityError` as an exported class extending
      Error, carrying `readonly id: string` and `readonly type: string` — the id and type of the
      entity that became invalid. Like every class in the package the declaration is types-only,
      so a test process cannot import the real class; only its declared shape is available.
    backing: documented
    sources:
      - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/invalidentityerror
        where: Extends, and Properties — id and type
        quote: |
          ## Extends

          - *Error*

          The error called when an entity is invalid. This can occur when accessing components on
          a removed entity.

          ### **id**

          `read-only id: string;`

          The id of the entity that is now invalid.

          ### **type**

          `read-only type: string;`

          The type of the entity that is now invalid.
      - description: |
          Runtime absence follows from [[f:server-package-ships-types-only]]: the class is declared
          in @minecraft/server 2.8.0's index.d.ts, which the package ships with no importable
          runtime, so a test process has the declared shape and not the class.

  - id: namespace-prefix-is-optional
    claim: |
      Whether the `minecraft:` prefix may be omitted is per-surface, not a uniform rule. Bare and
      prefixed ids are both accepted by `addEffect`, `getEffect`, `spawnEntity`, and
      `getComponent`; `Entity.triggerEvent` rejects the bare form and requires the prefix. The
      canonical (engine-reported) form is the prefixed one on every surface that reports one —
      `triggerEvent` returns `undefined` and reports no id at all.

      The API reference states the opposite for `triggerEvent` — "If a namespace is not specified,
      minecraft: is assumed" — and the observation overrides it. The probe ran matched pairs on one
      sheep: the bare id threw while its `minecraft:`-prefixed twin fired the same event
      successfully, and the error echoed the bare string back rather than a prefixed one, so the
      engine looked up the literal argument without assuming a namespace. The reference carries
      that sentence for `getComponent` as well, where it does hold.
    backing: tested
    sources:
      - run: resting-state-probe-run
        where: "`namespace-prefix-other-surfaces` probe lines"
        quote: |
          [2026-07-25 02:26:25.312] [mctest] namespace-prefix-other-surfaces :: addEffect("speed") ok value=object(Effect) reportedTypeId="minecraft:speed"
          [2026-07-25 02:26:25.312] [mctest] namespace-prefix-other-surfaces :: addEffect("minecraft:speed") ok value=object(Effect) reportedTypeId="minecraft:speed"
          [2026-07-25 02:26:25.312] [mctest] namespace-prefix-other-surfaces :: getEffect("speed") ok value=object(Effect) reportedTypeId="minecraft:speed"
          [2026-07-25 02:26:25.312] [mctest] namespace-prefix-other-surfaces :: getEffect("minecraft:speed") ok value=object(Effect) reportedTypeId="minecraft:speed"
          [2026-07-25 02:26:25.313] [mctest] namespace-prefix-other-surfaces :: spawnEntity("sheep") ok value=object(Entity) reportedTypeId="minecraft:sheep"
          [2026-07-25 02:26:25.313] [mctest] namespace-prefix-other-surfaces :: spawnEntity("minecraft:sheep") ok value=object(Entity) reportedTypeId="minecraft:sheep"
          [2026-07-25 02:26:25.313] [mctest] namespace-prefix-other-surfaces :: triggerEvent("entity_born") threw name=InvalidArgumentError ctor=InvalidArgumentError instanceofInvalidEntityError=false message="Invalid value passed to argument [0]. The event entity_born does not exist on minecraft:sheep"
          [2026-07-25 02:26:25.314] [mctest] namespace-prefix-other-surfaces :: triggerEvent("minecraft:entity_born") ok value=undefined
          [2026-07-25 02:26:25.314] [mctest] namespace-prefix-other-surfaces :: triggerEvent("ageable_grow_up") threw name=InvalidArgumentError ctor=InvalidArgumentError instanceofInvalidEntityError=false message="Invalid value passed to argument [0]. The event ageable_grow_up does not exist on minecraft:sheep"
          [2026-07-25 02:26:25.314] [mctest] namespace-prefix-other-surfaces :: triggerEvent("minecraft:ageable_grow_up") ok value=undefined
          [2026-07-25 02:26:25.314] [mctest] namespace-prefix-other-surfaces :: getComponent("health") ok value=object(EntityHealthComponent) reportedTypeId="minecraft:health"
          [2026-07-25 02:26:25.314] [mctest] namespace-prefix-other-surfaces :: getComponent("minecraft:health") ok value=object(EntityHealthComponent) reportedTypeId="minecraft:health"
      - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
        where: Methods — getComponent, componentId parameter
        quote: |
          If no namespace prefix is specified, 'minecraft:' is assumed.
      - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
        where: Methods — triggerEvent, eventName parameter — contradicted by the observation above
        quote: |
          Name of the entity type event to trigger. If a namespace is not specified, minecraft: is assumed.
      - description: |
          EntityComponentTypeMap in index.d.ts 2.8.0 carries every component id in both bare and
          prefixed form (136 keys = 68 components x 2). Prefixed is canonical: the
          @minecraft/vanilla-data constants report the prefixed form — see
          [[f:vanilla-data-provides-prefixed-id-constants]].

  - id: component-ids-are-derivable-from-types
    claim: |
      The finite id sets are computable from `@minecraft/server`'s own types rather than
      transcribed: `keyof EntityComponentTypeMap` yields every component id, `` `${EntityComponentTypes}` ``
      the canonical prefixed ids, and a conditional mapping over the type map the attribute-shaped
      subset. On 2.8.0 that is 68 component classes, each id in a bare and a prefixed form, of
      which 7 are attribute-shaped. The derivation tracks version bumps for free.
    backing: tested
    sources:
      - run: component-ids-typecheck
        where: the strict tsc --noEmit result
        quote: |
          $ npx tsc --noEmit --strict --module node16 --moduleResolution node16 --target es2022 component-ids-probe.ts
          exit 0, no diagnostics
      - run: component-ids-probe
        where: the EntityComponentTypeMap key counts
        quote: |
          bare keys: 68; "minecraft:"-prefixed keys: 68
          bare keys with no prefixed twin: none
      - run: component-ids-probe
        where: the attribute-shaped subset
        quote: |
          ## Attribute-shaped ids (14) from 7 classes
  - id: server-classes-are-structurally-assignable
    claim: |
      The classes `@minecraft/server` 2.8.0 declares carry no private instance members and no brand
      fields: a value exposing only a class's public shape is assignable to the class type. Nearly
      every class declares a `private constructor()`, which blocks construction and subclassing but
      adds no instance member, so it does not brand the instance type. A library class can therefore
      satisfy Entity, Player, EntityComponent, EntityHealthComponent, World, Dimension, Effect,
      EffectType, and the event signal classes structurally, and its instances pass where the real
      type is expected without casts.
    backing: tested
    sources:
      - run: assignability-probe
        where: the exported-class and private-declaration counts
        quote: |
          exported classes: 439
          private constructor(): 425
          private declarations of any kind: 425
          private instance members (private declarations that are not constructors): 0
      - run: assignability-probe
        where: the strict tsc --noEmit result on assignability-probe.ts
        quote: |
          ## tsc --noEmit on assignability-probe.ts (strict)
          exit 0, no diagnostics
  - id: vanilla-data-provides-prefixed-id-constants
    claim: |
      `@minecraft/vanilla-data`, unlike `@minecraft/server`, ships runtime JavaScript: named
      constants whose values are the canonical prefixed id strings. Every id namespace it exports
      is fully prefixed — the one exception is `MinecraftPotionDeliveryTypes`, whose values are
      unprefixed PascalCase names rather than ids. Code or tests referencing the id constants deal
      in prefixed ids.
    backing: tested
    sources:
      - run: vanilla-data-probe
        where: the shipped files, which include runtime JavaScript
        quote: |
          lib/index.js (217395 bytes)
      - run: vanilla-data-probe
        where: the constant value shapes — every namespace prefixed but MinecraftPotionDeliveryTypes
        quote: |
          MinecraftPotionDeliveryTypes: 3 members, 3 string-valued, 0 start with "minecraft:"; unprefixed samples: Consume="Consume", ThrownLingering="ThrownLingering", ThrownSplash="ThrownSplash"
  # Facts from the engine probe. Server, module version and coverage are on the run;
  # each source names the [mctest] lines it rests on.

  - id: addeffect-returns-the-effect
    claim: |
      `Entity.addEffect` returns the `Effect` object on success — both when adding a new effect
      and when updating one already present — resolving the pinned TSDoc's self-contradiction
      ("Returns nothing if the effect was added or updated successfully" vs the declared
      `Effect | undefined`) in favour of the signature.
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`addeffect-success-return` probe lines"
        quote: |
          [2026-07-24 18:56:23.775] [mctest] addeffect-success-return :: add ok value=object(Effect)
          [2026-07-24 18:56:23.775] [mctest] addeffect-success-return :: returned-object typeId=minecraft:speed duration=200 amplifier=1
          [2026-07-24 18:56:23.775] [mctest] addeffect-success-return :: update ok value=object(Effect)
      - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
        where: Methods — addEffect, signature and Returns
        quote: |
          `addEffect(effectType: EffectType | string, duration: number, options?: EntityEffectOptions): Effect | undefined`

          **Returns**[*Effect*](effect) | *undefined* - Returns nothing if the effect was added or updated successfully. This can throw an error if the duration or amplifier are outside of the valid ranges, or if the effect does not exist.

  - id: effect-members-throw-plain-error
    claim: |
      On a removed effect, and equally on an effect whose owner entity has been removed, the
      `Effect` value members `amplifier`, `duration`, `typeId`, and `displayName` throw a plain
      `Error` (name and constructor `Error`, message `Failed to get property '<member>'.`) — not
      `InvalidEntityError` — while `isValid` stays readable and answers false. Only `remove()`
      invalidation was exercised; chunk unloading is untested.
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`effect-member-guard-derivation` probe lines"
        quote: |
          [2026-07-24 18:56:23.906] [mctest] effect-member-guard-derivation :: removed-effect amplifier threw name=Error ctor=Error instanceofInvalidEntityError=false message="Failed to get property 'amplifier'."
          [2026-07-24 18:56:23.906] [mctest] effect-member-guard-derivation :: removed-effect duration threw name=Error ctor=Error instanceofInvalidEntityError=false message="Failed to get property 'duration'."
          [2026-07-24 18:56:23.906] [mctest] effect-member-guard-derivation :: removed-effect typeId threw name=Error ctor=Error instanceofInvalidEntityError=false message="Failed to get property 'typeId'."
          [2026-07-24 18:56:23.906] [mctest] effect-member-guard-derivation :: removed-effect displayName threw name=Error ctor=Error instanceofInvalidEntityError=false message="Failed to get property 'displayName'."
          [2026-07-24 18:56:23.906] [mctest] effect-member-guard-derivation :: removed-effect isValid ok value=boolean:false
          [2026-07-24 18:56:24.006] [mctest] effect-member-guard-derivation :: invalid-owner amplifier threw name=Error ctor=Error instanceofInvalidEntityError=false message="Failed to get property 'amplifier'."
          [2026-07-24 18:56:24.006] [mctest] effect-member-guard-derivation :: invalid-owner duration threw name=Error ctor=Error instanceofInvalidEntityError=false message="Failed to get property 'duration'."
          [2026-07-24 18:56:24.006] [mctest] effect-member-guard-derivation :: invalid-owner typeId threw name=Error ctor=Error instanceofInvalidEntityError=false message="Failed to get property 'typeId'."
          [2026-07-24 18:56:24.006] [mctest] effect-member-guard-derivation :: invalid-owner displayName threw name=Error ctor=Error instanceofInvalidEntityError=false message="Failed to get property 'displayName'."
          [2026-07-24 18:56:24.007] [mctest] effect-member-guard-derivation :: invalid-owner isValid ok value=boolean:false
  - id: damage-cascade-order-and-payload
    claim: |
      `applyDamage` fires `entityHurt`, then `entityHealthChanged`, then — on a killing hit —
      `entityDie`, and `entityHurt.damage` carries the requested amount even when it exceeds
      remaining health (damage=100 against 8 health).
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`damage-event-order-in-engine` probe lines"
        quote: |
          [2026-07-24 18:56:24.306] [mctest] damage-event-order-in-engine :: nonlethal sequence=[hurt(damage=2,cause=none), health(8->6)]
          [2026-07-24 18:56:24.506] [mctest] damage-event-order-in-engine :: lethal sequence=[hurt(damage=98,cause=none), health(6->-92), die(cause=none)]
      - run: engine-probe-run
        where: "`clamped-hit-damage-payload` probe lines"
        quote: |
          [2026-07-24 18:56:25.306] [mctest] clamped-hit-damage-payload :: health-before=8 requested=100 sequence=[hurt(damage=100,cause=none), health(8->-92), die(cause=none)]
  - id: health-not-clamped-at-minimum
    claim: |
      A killing `applyDamage` drives `currentValue` below `effectiveMin` — the engine does not
      clamp: 100 damage against 8/[0,8] health leaves −92, and `entityHealthChanged` reports
      the negative value. By contrast `kill()` and `resetToMinValue` land exactly at the
      minimum (8->0).
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`damage-event-order-in-engine` — lethal applyDamage — the health transition past zero"
        quote: |
          [2026-07-24 18:56:24.306] [mctest] damage-event-order-in-engine :: nonlethal sequence=[hurt(damage=2,cause=none), health(8->6)]
          [2026-07-24 18:56:24.506] [mctest] damage-event-order-in-engine :: lethal sequence=[hurt(damage=98,cause=none), health(6->-92), die(cause=none)]
      - run: engine-probe-run
        where: "`clamped-hit-damage-payload` — a requested 100 on 8 health"
        quote: |
          [2026-07-24 18:56:25.306] [mctest] clamped-hit-damage-payload :: health-before=8 requested=100 sequence=[hurt(damage=100,cause=none), health(8->-92), die(cause=none)]
      - run: engine-probe-run
        where: "`kill-cascade` — kill on a healthy entity"
        quote: |
          [2026-07-24 18:56:25.606] [mctest] kill-cascade :: first-kill return ok value=boolean:true sequence=[hurt(damage=8,cause=selfDestruct), health(8->0), die(cause=selfDestruct)]
          [2026-07-24 18:56:25.807] [mctest] kill-cascade :: second-kill return ok value=boolean:true sequence=[]
      - run: engine-probe-run
        where: "`component-health-writes-fire-events` — resetToMinValue"
        quote: |
          [2026-07-24 18:56:29.856] [mctest] component-health-writes-fire-events :: setCurrentValue(3) return ok value=boolean:true sequence=[health(8->3)]
          [2026-07-24 18:56:30.056] [mctest] component-health-writes-fire-events :: resetToMaxValue sequence=[health(3->8)]
          [2026-07-24 18:56:30.256] [mctest] component-health-writes-fire-events :: resetToMinValue sequence=[health(8->0), die(cause=override)]
  - id: applydamage-cause-defaults
    claim: |
      `applyDamage` with no options fires `damageSource.cause` `none`. With the projectile
      options form (which has no cause field) the engine derives cause `projectile` itself,
      and adjusts the damage: a requested 1 arrived as 1.045823097229004 from a real arrow, so
      the projectile-path damage is velocity-dependent, not the requested constant.
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`damage-default-cause` probe lines"
        quote: |
          [2026-07-24 18:56:24.806] [mctest] damage-default-cause :: no-options sequence=[hurt(damage=1,cause=none), health(8->7)]
          [2026-07-24 18:56:25.006] [mctest] damage-default-cause :: projectile-options sequence=[hurt(damage=1.045823097229004,cause=projectile), health(7->5.954176902770996)]
  - id: entity-remove-after-event-shape
    claim: |
      `EntityRemoveAfterEvent` — the payload `world.afterEvents.entityRemove` hands a subscriber —
      carries exactly two readonly string properties, named `removedEntityId` and `typeId`. It
      carries no entity reference, which is what makes the payload readable after the entity it
      describes is gone. The engine raises the event for unloading as well as for scripted removal.
    backing: documented
    sources:
      - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entityremoveafterevent
        where: Class summary, and Properties — removedEntityId and typeId
        quote: |
          Data for an event that happens when an entity is removed from the world (for example, the entity is unloaded because it is not close to players.)

          ### **removedEntityId**

          `read-only removedEntityId: string;`

          Id of the entity that was removed.

          ### **typeId**

          `read-only typeId: string;`

          Identifier of the type of the entity removed - for example, 'minecraft:skeleton'.

  - id: kill-and-remove-cascades
    claim: |
      `kill()` fires the full damage cascade — `entityHurt` with damage equal to current
      health and cause `selfDestruct`, then `entityHealthChanged` to exactly the minimum, then
      `entityDie` with cause `selfDestruct` — and returns true; on the still-valid corpse a
      second `kill()` returns true and fires nothing. `remove()` fires no *death* event, but it
      is not event-free: with all 55 `world.afterEvents` signals subscribed, `remove()` was
      followed by five delivered events — one `entitySpawn`, three `dataDrivenEntityTrigger`,
      and one `entityRemove`.
    backing: tested
    caveat: |
      "Followed by" is what the run establishes; that `remove()` *caused* all five is inference.
      The probe's payload matching failed on every one — it reads an id that is unreadable after
      removal — so attribution to the probe's own entity rests on the world holding nothing but
      stationary armor stands besides it. One of the five is an `entitySpawn`, which no removal
      plausibly causes, so at least that attribution is likely wrong. Read the five as events
      observed in the window, not as a cascade to reproduce.
    sources:
      - run: engine-probe-run
        where: "`kill-cascade` probe lines"
        quote: |
          [2026-07-24 18:56:25.606] [mctest] kill-cascade :: first-kill return ok value=boolean:true sequence=[hurt(damage=8,cause=selfDestruct), health(8->0), die(cause=selfDestruct)]
          [2026-07-24 18:56:25.807] [mctest] kill-cascade :: second-kill return ok value=boolean:true sequence=[]
      - run: engine-probe-run
        where: "`remove-fires-no-death-event` probe lines"
        quote: |
          [2026-07-24 18:56:26.106] [mctest] remove-fires-no-death-event :: sequence=[]
      - run: resting-state-probe-run
        where: "`remove-event-sweep` probe lines"
        quote: |
          [2026-07-25 02:26:23.218] [mctest] remove-event-sweep :: subscribed=55 skipped=0 skipped-names=[]
          [2026-07-25 02:26:23.412] [mctest] remove-event-sweep :: after remove() fired=[entitySpawn(other), dataDrivenEntityTrigger(other), dataDrivenEntityTrigger(other), dataDrivenEntityTrigger(other), entityRemove(other)] count=5
  - id: corpse-invalidation-is-twenty-one-ticks
    claim: |
      A killed mob's reference turns invalid exactly 21 ticks after `kill()`, and the boundary is a
      constant: 72 observations — 8 mob types x 3 internal repeats x 3 runs — all report
      `first-invalid-tick=21`, with no variation by type or between runs. Within each repeat every
      type is killed on the same tick and sampled together, so the uniformity cannot be tick
      alignment. The same sweep confirms the two readings either side of that boundary: the reference
      is valid in the same statement sequence as the call (72/72) and valid inside the `entityDie`
      handler (72/72), which is what a health-bearing `kill()` leaves behind until the corpse
      despawns. Measured on sheep, cow, pig, chicken, zombie, skeleton, creeper and villager_v2.
    backing: tested
    sources:
      - description: |
          The mctest7 corpse probe spawns one of each of eight mob types, kills them all in one tick,
          and reads isValid on every subject once per tick for 60 ticks, recording the first tick each
          answers false. Three internal repeats per run, three runs; identical in 3/3.
      - run: death-invalidation-probe-run
        where: Raw log — mctest7:corpse run 1, the SUMMARY HEADLINE line
        quote: |
          [2026-07-28 23:57:04.184] [mctest] corpse-invalidation-boundary :: SUMMARY HEADLINE observations=24 distinct-first-invalid-ticks=["21"] uniform-across-types-and-repeats=true — one value here means the boundary is a constant the fake could model; several mean it is per-type or drawn per death
      - run: death-invalidation-probe-run
        where: Raw log — mctest7:corpse run 3, the SUMMARY HEADLINE line, identical to runs 1 and 2
        quote: |
          [2026-07-29 00:04:13.684] [mctest] corpse-invalidation-boundary :: SUMMARY HEADLINE observations=24 distinct-first-invalid-ticks=["21"] uniform-across-types-and-repeats=true — one value here means the boundary is a constant the fake could model; several mean it is per-type or drawn per death

  - id: death-invalidation-window
    status: retired
    reason: superseded
    superseded_by: corpse-invalidation-is-twenty-one-ticks
    claim: |
      Inside an `entityDie` handler the dead entity's reference is still valid — `isValid`
      reads true and guarded members answer — and it stays valid for at least ~7 ticks after
      `kill()`, turning invalid by ~27 ticks when the corpse despawns. The exact boundary is
      unmeasured.
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`death-invalidation-timing` probe lines"
        quote: |
          [2026-07-24 18:56:26.307] [mctest] death-invalidation-timing :: inside-die-handler isValid ok value=boolean:true; hasTag ok value=boolean:false
          [2026-07-24 18:56:26.307] [mctest] death-invalidation-timing :: after-wait isValid=true
          [2026-07-24 18:56:26.556] [mctest] death-invalidation-timing :: after-wait isValid=true
          [2026-07-24 18:56:27.556] [mctest] death-invalidation-timing :: after-wait isValid=false
          [2026-07-24 18:56:29.556] [mctest] death-invalidation-timing :: after-wait isValid=false
  - id: component-health-writes-cascade
    claim: |
      Health writes through the component fire `entityHealthChanged` — `setCurrentValue` and
      the resets alike, with no `entityHurt` — and a write that reaches the effective minimum
      fires `entityDie` with cause `override`.
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`component-health-writes-fire-events` probe lines"
        quote: |
          [2026-07-24 18:56:29.856] [mctest] component-health-writes-fire-events :: setCurrentValue(3) return ok value=boolean:true sequence=[health(8->3)]
          [2026-07-24 18:56:30.056] [mctest] component-health-writes-fire-events :: resetToMaxValue sequence=[health(3->8)]
          [2026-07-24 18:56:30.256] [mctest] component-health-writes-fire-events :: resetToMinValue sequence=[health(8->0), die(cause=override)]
  - id: effect-amplifier-defaults-to-zero
    claim: |
      An effect added with no amplifier option carries amplifier 0.
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`effect-amplifier-default` probe lines"
        quote: |
          [2026-07-24 18:56:30.507] [mctest] effect-amplifier-default :: amplifier=0
  - id: attribute-guard-classes-observed
    claim: |
      On an invalid owner, the attribute members whose `@throws` names no error — the four value
      getters and all three resets (`resetToDefaultValue`, `resetToMaxValue`, `resetToMinValue`) —
      do throw, but a plain `Error` (`Failed to get property '<internal name>'.` / `Failed to
      call function '<name>'.`), while the members whose `@throws` names `InvalidEntityError` —
      `setCurrentValue` and `entity` — throw `InvalidEntityError`. `isValid` (false) and `typeId`
      stay readable. Across the attribute members observed, the error class matches the
      annotation, including where the annotation names none.
    backing: tested
    sources:
      - run: engine-probe-run
        where: "`attribute-generic-throws-on-invalid-owner` probe lines"
        quote: |
          [2026-07-24 18:56:30.707] [mctest] attribute-generic-throws-on-invalid-owner :: currentValue threw name=Error ctor=Error instanceofInvalidEntityError=false message="Failed to get property 'current'."
