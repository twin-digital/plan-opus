  - id: public-packs-reach-past-entities-and-events
    claim: |
      Across 103 public GitHub behavior-pack repositories (368,385 non-blank source lines,
      classified against the `@minecraft/server` 2.8.0 declarations), every part of the API outside
      entity state, effects and after-event subscriptions is reached by a large share of packs.
      `system` scheduling is reached by 84%,
      `beforeEvents` subscriptions by 76%, items and containers by 62%, blocks by 55%, the player
      client surface by 44%, the static type registries by 41%, and the startup and custom-command
      registries by 40%. Exactly one repository of the 103 reaches for none of them.

      On items and blocks specifically, 69% of repositories reference `ItemStack`, `Block`,
      `Container`, or an item or block component id unambiguously, and 88% either do so or
      subscribe to an event whose payload exposes one of those classes. The two halves are demanded
      almost equally — items 79%, blocks 78% — and 68% reference both, so a surface covering only
      one of the two leaves at most 22% of repositories referencing nothing beyond it. The 12
      repositories that reference none are
      small utility packs: median 394 source lines and largest 1,563, against a median of 1,466 for
      the rest.

      By contrast, entity components are referenced by 73% of repositories and effects by 13%.
    backing: tested
    caveat: |
      Presence is not weight: one `itemStack.typeId` read counts the same as an inventory system,
      so these shares rank what packs touch and do not establish how much of a pack could still be
      usefully tested against a fake lacking it. "Fully covered" is a claim about references, not
      about testability. The sample is what GitHub repository search returns for one fixed query
      list — packs shipped as `.mcaddon`, on marketplaces, or in private repositories are absent,
      and the unit is a repository rather than a shipped pack. Helper modules that manipulate API
      objects without naming `@minecraft/server` are not analysed at all, which undercounts.
    sources:
      - run: pack-api-survey
        where: "\"Surface absent from v1\" — the per-surface reach table and the repositories touching none"
        quote: |
          System scheduling (runInterval, runTimeout, ...)           87    84%
          beforeEvents subscriptions                                 78    76%
          items, item components, containers                         64    62%
          blocks, permutations, block components                     57    55%
          player client surface (ScreenDisplay, Camera, ...)         45    44%
          static type registries                                     42    41%
          startup phase and custom command/component registries      41    40%
      - run: pack-api-survey
        where: "\"Surface absent from v1\" — the repositories reaching for none of it"
        quote: |
          repositories touching none of the above: 1 (1%)
  - id: engine-surface-outside-instances
    claim: |
      `@minecraft/server` 2.8.0 exposes a surface that is not reached through any instance, in two
      kinds.

      **Module-level exported constants: 7.** Two are singleton instances — `system: System` and
      `world: World` — and five are numeric literals: `HudElementsCount` 13, `HudVisibilityCount` 2,
      `MoonPhaseCount` 8, `TicksPerDay` 24000, `TicksPerSecond` 20.

      **Static members on exported classes: 112**, across 439 exported classes. They divide as:

      - 86 are `static readonly componentId`, one on each component class, carrying that
        component's id string.
      - 16 are `get`/`getAll` lookup pairs on 8 registry classes: `BiomeTypes`, `BlockStates`,
        `BlockTypes`, `DimensionTypes`, `EffectTypes`, `EnchantmentTypes`, `EntityTypes`,
        `ItemTypes`.
      - 5 are on `Potions`: `resolve`, `getDeliveryType`, `getEffectType`, `getAllDeliveryTypes`,
        `getAllEffectTypes`.
      - 1 is `BlockPermutation.resolve`, the only way to obtain a `BlockPermutation`, whose
        constructor is private.
      - 4 are constant values: `AimAssistRegistry.DefaultCategoryId` and `.DefaultPresetId`,
        `FluidContainer.maxFillLevel` 6 and `.minFillLevel` 0.
