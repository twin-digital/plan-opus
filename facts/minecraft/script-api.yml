    claim: |
      `Entity.id` is documented as an opaque identifier: consistent across loads of a world
      instance, with no meaning to be inferred from its value or structure and no parsing or
      interpretation intended. The declaration types it as a bare `string` and states no format,
      so the negative-integer form the engine was observed to issue is an unpromised
      implementation detail rather than part of the API's contract.
    backing: documented
    sources:
      - url: https://learn.microsoft.com/en-us/minecraft/creator/scriptapi/minecraft/server/entity
        where: Properties — id, declaration line and description
        quote: |
          `read-only id: string;`

          Unique identifier of the entity. This identifier is intended to be consistent across
          loads of a world instance. No meaning should be inferred from the value and structure
          of this unique identifier - do not parse or interpret it. This property is accessible
          even if @minecraft/server.Entity.isValid is false.

  # Facts from the mctest:deep follow-up run. These close the factual half of the four
  # decision-gating questions; whether the fake should match the engine is the residual decision.

  - id: effect-replacement-rule-observed
    claim: |
      addEffect on an already-present effect replaces it iff the re-add has a higher amplifier,
      or the same amplifier and a longer duration; a lower amplifier never replaces regardless of
      duration, and the same amplifier with a shorter duration does not replace. The rule is
      amplifier-first with a duration tiebreak — not unconditional. At equal duration
      specifically, replacement takes at a higher or equal amplifier and not at a lower one.

      An effect's duration decays with the tick while it is applied: a base applied at 300 read
      back 290 once ticks had passed, which is how the probe told a surviving base from a fresh
      replacement. Whether the duration comparison is against the duration originally applied or
      the duration remaining is not discriminated by these runs — the one same-amplifier sample
      re-applied 300 over a base that had decayed to 290, which satisfies both readings, and no
      sample lies between.
    backing: tested
    sources:
      - run: resting-state-probe-run
        where: "`effect-equal-duration-replacement` probe lines"
        quote: |
          [2026-07-25 02:26:24.217] [mctest] effect-equal-duration-replacement :: [higher-amp/equal-dur] base(amp1,dur300) decayed-to(amp1,dur290) readd(amp2,dur300) -> readback(amp2,dur300) replaced=true discriminator="readDur===300 means fresh application; readDur===290 means the decayed base survived"
          [2026-07-25 02:26:24.717] [mctest] effect-equal-duration-replacement :: [same-amp/equal-dur] base(amp1,dur300) decayed-to(amp1,dur290) readd(amp1,dur300) -> readback(amp1,dur300) replaced=true discriminator="readDur===300 means fresh application; readDur===290 means the decayed base survived"
          [2026-07-25 02:26:25.217] [mctest] effect-equal-duration-replacement :: [lower-amp/equal-dur] base(amp1,dur300) decayed-to(amp1,dur290) readd(amp0,dur300) -> readback(amp1,dur290) replaced=false discriminator="readDur===300 means fresh application; readDur===290 means the decayed base survived"
