  - id: server-import-fails-without-an-alias
    claim: |
      `@minecraft/server` 2.8.0 declares no `main`, `module`, `types`, `typings` or `exports` key, so
      an import of it fails at module resolution — before any of the importing module's code runs.
      Node throws `ERR_MODULE_NOT_FOUND`; vitest 4.1.10, with the package installed, fails the whole
      suite with `Failed to resolve entry for package "@minecraft/server"`. A pack module that
      imports a *value* — an enum member, or a class for an `instanceof` — is therefore unloadable
      under a test runner unless the specifier is redirected to some other module. TypeScript is
      unaffected: it finds `index.d.ts` by convention, so the failure appears only at run time.
    backing: tested
    sources:
      - run: package-contents-probe
        where: the package.json entry points
        quote: |
          main: undefined
          module: undefined
          types: undefined
          typings: undefined
          exports: undefined
      - run: package-contents-probe
        where: the runtime import attempt from a plain node process
        quote: |
          threw Error code=ERR_MODULE_NOT_FOUND
      - run: alias-shim-control-run
        where: the failed suite, with @minecraft/server 2.8.0 installed and no alias configured
        quote: |
          Error: Failed to resolve entry for package "@minecraft/server". The package may have incorrect main/module/exports specified in its package.json.

  - id: vanilla-data-ships-no-api-enums
    claim: |
      `@minecraft/vanilla-data` 1.26.33 — the package in the `@minecraft` family that does ship
      runtime JavaScript — exports exactly 12 names, every one a namespace of id constants
      (`MinecraftBlockTypes`, `MinecraftEffectTypes`, and so on). No `@minecraft/server` API enum
      appears among them: there is no `EntityDamageCause`, `GameMode` or `EquipmentSlot`. So a pack
      that imports an API enum value cannot get it from `@minecraft/vanilla-data`, and the enum
      values have to come from somewhere else.
    backing: tested
    sources:
      - run: vanilla-data-probe
        where: the complete runtime export list
        quote: |
          ## Runtime exports (12)
          MinecraftBiomeTypes, MinecraftBlockTypes, MinecraftCameraPresetsTypes, MinecraftCooldownCategoryTypes, MinecraftDimensionTypes, MinecraftEffectTypes, MinecraftEnchantmentTypes, MinecraftEntityTypes, MinecraftFeatureTypes, MinecraftItemTypes, MinecraftPotionDeliveryTypes, MinecraftPotionEffectTypes


  # Facts from the mctest8 arity, expiry, handler-write and filter sets (Bedrock 1.26.31.1,
  # @minecraft/server 2.8.0), recorded in
  # evidence/minecraft/test-lib/mctest-arity-expiry-and-filter-probe-results.md.
  # The pack was run by the design's owner, not by the author of these facts; every source below says
  # so. n=3 per set, and normalising only the timestamp and the entity ids, each set's whole log body
  # is byte-identical across its three runs.

  - id: surplus-arguments-are-rejected
    claim: |
      The engine enforces a maximum argument count as well as a minimum. Called with one and with two
      arguments beyond its declared maximum, every one of 18 `Entity` members threw a `TypeError`
      reading `Incorrect number of arguments to function. Expected <n>, received <m>` — the same
      message shape a call with too few arguments produces, with the expected part written
      `<min>-<max>` where the two bounds differ and as the single number where they do not, and the
      received part the count actually passed. The five zero-arity members among them throw on the
      first surplus argument, so the upper bound is enforced independently of any minimum. Each
      member's control call, made at its declared arity on the same entity, returned normally, so what
      the throw rejects is the surplus argument rather than a malformed call.
    backing: tested
    sources:
      - description: |
          The mctest8 arity set calls 18 Entity members three ways each — at the declared maximum, at
          maximum+1 and at maximum+2 — on a valid entity, recording the control's return beside each
          surplus verdict. The pack was run by the design's owner, not by the author of this fact.
          Identical in 3/3 runs.
