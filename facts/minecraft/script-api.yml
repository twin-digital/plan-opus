  - id: subscribe-filter-fields-intersect
    claim: |
      A subscribe options object's fields intersect: a handler carrying two of them receives only the
      events matching both. Five crossings across `entityHurt` and `entityDie` all read INTERSECT,
      against an unfiltered control that received every driven event and single-field handlers that
      each received their own matches. Two further readings hold. `entityTypes` matches the
      **subject** entity of the event — the hurt entity on `entityHurt`, the dead entity on
      `entityDie` — and not the damaging one: a handler filtering on `minecraft:pig` received
      nothing although a pig was the damaging entity in three of the four hurt events. And `entities`
      is an instance filter rather than a type filter: given one of two sheep, a handler received only
      that sheep's events, with no crossover in either direction. `entityFilter` is honoured on
      `tags`, which is what makes the crossing that pairs it with `entityTypes` a live reading
      rather than a vacuous one.
    backing: tested
    sources:
      - description: |
          The mctest8 filters set subscribes fourteen handlers to entityHurt and seven to entityDie,
          each carrying a different EntityHurtAfterEventOptions or EntityEventOptions, then drives four
          hurt events and three deaths across two sheep, a cow and a pig, and reports which events each
          handler received. Both RUN-VALIDITY gates pass — the unfiltered control received everything,
          and the both-fields-match handler fired — so no reading is vacuous. The pack was run by the
          design's owner, not by the author of this fact. Identical in 3/3 runs.
      - run: arity-expiry-and-filter-probe-run
        where: Raw logs — mctest8:filters, filters run 1, the entityFilter tag gate and the crossing that pairs it with entityTypes
        quote: |
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY [filter-tag-sheepA] options="entityFilter={tags:['mctest_filter_marker']} — only sheepA carries the tag; the run-validity case for entityFilter" received=["sheepA-entityAttack-by-pig","sheepA-lava-no-damager"] count=2 foreign-deliveries=0
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY [types-cow+filter-tag-sheepA] options="entityTypes=[cow] AND entityFilter={tags:['mctest_filter_marker']} — HEADLINE: the exact pair the decision's union falsifier names" received=[] count=0 foreign-deliveries=0
      - run: arity-expiry-and-filter-probe-run
        where: Raw logs — mctest8:filters, filters run 1, the hurt-set validity gates and headlines
        quote: |
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY RUN-VALIDITY control-no-options-received=["sheepA-entityAttack-by-pig","sheepB-entityAttack-by-pig","cow-entityAttack-by-pig","sheepA-lava-no-damager"] expected=["sheepA-entityAttack-by-pig","sheepB-entityAttack-by-pig","cow-entityAttack-by-pig","sheepA-lava-no-damager"] applyDamage-returns=["sheepA-entityAttack-by-pig=>true","sheepB-entityAttack-by-pig=>true","cow-entityAttack-by-pig=>true","sheepA-lava-no-damager=>true"] — a control missing an event means the event never happened; nothing downstream of it counts
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY RUN-VALIDITY both-fields-match received=["sheepA-entityAttack-by-pig","sheepB-entityAttack-by-pig"] — this handler must receive the two sheep entityAttack events. If it receives nothing, the entityTypes string format or the cause enum is wrong and the intersect/union reading is void (compare types-sheep=["sheepA-entityAttack-by-pig","sheepB-entityAttack-by-pig","sheepA-lava-no-damager"] against types-sheep-unqualified=[])
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY HEADLINE intersect-vs-union handler=types-sheep+cause-lava received=["sheepA-lava-no-damager"] received-an-entityAttack-event=false — receiving ONLY sheepA-lava-no-damager is INTERSECT and CONFIRMS the spec; also receiving an entityAttack event is UNION and CONTRADICTS it; receiving nothing at all means the cause filter never matches and the case is void
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY HEADLINE intersect-vs-union handler=entities-sheepA+types-cow received=[] — nothing at all is INTERSECT and CONFIRMS the spec (no event is both sheepA and a cow); receiving sheepA events or the cow event is UNION and CONTRADICTS it
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY HEADLINE intersect-vs-union handler=types-cow+filter-tag-sheepA received=[] count=0 entityFilter-alone-received=["sheepA-entityAttack-by-pig","sheepA-lava-no-damager"] — nothing at all is INTERSECT and CONFIRMS the spec (no event is both a cow and the tagged sheep); receiving the sheepA events or the cow event is UNION and CONTRADICTS it. If entityFilter alone received nothing, the tag filter never matched and this case is void
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY HEADLINE which-entity-does-entityTypes-read handler=types-pig received=[] count=0 — any delivery means entityTypes reads the DAMAGING entity (no pig is ever hurt); silence means it reads the hurt entity, which is what the spec assumes
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY HEADLINE entities-instance-filter sheepA=["sheepA-entityAttack-by-pig","sheepA-lava-no-damager"] sheepB=["sheepB-entityAttack-by-pig"] — each must receive only its own entity's events. A handler receiving the other sheep's events means entities is read as a type filter, not an instance filter
      - run: arity-expiry-and-filter-probe-run
        where: Raw logs — mctest8:filters, filters run 1, the die-set validity gate and headlines
        quote: |
          [2026-07-29 12:52:07.568] [mctest] die-filter-semantics :: SUMMARY RUN-VALIDITY control-no-options-received=["sheepVictim","sheepOther","cowVictim"] expected=["sheepVictim","sheepOther","cowVictim"] applyDamage-returns=["sheepVictim=>true","sheepOther=>true","cowVictim=>true"] — a death missing from the control never happened; nothing downstream of it counts
          [2026-07-29 12:52:07.568] [mctest] die-filter-semantics :: SUMMARY HEADLINE intersect-vs-union handler=types-sheep+entities-cowVictim received=[] count=0 — nothing at all is INTERSECT and CONFIRMS the spec; receiving the sheep deaths or the cow death is UNION and CONTRADICTS it
          [2026-07-29 12:52:07.568] [mctest] die-filter-semantics :: SUMMARY HEADLINE intersect-vs-union handler=types-sheep+entities-sheepOther received=["sheepOther"] count=1 — sheepOther alone is INTERSECT and CONFIRMS the spec; both sheep deaths is UNION and CONTRADICTS it
          [2026-07-29 12:52:07.568] [mctest] die-filter-semantics :: SUMMARY HEADLINE entities-instance-filter sheepVictim=["sheepVictim"] sheepOther=["sheepOther"] — each must receive only its own death; receiving the other sheep's death means entities is read as a type filter

  - id: subscribe-filter-entity-types-requires-the-prefix
    claim: |
      A subscribe filter's `entityTypes` matches the `minecraft:`-prefixed id only. Two handlers
      subscribed side by side to the same signal in the same run, one filtering on `minecraft:sheep`
      and one on the bare `sheep`, received 3 events and 0 respectively: the bare form matches
      nothing at all, silently, with no error raised at subscription or at dispatch.

      That is a third behaviour for the namespace prefix, extending the surface-dependence
      [[f:namespace-prefix-tolerance-is-per-surface]] records — optional on `addEffect`,
      `getEffect`, `spawnEntity` and `getComponent`, rejected with `InvalidArgumentError` on
      `triggerEvent` — with a surface that accepts the bare form and quietly matches it against
      nothing.
    backing: tested
    sources:
      - description: |
          The mctest8 filters set subscribes types-sheep and types-sheep-unqualified to entityHurt in
          the same run, differing only in the id format, and drives three events on sheep. The pack was
          run by the design's owner, not by the author of this fact. Identical in 3/3 runs.
      - run: arity-expiry-and-filter-probe-run
        where: Raw logs — mctest8:filters, filters run 1, the matched pair of entityTypes handlers
        quote: |
          [2026-07-29 12:52:05.468] [mctest] hurt-filter-semantics :: SUMMARY [types-sheep] options="entityTypes=['minecraft:sheep']" received=["sheepA-entityAttack-by-pig","sheepB-entityAttack-by-pig","sheepA-lava-no-damager"] count=3 foreign-deliveries=0
          [2026-07-29 12:52:05.469] [mctest] hurt-filter-semantics :: SUMMARY [types-sheep-unqualified] options="entityTypes=['sheep']" received=[] count=0 foreign-deliveries=0

  # Facts from the village-guard protection probe (Bedrock 1.26.40.8, @minecraft/server 2.8.0),
  # recorded in evidence/minecraft/script-api/protection-probe/RESULTS.md. Headless: the pack
  # reports through console.warn and the driver reads the container log. n=3 per set.

  - id: entity-hurt-before-event-sees-engine-dealt-damage
    claim: |
      `world.beforeEvents.entityHurt` is raised for damage no script asked for, and a handler's
      write to `damage` takes on those paths exactly as it does for `applyDamage`. Five routes were
      dealt to a villager and every one raised the event in 3/3 runs, each carrying its own
      `damageSource.cause`: the `/damage` command (`entityAttack`), burning after `setOnFire`
      (`fireTick`, once per fire tick), `createExplosion` (`blockExplosion`), a fall
      (`fall`), and a zombie's own melee swing (`entityAttack` with `damagingEntity`
      `minecraft:zombie`). Writing `damage` down to 0.5 in the handler left exactly 0.5 health lost
      on every one of them. The fall pair is the sharpest: the same 21-damage fall killed the
      unwritten subject and left the written one at 19.5 health. This resolves what the earlier
      before-event probes left open — every one of them drove the event with a script's own
      `applyDamage`, so the engine's own damage paths were unobserved.
    caveat: |
      Suffocation is the one route named by the design that the probe could not deal at all:
      burying the subject in a stone column took no health in any run, so the case discriminates
      nothing either way and suffocation stays unmeasured.
    backing: tested
    sources:
      - run: protection-probe-sources
        where: "`damage-source-visibility` — the `/damage` command route"
        quote: "[2026-08-06 14:32:27:155 WARN] [Scripting] [vgprobe] damage-source-visibility :: [command-damage/observe] handler-entered=1 health(number:20 -> number:16) health-lost=number:4 subject-alive=true delivered=[entityAttack@4] verdict=BEFORE-EVENT-RAISED"
      - run: protection-probe-sources
        where: "`damage-source-visibility` — burning after setOnFire"
        quote: "[2026-08-06 14:32:31:250 WARN] [Scripting] [vgprobe] damage-source-visibility :: [fire/observe] handler-entered=3 health(number:20 -> number:17) health-lost=number:3 subject-alive=true delivered=[fireTick@1, fireTick@1, fireTick@1] verdict=BEFORE-EVENT-RAISED"
      - run: protection-probe-sources
        where: "`damage-source-visibility` — createExplosion"
        quote: "[2026-08-06 14:32:35:555 WARN] [Scripting] [vgprobe] damage-source-visibility :: [explosion/observe] handler-entered=1 health(number:20 -> number:0) health-lost=number:20 subject-alive=true delivered=[blockExplosion@43] verdict=BEFORE-EVENT-RAISED"
      - run: protection-probe-sources
        where: "`damage-source-visibility` — a zombie's own melee swing"
        quote: "[2026-08-06 14:33:07:600 WARN] [Scripting] [vgprobe] damage-source-visibility :: [zombie-attack/observe] handler-entered=7 health(number:20 -> undefined) health-lost=undefined subject-alive=false delivered=[entityAttack/minecraft:zombie@3, entityAttack/minecraft:zombie@3, entityAttack/minecraft:zombie@3, entityAttack/minecraft:zombie@3, entityAttack/minecraft:zombie@3, entityAttack/minecraft:zombie@3, entityAttack/minecraft:zombie@3] verdict=BEFORE-EVENT-RAISED"
      - run: protection-probe-sources
        where: "`damage-source-visibility` — a fall, unwritten: the subject died"
        quote: "[2026-08-06 14:32:41:350 WARN] [Scripting] [vgprobe] damage-source-visibility :: [fall/observe] handler-entered=1 health(number:20 -> undefined) health-lost=undefined subject-alive=false delivered=[fall@21] verdict=BEFORE-EVENT-RAISED"
      - run: protection-probe-sources
        where: "`damage-source-visibility` — the same fall, written down to 0.5: the subject lived"
        quote: "[2026-08-06 14:32:46:250 WARN] [Scripting] [vgprobe] damage-source-visibility :: [fall/clamp] handler-entered=1 health(number:20 -> number:19.5) health-lost=number:0.5 subject-alive=true delivered=[fall@21] verdict=CLAMP-WRITE-TOOK"

  - id: preventing-a-villagers-death-prevents-its-conversion
    claim: |
      A zombie converts a villager on the killing blow and by no other trigger, so a villager that
      cannot be killed cannot be converted. On hard difficulty, where vanilla conversion is certain,
      an unguarded villager penned with three zombies was killed — `death-cause=[entityAttack]` —
      and left one `minecraft:zombie_villager_v2` behind, in 3/3 runs. A villager under a handler
      clamping `entityHurt.damage` and restoring the health in the after-event survived the full
      1200-tick window at 20/20 health with no zombie villager anywhere near, in 3/3 runs. Nothing
      converted a villager that stayed alive.
    backing: tested
    sources:
      - run: protection-probe-conversion
        where: "`zombie-conversion` — the unguarded control, killed and converted"
        quote: "[2026-08-06 14:34:03:506 WARN] [Scripting] [vgprobe] zombie-conversion :: [control-unguarded] zombies=3 ticks=420 health(number:20 -> undefined) subject-alive=false villagers-near=0 zombie-villagers-near=1 death-cause=[entityAttack] verdict=CONTROL-CONVERTED"
      - run: protection-probe-conversion
        where: "`zombie-conversion` — the guarded villager, whole window at full health"
        quote: "[2026-08-06 14:35:04:206 WARN] [Scripting] [vgprobe] zombie-conversion :: [guarded] zombies=3 ticks=1200 health(number:20 -> number:20) subject-alive=true villagers-near=1 zombie-villagers-near=0 death-cause=[] verdict=GUARDED-SURVIVED-UNCONVERTED"

  - id: a-clamped-hit-knocks-back-and-a-cancelled-one-does-not
    claim: |
      Writing `entityHurt.damage` down leaves the engine's knockback untouched; cancelling the
      event removes it. Measured as the peak speed in the six ticks after a zombie's swing, against
      the resting speed in the four before it: a vanilla hit peaked at 0.417–0.646 across three
      runs, a hit whose damage was written down to 0.5 peaked at 0.308–0.624, and a cancelled hit
      peaked at 0.002–0.278 — frequently *below* the subject's own speed before the hit, so the hit
      added nothing at all. The two mechanisms separate by roughly a factor of three, and the
      clamped hit is indistinguishable from the vanilla one.
    caveat: |
      Panic is not discriminated by this measurement. Total horizontal displacement over the window
      reads 6.5–9.1 vanilla, 8.9–12.7 clamped and 9.0–10.6 cancelled: a villager flees a zombie on
      sight whether or not the hit lands, so displacement cannot separate panic-from-being-hit from
      ordinary flight. Flinch and the hurt sound are rendered on the client and reach no server log,
      so neither is observed here either.
    backing: tested
    sources:
      - run: protection-probe-reaction
        where: "`hit-reaction` — the vanilla control"
        quote: "[2026-08-06 14:35:39:801 WARN] [Scripting] [vgprobe] hit-reaction :: [control-no-handler] hits=4 samples=600 subject-alive=true moved-horizontally=6.525 peak-speed-overall=0.58 per-hit=[entityAttack@3:rest=0.033->peak=0.568, entityAttack@3:rest=0.183->peak=0.58, entityAttack@3:rest=0.334->peak=0.566, entityAttack@3:rest=0.321->peak=0.491] verdict=SEE-NUMBERS"
      - run: protection-probe-reaction
        where: "`hit-reaction` — the cancelled treatment, no spike over resting speed"
        quote: "[2026-08-06 14:36:41:307 WARN] [Scripting] [vgprobe] hit-reaction :: [cancelled] hits=13 samples=600 subject-alive=true moved-horizontally=9.01 peak-speed-overall=0.261 per-hit=[entityAttack@3:rest=0.052->peak=0.049, entityAttack@3:rest=0.049->peak=0.087, entityAttack@3:rest=0.029->peak=0.085, entityAttack@3:rest=0.043->peak=0.158, entityAttack@3:rest=0.085->peak=0.191, entityAttack@3:rest=0.109->peak=0.136] verdict=SEE-NUMBERS"

  - id: a-damage-clamp-without-a-restore-still-kills
    claim: |
      Clamping `entityHurt.damage` to a small constant does not by itself keep a mob alive: with no
      health restored, the losses accumulate and the mob dies anyway. A villager under a 0.5 clamp
      and nothing else, penned with four zombies, lost 6.5 health over 23 hits in one run, 18 over
      72 in another, and died in the third after 78. Under the same attack with the same clamp plus
      a same-tick restore, the subject held 20/20 health for the whole window
      [[f:preventing-a-villagers-death-prevents-its-conversion]]. The restore is what makes the
      clamp a protection rather than a slower death.
    backing: tested
    sources:
      - run: protection-probe-sources
        where: "`damage-source-visibility` — the clamp-only subject that died under sustained attack"
