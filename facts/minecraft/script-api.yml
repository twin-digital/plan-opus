  - id: addeffect-argument-bounds-observed
    claim: |
      `Entity.addEffect` accepts amplifier `0…255` and duration `1…20000000`, rejecting anything
      outside either range with `ArgumentOutOfBoundsError`. Nothing is clamped: every accepted
      integer reads back as the value requested, so a value is either taken verbatim or refused.
      Duration's minimum is 1, not 0 — a zero duration is rejected rather than treated as
      instantaneous — which resolves the self-contradiction in `addEffect`'s own TSDoc, where the
      duration parameter says "The value must be within the range [0, 20000000]." and then
      "Bounds: [1, 20000000]"; the second is right. The two rejections do not share a message shape.
      Amplifier names its parameter after a colon —
      `Unsupported or out of bounds value passed to function argument [2]: amplifier, Value: 256, Argument bounds: [0, 255]`
      — matching the shape `setCurrentValue` produces, while duration ends the argument index with a
      period and names no parameter —
      `Unsupported or out of bounds value passed to function argument [1]. Value: 0, Argument bounds: [1, 20000000]`.
      A duration beyond int32 is reported against the int32 bounds `[-2147483648, 2147483647]`
      instead of the effect bounds.
    backing: tested
    sources:
      - description: |
          The mctest5 effect-name pack walks minecraft:speed's amplifier up from 0 and down from -1,
          and probes duration at its documented boundaries and beyond, recording the read-back beside
          each accepted value so a clamp is told apart from a bound. Identical in 3/3 runs.
      - run: effect-name-probe-run
        where: Raw log — mctest5:effectbounds run 1, the amplifier boundary and read-back SUMMARY lines
        quote: |
          [2026-07-27 21:35:55.413] [mctest] amplifier-bound :: [up/256-first-rejected] addEffect(duration=200, amplifier=256) threw name=ArgumentOutOfBoundsError ctor=ArgumentOutOfBoundsError index=2 minValue=0 maxValue=255 value=256 message="Unsupported or out of bounds value passed to function argument [2]: amplifier, Value: 256, Argument bounds: [0, 255]" verdict=REJECTED
          [2026-07-27 21:35:55.413] [mctest] amplifier-bound :: SUMMARY highest-accepted=255 first-rejected=256 rejection=name=ArgumentOutOfBoundsError minValue=0 maxValue=255 message="Unsupported or out of bounds value passed to function argument [2]: amplifier, Value: 256, Argument bounds: [0, 255]"
          [2026-07-27 21:35:55.413] [mctest] amplifier-bound :: SUMMARY read-back-echoes-request up-to=255 first-divergence=none — an accepted value whose readback differs is a clamp, not a bound
      - run: effect-name-probe-run
        where: Raw log — mctest5:effectbounds run 1, the declared-bounds preamble and the three rejected low durations
        quote: |
          [2026-07-27 21:35:56.108] [mctest] duration-bound :: declared (index.d.ts, Entity.addEffect duration param) "The value must be within the range [0, 20000000]." followed by "Bounds: [1, 20000000]" — the two lower bounds disagree, so 0 and 1 are both probed
          [2026-07-27 21:35:56.108] [mctest] duration-bound :: [duration=-1000] addEffect(duration=-1000, amplifier=0) threw name=ArgumentOutOfBoundsError ctor=ArgumentOutOfBoundsError index=1 minValue=1 maxValue=20000000 value=-1000 message="Unsupported or out of bounds value passed to function argument [1]. Value: -1000, Argument bounds: [1, 20000000]" verdict=REJECTED
          [2026-07-27 21:35:56.163] [mctest] duration-bound :: [duration=-1] addEffect(duration=-1, amplifier=0) threw name=ArgumentOutOfBoundsError ctor=ArgumentOutOfBoundsError index=1 minValue=1 maxValue=20000000 value=-1 message="Unsupported or out of bounds value passed to function argument [1]. Value: -1, Argument bounds: [1, 20000000]" verdict=REJECTED
          [2026-07-27 21:35:56.212] [mctest] duration-bound :: [duration=0] addEffect(duration=0, amplifier=0) threw name=ArgumentOutOfBoundsError ctor=ArgumentOutOfBoundsError index=1 minValue=1 maxValue=20000000 value=0 message="Unsupported or out of bounds value passed to function argument [1]. Value: 0, Argument bounds: [1, 20000000]" verdict=REJECTED
      - run: effect-name-probe-run
        where: Raw log — mctest5:effectbounds run 1, the duration SUMMARY block
        quote: |
          [2026-07-27 21:35:57.013] [mctest] duration-bound :: SUMMARY accepted=[1,2,20,200,19999999,20000000] rejected=[-1000,-1,0,20000001,20000002,100000000,2147483647,2147483648]
          [2026-07-27 21:35:57.013] [mctest] duration-bound :: SUMMARY lowest-rejected-at-or-below-1=-1000 rejection=name=ArgumentOutOfBoundsError minValue=1 maxValue=20000000 message="Unsupported or out of bounds value passed to function argument [1]. Value: -1000, Argument bounds: [1, 20000000]"
