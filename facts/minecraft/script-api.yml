  - id: fresh-entity-spawn-frame-field-values
    claim: |
      A freshly spawned entity's own fields are populated before any test writes to it, and the
      values are not all empty: on a never-written sheep `nameTag` is the empty string (length 0),
      `localizationKey` is populated (`entity.sheep.name`), `location` and `dimension.id` are
      real, `getTags()` is empty, `isValid` is true, and `getRotation()` and `getVelocity()` read
      all-zero vectors. The zeroed rotation and velocity are a spawn-frame reading and hold for
      most but not all entity types — `minecraft:xp_orb` spawns with neither
      [[f:spawn-frame-kinematics-zero-except-xp-orb]] — and they are not a resting value either,
      since an AI-driven mob may be moving a few ticks later
      [[f:post-spawn-mob-motion-is-per-run-not-per-type]].
