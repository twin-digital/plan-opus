# Facts from the `resting-kinematics-isolated` runs (pack 0.3.0, Bedrock 1.26.31.1,
# @minecraft/server 2.8.0), each type spawned alone 4 blocks clear of the source and disposed
# before the next, sampled on the spawn frame and again at 2 and 22 ticks; four consecutive runs
# from a fixed source at (38.5, 81, 22.5). Raw logs and per-run tables in
# artifacts/mctest-resting-state-probe-results.md. The contended `resting-kinematics` runs that
# preceded them spawned all eight types at one point; that file retracts two of their readings
# (an arrow that self-invalidated and a +0.455 upward velocity on sheep and cow), both artifacts
# of overlap resolution, and neither is recorded here.

- id: spawn-frame-kinematics-zero-except-xp-orb
  claim: |
    On its own spawn frame an entity reads `getRotation() = {x:0, y:0}` and
    `getVelocity() = {x:0, y:0, z:0}` for seven of the eight types sampled — `sheep`, `cow`,
    `chicken`, `zombie`, `armor_stand`, `arrow`, `boat` — bit-identical in 4/4 runs.
    `minecraft:xp_orb` is the exception: it spawns with a randomized y-rotation and a nonzero
    randomized velocity, drawn afresh per spawn (four runs, four distinct values, no repeats),
    then decays to near-rest by 22 ticks. Zero rotation and velocity at spawn are therefore an
    engine constant a fake may assume for most types, but not a universal one.
  backing: tested
