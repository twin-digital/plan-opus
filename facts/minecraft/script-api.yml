  - id: effect-expiry-boundary-observed
    claim: |
      An effect is removed on the tick its decaying duration would reach 0, so the last tick it is
      readable on is the one where `duration` reads 1, and 0 is never readable. The tick of the add
      reads the duration applied, and the effect is first absent exactly that many ticks later — 3 at
      tick 3, 5 at tick 5, 8 at tick 8, over two repeats of each. `getEffect` and `getEffects` agree
      on every tick, and an `Effect` handle captured before the expiry answers a `duration` read with
      the plain `Failed to get property 'duration'.` afterwards, the shape a removed effect's handle
      already carries [[f:effect-members-throw-plain-error]].
    backing: tested
    sources:
      - description: |
          The mctest8 expiry set adds minecraft:speed at amplifier 1 for durations 3, 5 and 8, twice
