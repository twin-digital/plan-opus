  - id: applydamage-boolean-reports-admission
    claim: |
      `applyDamage`'s boolean reports that the entity is damageable and the amount is positive —
      both settled before the call acts — and not whether damage landed. The declared contract
      ("Whether the entity takes any damage. This can return false if the entity is invulnerable or
      if the damage applied is less than or equal to 0") holds on its amount clause and fails on its
      invulnerability clause. On amount: `-1` and `0` return `false` and take nothing, while `0.5`
      returns `true` and takes exactly 0.5, so the boundary sits at zero and damage is not integral.
      Two reachable paths return `true` with nothing lost: a cancelled `entityHurt` before-event,
      and a second hit inside the invulnerability window opened by a first.
    backing: tested
    sources:
      - description: |
          The mctest5 return-value pack ran seven cases, each on a freshly spawned subject so none
          inherits the previous case's invulnerability window, reporting the boolean beside the
          health actually lost. Identical in 3/3 runs. The invulnerability case records the priming
          hit's own return on the same line, which read true with damage landing in all three runs,
          so the window is known to have been open.
      - run: return-value-probe-run
