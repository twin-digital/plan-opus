# Facts about testing Bedrock behavior packs: the tooling a pack author stands the engine up with,
# and the commitments the test library makes to them.

- id: alias-shim-runs-unmodified-pack-code
  claim: |
    A module aliased over `@minecraft/server` in a runner's resolver is enough to make unmodified
    public pack code testable against `@twin-digital/minecraft-test-lib`'s fakes. A 26-line shim —
    re-exporting enum values generated from the pinned 2.8.0 declarations, exposing `Player` and
    `Entity` as `Symbol.hasInstance` brands over a member check, and holding `world` and `system`
    as reassignable module-scope bindings a setter points at a fake server — carried 26 tests
    across three suites over two third-party packs (`bencrob/marron-town-mod` at `2c025b4` and
    `xigma0512/GunFight-Arena` at `0f16e88`), driving their combat handler, scoreboard and
    messenger adapters, dynamic properties on the world and on an entity, `system` scheduling and
    entity queries. Neither pack was edited. Removing the alias, with `@minecraft/server` 2.8.0
    still installed, puts the same suite back to a resolution failure
    [[f:server-import-fails-without-an-alias]].
  backing: tested
  caveat: |
    This establishes that the shape works, not that it is the right one. The brands guess a
    distinguishing member (`'onScreenDisplay' in value`) rather than asking the library; the
    module-scope bindings are reset by an explicit setter call in each suite's `beforeEach`; and
    the runner is vitest and ESM only — no jest, bun or CJS consumer was exercised. GunFight-Arena
    declares `@minecraft/server` `^1.17.0` against the shim's 2.8.0 values.
  sources:
    - run: alias-shim-harness-run
      where: the suite totals
      quote: |
         Test Files  3 passed (3)
              Tests  26 passed (26)

- id: test-lib-supplies-the-module-surface-and-the-runner-tooling
  claim: |
    `@twin-digital/minecraft-test-lib` commits, as owner fiat, to keeping suites that inject fake
    objects into code under test working, and to additionally supplying the `@minecraft/server`
    module surface a consumer aliases together with the runner tooling that configures that alias.
    Both styles are the library's: code reachable only through a direct module import is within its
    reach, and nothing it ships breaks a suite written against injection.
  backing: documented
  sources:
    - url: design/minecraft/test-lib/requirements.yaml
      where: r:injection-suites-stay-supported
      quote: |
        a suite that injects fake objects into code under test stays supported, and nothing the
        library ships breaks one. The library additionally supplies the `@minecraft/server` module
        surface a consumer aliases, and the runner tooling that configures that alias.

- id: test-lib-ships-no-reset-hook
  claim: |
    `@twin-digital/minecraft-test-lib` exposes no reset of any kind: its specification holds that a
    bundle's state belongs to that bundle and that two `createServer()` calls share nothing, so a
    test wanting a clean world makes another server. A consumer shape that needs one server's state
    cleared in place is asking the library for a capability it does not have.
  backing: documented
  sources:
    - url: design/minecraft/test-lib/spec.md
      where: "The package and how a test reaches a fake — what a bundle's state belongs to"
      quote: |
        ships no reset of a server's state, so a test wanting a clean world makes another server

- id: test-lib-does-not-intercept-the-module-import
  status: retired
  reason: superseded
  superseded_by: test-lib-supplies-the-module-surface-and-the-runner-tooling
  claim: |
    `@twin-digital/minecraft-test-lib` commits, as owner fiat, to substituting fake objects passed
    into code under test and to not replacing or intercepting the `@minecraft/server` module
    import — code reachable only through a direct module import is outside its reach. Anything
    that makes that import resolve is therefore something other than the library.
  backing: documented
  sources:
    - url: design/minecraft/test-lib/requirements.yaml
      where: r:object-substitution-not-module-mocking
      quote: |
        the library substitutes fake objects passed into code under test; it does not replace or
        intercept the `@minecraft/server` module import. Code that can only reach the engine
        through a direct module import is outside its reach.
