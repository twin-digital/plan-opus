# Facts about testing Bedrock behavior packs: the tooling a pack author stands the engine up with,
# and the commitments the test library makes to them.

- id: alias-shim-runs-unmodified-pack-code
  claim: |
    A module aliased over `@minecraft/server` in a runner's resolver is enough to make unmodified
    public pack code testable against `@twin-digital/minecraft-test-lib`'s fakes. A 26-line shim —
    re-exporting enum values generated from the pinned 2.8.0 declarations, exposing `Player` and
    `Entity` as `Symbol.hasInstance` brands over a member check, and holding `world` and `system`
    as reassignable module-scope bindings a setter points at a fake server — carried 26 tests
    across three suites over two third-party packs (`bencrob/marron-town-mod` at `2c025b4` and
    `xigma0512/GunFight-Arena` at `0f16e88`), driving their combat handler, scoreboard and
    messenger adapters, dynamic properties on the world and on an entity, `system` scheduling and
    entity queries. Neither pack was edited. Removing the alias, with `@minecraft/server` 2.8.0
    still installed, puts the same suite back to a resolution failure
    [[f:server-import-fails-without-an-alias]].
  backing: tested
  caveat: |
    This establishes that the shape works, not that it is the right one. The brands guess a
    distinguishing member (`'onScreenDisplay' in value`) rather than asking the library; the
    module-scope bindings are reset by an explicit setter call in each suite's `beforeEach`; and
    the runner is vitest and ESM only — no jest, bun or CJS consumer was exercised. GunFight-Arena
    declares `@minecraft/server` `^1.17.0` against the shim's 2.8.0 values.

    The quoted evidence carries the suite totals and the generator's enum counts, and nothing about
    how the extraction works. That the shipped `index.d.ts` is read as CRLF, that reserved-word
    member names arrive quoted, and that the script reproduces the committed generated module byte
    for byte are visible in the harness script and in the run's `environment`, not in any quoted
    passage; the 476-member total is in the generator's captured output but outside the quote. A
    design leaning on those specifics is leaning on the artifacts rather than on this fact's
    sources.
  sources:
    - run: alias-shim-harness-run
      where: the suite totals
      quote: |
         Test Files  3 passed (3)
              Tests  26 passed (26)
    - run: alias-shim-enum-generation-run
      where: the generator's summary — the declaration source, its version, and the enum counts
      quote: |
        @minecraft/server version: 2.8.0
        export enum declarations in index.d.ts: 64
        enums generated from the pinned declarations: 64

- id: test-lib-does-not-intercept-the-module-import
  claim: |
    `@twin-digital/minecraft-test-lib` commits, as owner fiat, to substituting fake objects passed
    into code under test and to not replacing or intercepting the `@minecraft/server` module
    import — code reachable only through a direct module import is outside its reach. Anything
    that makes that import resolve is therefore something other than the library.
  backing: documented
  sources:
    - url: design/minecraft/test-lib/requirements.yaml
      where: r:object-substitution-not-module-mocking
      quote: |
        the library substitutes fake objects passed into code under test; it does not replace or
        intercept the `@minecraft/server` module import. Code that can only reach the engine
        through a direct module import is outside its reach.

- id: alias-and-control-subpath-are-one-module-instance
  claim: |
    Under vitest 4.1.10 on node 24, a `resolve.alias` from `@minecraft/server` to a shim package
    and an ordinary node-resolved import of that package's `./control` subpath reach the same
    instance of the module holding the shared mutable state, so state written through the control
    subpath is what the aliased specifier reads. Both alias shapes hold: aliasing to the shim's
    bare package name and aliasing to its resolved entry file each report `same-instance=true`
    with the state module evaluated once, under both a `file:` install (a node_modules symlink to
    the source) and an unpacked `npm pack` tarball (a real node_modules directory) — four runs,
    all four passing. A `__useServer` called through `./control` is therefore visible to pack code
    that imports `@minecraft/server`: the pack read back the exact `world` and `system` objects the
    test installed.
  backing: tested
  caveat: |
    Measured on vitest 4.1.10 / node 24.16.0 with an ESM-only package and both entries re-exporting
    one internal module; jest, bun and CJS were not exercised, and neither was a duplicate install
    of the shim at two node_modules depths.
  sources:
    - run: alias-control-instance-probe-run
      where: the identity line each of the four runs logs
      quote: |
        same-instance=true state-module-evaluations=1
    - run: alias-control-instance-probe-run
      where: what the pack side read back after the control side's __useServer
      quote: |
        pack-world={"tag":"fake-world"} pack-system={"tag":"fake-system"}
    - run: alias-control-instance-probe-run
      where: the suite totals, identical in all four runs
      quote: |
         Test Files  1 passed (1)
              Tests  2 passed (2)

- id: a-setup-file-server-makes-a-pack-test-file-boilerplate-free
  claim: |
    A setup file that installs one server at module scope — a bare `__useServer(createServer())`,
    with no `beforeEach` and no naming of the pack's own modules — leaves a consumer's test file
    holding static imports and nothing else: the pack imported for its side effects, and `world` and
    `system` imported to arrange and assert. Vitest evaluates `setupFiles` before the test file's
    own module evaluation, so the pack's module-scope `subscribe` and `runInterval` calls land on
    the installed server, and no dynamic `await import` and no `vi.resetModules()` prelude appear
    anywhere. Measured with bencrob/marron-town-mod at 2c025b4, unmodified, whose `src/main.ts`
    subscribes to five world events and registers two `system.runInterval` loops while it evaluates,
    against `@twin-digital/minecraft-test-lib`'s real fakes — and against both shim shapes, the
    `export let` bindings the spec ships and fixed-identity Proxy bindings, with identical results.
  backing: tested
  caveat: |
    The cost this shape does not remove is state: one server per file carries every test's leavings
    into the next [[f:one-server-per-file-carries-state-into-the-next-test]]. The pack's
    `@minecraft/server-ui` import needed a second alias to a stub, which is a second module the shim
    does not cover rather than anything about the setup file. vitest 4.1.10 on node 24.16.0 only.
  sources:
    - run: file-scoped-server-probe-run
      where: the setup file's line, printed before any test in the file ran, Proxy shim
      quote: |
        [setup] installed one server at module scope (shim=proxy)
    - run: file-scoped-server-probe-run
      where: the same run's suite totals — the pack reacted, from a test file with no install code in it
      quote: |
         Test Files  1 passed (1)
              Tests  3 passed (3)
    - run: file-scoped-server-probe-run
      where: the `export let` shim invocation of the same suite
      quote: |
        [setup] installed one server at module scope (shim=let)

- id: one-server-per-file-carries-state-into-the-next-test
  claim: |
    A file-scoped server carries everything a test did into the tests after it, and the amount is
    not marginal. Against bencrob/marron-town-mod at 2c025b4 driven through
    `@twin-digital/minecraft-test-lib`: a first test that spawns one player and advances 40 ticks
    hands the second test 1 entity, a tick clock at 40, and 11 scoreboard objectives its own code
    never created; the second hands the third 2 entities and a clock at 80, with the first test's
    player still in the dimension and still being iterated by the pack's module-scope loops. Nothing
    resets between tests because nothing can: the state belongs to the one server the file
    installed.
  backing: tested
  caveat: |
    Three tests of one pack. The counters grow linearly here because each test does the same work;
    a suite whose tests differ would leak differently, and how much of that leakage changes an
    assertion rather than merely accumulating was not measured.
  sources:
    - run: file-scoped-server-probe-run
      where: what each test found already in the world when it started, Proxy shim
      quote: |
        [carried into test 1] entities=0 currentTick=0 objectives=0 world-output=0 handler-errors=0
    - run: file-scoped-server-probe-run
      where: the same reading at the start of the second and third tests
      quote: |
        [carried into test 2] entities=1 currentTick=40 objectives=11 world-output=1 handler-errors=0
    - run: file-scoped-server-probe-run
      where: the third test's starting state, and the second test finding the first test's player still present
      quote: |
        [carried into test 3] entities=2 currentTick=80 objectives=11 world-output=1 handler-errors=0

- id: a-fake-server-can-be-cleared-in-place-with-its-subscriptions-intact
  claim: |
    A fake server's state can be cleared while the object identity a pack's module-scope
    subscriptions are bound to is preserved, and the handlers still fire afterwards. Reaching
    `@twin-digital/minecraft-test-lib`'s private `ServerState` directly — it exposes no reset — and
    clearing the entities, the scoreboard, the dynamic properties, the output log and the tick clock
    while leaving the signal objects alone, all 5 of bencrob/marron-town-mod's module-scope
    subscribers survived every reset, `world` was the same object it was at install, and three
    successive tests each started from `entities=0 currentTick=0 objectives=0` and each drove the
    pack to the identical end state. The scheduled runs are the boundary case, not an afterthought:
    a pack registers `system.runInterval` in the same evaluation as its subscriptions, so a reset
    that clears the run queue unregisters half of what the pack set up. Clearing it left the same 5
    subscribers in place and took the pack's two loops away, and the objectives those loops create
    stopped appearing — 11 became 0 — with nothing raised anywhere; the suite's failing assertion is
    the only thing that noticed.
  backing: tested
  caveat: |
    The reset is the probe's own function writing the library's private record, not an API: it
    reaches `src/runtime/state.ts` and `src/runtime/member.ts` through aliases, so this measures the
    capability and its cost, not something a consumer can call
    [[f:test-lib-ships-no-reset-hook]]. What a supported hook would have to preserve is what this one
    preserved: the `world` and `system` fakes, the signal objects with their subscriber sets, the
    registered dimensions, and the scheduled runs, with each surviving run re-based onto the reset
    tick clock. Entities the cleared tests created were marked invalid rather than left readable,
    which was a choice of the probe's and is not measured against the engine.
  sources:
    - run: in-place-reset-probe-run
      where: what survived each reset, keeping the scheduled runs
      quote: |
        [reset] world-identity-preserved=true surviving-subscribers=5 surviving-scheduled-runs=2
    - run: in-place-reset-probe-run
      where: the second and third tests each starting from a cleared world and reaching the same end state
      quote: |
        [test 2 start] entities=0 currentTick=0 objectives=0
        [test 2 end] entities=1 currentTick=40 objectives=11
    - run: in-place-reset-probe-run
      where: the same suite with the scheduled runs cleared — subscribers survive, the pack's loops do not
      quote: |
        [reset] world-identity-preserved=true surviving-subscribers=5 surviving-scheduled-runs=0
    - run: in-place-reset-probe-run
      where: what the cleared run queue costs — the same test, with the loops' objectives gone
      quote: |
        [test 2 start] entities=0 currentTick=0 objectives=0
        [test 2 end] entities=1 currentTick=40 objectives=0

- id: test-lib-ships-no-reset-hook
  claim: |
    `@twin-digital/minecraft-test-lib` exposes no reset of any kind, by design: its specification
    holds that a bundle's state belongs to that bundle and that two `createServer()` calls share
    nothing, so a test wanting a clean world makes another server. A shim shape that needs one
    server's state cleared in place is asking the library for a capability it has decided against.
  backing: documented
  sources:
    - url: design/minecraft/test-lib/spec.md
      where: "The package and how a test reaches a fake — what a bundle's state belongs to"
      quote: |
        All state a bundle holds belongs to that bundle. The library keeps no module-level mutable state,
        so two `createServer()` calls in one process share nothing and tests need no reset hook
